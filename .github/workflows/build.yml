name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload artifact (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: SwapnoHadith-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish permanent release (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SwapnoHadith.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest SwapnoHadith.apk --title "Latest APK" --notes "Auto-built from commit ${GITHUB_SHA::7}" --target "${GITHUB_SHA}"
