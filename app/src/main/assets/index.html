েগে থাকাবস্থায় দেখতে পাবে। অথবা তিনি বলেছেন, সে যেন আমাকে জাগ্রত অবস্থায় প্রত্যক্ষ করলো। কারণ শাইতান আমার আকৃতি ধারণ করতে পারে না। (ইসলামিক ফাউন্ডেশন ৫৭২৩, ইসলামিক সেন্টার)","e":"Abu Huraira reported:I heard Allah's Messenger (ﷺ) as saying: He who saw me in a dream would soon see me in the state of wakefulness, or as if he saw me in a state of wakefulness, for the satan does not appear in my form"},{"n":"5921","k":"2267.01","a":"وَقَالَ فَقَالَ أَبُو سَلَمَةَ قَالَ أَبُو قَتَادَةَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَنْ رَآنِي فَقَدْ رَأَى الْحَقَّ ‏\"‏ ‏.‏","b":"আবূ সালামাহ্ (রহঃ) বলেন, আবূ কাতাদাহ্ (রাযিঃ) বলেছেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেনঃ যে আমাকে দেখলো সে যেন (অবশ্যই) সত্যই দেখলো। (ইসলামিক ফাউন্ডেশন ৫৭২৩, ইসলামিক সেন্টার)","e":"Abu Qatada reported Allah's Messenger (ﷺ) as saying:He who saw me in dream in fact saw the truth (what is true)"},{"n":"5922","k":"2267.02","a":"وَحَدَّثَنِيهِ زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا ابْنُ أَخِي الزُّهْرِيِّ، حَدَّثَنَا عَمِّي، ‏.‏ فَذَكَرَ الْحَدِيثَيْنِ جَمِيعًا بِإِسْنَادَيْهِمَا سَوَاءً مِثْلَ حَدِيثِ يُونُسَ ‏.‏","b":"(…/...) যুহরীর ভাইয়ের ছেলে বলেন, তার চাচা (অর্থাৎ যুহরী) তাকে হাদীস রিওয়ায়াত করেছেন। এ ব্যাপারে তিনি ইউনুস বর্ণিত হাদীসের অনুরূপ দুটি হাদীস সানাদসহ রিওয়ায়াত করেন। (ইসলামিক ফাউন্ডেশন ৫৭২৩, ইসলামিক সেন্টার)","e":"The above two hadith have been narrated likewise through another chain of transmitters"},{"n":"5923","k":"2268.01","a":"وَحَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا لَيْثٌ، ح وَحَدَّثَنَا ابْنُ رُمْحٍ، أَخْبَرَنَا اللَّيْثُ، عَنْ أَبِي، الزُّبَيْرِ عَنْ جَابِرٍ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏\"‏ مَنْ رَآنِي فِي النَّوْمِ فَقَدْ رَآنِي إِنَّهُ لاَ يَنْبَغِي لِلشَّيْطَانِ أَنْ يَتَمَثَّلَ فِي صُورَتِي ‏\"‏ ‏.‏ وَقَالَ ‏\"‏ إِذَا حَلَمَ أَحَدُكُمْ فَلاَ يُخْبِرْ أَحَدًا بِتَلَعُّبِ الشَّيْطَانِ بِهِ فِي الْمَنَامِ ‏\"‏ ‏.‏","b":"কুতাইবাহ ইবনু সাঈদ ও ইবনু রুমূহ (রহঃ) ..... জাবির (রাযিঃ) হতে বর্ণিত যে, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে লোক স্বপ্নযোগে আমাকে দেখল, সে নিশ্চয়ই আমাকে (স্বপ্নে) দেখল। কারণ, শাইতানের পক্ষে আমার আকৃতি ধারণ করা অসম্ভব। তিনি আরও বলেন, তোমাদের কেউ যখন খারাপ স্বপ্ন দেখে সে যেন ঘুমের মধ্যে তার সাথে শাইতানের চক্রান্তের সংবাদ কাউকে না দেয়। (ইসলামিক ফাউন্ডেশন ৫৭২৪, ইসলামিক সেন্টার)","e":"Jabir reported Allah's Messenger (ﷺ) as saying:He who saw me in sleep in fact saw me, for it is not possible for the satan to appear in my form; and he also said: When any one of you sees a hulm he should not inform anyone, for it is a sort of vain sport of devil in the state of sleep"},{"n":"5924","k":"2268.02","a":"وَحَدَّثَنِي مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا رَوْحٌ، حَدَّثَنَا زَكَرِيَّاءُ بْنُ إِسْحَاقَ، حَدَّثَنِي أَبُو الزُّبَيْرِ، أَنَّهُ سَمِعَ جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَنْ رَآنِي فِي النَّوْمِ فَقَدْ رَآنِي فَإِنَّهُ لاَ يَنْبَغِي لِلشَّيْطَانِ أَنْ يَتَشَبَّهَ بِي ‏\"‏ ‏.‏","b":"মুহাম্মাদ ইবনু হাতিম (রহঃ) ..... জাবির ইবনু আবদুল্লাহ (রাযিঃ) হতে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে লোক স্বপ্নযোগে আমাকে দেখল সে অবশ্যই আমাকেই দেখল। কারণ আমার রূপ ধারণ করা শাইতানের পক্ষে অসম্ভব। (ইসলামিক ফাউন্ডেশন ৫৭২৫, ইসলামিক সেন্টার)","e":"Jabir b. `Abdullah reported Allah's Messenger (ﷺ) as saying:He who saw me in a dream in fact saw me, for the satan cannot assume my form"},{"n":"5925","k":"2268.03","a":"حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا لَيْثٌ، ح وَحَدَّثَنَا ابْنُ رُمْحٍ، أَخْبَرَنَا اللَّيْثُ، عَنْ أَبِي، الزُّبَيْرِ عَنْ جَابِرٍ، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم أَنَّهُ قَالَ لأَعْرَابِيٍّ جَاءَهُ فَقَالَ إِنِّي حَلَمْتُ أَنَّ رَأْسِي قُطِعَ فَأَنَا أَتَّبِعُهُ فَزَجَرَهُ النَّبِيُّ صلى الله عليه وسلم وَقَالَ ‏ \"‏ لاَ تُخْبِرْ بِتَلَعُّبِ الشَّيْطَانِ بِكَ فِي الْمَنَامِ ‏\"‏ ‏.‏","b":"কুতাইবাহ ও ইবনু রুমূহ (রহঃ) ..... জাবির (রাযিঃ) এর সানাদে রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। একবার এক বেদুঈন তার নিকট এসে বলল, আমি স্বপ্নে প্রত্যক্ষ করলাম যে, আমার মস্তিষ্ক কর্তন করা হয়েছে আর আমি তার পিছু পিছু ছুটে চলছি। সে সময় নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তাকে রাগাম্বিত হয়ে বললেনঃ ঘুমের মধ্যে তোমার সঙ্গে শাইতানের খেলাধূলার সংবাদ কাউকে প্রকাশ করো না। (ইসলামিক ফাউন্ডেশন ৫৭২৬, ইসলামিক সেন্টার)","e":"Jabir reported Allah's Messenger (ﷺ) as saying:There came to him (the Holy Prophet) a desert Arab and said: I saw in a dream that I had been beheaded and I had been following it (the severed head). Allah's Apostle (ﷺ) reprimanded him saying: Do not inform about the vain sporting of devil with you during the night"},{"n":"5926","k":"2268.04","a":"وَحَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا جَرِيرٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرٍ، قَالَ جَاءَ أَعْرَابِيٌّ إِلَى النَّبِيِّ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ رَأَيْتُ فِي الْمَنَامِ كَأَنَّ رَأْسِي ضُرِبَ فَتَدَحْرَجَ فَاشْتَدَدْتُ عَلَى أَثَرِهِ ‏.‏ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم لِلأَعْرَابِيِّ ‏\"‏ لاَ تُحَدِّثِ النَّاسَ بِتَلَعُّبِ الشَّيْطَانِ بِكَ فِي مَنَامِكَ ‏\"‏ ‏.‏ وَقَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم بَعْدُ يَخْطُبُ فَقَالَ ‏\"‏ لاَ يُحَدِّثَنَّ أَحَدُكُمْ بِتَلَعُّبِ الشَّيْطَانِ بِهِ فِي مَنَامِهِ ‏\"‏ ‏.‏","b":"উসমান ইবনু আবূ শইবাহ (রহঃ) ..... জাবির (রাযিঃ) হতে বর্ণিত তিনি বলেন, এক বেদুঈন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর নিকট এসে বলল, হে আল্লাহর রসূল! আমি স্বপ্নে দেখলাম যেন আমার মাথা কর্তন করা হয়েছে এবং তা গড়াতে শুরু করেছে, আর আমি তার পিছনে পিছনে খুব জোরে দৌড় লাগালাম। তখন রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম সে বেদুঈন আরবকে বললেন, তোমার ঘুমের মধ্যে তোমার সঙ্গে শাইতানের ক্রীড়া-কৌতুকের ব্যাপারে কারো নিকটেই প্রকাশ করো না। বর্ণনাকারী জাবির (রাযিঃ) বলেন, এ ঘটনার পর আমি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কে ভাষণ দিতে শুনলাম। তাতে তিনি বললেন, তোমাদের কেউ ঘুমের মধ্যে তার সঙ্গে শাইতানের ক্রীড়া-কৌতুকের ব্যাপারে বলে দিও না। (ইসলামিক ফাউন্ডেশন ৫৭২৭, ইসলামিক সেন্টার)","e":"Jabir reported that there came to Allah's Apostle (ﷺ) a desert Arab and said:Allah's Messenger, I saw in the state of sleep as if my head had been cut off and I had been moving on haltingly after it. Thereupon Allah's Messenger (ﷺ) said to that desert Arab: Do not narrate to the people the vain sporting of satan with you in your sleep and (the narrator) also said: I heard Allah's Messenger (ﷺ) in his subsequent address: None amongst you should narrate the vain sporting of devil with him in the dream"},{"n":"5927","k":"2268.05","a":"وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَأَبُو سَعِيدٍ الأَشَجُّ قَالاَ حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرٍ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ رَأَيْتُ فِي الْمَنَامِ كَأَنَّ رَأْسِي قُطِعَ ‏.‏ قَالَ فَضَحِكَ النَّبِيُّ صلى الله عليه وسلم وَقَالَ ‏\"‏ إِذَا لَعِبَ الشَّيْطَانُ بِأَحَدِكُمْ فِي مَنَامِهِ فَلاَ يُحَدِّثْ بِهِ النَّاسَ ‏\"‏ ‏.‏ وَفِي رِوَايَةِ أَبِي بَكْرٍ ‏\"‏ إِذَا لُعِبَ بِأَحَدِكُمْ ‏\"‏ ‏.‏ وَلَمْ يَذْكُرِ الشَّيْطَانَ ‏.‏","b":"আবূ বাকর ইবনু আবূ শাইবাহ ও আবূ সাঈদ আশাজ্জ (রহঃ) ..... জাবির (রাযিঃ) হতে বর্ণিত। তিনি বলেন, এক লোক নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর নিকট এসে বলল, হে আল্লাহর রসূল! আমি স্বপ্নে দেখলাম যেন আমার মস্তিষ্ক কর্তন করা হয়েছে। বর্ণনাকারী বলেন, তখন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম মুচকি হেসে বললেন, শাইতান যখন তোমাদের কারো সঙ্গে তার ঘুমের মধ্যে খেলাধূলা করে, তখন সে যেন কোন ব্যক্তির নিকট তা প্রকাশ না করে। আর বর্ণনাকারী আবূ বাকর (রহঃ)-এর বর্ণনাতে আছে- ‘যখন তোমাদের কারো সঙ্গে ক্রীড়া-কৌতুহল করা হয়। তিনি 'শাইতান' শব্দ বর্ণনা করেননি। (ইসলামিক ফাউন্ডেশন ৫৭২৮, ইসলামিক সেন্টার)","e":"Jabir reported that a person came to Allah's Apostle (ﷺ) and said:Allah's Messenger, I have seen in the state of sleep as if my head had been cut off. Thereupon Allah's Apostle (ﷺ) laughed and said: When the satan plays with any one of you in the state of sleep, do not mention it to the people; and in the hadith transmitted by Abu Bakr (the words are): \"If one of you is played with, and he did not make any mention of the word: \"Satan"},{"n":"5928","k":"2269.01","a":"حَدَّثَنَا حَاجِبُ بْنُ الْوَلِيدِ، حَدَّثَنَا مُحَمَّدُ بْنُ حَرْبٍ، عَنِ الزُّبَيْدِيِّ، أَخْبَرَنِي الزُّهْرِيُّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، أَنَّ ابْنَ عَبَّاسٍ، أَوْ أَبَا هُرَيْرَةَ كَانَ يُحَدِّثُ أَنَّ رَجُلاً، أَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم ح وَحَدَّثَنِي حَرْمَلَةُ بْنُ يَحْيَى التُّجِيبِيُّ، - وَاللَّفْظُ لَهُ - أَخْبَرَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، أَنَّ عُبَيْدَ اللَّهِ بْنَ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، أَخْبَرَهُ أَنَّ ابْنَ عَبَّاسٍ كَانَ يُحَدِّثُ أَنَّ رَجُلاً أَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي أَرَى اللَّيْلَةَ فِي الْمَنَامِ ظُلَّةً تَنْطِفُ السَّمْنَ وَالْعَسَلَ فَأَرَى النَّاسَ يَتَكَفَّفُونَ مِنْهَا بِأَيْدِيهِمْ فَالْمُسْتَكْثِرُ وَالْمُسْتَقِلُّ وَأَرَى سَبَبًا وَاصِلاً مِنَ السَّمَاءِ إِلَى الأَرْضِ فَأَرَاكَ أَخَذْتَ بِهِ فَعَلَوْتَ ثُمَّ أَخَذَ بِهِ رَجُلٌ مِنْ بَعْدِكَ فَعَلاَ ثُمَّ أَخَذَ بِهِ رَجُلٌ آخَرُ فَعَلاَ ثُمَّ أَخَذَ بِهِ رَجُلٌ آخَرُ فَانْقَطَعَ بِهِ ثُمَّ وُصِلَ لَهُ فَعَلاَ ‏.‏ قَالَ أَبُو بَكْرٍ يَا رَسُولَ اللَّهِ بِأَبِي أَنْتَ وَاللَّهِ لَتَدَعَنِّي فَلأَعْبُرَنَّهَا ‏.‏ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ اعْبُرْهَا ‏\"‏ ‏.‏ قَالَ أَبُو بَكْرٍ أَمَّا الظُّلَّةُ فَظُلَّةُ الإِسْلاَمِ وَأَمَّا الَّذِي يَنْطِفُ مِنَ السَّمْنِ وَالْعَسَلِ فَالْقُرْآنُ حَلاَوَتُهُ وَلِينُهُ وَأَمَّا مَا يَتَكَفَّفُ النَّاسُ مِنْ ذَلِكَ فَالْمُسْتَكْثِرُ مِنَ الْقُرْآنِ وَالْمُسْتَقِلُّ وَأَمَّا السَّبَبُ الْوَاصِلُ مِنَ السَّمَاءِ إِلَى الأَرْضِ فَالْحَقُّ الَّذِي أَنْتَ عَلَيْهِ تَأْخُذُ بِهِ فَيُعْلِيكَ اللَّهُ بِهِ ثُمَّ يَأْخُذُ بِهِ رَجُلٌ مِنْ بَعْدِكَ فَيَعْلُو بِهِ ثُمَّ يَأْخُذُ بِهِ رَجُلٌ آخَرُ فَيَعْلُو بِهِ ثُمَّ يَأْخُذُ بِهِ رَجُلٌ آخَرُ فَيَنْقَطِعُ بِهِ ثُمَّ يُوصَلُ لَهُ فَيَعْلُو بِهِ ‏.‏ فَأَخْبِرْنِي يَا رَسُولَ اللَّهِ بِأَبِي أَنْتَ أَصَبْتُ أَمْ أَخْطَأْتُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ أَصَبْتَ بَعْضًا وَأَخْطَأْتَ بَعْضًا ‏\"‏ ‏.‏ قَالَ فَوَاللَّهِ يَا رَسُولَ اللَّهِ لَتُحَدِّثَنِّي مَا الَّذِي أَخْطَأْتُ قَالَ ‏\"‏ لاَ تُقْسِمْ ‏\"‏ ‏.‏","b":"—(১৭/২২৬৯) হাজিব ইবনু ওয়ালীদ (রহঃ) ..... উবাইদুল্লাহ ইবনু আবদুল্লাহ (রহঃ) হতে বর্ণিত যে, ইবনু আব্বাস (রাযিঃ) অথবা আবূ হুরাইরাহ (রাযিঃ) হাদীস রিওয়ায়াত করতেন যে, জনৈক লোক রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর নিকট উপস্থিত হলো .....। ভিন্ন সূত্রে হারমালাহ ইবনু ইয়াহইয়া তুজীবী (রহঃ) উবাইদুল্লাহ ইবনু আবদুল্লাহ ইবনু উতবাহ (রাযিঃ) ইবনু শিহাব (রহঃ) কে সংবাদ দিয়েছেন যে, ইবনু আব্বাস (রাযিঃ) এ হাদীসটি রিওয়ায়াত করতেন যে, জনৈক লোক রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর দরবারে এসে বলল, হে আল্লাহর রসূল! আমি আজ রাতে স্বপ্ন দেখলাম যে, শামিয়ানা হতে ঘি ও মধু ঝরে পড়ছে আর লোকদের দেখলাম- তারা তা থেকে তাদের হাতের অঞ্জলি ভরে ভরে নিয়ে যাচ্ছে। কেউ বেশি পরিমাণ নিচ্ছে, কেউ স্বল্প পরিমাণে। আর একটি রশি দেখলাম আসমান থেকে জমিন পর্যন্ত সংযোগ স্থাপনকারী, আর দেখলাম আপনি তা ধরলেন এবং উপর উঠে গেলেন, এরপর এক ব্যক্তি তা ধরল এবং সে উপর উঠে গেল, তারপর আর এক ব্যক্তি তা ধরল এবং তা ছিড়ে পড়ে গেল। পরিশেষে তা তার জন্য জুড়ে দেয়া হলো এবং সেও উপরে উঠে গেল। স্বপ্ন বর্ণনার এ পর্যায়ে আবূ বাকর (রাযীঃ) বললেন, হে আল্লাহর রসূল! আমার পিতা আপনার জন্য উৎসর্গিত। আল্লাহর শপথ! আপনি অবশ্য আমাকে অনুমতি দিবেন, তাহলে আমি এ স্বপ্লটির ব্যাখ্যা করব। রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, আপনি ব্যাখ্যা করুন। আবূ বাকর (রাযিঃ) বললেন, শামিয়ানাটি হলো ইসলামের (রূপক) শামিয়ানা, আর যে ঘি ও মধু ফোটা ঝরে পড়ছিল, তা হচ্ছে আল-কুরআনের মধুরতা ও কোমলতা আর মানুষেরা যে তা থেকে অঞ্জলি ভরে ভরে নিয়ে যাচ্ছিল তা হলো- কেউ বেশি পরিমাণে আর কেউ সামান্য পরিমাণে আল কুরআন হতে সংগ্রহ করছে। আর আসমান হতে জমিন পর্যন্ত সংযুক্ত রশিটি হলো হক ও সত্য (পথ), যার উপরে আপনি রয়েছেন তা ধারণ করলেন, আর আল্লাহ তা দিয়ে আপনাকে উপরে উঠিয়ে নিলেন। তারপর আপনার পরে এক লোক তা ধারণ করলেন এবং তা দিয়ে সেও উপরে উঠে যাবে, তারপর আর এক লোক তা ধারণ করবে এবং তা ছিড়ে পড়ে যাবে, পরে তা তার জন্য জুড়ে দেয়া হবে এবং তা দিয়ে সে উপরে উঠে যাবে। হে আল্লাহর রসূল! এখন আমাকে বলে দিন, আমার পিতা আপনার উদ্দেশে উৎসর্গিত, আমি ঠিক বলেছি নাকি ভুল বলেছি? রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেনঃ কতক ঠিক বলেছেন আর কতক ভুল করেছেন। তিনি বললেন, তাহলে আল্লাহর শপথ! হে আল্লাহর রসূল! যা আমি ভুল করেছি তা আপনি অবশ্যই আমাকে বর্ণনা করে দিবেন। তিনি বললেন, এভাবে শপথ করবে না। (ইসলামিক ফাউন্ডেশন ৫৭২৯, ইসলামিক সেন্টার)","e":"It is reported either on the authority of Ibn `Abbas or on the authority of Abu Huraira that a person came to Allah's Messenger (ﷺ) and said:Allah's Messenger, I saw while I was sleeping during the night (this vision) that there was a canopy from which butter and honey were trickling and I also saw people collecting them in the palms of their hands, some more, some less, and I also saw a rope connecting the earth with the sky and I saw you catching hold of it and rising towards the heaven; then another person after you catching hold of it and rising towards (Heaven); then another person catching hold of it, but it was broken while it was rejoined for him and he also climbed up. Abu Bakr said: Allah's Messenger, may my father be sacrificed for you, by Allah, allow me to interpret it. Allah's Messenger (ﷺ) said: Well, give its interpretation. Thereupon Abu Bakr said: The canopy signifies the canopy of Islam and that what trickles out of it in the form of butter and honey is the Holy Qur'an and its sweetness and softness and what the people get hold of it in their palms implies major portion of the Qur'an or the small portion; and so far as the rope joining the sky with the earth is concerned, it is the Truth by which you stood (in the worldly life) and by which Allah would raise you (to Heaven). Then the person after you would take hold of it and he would also climb up with the help of it. Then another person would take hold of it and climb up with the help of it. Then another person would take hold of it and it would be broken; then it would be rejoined for him and he would climb up with the help of it. Allah's Messenger, may my father be taken as a ransom for you, tell me whether I have interpreted it correctly or I have made an error. Allah's Messenger (ﷺ) said: You have interpreted a part of it correctly and you have erred in interpreting a part of it. Thereupon he said: Allah's Messenger, by Allah, tell me that part where I have committed an error. Thereupon he said: Don't take an oath"},{"n":"5929","k":"2269.02","a":"وَحَدَّثَنَاهُ ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ جَاءَ رَجُلٌ النَّبِيَّ صلى الله عليه وسلم مُنْصَرَفَهُ مِنْ أُحُدٍ فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي رَأَيْتُ هَذِهِ اللَّيْلَةَ فِي الْمَنَامِ ظُلَّةً تَنْطِفُ السَّمْنَ وَالْعَسَلَ ‏.‏ بِمَعْنَى حَدِيثِ يُونُسَ ‏.‏","b":"ইবনু আবূ উমর (রহঃ) ..... ইবনু আব্বাস (রাযিঃ) হতে বর্ণিত। তিনি বলেন, উহুদ (যুদ্ধক্ষেত্র) হতে তার ফিরে আসার সময় জনৈক লোক নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর দরবারে এলো। সে বলল, হে আল্লাহর রসূল! আজ রাতে আমি স্বপ্নে দেখলাম- একটি শামিয়ানা তা থেকে ফোটা ফোটা ঘি ও মধু ঝরছে। হাদীসের পরবর্তী অংশ ইউনুস (রহঃ) বর্ণিত হাদীসের অর্থানুরূপ। (ইসলামিক ফাউন্ডেশন ৫৭৩০, ইসলামিক সেন্টার)","e":"Ibn `Abbas reported that there came to Allah's Apostle (ﷺ) a person as he was returning from Uhud and he said:Allah's Messenger, I saw in sleep during the night a canopy trickling butter and honey; the rest of the hadith is the same"},{"n":"5930","k":"2269.03","a":"وَحَدَّثَنَا مُحَمَّدُ بْنُ رَافِعٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ عُبَيْدِ، اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ عَنِ ابْنِ عَبَّاسٍ، أَوْ أَبِي هُرَيْرَةَ قَالَ عَبْدُ الرَّزَّاقِ كَانَ مَعْمَرٌ أَحْيَانًا يَقُولُ عَنِ ابْنِ عَبَّاسٍ وَأَحْيَانًا يَقُولُ عَنْ أَبِي هُرَيْرَةَ أَنَّ رَجُلاً أَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ إِنِّي أَرَى اللَّيْلَةَ ظُلَّةً ‏.‏ بِمَعْنَى حَدِيثِهِمْ ‏.‏","b":"মুহাম্মাদ ইবনু রাফি (রহঃ) ..... ইবনু আব্বাস (রাযিঃ) কিংবা আবূ হুরাইরাহ (রাযিঃ) হতে বর্ণিত যে, আবদুর রাযযাক বলেন (আমার ঊর্ধ্বতন বর্ণনাকারী উস্তায) মা'মার (রহঃ) কখনো বর্ণনা করতেন ইবনু আব্বাস (রাযিঃ) হতে আবার কখনো বর্ণনা করতেন আবূ হুরাইরাহ (রাযিঃ) হতে এ মর্মে যে, জনৈক লোক রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর দরবারে উপস্থিত হয়ে বললেন, আজ রাতে (স্বপ্নে) আমি একটি শামিয়ানা দেখতে পাই, তারপর পূর্বোল্লিখিত বর্ণনাকারীগণের বর্ণিত হাদীসের অর্থে হাদীস বর্ণনা করেছেন। (ইসলামিক ফাউন্ডেশন ৫৭৩১, ইসলামিক সেন্টার)","e":"It is reported either on the authority of Ibn 'Abbas or on that of Abu Huraira that a person came to Allah's Messenger (ﷺ) and said:Verily I saw during the night a canopy; the rest of the hadith is the same"},{"n":"5931","k":"2269.04","a":"وَحَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الرَّحْمَنِ الدَّارِمِيُّ، حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، حَدَّثَنَا سُلَيْمَانُ، - وَهُوَ ابْنُ كَثِيرٍ - عَنِ الزُّهْرِيِّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ مِمَّا يَقُولُ لأَصْحَابِهِ ‏ \"‏ مَنْ رَأَى مِنْكُمْ رُؤْيَا فَلْيَقُصَّهَا أَعْبُرْهَا لَهُ ‏\"‏ ‏.‏ قَالَ فَجَاءَ رَجُلٌ فَقَالَ يَا رَسُولَ اللَّهِ رَأَيْتُ ظُلَّةً ‏.‏ بِنَحْوِ حَدِيثِهِمْ ‏.‏","b":"আবদুল্লাহ ইবনু আবদুর রহমান দারিমী (রহঃ) ..... ইবনু আব্বাস (রাযিঃ) হতে বর্ণিত যে, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম (যেসব অভ্যাসে অভ্যস্ত) ছিলেন (সে সবের মধ্যে একটি ছিল এই) যে, তিনি তার সাহাবীগণকে (ফজরের সালাতের পরে) বলতেন, তোমাদের কেউ কোন স্বপ্ন দেখলে সে তা আমার নিকট প্রকাশ করুক, তাহলে আমি তাকে তার ব্যাখ্যা বলে দিব। জনৈক লোক এসে বলল, হে আল্লাহর রসূল! আমি একটি শামিয়ানা দেখলাম .....। পরবর্তী বর্ণনা (পূর্বোল্লিখিত) বর্ণনাকারীগণের বর্ণিত হাদীসের অবিকল। (ইসলামিক ফাউন্ডেশন ৫৭৩২, ইসলামিক সেন্টার)","e":"Ibn `Abbas reported that Allah's Messenger (ﷺ) used to say to his Companions:He who amongst you sees a vision should narrate it and I would interpret it for him, and a person came and said: Allah's Messenger, I saw a canopy. The rest of the hadith is the same"},{"n":"5932","k":"2270","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ بْنِ قَعْنَبٍ، حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ ثَابِتٍ الْبُنَانِيِّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ رَأَيْتُ ذَاتَ لَيْلَةٍ فِيمَا يَرَى النَّائِمُ كَأَنَّا فِي دَارِ عُقْبَةَ بْنِ رَافِعٍ فَأُتِينَا بِرُطَبٍ مِنْ رُطَبِ ابْنِ طَابٍ فَأَوَّلْتُ الرِّفْعَةَ لَنَا فِي الدُّنْيَا وَالْعَاقِبَةَ فِي الآخِرَةِ وَأَنَّ دِينَنَا قَدْ طَابَ ‏\"‏ ‏.‏","b":"আবদুল্লাহ ইবনু মাসলামাহ্ ইবনু কা'নাব (রহঃ) ..... আনাস ইবনু মালিক (রাযিঃ) হতে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ এক রাতে আমি দেখলাম যেভাবে ঘুমন্ত লোক দেখে (অর্থাৎ স্বপ্ন), যেন আমরা উক্‌বাহ ইবনু রাফি’ এর গৃহে রয়েছি। তখন আমাদের নিকট ইবনু তাব* (নামক) খেজুর হতে কিছু তাজা খেজুর নিয়ে আসা হলো। তখন আমি এর বিশ্লেষণ করলাম- পৃথিবীর বুকে আমাদের জন্য উন্নতি এবং আখিরাতে উত্তম পরিণতি। আর আমাদের দীন অবশ্যই উত্তম। (ইসলামিক ফাউন্ডেশন ৫৭৩৩, ইসলামিক সেন্টার)","e":"Anas b. Malik reported Allah's Messenger (ﷺ) as saying:I saw during the night that which a person sees during the sleep as if we are in the house of `Uqba b. Rafi` that there was brought to us the fresh dates of Ibn Tab. I interpreted it as the sublimity for us in the world and good ending in the Hereafter and that our religion is good"},{"n":"5933","k":"2271","a":"وَحَدَّثَنَا نَصْرُ بْنُ عَلِيٍّ الْجَهْضَمِيُّ، أَخْبَرَنِي أَبِي، حَدَّثَنَا صَخْرُ بْنُ جُوَيْرِيَةَ، عَنْ نَافِعٍ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، حَدَّثَهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ أَرَانِي فِي الْمَنَامِ أَتَسَوَّكُ بِسِوَاكٍ فَجَذَبَنِي رَجُلاَنِ أَحَدُهُمَا أَكْبَرُ مِنَ الآخَرِ فَنَاوَلْتُ السِّوَاكَ الأَصْغَرَ مِنْهُمَا فَقِيلَ لِي كَبِّرْ ‏.‏ فَدَفَعْتُهُ إِلَى الأَكْبَرِ ‏\"‏ ‏.‏","b":"নাসর ইবনু আলী জাহ্যামী (রহঃ) ..... নাফি' (রহঃ) হতে বর্ণিত। ‘আবদুল্লাহ ইবনু উমর (রাযিঃ) এ মর্মে বর্ণনা করেছেন যে, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ আমি ঘুমের মধ্যে আমাকে একটি দাতন দিয়ে মিসওয়াক করতে দেখলাম। তখন দু’লোক আমাকে আকৃষ্ট করল, যাদের একজন অন্যজনের চেয়ে বয়সে বড়। তখন আমি মিসওয়াকটি কম বয়সীকে দিতে গেলে আমাকে বলা হলো- 'বড়কে দিন', তাই তা আমি বয়স্ককে দিয়ে দিলাম। (ইসলামিক ফাউন্ডেশন ৫৭৩৪, ইসলামিক সেন্টার)","e":"Abdullah b. `Umar reported Allah's Messenger (ﷺ) as saying:I saw in a dream that I was using miswak and two persons contended to get it from me, one being older than the other one. I gave the miswak to the younger one. It was said to me to give that to the older one and I gave it to the older one"},{"n":"5934","k":"2272","a":"حَدَّثَنَا أَبُو عَامِرٍ عَبْدُ اللَّهِ بْنُ بَرَّادٍ الأَشْعَرِيُّ، وَأَبُو كُرَيْبٍ مُحَمَّدُ بْنُ الْعَلاَءِ - وَتَقَارَبَا فِي اللَّفْظِ - قَالاَ حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، جَدِّهِ عَنْ أَبِي مُوسَى، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ رَأَيْتُ فِي الْمَنَامِ أَنِّي أُهَاجِرُ مِنْ مَكَّةَ إِلَى أَرْضٍ بِهَا نَخْلٌ فَذَهَبَ وَهَلِي إِلَى أَنَّهَا الْيَمَامَةُ أَوْ هَجَرُ فَإِذَا هِيَ الْمَدِينَةُ يَثْرِبُ وَرَأَيْتُ فِي رُؤْيَاىَ هَذِهِ أَنِّي هَزَزْتُ سَيْفًا فَانْقَطَعَ صَدْرُهُ فَإِذَا هُوَ مَا أُصِيبَ مِنَ الْمُؤْمِنِينَ يَوْمَ أُحُدٍ ثُمَّ هَزَزْتُهُ أُخْرَى فَعَادَ أَحْسَنَ مَا كَانَ فَإِذَا هُوَ مَا جَاءَ اللَّهُ بِهِ مِنَ الْفَتْحِ وَاجْتِمَاعِ الْمُؤْمِنِينَ وَرَأَيْتُ فِيهَا أَيْضًا بَقَرًا وَاللَّهُ خَيْرٌ فَإِذَا هُمُ النَّفَرُ مِنَ الْمُؤْمِنِينَ يَوْمَ أُحُدٍ وَإِذَا الْخَيْرُ مَا جَاءَ اللَّهُ بِهِ مِنَ الْخَيْرِ بَعْدُ وَثَوَابُ الصِّدْقِ الَّذِي آتَانَا اللَّهُ بَعْدُ يَوْمَ بَدْرٍ ‏\"‏ ‏.‏","b":"আবূ ‘আমির আবদুল্লাহ ইবনু বাররাদ আশ'আরী ও আবূ কুরায়ব মুহাম্মাদ ইবনু আলা (রহঃ) ..... আবূ মূসা (রাযিঃ) এর সানাদে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কে বলতে শুনেছি। তিনি বলেন, আমি স্বপ্নে দেখলাম যে, আমি মাক্কাহ থেকে এমন এক দেশে হিজরত করে যাচ্ছি, যেখানে খেজুর বৃক্ষ আছে, তাতে আমার কল্পনা এদিকে গেল যে, তা ইয়ামামাহ্ অথবা হাজর (এলাকা) হবে। পরে (বাস্তবে) দেখি যে, তা হলো মাদীনাহ্- (যার পূর্ব নাম) ইয়াসরিব। আমি আমার এ স্বপ্নে আরও দেখলাম যে, আমি একটি তলোয়ার নাড়াচাড়া করলাম, ফলে তার মধ্যখান ভেঙ্গে গেল। তা ছিল উহুদের দিনে যা মুমিনগণের উপর আপতিত হয়েছিল। তারপরে আমি আর একবার সে তলোয়ার নাড়া দিলে তা পূর্বের চাইতে ভাল হয়ে গেল। তারপরে মূলত তা হলো সে বিজয় ও ঈমানদারদের সম্মেলন- যা আল্লাহ সংঘটিত করলেন (মাক্কাহ বিজয়)। আমি তাতে একটি গরুও দেখলাম। আর আল্লাহ তা'আলাই কল্যাণের অধিকারী। মূলত তা হলো- উহুদের যুদ্ধে (শাহাদাতপ্রাপ্ত) মুমিনদের দলটি। আর মঙ্গল হলো, সে কল্যাণ যা পরবর্তীতে আল্লাহ তা'আলা দান করেছেন এবং সততা ও নিষ্ঠার সে সাওয়াব ও প্রতিদান— যা আল্লাহ তা'আলা আমাদের বাদর যুদ্ধের পরে দিয়েছেন। (ইসলামিক ফাউন্ডেশন ৫৭৩৫, ইসলামিক সেন্টার)","e":"Abu Musa reported Allah's Messenger (ﷺ) as saying:I dreamt (while asleep) that I was about to migrate from Mecca to a land abounding in palm trees and I guessed that it would be Yamama or Hajar, but it was the city of Yathrib (the old name of Medina), and I saw in this dream of mine that I was brandishing a sword and its upper end was broken and this is what fell (in the form of misfortune to the believers on the Day of Uhud). I brandished (the sword) for the second time and it became all right and this is what came to be true when Allah granted us victory and solidarity of the believers. And I saw therein cows also and Allah is the Doer of good. These meant the group from amongst the believers on the Day of Uhud and the goodness which Allah brought after that and the reward of attestation of his Truth which Allah brought to us after the Day of Badr"},{"n":"5936","k":"2274.02","a":"وَحَدَّثَنَا مُحَمَّدُ بْنُ رَافِعٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنْ هَمَّامِ بْنِ مُنَبِّهٍ، قَالَ هَذَا مَا حَدَّثَنَا أَبُو هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم ‏.‏ فَذَكَرَ أَحَادِيثَ مِنْهَا وَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ بَيْنَا أَنَا نَائِمٌ أُتِيتُ خَزَائِنَ الأَرْضِ فَوَضَعَ فِي يَدَىَّ أُسْوَارَيْنِ مِنْ ذَهَبٍ فَكَبُرَا عَلَىَّ وَأَهَمَّانِي فَأُوحِيَ إِلَىَّ أَنِ انْفُخْهُمَا فَنَفَخْتُهُمَا فَذَهَبَا فَأَوَّلْتُهُمَا الْكَذَّابَيْنِ اللَّذَيْنِ أَنَا بَيْنَهُمَا صَاحِبَ صَنْعَاءَ وَصَاحِبَ الْيَمَامَةِ ‏\"‏ ‏.‏","b":"মুহাম্মাদ ইবনু রাফি (রহঃ) ..... হাম্মাম ইবনু মুনব্বিহ (রহঃ) হতে বর্ণিত। তিনি বলেন, এ হলো সেসব হাদীস যা আবূ হুরাইরাহ্ (রাযিঃ) রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম থেকে আমাদের নিকট বর্ণনা করেছেন। এ কথা বলে তিনি কয়েকটি হাদীস বর্ণনা করেন। এটি হলো (সেগুলোর একটি)। রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম আরও বলেন, আমি নিদ্রিত ছিলাম এমতাবস্থায় আমার নিকট দুনিয়ার ভাণ্ডারসমূহ নিয়ে আসা হলো। সে সময় আমার হাতে দুটি স্বর্ণের কাকন রেখে দেয়া হলে সে দুটি আমার জন্য অনেক ওজন মনে হলো এবং তারা আমাকে দুর্ভাবনায় ফেলল। তখন আমার নিকট ওয়াহীর মাধ্যমে জানানো হলো যে, আমি যেন সে দু'টির উপরে ফুঁ দেই। তখন আমি ফুঁ দিলে সে দু'টি উড়ে গেল। আমি সে দুটির ব্যাখ্যা করলাম- সে দু' মিথ্যাবাদী (ভণ্ড নবী) যে দু'জনের মাঝে আমি রয়েছি- (অর্থাৎ-) সান’আ অধিবাসী আসওয়াদ আল-আনসী এবং ইয়ামামাহ অধিবাসী মুসাইলামাতুল কাযযাব। (ইসলামিক ফাউন্ডেশন ৫৭৩৭, ইসলামিক সেন্টার)","e":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:While I was sleeping, the treasures of the earth were presented to me and I was made to wear in my hands two gold bangles. I felt a sort of burden upon me and I was disturbed and it was suggested to me that I should blow over them, so I blew and both of them disappeared. I interpreted them as two great liars who would appear at any time, one is the inhabitant of San`a' and the other is that of Yamama"},{"n":"5937","k":"2275","a":"حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، حَدَّثَنَا أَبِي، عَنْ أَبِي رَجَاءٍ الْعُطَارِدِيِّ، عَنْ سَمُرَةَ بْنِ جُنْدَبٍ، قَالَ كَانَ النَّبِيُّ صلى الله عليه وسلم إِذَا صَلَّى الصُّبْحَ أَقْبَلَ عَلَيْهِمْ بِوَجْهِهِ فَقَالَ ‏ \"‏ هَلْ رَأَى أَحَدٌ مِنْكُمُ الْبَارِحَةَ رُؤْيَا ‏\"‏ ‏.‏","b":"মুহাম্মদ ইবনু বাশশার (রহঃ) .... সামুরাহ ইবনু জুনদাব (রাযিঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ফজরের সালাত (সালাত/নামাজ/নামায) আদায়ন্তে লোকদের দিকে মুখ ফিরিয়ে বসতেন এবং বলতেন, তোমাদের কেউ কি গত রাতে কোন স্বপ্ন দেখেছে? (ইসলামিক ফাউন্ডেশন ৫৭৩৮, ইসলামিক সেন্টার)","e":"Samura b. Jundab reported that when Allah's Messenger (ﷺ) had performed his dawn prayer he turned his face towards them (that is towards his Companions) and said:Did any one of you see any vision last night?"}]},{"id":"zb","name":"সহীহ বুখারী","short":"বুখারী","sub":"কিতাব ৪৬ · কিতাবুল মাযালিম (জুলুম)","items":[{"n":"2440","k":"","a":"حَدَّثَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، أَخْبَرَنَا مُعَاذُ بْنُ هِشَامٍ، حَدَّثَنِي أَبِي، عَنْ قَتَادَةَ، عَنْ أَبِي الْمُتَوَكِّلِ النَّاجِيِّ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ ـ رضى الله عنه ـ عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ إِذَا خَلَصَ الْمُؤْمِنُونَ مِنَ النَّارِ حُبِسُوا بِقَنْطَرَةٍ بَيْنَ الْجَنَّةِ وَالنَّارِ، فَيَتَقَاصُّونَ مَظَالِمَ كَانَتْ بَيْنَهُمْ فِي الدُّنْيَا، حَتَّى إِذَا نُقُّوا وَهُذِّبُوا أُذِنَ لَهُمْ بِدُخُولِ الْجَنَّةِ، فَوَالَّذِي نَفْسُ مُحَمَّدٍ صلى الله عليه وسلم بِيَدِهِ لأَحَدُهُمْ بِمَسْكَنِهِ فِي الْجَنَّةِ أَدَلُّ بِمَنْزِلِهِ كَانَ فِي الدُّنْيَا ‏\"‏‏.‏ وَقَالَ يُونُسُ بْنُ مُحَمَّدٍ حَدَّثَنَا شَيْبَانُ عَنْ قَتَادَةَ حَدَّثَنَا أَبُو الْمُتَوَكِّلِ‏.‏","b":"وَقَوْلِ اللهِ تَعَالَى ( وَلاَ تَحْسَبَنَّ اللهَ غَافِلاً عَمَّا يَعْمَلُ الظَّالِمُونَ إِنَّمَا يُؤَخِّرُهُمْ لِيَوْمٍ تَشْخَصُ فِيهِ الأَبْصَارُ مُهْطِعِينَ مُقْنِعِي رُءُوسِهِمْ ) رَافِعِي الْمُقْنِعُ وَالْمُقْمِحُ وَاحِدٌ وَقَالَ مُجَاهِدٌ (مُهْطِعِينَ) مُدِيمِي النَّظَرِ وَيُقَالُ مُسْرِعِينَ (لاَ يَرْتَدُّ إِلَيْهِمْ طَرْفُهُمْ وَأَفْئِدَتُهُمْ هَوَاءٌ) يَعْنِي جُوفًا لاَ عُقُولَ لَهُمْ ( وَأَنْذِرْ النَّاسَ يَوْمَ يَأْتِيهِمْ الْعَذَابُ فَيَقُولُ الَّذِينَ ظَلَمُوا رَبَّنَا أَخِّرْنَا إِلَى أَجَلٍ قَرِيبٍ نُجِبْ دَعْوَتَكَ وَنَتَّبِعْ الرُّسُلَ أَوَلَمْ تَكُونُوا أَقْسَمْتُمْ مِنْ قَبْلُ مَا لَكُمْ مِنْ زَوَالٍ وَسَكَنْتُمْ فِي مَسَاكِنِ الَّذِينَ ظَلَمُوا أَنْفُسَهُمْ وَتَبَيَّنَ لَكُمْ كَيْفَ فَعَلْنَا بِهِمْ وَضَرَبْنَا لَكُمْ الأَمْثَالَ وَقَدْ مَكَرُوا مَكْرَهُمْ وَعِنْدَ اللهِ مَكْرُهُمْ وَإِنْ كَانَ مَكْرُهُمْ لِتَزُولَ مِنْهُ الْجِبَالُ فَلاَ تَحْسِبَنَّ اللهَ مُخْلِفَ وَعْدِهِ رُسُلَهُ إِنَّ اللهَ عَزِيزٌ ذُو انْتِقَامٍ ) আল্লাহ তা‘আলার বাণীঃ ‘‘আর তুমি কখনও মনে করো না যে, যালিমরা যা করে সে সম্বন্ধে আল্লাহ বেখবর। তবে তিনি তাদেরকে অবকাশ দেন সেদিন পর্যন্ত, যেদিন চক্ষুসমূহ বিস্ফারিত হবে। ভীত-বিহবল চিত্তে মস্তক ঊর্ধ্বমুখী করে তারা দৌড়াতে থাকবে, নিজেদের দিকে তাদের দৃষ্টি ফিরে আসবে না এবং তাদের অন্তর হবে শূন্য।’’ (لاَ يَرْتَدُّ إِلَيْهِمْ طَرْفُهُمْ وَأَفْئِدَتُهُمْ هَوَاءٌ) অর্থাৎ উপরের দিকে তাদের মাথা তুলে। ﴿الْمُقْنِعُ﴾ এবং ﴿الْمُقْمِعُ﴾ সমার্থক শব্দ। মুজাহিদ (রহ.) বলেন, (مُهْطِعِينَ) অর্থ দৃষ্টি অবনত করে। ﴿هَوَاءٌ) শব্দের অর্থ জ্ঞানশূন্য। আল্লাহ তা‘আলার বাণীঃ ‘‘কাজেই মানুষকে সতর্ক কর সেদিনের ব্যাপারে যেদিন তাদের উপর ‘আযাব আসবে। যারা জুলুম করেছিল তারা তখন বলবে, ‘হে আমাদের প্রতিপালক! আমাদেরকে অল্পদিনের জন্য সময় দাও, আমরা তোমার আহবানে সাড়া দিব আর রাসূলদের কথা মেনে চলব।’ (তখন তাদেরকে বলা হবে) তোমরা কি পূর্বে শপথ করে বলনি যে, তোমাদের কক্ষনো পতন ঘটবে না? অথচ তোমরা সেই লোকগুলোর বাসভূমিতে বসবাস করছিলে যারা নিজেদের প্রতি জুলুম করেছিল আর তোমাদেরকে স্পষ্ট করে দেখিয়ে দেয়া হয়েছিল আমি তাদের সঙ্গে কেমন ব্যবহার করেছিলাম। আর আমি বহু উদাহরণ টেনে তোমাদেরকে বুঝিয়েও দিয়েছিলাম। তারা যে চক্রান্ত করেছিল তা ছিল সত্যিই ভয়ানক, কিন্তু তাদের চক্রান্ত আল্লাহ্‌র দৃষ্টির ভিতরেই ছিল, যদিও তাদের চক্রান্তগুলো এমন ছিল যে, তাতে পর্বতও টলে যেত। (অবস্থা যতই প্রতিকূল হোক না কেন) তুমি কক্ষনো মনে কর না যে, আল্লাহ তাঁর রাসূলগণকে দেয়া ওয়া‘দা খেলাপ করবেন, আল্লাহ মহা প্রতাপশালী, প্রবল প্রতিশোধ গ্রহণকারী।’’ (ইবরাহীমঃ ৪২-৪৭) ২৪৪০. আবূ সাঈদ খুদরী (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেন, মু’মিনগণ যখন জাহান্নাম হতে মুক্তি পাবে, তখন জান্নাত ও জাহান্নামের মাঝখানে এক পুলের উপর তাদের আটকে রাখা হবে। তখন পৃথিবীতে একের প্রতি অন্যের যা যা জুলুম ও অন্যায় ছিল, তার প্রতিশোধ গ্রহণের পরে যখন তারা পরিচ্ছন্ন হয়ে যাবে, তখন তাদেরকে জান্নাতে প্রবেশের অনুমতি দেয়া হবে। সেই সত্তার কসম! যাঁর হাতে মুহাম্মাদের প্রাণ, নিশ্চয়ই তাদের প্রত্যেকে পৃথিবীতে তার আবাসস্থল যেরূপ চিনত, তার চেয়ে অধিক তার জান্নাতের আবাসস্থল চিনতে পারবে। (৬৫৩৫) (আধুনিক প্রকাশনীঃ ২২৬১, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Sa`id Al-Khudri:Allah's Messenger (ﷺ) said, \"When the believers pass safely over (the bridge across) Hell, they will be stopped at a bridge in between Hell and Paradise where they will retaliate upon each other for the injustices done among them in the world, and when they get purified of all their sins, they will be admitted into Paradise. By Him in Whose Hands the life of Muhammad is everybody will recognize his dwelling in Paradise better than he recognizes his dwelling in this world"},{"n":"2441","k":"","a":"حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا هَمَّامٌ، قَالَ أَخْبَرَنِي قَتَادَةُ، عَنْ صَفْوَانَ بْنِ مُحْرِزٍ الْمَازِنِيِّ، قَالَ بَيْنَمَا أَنَا أَمْشِي، مَعَ ابْنِ عُمَرَ ـ رضى الله عنهما ـ آخِذٌ بِيَدِهِ إِذْ عَرَضَ رَجُلٌ، فَقَالَ كَيْفَ سَمِعْتَ رَسُولَ اللَّهِ صلى الله عليه وسلم فِي النَّجْوَى فَقَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ إِنَّ اللَّهَ يُدْنِي الْمُؤْمِنَ فَيَضَعُ عَلَيْهِ كَنَفَهُ، وَيَسْتُرُهُ فَيَقُولُ أَتَعْرِفُ ذَنْبَ كَذَا أَتَعْرِفُ ذَنْبَ كَذَا فَيَقُولُ نَعَمْ أَىْ رَبِّ‏.‏ حَتَّى إِذَا قَرَّرَهُ بِذُنُوبِهِ وَرَأَى فِي نَفْسِهِ أَنَّهُ هَلَكَ قَالَ سَتَرْتُهَا عَلَيْكَ فِي الدُّنْيَا، وَأَنَا أَغْفِرُهَا لَكَ الْيَوْمَ‏.‏ فَيُعْطَى كِتَابَ حَسَنَاتِهِ، وَأَمَّا الْكَافِرُ وَالْمُنَافِقُونَ فَيَقُولُ الأَشْهَادُ هَؤُلاَءِ الَّذِينَ كَذَبُوا عَلَى رَبِّهِمْ، أَلاَ لَعْنَةُ اللَّهِ عَلَى الظَّالِمِينَ ‏\"‏‏.‏","b":"সাফওয়ান ইবনু মুহরিব আল-মাযিনী (রাঃ) হতে বর্ণিত। তিনি বলেন, একদিন আমি ইবনু ‘উমার (রাঃ)-এর সাথে তাঁর হাত ধরে চলছিলাম। এ সময় এক ব্যক্তি এসে বলল, কিয়ামতের দিন আল্লাহ তা‘আলা ও তাঁর মু’মিন বান্দার একান্তে কথাবার্তা সম্পর্কে আপনি রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -কে কী বলতে শুনেছেন? তখন তিনি বললেন, আমি রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -কে বলতে শুনেছি যে, আল্লাহ তা‘আলা মু’মিন ব্যক্তিকে নিজের কাছে নিয়ে আসবেন এবং তার উপর স্বীয় আবরণ দ্বারা তাকে ঢেকে নিবেন। তারপর বলবেন, অমুক পাপের কথা কি তুমি জান? তখন সে বলবে, হ্যাঁ, হে আমার প্রতিপালক! এভাবে তিনি তার কাছ হতে তার পাপগুলো স্বীকার করিয়ে নিবেন। আর সে মনে করবে যে, তার ধ্বংস অনিবার্য। তখন আল্লাহ তা‘আলা বলবেন, আমি পৃথিবীতে তোমার পাপ গোপন করে রেখেছিলাম। আর আজ আমি তা মাফ করে দিব’’। তারপর তার নেকের আমলনামা তাকে দেয়া হবে। কিন্তু কাফির ও মুনাফিকদের সম্পর্কে সাক্ষীরা বলবে, এরাই তাদের প্রতিপালক সম্পর্কে মিথ্যা বলেছিল। সাবধান, যালিমদের উপর আল্লাহর অভিসম্পাত। (৪৬৮৫, ৬০৭০, ৭৫১৪) (আধুনিক প্রকাশনীঃ ২২৬২, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Safwan bin Muhriz Al-Mazini:While I was walking with Ibn `Umar holding his hand, a man came in front of us and asked, \"What have you heard from Allah's Messenger (ﷺ) about An-Najwa?\" Ibn `Umar said, \"I heard Allah's Messenger (ﷺ) saying, 'Allah will bring a believer near Him and shelter him with His Screen and ask him: Did you commit such-and-such sins? He will say: Yes, my Lord. Allah will keep on asking him till he will confess all his sins and will think that he is ruined. Allah will say: 'I did screen your sins in the world and I forgive them for you today', and then he will be given the book of his good deeds. Regarding infidels and hypocrites (their evil acts will be exposed publicly) and the witnesses will say: These are the people who lied against their Lord. Behold! The Curse of Allah is upon the wrongdoers"},{"n":"2442","k":"","a":"حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، أَنَّ سَالِمًا، أَخْبَرَهُ أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ ـ رضى الله عنهما ـ أَخْبَرَهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ الْمُسْلِمُ أَخُو الْمُسْلِمِ، لاَ يَظْلِمُهُ وَلاَ يُسْلِمُهُ، وَمَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ، وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً فَرَّجَ اللَّهُ عَنْهُ كُرْبَةً مِنْ كُرُبَاتِ يَوْمِ الْقِيَامَةِ، وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ يَوْمَ الْقِيَامَةِ ‏\"‏‏.‏","b":"‘আবদুল্লাহ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, মুসলিম মুসলিমের ভাই। সে তার উপর জুলুম করবে না এবং তাকে যালিমের হাতে সোপর্দ করবে না। যে কেউ তার ভাইয়ের অভাব পূরণ করবে,আল্লাহ তার অভাব পূরণ করবেন।যে কেউ তার মুসলিম ভাইয়ের বিপদ দুর করবে, আল্লাহ তা‘আলা কিয়ামতের দিন তার বিপদসমূহ দূর করবেন। যে ব্যক্তি কোন মুসলিমের দোষ ঢেকে রাখবে, আল্লাহ কিয়ামতের দিন তার দোষ ঢেকে রাখবেন। (৬৯৫১) (আধুনিক প্রকাশনীঃ ২২৬৩, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"A Muslim is a brother of another Muslim, so he should not oppress him, nor should he hand him over to an oppressor. Whoever fulfilled the needs of his brother, Allah will fulfill his needs; whoever brought his (Muslim) brother out of a discomfort, Allah will bring him out of the discomforts of the Day of Resurrection, and whoever screened a Muslim, Allah will screen him on the Day of Resurrection"},{"n":"2443","k":"","a":"حَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا هُشَيْمٌ، أَخْبَرَنَا عُبَيْدُ اللَّهِ بْنُ أَبِي بَكْرِ بْنِ أَنَسٍ، وَحُمَيْدٌ الطَّوِيلُ، سَمِعَا أَنَسَ بْنَ مَالِكٍ ـ رضى الله عنه ـ يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ انْصُرْ أَخَاكَ ظَالِمًا أَوْ مَظْلُومًا ‏\"‏‏.‏","b":"আনাস ইবনু মালিক (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, তোমার ভাইকে সাহায্য কর, সে যালিম হোক অথবা মাযলুম। (অর্থাৎ যালিম ভাইকে যুলুম থেকে বিরত রাখবে এবং মাযলুম ভাইকে যালিমের হাত হতে রক্ষা করবে)। (২৪৪৪, ৬৯৫২) (আধুনিক প্রকাশনীঃ ২২৬৪, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"Help your brother, whether he is an oppressor or he is an oppressed one"},{"n":"2444","k":"","a":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا مُعْتَمِرٌ، عَنْ حُمَيْدٍ، عَنْ أَنَسٍ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ انْصُرْ أَخَاكَ ظَالِمًا أَوْ مَظْلُومًا ‏\"‏‏.‏ قَالُوا يَا رَسُولَ اللَّهِ هَذَا نَنْصُرُهُ مَظْلُومًا، فَكَيْفَ نَنْصُرُهُ ظَالِمًا قَالَ ‏\"‏ تَأْخُذُ فَوْقَ يَدَيْهِ ‏\"‏‏.‏","b":"আনাস (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, তোমার ভাইকে সাহায্য কর, সে যালিম হোক অথবা মাযলুম। তিনি (আনাস) বললেন, হে আল্লাহর রাসূল! মাযলুমকে সাহায্য করব, তা তো বুঝলাম। কিন্তু যালিমকে কি করে সাহায্য করব? তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, তুমি তার হাত ধরে তাকে বিরত রাখবে। (অর্থাৎ তাকে যুলুম করতে দিবে না)। (২৪৪৩) (আধুনিক প্রকাশনীঃ ২২৬৫, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Anas:Allah's Messenger (ﷺ) said, \"Help your brother, whether he is an oppressor or he is an oppressed one. People asked, \"O Allah's Messenger (ﷺ)! It is all right to help him if he is oppressed, but how should we help him if he is an oppressor?\" The Prophet (ﷺ) said, \"By preventing him from oppressing others"},{"n":"2445","k":"","a":"حَدَّثَنَا سَعِيدُ بْنُ الرَّبِيعِ، حَدَّثَنَا شُعْبَةُ، عَنِ الأَشْعَثِ بْنِ سُلَيْمٍ، قَالَ سَمِعْتُ مُعَاوِيَةَ بْنَ سُوَيْدٍ، سَمِعْتُ الْبَرَاءَ بْنَ عَازِبٍ ـ رضى الله عنهما ـ قَالَ أَمَرَنَا النَّبِيُّ صلى الله عليه وسلم بِسَبْعٍ، وَنَهَانَا عَنْ سَبْعٍ‏.‏ فَذَكَرَ عِيَادَةَ الْمَرِيضِ، وَاتِّبَاعَ الْجَنَائِزِ، وَتَشْمِيتَ الْعَاطِسِ، وَرَدَّ السَّلاَمِ، وَنَصْرَ الْمَظْلُومِ، وَإِجَابَةَ الدَّاعِي، وَإِبْرَارَ الْمُقْسِمِ‏.‏","b":"বারা ইবনু ‘আযিব (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম আমাদেরকে সাতটি বিষয়ে নির্দেশ দিয়েছেন এবং সাতটি বিষয়ে নিষেধ করেছেন। তারপর তিনি উল্লেখ করলেন, অসুস্থদের খোঁজখবর নেয়া, জানাযায় পিছে পিছে যাওয়া, হাঁচির জবাবে ইয়ারহামুকাল্লাহ্ বলা, সালামের উত্তর দেয়া, অত্যাচারিতকে সাহায্য করা, আহবানকারীর প্রতি সাড়া দেয়া, কসমকারীকে দায়িত্ব মুক্ত করা। (১২৩৯) (আধুনিক প্রকাশনীঃ ২২৬৬, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Muawiya bin Suwaid:I heard Al-Bara' bin `Azib saying, \"The Prophet (ﷺ) ordered us to do seven things and prohibited us from doing seven other things.\" Then Al-Bara' mentioned the following:-- (1) To pay a visit to the sick (inquiring about his health), (2) to follow funeral processions, (3) to say to a sneezer, \"May Allah be merciful to you\" (if he says, \"Praise be to Allah!\"), (4) to return greetings, (5) to help the oppressed, (6) to accept invitations, (7) to help others to fulfill their oaths. (See Hadith No. 753, Vol)"},{"n":"2446","k":"","a":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ يَشُدُّ بَعْضُهُ بَعْضًا ‏\"‏‏.‏ وَشَبَّكَ بَيْنَ أَصَابِعِهِ‏.‏","b":"আবূ মূসা (রাঃ) হতে বর্ণিত যে, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, এক মু’মিন আর এক মু’মিনের জন্য ইমারত তুল্য, যার এক অংশ আর এক অংশকে সুদৃঢ় করে। আর তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তাঁর এক হাতের আঙ্গুল আর এক হাতের আঙ্গুলে প্রবেশ করিয়ে দেখালেন। (৪৮১) (আধুনিক প্রকাশনীঃ ২২৬৭, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Musa:The Prophet (ﷺ) said, \"A believer to another believer is like a building whose different parts enforce each other.\" The Prophet (ﷺ) then clasped his hands with the fingers interlaced (while saying that)"},{"n":"2447","k":"","a":"حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا عَبْدُ الْعَزِيزِ الْمَاجِشُونُ، أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ دِينَارٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ ـ رضى الله عنهما ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الظُّلْمُ ظُلُمَاتٌ يَوْمَ الْقِيَامَةِ ‏\"‏‏.‏","b":"بَاب الِانْتِصَارِ مِنْ الظَّالِمِ لِقَوْلِهِ جَلَّ ذِكْرُهُ ৪৬/৬. অত্যাচারী হতে প্রতিশোধ নেয়া। ( لاَ يُحِبُّ اللهُ الْجَهْرَ بِالسُّوءِ مِنْ الْقَوْلِ إِلاَّ مَنْ ظُلِمَ وَكَانَ اللهُ سَمِيعًا عَلِيمًا ) ( وَالَّذِينَ إِذَا أَصَابَهُمْ الْبَغْيُ هُمْ يَنْتَصِرُونَ ) قَالَ إِبْرَاهِيمُ كَانُوا يَكْرَهُونَ أَنْ يُسْتَذَلُّوا فَإِذَا قَدَرُوا عَفَوْا আল্লাহ তা‘আলার বাণীঃ ‘‘মন্দ কথার প্রচারণা আল্লাহ পছন্দ করেন না, তবে যার উপর যুলুম করা হয়েছে। আর আল্লাহ শ্রবণকারী, জ্ঞানী’’- (আন-নিসাঃ ১৪৮)। ‘‘এবং যারা অত্যাচারিত হলে প্রতিশোধ গ্রহণ করে’’- (শূরাঃ ৩৯)। ইবরাহীম (রহ.) বলেন, সহাবায়ে কিরাম (রাঃ) অপমানিত হওয়াকে পছন্দ করতেন না, তবে ক্ষমতা লাভ করলে মাফ করে দিতেন। 46/7. بَاب عَفْوِ الْمَظْلُومِ ৪৬/৭. অধ্যায় : নির্যাতিতকে ক্ষমা করা। لِقَوْلِهِ تَعَالَى ( إِنْ تُبْدُوا خَيْرًا أَوْ تُخْفُوهُ أَوْ تَعْفُوا عَنْ سُوءٍ فَإِنَّ اللهَ كَانَ عَفُوًّا قَدِيرًا ) ( وَجَزَاءُ سَيِّئَةٍ سَيِّئَةٌ مِثْلُهَا فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُ عَلَى اللهِ إِنَّهُ لاَ يُحِبُّ الظَّالِمِينَ وَلَمَنْ انْتَصَرَ بَعْدَ ظُلْمِهِ فَأُولَئِكَ مَا عَلَيْهِمْ مِنْ سَبِيلٍ إِنَّمَا السَّبِيلُ عَلَى الَّذِينَ يَظْلِمُونَ النَّاسَ وَيَبْغُونَ فِي الأَرْضِ بِغَيْرِ الْحَقِّ أُولَئِكَ لَهُمْ عَذَابٌ أَلِيمٌ وَلَمَنْ صَبَرَ وَغَفَرَ إِنَّ ذَلِكَ لَمِنْ عَزْمِ الأُمُورِ) (وَتَرَى الظَّالِمِينَ لَمَّا رَأَوْا الْعَذَابَ يَقُولُونَ هَلْ إِلَى مَرَدٍّ مِنْ سَبِيلٍ) আল্লাহ তা‘আলার বাণীঃ ‘‘তোমরা সৎকর্ম প্রকাশ্যে করলে অথবা গোপনে করলে অথবা দোষ ক্ষমা করলে আল্লাহও দোষ মোচনকারী, শক্তিমান’’- (আন-নিসাঃ ১৪৯)। ‘‘মন্দের প্রতিফল অনুরূপ মন্দ, কিন্তু যে মাফ করে দেয় এবং আপোষে নিষ্পত্তি করে, তার পুরস্কার আল্লাহর নিকটই রয়েছে। তিনি যালিমদের পছন্দ করেন না। তবে অত্যাচারিত হওয়ার পর যারা প্রতিবিধান করে, তাদের বিরুদ্ধে কোন ব্যবস্থা গ্রহণ করা হবে না। কেবল তাদের বিরুদ্ধে ব্যবস্থা অবলম্বন করা হবে, যারা মানুষের উপর জুলুম করে এবং পৃথিবীতে অন্যায়ভাবে বিদ্রোহাচরণ করে বেড়ায়। এদের জন্য রয়েছে যন্ত্রণাদায়ক শাস্তি। অবশ্য যে ধৈর্য ধারণ করে এবং মাফ করে দেয়, এতো হবে দৃঢ়সংকল্পের কাজ। আল্লাহ যাকে পথভ্রষ্ট করেন তার জন্য কোন অভিভাবক নেই। যালিমরা (কিয়ামতের দিন) যখন শাস্তি দেখবে, তখন আপনি তাদের বলতে শুনবেন প্রত্যাবর্তনের কোন পথ আছে কি?’’ (শূরা (৪২) : ৪০-৪৪) ২৪৪৭. ‘আবদুল্লাহ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, জুলুম কিয়ামতের দিন অনেক অন্ধকারের রূপ ধারণ করবে। (আধুনিক প্রকাশনীঃ ২২৬৮, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Ibn `Umar:The Prophet (ﷺ) said, \"Oppression will be a darkness on the Day of Resurrection"},{"n":"2448","k":"","a":"حَدَّثَنَا يَحْيَى بْنُ مُوسَى، حَدَّثَنَا وَكِيعٌ، حَدَّثَنَا زَكَرِيَّاءُ بْنُ إِسْحَاقَ الْمَكِّيُّ، عَنْ يَحْيَى بْنِ عَبْدِ اللَّهِ بْنِ صَيْفِيٍّ، عَنْ أَبِي مَعْبَدٍ، مَوْلَى ابْنِ عَبَّاسٍ عَنِ ابْنِ عَبَّاسٍ ـ رضى الله عنهما ـ أَنَّ النَّبِيَّ صلى الله عليه وسلم بَعَثَ مُعَاذًا إِلَى الْيَمَنِ، فَقَالَ ‏ \"‏ اتَّقِ دَعْوَةَ الْمَظْلُومِ، فَإِنَّهَا لَيْسَ بَيْنَهَا وَبَيْنَ اللَّهِ حِجَابٌ ‏\"‏‏.‏","b":"ইবনু ‘আব্বাস (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম যখন মু‘আয (রাঃ)-কে ইয়ামানে পাঠান এবং তাকে বলেন, মাযলুমের ফরিয়াদকে ভয় করবে। কেননা, তার ফরিয়াদ এবং আল্লাহর মাঝে কোন পর্দা থাকে না। (১৩৯৫) (আধুনিক প্রকাশনীঃ ২২৬৯, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Ibn `Abbas:The Prophet (ﷺ) sent Mu`adh to Yemen and said, \"Be afraid, from the curse of the oppressed as there is no screen between his invocation and Allah"},{"n":"2449","k":"","a":"حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، حَدَّثَنَا ابْنُ أَبِي ذِئْبٍ، حَدَّثَنَا سَعِيدٌ الْمَقْبُرِيُّ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَنْ كَانَتْ لَهُ مَظْلَمَةٌ لأَحَدٍ مِنْ عِرْضِهِ أَوْ شَىْءٍ فَلْيَتَحَلَّلْهُ مِنْهُ الْيَوْمَ، قَبْلَ أَنْ لاَ يَكُونَ دِينَارٌ وَلاَ دِرْهَمٌ، إِنْ كَانَ لَهُ عَمَلٌ صَالِحٌ أُخِذَ مِنْهُ بِقَدْرِ مَظْلَمَتِهِ، وَإِنْ لَمْ تَكُنْ لَهُ حَسَنَاتٌ أُخِذَ مِنْ سَيِّئَاتِ صَاحِبِهِ فَحُمِلَ عَلَيْهِ ‏\"‏‏.‏ قَالَ أَبُو عَبْدِ اللَّهِ قَالَ إِسْمَاعِيلُ بْنُ أَبِي أُوَيْسٍ إِنَّمَا سُمِّيَ الْمَقْبُرِيَّ لأَنَّهُ كَانَ نَزَلَ نَاحِيَةَ الْمَقَابِرِ‏.‏ قَالَ أَبُو عَبْدِ اللَّهِ وَسَعِيدٌ الْمَقْبُرِيُّ هُوَ مَوْلَى بَنِي لَيْثٍ، وَهُوَ سَعِيدُ بْنُ أَبِي سَعِيدٍ، وَاسْمُ أَبِي سَعِيدٍ كَيْسَانُ‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, যে ব্যক্তি তার ভাইয়ের সম্ভ্রমহানি বা অন্য কোন বিষয়ে যুলুমের জন্য দায়ী থাকে, সে যেন আজই তার কাছ হতে মাফ করিয়ে নেয়, সে দিন আসার পূর্বে যে দিন তার কোন দ্বীনার বা দিরহাম থাকবে না। সে দিন তার কোন সৎকর্ম না থাকলে তার যুলুমের পরিমাণ তা তার নিকট হতে নেয়া হবে আর তার কোন সৎকর্ম না থাকলে তার প্রতিপক্ষের পাপ হতে নিয়ে তা তার উপর চাপিয়ে দেয়া হবে। আবূ ‘আবদুল্লাহ (ইমাম বুখারী) (রহ.) বলেন, ইসমাঈল ইবনু উয়াইস (রহ.) বলেছেন, সাঈদ আল-মাকবুরী (রহ.) কবরস্থানের পার্শ্বে অবস্থান করতেন বলে আল-মাকবুরী বলা হত। আবূ ‘আবদুল্লাহ (ইমাম বুখারী) (রহ.) এও বলেছেন, সাঈদ আল-মাকবুরী হলেন, বনূ লাইসের আযাদকৃত গোলাম। ইনি হলেন সাঈদ ইবনু আবূ সাঈদ। আর আবূ সাঈদের নাম হলো কায়সান। (৬৫৩৪) (আধুনিক প্রকাশনীঃ ২২৭০, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"Whoever has oppressed another person concerning his reputation or anything else, he should beg him to forgive him before the Day of Resurrection when there will be no money (to compensate for wrong deeds), but if he has good deeds, those good deeds will be taken from him according to his oppression which he has done, and if he has no good deeds, the sins of the oppressed person will be loaded on him"},{"n":"2450","k":"","a":"حَدَّثَنَا مُحَمَّدٌ، أَخْبَرَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا هِشَامُ بْنُ عُرْوَةَ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ ـ رضى الله عنها – ‏{‏وَإِنِ امْرَأَةٌ خَافَتْ مِنْ بَعْلِهَا نُشُوزًا أَوْ إِعْرَاضًا‏}‏ قَالَتِ الرَّجُلُ تَكُونُ عِنْدَهُ الْمَرْأَةُ، لَيْسَ بِمُسْتَكْثِرٍ مِنْهَا، يُرِيدُ أَنْ يُفَارِقَهَا، فَتَقُولُ أَجْعَلُكَ مِنْ شَأْنِي فِي حِلٍّ‏.‏ فَنَزَلَتْ هَذِهِ الآيَةُ فِي ذَلِكَ‏.‏","b":"‘আয়িশাহ (রাযি.) হতে বর্ণিত, ‘‘কোন স্ত্রী যদি স্বামীর অবজ্ঞা ও উপেক্ষার ভয় করে’’- (আন-নিসাঃ ১২৮) আয়াতের তাফসীর প্রসঙ্গে তিনি (‘আয়িশাহ (রাযি.) বলেন, এক ব্যক্তি তার স্ত্রীর কাছে বেশী যাওয়া-আসা করত না বরং তাকে পরিত্যাগ অর্থাৎ তালাক দেয়ার ইচ্ছা পোষণ করত। [1] এ অবস্থায় স্ত্রী বলল, আমি তোমাকে আমার ব্যাপারে দায়মুক্ত করে দিলাম। এ ঘটনার প্রেক্ষিতে এই আয়াতটি অবতীর্ণ হয়। (২৬৯৪, ৪৬০১, ৫২০৬) (আধুনিক প্রকাশনীঃ ২২৭১, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Aisha:Regarding the explanation of the following verse:-- \"If a wife fears Cruelty or desertion On her husband's part.\" (4.128) A man may dislike his wife and intends to divorce her, so she says to him, \"I give up my rights, so do not divorce me.\" The above verse was revealed concerning such a case"},{"n":"2451","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ أَبِي حَازِمِ بْنِ دِينَارٍ، عَنْ سَهْلِ بْنِ سَعْدٍ السَّاعِدِيِّ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم أُتِيَ بِشَرَابٍ، فَشَرِبَ مِنْهُ وَعَنْ يَمِينِهِ غُلاَمٌ وَعَنْ يَسَارِهِ الأَشْيَاخُ، فَقَالَ لِلْغُلاَمِ ‏ \"‏ أَتَأْذَنُ لِي أَنْ أُعْطِيَ هَؤُلاَءِ ‏\"‏‏.‏ فَقَالَ الْغُلاَمُ لاَ وَاللَّهِ يَا رَسُولَ اللَّهِ لاَ أُوثِرُ بِنَصِيبِي مِنْكَ أَحَدًا‏.‏ قَالَ فَتَلَّهُ رَسُولُ اللَّهِ صلى الله عليه وسلم فِي يَدِهِ‏.‏","b":"সাহল ইবনু সা‘দ সায়াদী (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর কাছে কিছু পানীয় দ্রব্য আনা হল। তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তা হতে কিছুটা পান করলেন। তাঁর সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ডান দিকে বসা ছিল একটি বালক, আর বাম দিকে ছিলেন বয়োজ্যেষ্ঠরা। তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বালকটিকে বললেন, এ বয়োজ্যেষ্ঠদেরকে দেয়ার জন্য তুমি আমাকে অনুমতি দিবে কি? তখন বালকটি বলল, না, হে আল্লাহর রাসূল! আল্লাহর কসম! আমি আপনার কাছ হতে প্রাপ্য আমার অংশে কাউকে অগ্রাধিকার দিব না। রাবী বলেন, তখন রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম পানির পেয়ালাটা তার হাতে ঠেলে দিলেন। (২৩৫১) (আধুনিক প্রকাশনীঃ ২২৭২, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Sahl bin Sa`d As-Sa`idi:A drink (milk mixed with water) was brought to Allah's Messenger (ﷺ) who drank some of it. A boy was sitting to his right, and some old men to his left. Allah's Messenger (ﷺ) said to the boy, \"Do you allow me to give the rest of the drink to these people?\" The boy said, \"O Allah's Messenger (ﷺ)! I will not give preference to anyone over me to drink the rest of it from which you have drunk.\" Allah's Messenger (ﷺ) then handed the bowl (of drink) to the boy. (See Hadith No)"},{"n":"2452","k":"","a":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، قَالَ حَدَّثَنِي طَلْحَةُ بْنُ عَبْدِ اللَّهِ، أَنَّ عَبْدَ الرَّحْمَنِ بْنَ عَمْرِو بْنِ سَهْلٍ، أَخْبَرَهُ أَنَّ سَعِيدَ بْنَ زَيْدٍ ـ رضى الله عنه ـ قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ مَنْ ظَلَمَ مِنَ الأَرْضِ شَيْئًا طُوِّقَهُ مِنْ سَبْعِ أَرَضِينَ ‏\"‏‏.‏","b":"সাঈদ ইবনু যায়দ (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি, যে ব্যক্তি কারো জমির অংশ জুলুম করে কেড়ে নেয়, কিয়ামতের দিন এর সাত তবক জমিন তার গলায় লটকিয়ে দেয়া হবে। (৩১৯৮) (আধুনিক প্রকাশনীঃ ২২৭৩, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Sa`id bin Zaid:Allah's Messenger (ﷺ) said, \"Whoever usurps the land of somebody unjustly, his neck will be encircled with it down the seven earths (on the Day of Resurrection)"},{"n":"2453","k":"","a":"حَدَّثَنَا أَبُو مَعْمَرٍ، حَدَّثَنَا عَبْدُ الْوَارِثِ، حَدَّثَنَا حُسَيْنٌ، عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، قَالَ حَدَّثَنِي مُحَمَّدُ بْنُ إِبْرَاهِيمَ، أَنَّ أَبَا سَلَمَةَ، حَدَّثَهُ أَنَّهُ، كَانَتْ بَيْنَهُ وَبَيْنَ أُنَاسٍ خُصُومَةٌ، فَذَكَرَ لِعَائِشَةَ ـ رضى الله عنها ـ فَقَالَتْ يَا أَبَا سَلَمَةَ اجْتَنِبِ الأَرْضَ، فَإِنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ ‏ \"‏ مَنْ ظَلَمَ قِيدَ شِبْرٍ مِنَ الأَرْضِ طُوِّقَهُ مِنْ سَبْعِ أَرَضِينَ ‏\"‏‏.‏","b":"আবূ সালামাহ (রহ.) হতে বর্ণিত। তিনি বর্ণনা করেন যে, তাঁর এবং কয়েকজন লোকের মধ্যে একটি বিবাদ ছিল। ‘আয়িশাহ (রাযি.)-এর কাছে উল্লেখ করা হলে তিনি বললেন, হে আবূ সালামাহ! জমির ব্যাপারে সতর্ক থাক। কেননা, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, যে ব্যক্তি এক বিঘত জমি অন্যায়ভাবে নিয়ে নেয়, (কিয়ামতের দিন) এর সাত তবক জমি তার গলায় লটকিয়ে দেয়া হবে। (৩১৯৫) (আধুনিক প্রকাশনীঃ ২২৭৪, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Salama:That there was a dispute between him and some people (about a piece of land). When he told `Aisha about it, she said, \"O Abu Salama! Avoid taking the land unjustly, for the Prophet (ﷺ) said, 'Whoever usurps even one span of the land of somebody, his neck will be encircled with it down the seven earths"},{"n":"2454","k":"","a":"حَدَّثَنَا مُسْلِمُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ الْمُبَارَكِ، حَدَّثَنَا مُوسَى بْنُ عُقْبَةَ، عَنْ سَالِمٍ، عَنْ أَبِيهِ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ مَنْ أَخَذَ مِنَ الأَرْضِ شَيْئًا بِغَيْرِ حَقِّهِ خُسِفَ بِهِ يَوْمَ الْقِيَامَةِ إِلَى سَبْعِ أَرَضِينَ ‏\"‏‏.‏ قَالَ أَبُو عَبْدِ اللَّهِ هَذَا الْحَدِيثُ لَيْسَ بِخُرَاسَانَ فِي كِتَابِ ابْنِ الْمُبَارَكِ، أَمْلاَهُ عَلَيْهِمْ بِالْبَصْرَةِ‏.‏","b":"সালিম (রহ.)-এর পিতা হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, যে ব্যক্তি অন্যায়ভাবে সামান্য পরিমাণ জমিও নিয়ে নিবে, কিয়ামতের দিন তাকে সাত তবক জমিনের নীচ পর্যন্ত ধসিয়ে দেয়া হবে। আবূ ‘আবদুল্লাহ [ইমাম বুখারী (রহ.)] বলেন, ‘আবদুল্লাহ ইবনু মুবারক (রহ.) কর্তৃক খুরাসানে রচিত হাদীসগ্রন্থে এ হাদীসটি নেই। এ হাদীসটি বসরায় লোকজনকে শুনানো হয়েছে। (৩১৯৬) (আধুনিক প্রকাশনীঃ ২২৭৫, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Salim's father (i.e. `Abdullah):The Prophet (ﷺ) said, \"Whoever takes a piece of the land of others unjustly, he will sink down the seven earths on the Day of Resurrection"},{"n":"2455","k":"","a":"حَدَّثَنَا حَفْصُ بْنُ عُمَرَ، حَدَّثَنَا شُعْبَةُ، عَنْ جَبَلَةَ، كُنَّا بِالْمَدِينَةِ فِي بَعْضِ أَهْلِ الْعِرَاقِ، فَأَصَابَنَا سَنَةٌ، فَكَانَ ابْنُ الزُّبَيْرِ يَرْزُقُنَا التَّمْرَ، فَكَانَ ابْنُ عُمَرَ ـ رضى الله عنهما ـ يَمُرُّ بِنَا فَيَقُولُ إِنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم نَهَى عَنِ الإِقْرَانِ، إِلاَّ أَنْ يَسْتَأْذِنَ الرَّجُلُ مِنْكُمْ أَخَاهُ‏.‏","b":"জাবালাহ (রহ.) হতে বর্ণিত। তিনি বলেন, আমরা মাদ্বীনায় কিছু সংখ্যক ইরাকী লোকের সাথে ছিলাম। একবার আমরা দুর্ভিক্ষের কবলে পতিত হই, তখন ইবনু যুবাইর (রাঃ) আমাদেরকে খেজুর খেতে দিতেন। ইবনু উমার (রাঃ) আমাদের নিকট দিয়ে যেতেন এবং বলতেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কাউকে তার ভাইয়ের অনুমতি ব্যতীত এক সাথে দু’টো করে খেজুর খেতে নিষেধ করেছেন। (২৪৮৯, ২৪৯০, ৫৪৪৬) (আধুনিক প্রকাশনীঃ ২২৭৬, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Jabala:\"We were in Medina with some of the Iraqi people, and we were struck with famine and Ibn Az-Zubair used to give us dates. Ibn `Umar used to pass by and say, \"The Prophet (ﷺ) forbade us to eat two dates at a time, unless one takes the permission of one's companions"},{"n":"2456","k":"","a":"حَدَّثَنَا أَبُو النُّعْمَانِ، حَدَّثَنَا أَبُو عَوَانَةَ، عَنِ الأَعْمَشِ، عَنْ أَبِي وَائِلٍ، عَنْ أَبِي مَسْعُودٍ، أَنَّ رَجُلاً، مِنَ الأَنْصَارِ يُقَالُ لَهُ أَبُو شُعَيْبٍ كَانَ لَهُ غُلاَمٌ لَحَّامٌ فَقَالَ لَهُ أَبُو شُعَيْبٍ اصْنَعْ لِي طَعَامَ خَمْسَةٍ لَعَلِّي أَدْعُو النَّبِيَّ صلى الله عليه وسلم خَامِسَ خَمْسَةٍ‏.‏ وَأَبْصَرَ فِي وَجْهِ النَّبِيِّ صلى الله عليه وسلم الْجُوعَ ـ فَدَعَاهُ، فَتَبِعَهُمْ رَجُلٌ لَمْ يُدْعَ فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ إِنَّ هَذَا قَدِ اتَّبَعَنَا أَتَأْذَنُ لَهُ ‏\"‏‏.‏ قَالَ نَعَمْ‏.‏","b":"আবূ মাসঊদ (রাঃ) হতে বর্ণিত যে, আবূ শুয়াইব (রাঃ) নামক এক আনসারীর গোশত বিক্রেতা একজন গোলাম ছিল। একদিন আবূ শুয়াইব (রাঃ) তাকে বললেন, আমার জন্য পাঁচজন লোকের খাবার তৈরী কর। আমি আশা করছি যে, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -কে দাওয়াত করব। আর তিনি উক্ত পাঁচজনের একজন। উক্ত আনসারী নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর চেহারায় ক্ষুধার ছাপ লক্ষ্য করেছিলেন। কাজেই তিনি তাঁকে সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম দাওয়াত করলেন। কিন্তু তাঁদের সঙ্গে আরেকজন লোক আসলেন, যাকে দাওয়াত করা হয়নি। তখন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম (আনসারীকে) বললেন, এ আমাদের পিছে পিছে চলে এসেছে। তুমি কি তাকে অনুমতি দিচ্ছ? তিনি বললেন, হ্যাঁ। (২০৮১) (আধুনিক প্রকাশনীঃ ২২৭৭, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Mas`ud:There was an Ansari man called Abu Shu'aib who had a slave butcher. Abu Shu'aib said to him, \"Prepare a meal sufficient for five persons so that I might invite the Prophet (ﷺ) besides other four persons.\" Abu Shu'aib had seen the signs of hunger on the face of the Prophet (ﷺ) and so he invited him. Another man who was not invited, followed the Prophet. The Prophet (ﷺ) said to Abu Shu'aib, \"This man has followed us. Do you allow him to share the meal?\" Abu Shu'aib said, \"Yes"},{"n":"2457","k":"","a":"حَدَّثَنَا أَبُو عَاصِمٍ، عَنِ ابْنِ جُرَيْجٍ، عَنِ ابْنِ أَبِي مُلَيْكَةَ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ إِنَّ أَبْغَضَ الرِّجَالِ إِلَى اللَّهِ الأَلَدُّ الْخَصِمُ ‏\"‏‏.‏","b":"‘আয়িশাহ (রাযি.) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, আল্লাহর নিকট সেই লোক সবচেয়ে বেশী ঘৃণিত, যে অতি ঝগড়াটে। (৪০২৩, ৭১৮৮) (আধুনিক প্রকাশনীঃ ২২৭৮, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated `Aisha:The Prophet (ﷺ) said, \"The most hated person in the sight of Allah is the most quarrelsome person"},{"n":"2458","k":"","a":"حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ عَبْدِ اللَّهِ، قَالَ حَدَّثَنِي إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنْ صَالِحٍ، عَنِ ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي عُرْوَةُ بْنُ الزُّبَيْرِ، أَنَّ زَيْنَبَ بِنْتَ أُمِّ سَلَمَةَ، أَخْبَرَتْهُ أَنَّ أُمَّهَا أُمَّ سَلَمَةَ ـ رضى الله عنها ـ زَوْجَ النَّبِيِّ صلى الله عليه وسلم أَخْبَرَتْهَا عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم أَنَّهُ سَمِعَ خُصُومَةً بِبَابِ حُجْرَتِهِ، فَخَرَجَ إِلَيْهِمْ، فَقَالَ ‏ \"‏ إِنَّمَا أَنَا بَشَرٌ وَإِنَّهُ يَأْتِينِي الْخَصْمُ، فَلَعَلَّ بَعْضَكُمْ أَنْ يَكُونَ أَبْلَغَ مِنْ بَعْضٍ، فَأَحْسِبُ أَنَّهُ صَدَقَ، فَأَقْضِيَ لَهُ بِذَلِكَ، فَمَنْ قَضَيْتُ لَهُ بِحَقِّ مُسْلِمٍ فَإِنَّمَا هِيَ قِطْعَةٌ مِنَ النَّارِ، فَلْيَأْخُذْهَا أَوْ فَلْيَتْرُكْهَا ‏\"‏‏.‏","b":"নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর সহধর্মিনী উম্মু সালামাহ (রাযি.) রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণনা করেছেন যে, একদিন তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তাঁর ঘরের দরজার নিকটে ঝগড়ার শব্দ শুনতে পেয়ে তাদের নিকট বেরিয়ে আসলেন। [তাঁর সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর কাছে বিচার চাওয়া হল] তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, আমি তো একজন মানুষ। আমার কাছে (কোন কোন সময়) ঝগড়াকারীরা আসে। তোমাদের মধ্যে কেউ কেউ অন্যের চেয়ে অধিক বাকপটু। তখন আমি মনে করি যে, সে সত্য বলেছে। তাই আমি তার পক্ষে রায় দেই। বিচারে যদি আমি ভুলবশত অন্য কোন মুসলিমের হক তাকে দিয়ে থাকি, তবে তা দোযখের টুকরা। এখন সে তা গ্রহণ করুক বা ত্যাগ করুক। (২৬৮০, ৬৯৬৭, ৭১৬৯, ৮১৮১, ৭১৮০) (আধুনিক প্রকাশনীঃ ২২৭৯, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Um Salama:(the wife of the Prophet) Allah's Messenger (ﷺ) heard some people quarreling at the door of his dwelling. He came out and said, \"I am only a human being, and opponents come to me (to settle their problems); maybe someone amongst you can present his case more eloquently than the other, whereby I may consider him true and give a verdict in his favor. So, If I give the right of a Muslim to another by mistake, then it is really a portion of (Hell) Fire, he has the option to take or give up (before the Day of Resurrection)"},{"n":"2459","k":"","a":"حَدَّثَنَا بِشْرُ بْنُ خَالِدٍ، أَخْبَرَنَا مُحَمَّدٌ، عَنْ شُعْبَةَ، عَنْ سُلَيْمَانَ، عَنْ عَبْدِ اللَّهِ بْنِ مُرَّةَ، عَنْ مَسْرُوقٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو ـ رضى الله عنهما ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ أَرْبَعٌ مَنْ كُنَّ فِيهِ كَانَ مُنَافِقًا، أَوْ كَانَتْ فِيهِ خَصْلَةٌ مِنْ أَرْبَعَةٍ كَانَتْ فِيهِ خَصْلَةٌ مِنَ النِّفَاقِ، حَتَّى يَدَعَهَا إِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ، وَإِذَا عَاهَدَ غَدَرَ، وَإِذَا خَاصَمَ فَجَرَ ‏\"‏‏.‏","b":"‘আবদুল্লাহ ইবনু আমর (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, চারটি স্বভাব যার মধ্যে থাকে, সে মুনাফিক অথবা যার মধ্যে এ চারটি স্বভাবের কোন একটা থাকে, তার মধ্যেও মুনাফিকীর একটি স্বভাব থাকে, যে পর্যন্ত না সে তা পরিত্যাগ করে। (১) সে যখন কথা বলে মিথ্যা বলে (২) যখন ওয়াদা করে ভঙ্গ করে (৩) যখন চুক্তি করে তা লঙ্ঘন করে (৪) যখন ঝগড়া করে অশ্লীল বাক্যালাপ করে। (৩৪) (আধুনিক প্রকাশনীঃ ২২৮০, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated `Abdullah bin `Amr:The Prophet (ﷺ) said, \"Whoever has (the following) four characters will be a hypocrite, and whoever has one of the following four characteristics will have one characteristic of hypocrisy until he gives it up. These are: (1 ) Whenever he talks, he tells a lie; (2) whenever he makes a promise, he breaks it; (3) whenever he makes a covenant he proves treacherous; (4) and whenever he quarrels, he behaves impudently in an evil insulting manner.\" (See Hadith No. 33 Vol)"},{"n":"2460","k":"","a":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، حَدَّثَنِي عُرْوَةُ، أَنَّ عَائِشَةَ ـ رضى الله عنها ـ قَالَتْ جَاءَتْ هِنْدُ بِنْتُ عُتْبَةَ بْنِ رَبِيعَةَ، فَقَالَتْ يَا رَسُولَ اللَّهِ إِنَّ أَبَا سُفْيَانَ رَجُلٌ مِسِّيكٌ، فَهَلْ عَلَىَّ حَرَجٌ أَنْ أُطْعِمَ مِنَ الَّذِي لَهُ عِيَالَنَا فَقَالَ ‏ \"‏ لاَ حَرَجَ عَلَيْكِ أَنْ تُطْعِمِيهِمْ بِالْمَعْرُوفِ ‏\"‏‏.‏","b":"وَقَالَ ابْنُ سِيرِينَ يُقَاصُّهُ وَقَرَأَ ( وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا بِمِثْلِ مَا عُوقِبْتُمْ بِهِ ) ইবনু সীরীন (রহ.) বলেন, তার প্রাপ্য যতটুকু, ততটুকু গ্রহণ করতে পারে এবং তিনি (কুরআনুল কারীমের এ আয়াত) পাঠ করেনঃ ‘‘যদি তোমরা প্রতিশোধ গ্রহণ কর, তবে ঠিক ততখানি করবে, যতখানি অন্যায় তোমাদের প্রতি করা হয়েছে।’’ (নাহল (১৬) : ১২৬) ২৪৬০. ‘আয়িশাহ (রাযি.) হতে বর্ণিত। তিনি বলেন, একদিন উতবাহ ইবনু রবী‘আর কন্যা হিন্দা নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর কাছে এসে বললেন, হে আল্লাহর রাসূল! সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম (আমার স্বামী) আবূ সুফিয়ান বখিল ব্যক্তি। তার সম্পদ হতে যদি আমার সন্তানদের খেতে দেই, তাহলে আমার কোন গুনাহ হবে কি? তখন তিনি বললেন, যদি তুমি তাদেরকে ন্যায়সঙ্গতভাবে খেতে দাও তাহলে তোমার কোন গুনাহ হবে না। (২২১১) (আধুনিক প্রকাশনীঃ ২২৮১, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Aisha:Hind bint `Utba (Abu Sufyan's wife) came and said, \"O Allah's Messenger (ﷺ)! Abu Sufyan is a miser. Is there any harm if I spend something from his property for our children?\" He said, there is no harm for you if you feed them from it justly and reasonably (with no extravagance)"},{"n":"2461","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، حَدَّثَنَا اللَّيْثُ، قَالَ حَدَّثَنِي يَزِيدُ، عَنْ أَبِي الْخَيْرِ، عَنْ عُقْبَةَ بْنِ عَامِرٍ، قَالَ قُلْنَا لِلنَّبِيِّ صلى الله عليه وسلم إِنَّكَ تَبْعَثُنَا فَنَنْزِلُ بِقَوْمٍ لاَ يَقْرُونَا فَمَا تَرَى فِيهِ فَقَالَ لَنَا ‏ \"‏ إِنْ نَزَلْتُمْ بِقَوْمٍ، فَأُمِرَ لَكُمْ بِمَا يَنْبَغِي لِلضَّيْفِ فَاقْبَلُوا، فَإِنْ لَمْ يَفْعَلُوا فَخُذُوا مِنْهُمْ حَقَّ الضَّيْفِ ‏\"‏‏.‏","b":"‘উকবাহ ইবনু ‘আমির (রাঃ) হতে বর্ণিত। তিনি বলেন, আমরা নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -কে বললাম, আপনি যখন আমাদের কোন অভিযানে পাঠান, আর আমরা এমন গোত্রের কাছে অবতরণ করি, যারা আমাদের মেহমানদারী করে না। এ ব্যাপারে আপনি কী বলেন? তিনি আমাদেরকে বললেন, যদি তোমরা কোন গোত্রের কাছে অবতরণ কর এবং তোমাদের জন্য যদি উপযুক্ত মেহমানদারীর আয়োজন করা হয়, তবে তোমরা তা গ্রহণ করবে, আর যদি তা না করে তবে তাদের কাছ হতে মেহমানের হক আদায় করে নিবে। (৬১৩৭) (আধুনিক প্রকাশনীঃ ২২৮২, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated `Uqba bin 'Amir:We said to the Prophet, \"You send us out and it happens that we have to stay with people who do not entertain us. What do you think about it? He said to us, \"If you stay with some people and they entertain you as they should for a guest, accept their hospitality, but if they don't, take the right of the guest from them"},{"n":"2462","k":"","a":"حَدَّثَنَا يَحْيَى بْنُ سُلَيْمَانَ، قَالَ حَدَّثَنِي ابْنُ وَهْبٍ، قَالَ حَدَّثَنِي مَالِكٌ،‏.‏ وَأَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، أَخْبَرَنِي عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، أَنَّ ابْنَ عَبَّاسٍ، أَخْبَرَهُ عَنْ عُمَرَ ـ رضى الله عنهم ـ قَالَ حِينَ تَوَفَّى اللَّهُ نَبِيَّهُ صلى الله عليه وسلم إِنَّ الأَنْصَارَ اجْتَمَعُوا فِي سَقِيفَةِ بَنِي سَاعِدَةَ، فَقُلْتُ لأَبِي بَكْرٍ انْطَلِقْ بِنَا‏.‏ فَجِئْنَاهُمْ فِي سَقِيفَةِ بَنِي سَاعِدَةَ‏.‏","b":"وَجَلَسَ النَّبِيُّ صلى الله عليه وسلم وَأَصْحَابُهُ فِي سَقِيفَةِ بَنِي سَاعِدَةَ নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ও তাঁর সাহাবীগণ বনু সাঈদার ছায়াযুক্ত উঠানে বসেছিলেন। ২৪৬২. ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, আল্লাহ তা‘আলা যখন তাঁর নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -কে তাঁর সান্নিধ্যে উঠিয়ে নিলেন, তখন আনসারগণ বনূ সাঈদা গোত্রের ছায়া ছাউনীতে গিয়ে সমবেত হলেন। আমি আবূ বাকর (রাঃ)-কে বললাম, আমাদের সঙ্গে চলুন। এরপর আমরা তাদের নিকট সাকীফাহ বনূ সাঈদাতে গিয়ে পৌঁছলাম। (৩৪৪৫, ৩৯২৮, ৪০২১, ৬৮২৯, ৬৮৩০, ৭৩২৩) (আধুনিক প্রকাশনীঃ ২২৮৩, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated `Umar:When Allah took away the soul of His Prophet at his death, the Ansar assembled In the shed of Bani Sa`ida. I said to Abu Bakr, \"Let us go.\" So, we came to them (i.e. to Ansar) at the shed of Bani Sa`ida. (See Hadith No. 19, Vol. 5 for details)"},{"n":"2463","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنِ ابْنِ شِهَابٍ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَيْرَةَ، رضى الله عنه أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ يَمْنَعُ جَارٌ جَارَهُ أَنْ يَغْرِزَ خَشَبَهُ فِي جِدَارِهِ ‏\"‏‏.‏ ثُمَّ يَقُولُ أَبُو هُرَيْرَةَ مَا لِي أَرَاكُمْ عَنْهَا مُعْرِضِينَ وَاللَّهِ لأَرْمِيَنَّ بِهَا بَيْنَ أَكْتَافِكُمْ‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, কোন প্রতিবেশী যেন তার প্রতিবেশীকে তার দেয়ালে খুঁটি পুঁততে নিষেধ না করে। তারপর আবূ হুরাইরাহ (রাঃ) বলেন, কী হল, আমি তোমাদেরকে এ হাদীস হতে উদাসীন দেখতে পাচ্ছি। আল্লাহর কসম, আমি সব সময় তোমাদেরকে এ হাদীস বলতে থাকব। (৫৬২৮, ৫৬২৭) (আধুনিক প্রকাশনীঃ ২২৮৪, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Al-Araj:Abu Huraira said, \"Allah's Messenger (ﷺ) said, 'No one should prevent his neighbor from fixing a wooden peg in his wall.\" Abu Huraira said (to his companions), \"Why do I find you averse to it? By Allah, I certainly will narrate it to you"},{"n":"2464","k":"","a":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الرَّحِيمِ أَبُو يَحْيَى، أَخْبَرَنَا عَفَّانُ، حَدَّثَنَا حَمَّادُ بْنُ زَيْدٍ، حَدَّثَنَا ثَابِتٌ، عَنْ أَنَسٍ ـ رضى الله عنه ـ كُنْتُ سَاقِيَ الْقَوْمِ فِي مَنْزِلِ أَبِي طَلْحَةَ، وَكَانَ خَمْرُهُمْ يَوْمَئِذٍ الْفَضِيخَ، فَأَمَرَ رَسُولُ اللَّهِ صلى الله عليه وسلم مُنَادِيًا يُنَادِي ‏\"‏ أَلاَ إِنَّ الْخَمْرَ قَدْ حُرِّمَتْ ‏\"‏‏.‏ قَالَ فَقَالَ لِي أَبُو طَلْحَةَ اخْرُجْ فَأَهْرِقْهَا، فَخَرَجْتُ فَهَرَقْتُهَا، فَجَرَتْ فِي سِكَكِ الْمَدِينَةِ فَقَالَ بَعْضُ الْقَوْمِ قَدْ قُتِلَ قَوْمٌ وَهْىَ فِي بُطُونِهِمْ‏.‏ فَأَنْزَلَ اللَّهُ ‏{‏لَيْسَ عَلَى الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ جُنَاحٌ فِيمَا طَعِمُوا‏}‏ الآيَةَ‏.‏","b":"আনাস (রাঃ) হতে বর্ণিত। তিনি বলেন, একদিন আমি আবূ তালহার বাড়িতে লোকজনকে শরাব পান করাচ্ছিলাম। সে সময় লোকেরা ফাযীখ শরাব ব্যবহার করতেন। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এক ব্যক্তিকে আদেশ করলেন, যেন সে এ মর্মে ঘোষণা দেয় যে, সাবধান! শরাব এখন হতে হারাম করে দেয়া হয়েছে। আবূ তালহা (রাঃ) আমাকে বললেন, বাইরে যাও এবং সমস্ত শরাব ঢেলে দাও। আমি বাইরে গেলাম এবং সমস্ত শরাব রাস্তায় ঢেলে দিলাম। আনাস (রাঃ) বলেন, সে দিন মাদ্বীনার অলিগলিতে শরাবের প্লাবন বয়ে গিয়েছিল। তখন কেউ কেউ বলল, একদল লোক নিহত হয়েছে, অথচ তাদের পেটে শরাব ছিল। তখন এ আয়াত নাযিল হলঃ ‘‘যারা ঈমান আনে ও সৎকর্ম করে, তারা পূর্বে যা কিছু পানাহার করেছে তার জন্য তাদের কোন গুনাহ হবে না’’- (আল-মা-য়িদাহ ৯৩)। (৪৬১৭, ৪৬২০, ৫৫৮০, ৫৫৮২, ৫৫৮৩, ৫৫৮৪, ৫৬০০, ৫৬২২, ৭২৫৩) (আধুনিক প্রকাশনীঃ ২২৮৫, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Anas:I was the butler of the people in the house of Abu Talha, and in those days drinks were prepared from dates. Allah's Messenger (ﷺ) ordered somebody to announce that alcoholic drinks had been prohibited. Abu Talha ordered me to go out and spill the wine. I went out and spilled it, and it flowed in the streets of Medina. Some people said, \"Some people were killed and wine was still in their stomachs.\" On that the Divine revelation came:-- \"On those who believe And do good deeds There is no blame For what they ate (in the past)"},{"n":"2465","k":"","a":"حَدَّثَنَا مُعَاذُ بْنُ فَضَالَةَ، حَدَّثَنَا أَبُو عُمَرَ، حَفْصُ بْنُ مَيْسَرَةَ عَنْ زَيْدِ بْنِ أَسْلَمَ، عَنْ عَطَاءِ بْنِ يَسَارٍ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ ـ رضى الله عنه ـ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏\"‏ إِيَّاكُمْ وَالْجُلُوسَ عَلَى الطُّرُقَاتِ ‏\"‏‏.‏ فَقَالُوا مَا لَنَا بُدٌّ، إِنَّمَا هِيَ مَجَالِسُنَا نَتَحَدَّثُ فِيهَا‏.‏ قَالَ ‏\"‏ فَإِذَا أَبَيْتُمْ إِلاَّ الْمَجَالِسَ فَأَعْطُوا الطَّرِيقَ حَقَّهَا ‏\"‏ قَالُوا وَمَا حَقُّ الطَّرِيقِ قَالَ ‏\"‏ غَضُّ الْبَصَرِ، وَكَفُّ الأَذَى، وَرَدُّ السَّلاَمِ، وَأَمْرٌ بِالْمَعْرُوفِ، وَنَهْىٌ عَنِ الْمُنْكَرِ ‏\"‏‏.‏","b":"وَقَالَتْ عَائِشَةُ فَابْتَنَى أَبُو بَكْرٍ مَسْجِدًا بِفِنَاءِ دَارِهِ يُصَلِّي فِيهِ وَيَقْرَأُ الْقُرْآنَ فَيَتَقَصَّفُ عَلَيْهِ نِسَاءُ الْمُشْرِكِينَ وَأَبْنَاؤُهُمْ يَعْجَبُونَ مِنْهُ وَالنَّبِيُّ صلى الله عليه وسلم يَوْمَئِذٍ بِمَكَّةَ ‘আয়িশাহ (রাযি.) বলেন, আবূ বাকর (রাঃ) তাঁর বাড়ীর আঙিণায় মসজিদ বানালেন। সেখানে তিনি সালাত আদায় করতেন ও কুরআন তিলাওয়াত করতেন। এতে মুশরিকদের স্ত্রীরা ও তাদের সন্তানেরা তাঁর কাছে ভীড় জমাতে লাগল। তারা আবূ বকরের অবস্থা দেখে বিস্মিত হত। সে সময় নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম মক্কায় ছিলেন। ২৪৬৫. আবূ সাঈদ খুদরী (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেন, তোমরা রাস্তার উপর বসা ছেড়ে দাও। লোকজন বলল, এ ছাড়া আমাদের কোন পথ নেই। কেননা, এটাই আমাদের উঠাবসার জায়গা এবং এখানেই আমরা কথাবার্তা বলে থাকি। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেন, যদি তোমাদের সেখানে বসতেই হয়, তবে রাস্তার হক আদায় করবে। তারা বলল, রাস্তার হক্ব কী? তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, দৃষ্টি অবনমিত রাখা, কষ্ট দেয়া হতে বিরত থাকা, সালামের জবাব দেয়া, সৎকাজের আদেশ দেয়া এবং অন্যায় কাজে নিষেধ করা। (৬২২৯) (আধুনিক প্রকাশনীঃ ২২৮৬, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Sa`id Al-Khudri:The Prophet (ﷺ) said, \"Beware! Avoid sitting on the roads (ways).\" The people said, \"There is no way out of it as these are our sitting places where we have talks.\" The Prophet (ﷺ) said, \"If you must sit there, then observe the rights of the way.\" They asked, \"What are the rights of the way?\" He said, \"They are the lowering of your gazes (on seeing what is illegal to look at), refraining from harming people, returning greetings, advocating good and forbidding evil"},{"n":"2466","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ سُمَىٍّ، مَوْلَى أَبِي بَكْرٍ عَنْ أَبِي صَالِحٍ السَّمَّانِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ ‏\"‏ بَيْنَا رَجُلٌ بِطَرِيقٍ، اشْتَدَّ عَلَيْهِ الْعَطَشُ فَوَجَدَ بِئْرًا فَنَزَلَ فِيهَا فَشَرِبَ، ثُمَّ خَرَجَ، فَإِذَا كَلْبٌ يَلْهَثُ يَأْكُلُ الثَّرَى مِنَ الْعَطَشِ، فَقَالَ الرَّجُلُ لَقَدْ بَلَغَ هَذَا الْكَلْبَ مِنَ الْعَطَشِ مِثْلُ الَّذِي كَانَ بَلَغَ مِنِّي، فَنَزَلَ الْبِئْرَ، فَمَلأَ خُفَّهُ مَاءً، فَسَقَى الْكَلْبَ، فَشَكَرَ اللَّهُ لَهُ، فَغَفَرَ لَهُ ‏\"‏‏.‏ قَالُوا يَا رَسُولَ اللَّهِ وَإِنَّ لَنَا فِي الْبَهَائِمِ لأَجْرًا فَقَالَ ‏\"‏ فِي كُلِّ ذَاتِ كَبِدٍ رَطْبَةٍ أَجْرٌ ‏\"‏‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেন, একদিন এক ব্যক্তি রাস্তায় চলার পথে অত্যন্ত তৃষ্ণার্ত হল। তারপর একটি কূয়া দেখতে পেয়ে তাতে সে নেমে পড়ল এবং পানি পান করল। উপরে উঠে এসে সে দেখতে পেল একটা কুকুর হাঁপাচ্ছে আর পিপাসার দরুন ভিজে মাটি চেটে খাচ্ছে। লোকটি (মনে মনে) বলল, এ কুকুরটির তেমনি পিপাসা পেয়েছে, যেমনি আমার পিপাসা পেয়েছিল। তারপর সে কূয়ার মধ্যে নামল এবং নিজের মোজা পানি ভর্তি করে এনে কুকুরটিকে পান করাল। আল্লাহ তার এ কাজ কবূল করেন এবং তাকে ক্ষমা করে দেন। সাহাবীগণ বলল, হে আল্লাহর রাসূল! পশুদের ব্যাপারেও কি আমাদের জন্য পুণ্য রয়েছে? তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, প্রাণী মাত্রের সেবার মধ্যেই পুণ্য রয়েছে। (১৭৩) (আধুনিক প্রকাশনীঃ ২২৮৭, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"A man felt very thirsty while he was on the way, there he came across a well. He went down the well, quenched his thirst and came out. Meanwhile he saw a dog panting and licking mud because of excessive thirst. He said to himself, \"This dog is suffering from thirst as I did.\" So, he went down the well again and filled his shoe with water and watered it. Allah thanked him for that deed and forgave him. The people said, \"O Allah's Messenger (ﷺ)! Is there a reward for us in serving the animals?\" He replied: \"Yes, there is a reward for serving any animate (living being).\" (See Hadith No)"},{"n":"2467","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا ابْنُ عُيَيْنَةَ، عَنِ الزُّهْرِيِّ، عَنْ عُرْوَةَ، عَنْ أُسَامَةَ بْنِ زَيْدٍ ـ رضى الله عنهما ـ قَالَ أَشْرَفَ النَّبِيُّ صلى الله عليه وسلم عَلَى أُطُمٍ مِنْ آطَامِ الْمَدِينَةِ ثُمَّ قَالَ ‏ \"‏ هَلْ تَرَوْنَ مَا أَرَى إِنِّي أَرَى مَوَاقِعَ الْفِتَنِ خِلاَلَ بُيُوتِكُمْ كَمَوَاقِعِ الْقَطْرِ ‏\"‏‏.‏","b":"بَاب إِمَاطَةِ الأَذَى ৪৬/২৪. রাস্তা হতে কষ্টদায়ক জিনিস দূর করা। وَقَالَ هَمَّامٌ عَنْ أَبِي هُرَيْرَةَ عَنْ النَّبِيِّ صلى الله عليه وسلم يُمِيطُ الأَذَى عَنْ الطَّرِيقِ صَدَقَةٌ হাম্মাম (রহ.) বলেন, আবূ হুরাইরাহ (রাঃ) নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণনা করেছেন, রাস্তা হতে কষ্টদায়ক বস্তু দূর করা সাদাকা স্বরূপ। ২৪৬৭. উসামা ইবনু যায়দ (রাঃ) হতে বর্ণিত। তিনি বলেন, একদিন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম মদ্বীনার এক টিলার উপর উঠে বললেন, আমি যা দেখছি তোমরা কি তা দেখতে পাচ্ছ যে তোমাদের ঘরগুলোতে বৃষ্টি বর্ষণের মতো ফিতনা বর্ষিত হচ্ছে। (১৮৭৮) (আধুনিক প্রকাশনীঃ ২২৮৮, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Usama bin Zaid:Once the Prophet (ﷺ) stood at the top of one of the castles (or higher buildings) of Medina and said, \"Do you see what I see? No doubt I am seeing the spots of afflictions amongst your houses as numerous as the spots where raindrops fall (during a heavy rain). (See Hadith No)"},{"n":"2468","k":"","a":"حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ بْنِ أَبِي ثَوْرٍ، عَنْ عَبْدِ اللَّهِ بْنِ عَبَّاسٍ ـ رضى الله عنهما ـ قَالَ لَمْ أَزَلْ حَرِيصًا عَلَى أَنْ أَسْأَلَ عُمَرَ ـ رضى الله عنه ـ عَنِ الْمَرْأَتَيْنِ مِنْ أَزْوَاجِ النَّبِيِّ صلى الله عليه وسلم اللَّتَيْنِ قَالَ اللَّهُ لَهُمَا ‏{‏إِنْ تَتُوبَا إِلَى اللَّهِ فَقَدْ صَغَتْ قُلُوبُكُمَا‏}‏ فَحَجَجْتُ مَعَهُ فَعَدَلَ وَعَدَلْتُ مَعَهُ بِالإِدَاوَةِ، فَتَبَرَّزَ حَتَّى جَاءَ، فَسَكَبْتُ عَلَى يَدَيْهِ مِنَ الإِدَاوَةِ، فَتَوَضَّأَ فَقُلْتُ يَا أَمِيرَ الْمُؤْمِنِينَ مَنِ الْمَرْأَتَانِ مِنْ أَزْوَاجِ النَّبِيِّ صلى الله عليه وسلم اللَّتَانِ قَالَ لَهُمَا ‏{‏إِنْ تَتُوبَا إِلَى اللَّهِ‏}‏ فَقَالَ وَاعَجَبِي لَكَ يَا ابْنَ عَبَّاسٍ عَائِشَةُ وَحَفْصَةُ، ثُمَّ اسْتَقْبَلَ عُمَرُ الْحَدِيثَ يَسُوقُهُ، فَقَالَ إِنِّي كُنْتُ وَجَارٌ لِي مِنَ الأَنْصَارِ فِي بَنِي أُمَيَّةَ بْنِ زَيْدٍ، وَهْىَ مِنْ عَوَالِي الْمَدِينَةِ، وَكُنَّا نَتَنَاوَبُ النُّزُولَ عَلَى النَّبِيِّ صلى الله عليه وسلم فَيَنْزِلُ يَوْمًا وَأَنْزِلُ يَوْمًا، فَإِذَا نَزَلْتُ جِئْتُهُ مِنْ خَبَرِ ذَلِكَ الْيَوْمِ مِنَ الأَمْرِ وَغَيْرِهِ، وَإِذَا نَزَلَ فَعَلَ مِثْلَهُ، وَكُنَّا مَعْشَرَ قُرَيْشٍ نَغْلِبُ النِّسَاءَ، فَلَمَّا قَدِمْنَا عَلَى الأَنْصَارِ إِذَا هُمْ قَوْمٌ تَغْلِبُهُمْ نِسَاؤُهُمْ، فَطَفِقَ نِسَاؤُنَا يَأْخُذْنَ مِنْ أَدَبِ نِسَاءِ الأَنْصَارِ، فَصِحْتُ عَلَى امْرَأَتِي، فَرَاجَعَتْنِي، فَأَنْكَرْتُ أَنْ تُرَاجِعَنِي، فَقَالَتْ وَلِمَ تُنْكِرُ أَنْ أُرَاجِعَكَ فَوَاللَّهِ إِنَّ أَزْوَاجَ النَّبِيِّ صلى الله عليه وسلم لَيُرَاجِعْنَهُ، وَإِنَّ إِحْدَاهُنَّ لَتَهْجُرُهُ الْيَوْمَ حَتَّى اللَّيْلِ‏.‏ فَأَفْزَعَنِي، فَقُلْتُ خَابَتْ مَنْ فَعَلَ مِنْهُنَّ بِعَظِيمٍ‏.‏ ثُمَّ جَمَعْتُ عَلَىَّ ثِيَابِي، فَدَخَلْتُ عَلَى حَفْصَةَ فَقُلْتُ أَىْ حَفْصَةُ، أَتُغَاضِبُ إِحْدَاكُنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم الْيَوْمَ حَتَّى اللَّيْلِ فَقَالَتْ نَعَمْ‏.‏ فَقُلْتُ خَابَتْ وَخَسِرَتْ، أَفَتَأْمَنُ أَنْ يَغْضَبَ اللَّهُ لِغَضَبِ رَسُولِهِ صلى الله عليه وسلم فَتَهْلِكِينَ لاَ تَسْتَكْثِرِي عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم وَلاَ تُرَاجِعِيهِ فِي شَىْءٍ وَلاَ تَهْجُرِيهِ، وَاسْأَلِينِي مَا بَدَا لَكِ، وَلاَ يَغُرَّنَّكِ أَنْ كَانَتْ جَارَتُكِ هِيَ أَوْضَأَ مِنْكِ وَأَحَبَّ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم ـ يُرِيدُ عَائِشَةَ ـ وَكُنَّا تَحَدَّثْنَا أَنَّ غَسَّانَ تُنْعِلُ النِّعَالَ لِغَزْوِنَا، فَنَزَلَ صَاحِبِي يَوْمَ نَوْبَتِهِ فَرَجَعَ عِشَاءً، فَضَرَبَ بَابِي ضَرْبًا شَدِيدًا، وَقَالَ أَنَائِمٌ هُوَ فَفَزِعْتُ فَخَرَجْتُ إِلَيْهِ‏.‏ وَقَالَ حَدَثَ أَمْرٌ عَظِيمٌ‏.‏ قُلْتُ مَا هُوَ أَجَاءَتْ غَسَّانُ قَالَ لاَ، بَلْ أَعْظَمُ مِنْهُ وَأَطْوَلُ، طَلَّقَ رَسُولُ اللَّهِ صلى الله عليه وسلم نِسَاءَهُ‏.‏ قَالَ قَدْ خَابَتْ حَفْصَةُ وَخَسِرَتْ، كُنْتُ أَظُنُّ أَنَّ هَذَا يُوشِكُ أَنْ يَكُونَ، فَجَمَعْتُ عَلَىَّ ثِيَابِي، فَصَلَّيْتُ صَلاَةَ الْفَجْرِ مَعَ النَّبِيِّ صلى الله عليه وسلم فَدَخَلَ مَشْرُبَةً لَهُ فَاعْتَزَلَ فِيهَا، فَدَخَلْتُ عَلَى حَفْصَةَ، فَإِذَا هِيَ تَبْكِي‏.‏ قُلْتُ مَا يُبْكِيكِ أَوَلَمْ أَكُنْ حَذَّرْتُكِ أَطَلَّقَكُنَّ رَسُولُ اللَّهِ صلى الله عليه وسلم قَالَتْ لاَ أَدْرِي هُوَ ذَا فِي الْمَشْرُبَةِ‏.‏ فَخَرَجْتُ، فَجِئْتُ الْمِنْبَرَ، فَإِذَا حَوْلَهُ رَهْطٌ يَبْكِي بَعْضُهُمْ، فَجَلَسْتُ مَعَهُمْ قَلِيلاً ثُمَّ غَلَبَنِي مَا أَجِدُ، فَجِئْتُ الْمَشْرُبَةَ الَّتِي هُوَ فِيهَا فَقُلْتُ لِغُلاَمٍ لَهُ أَسْوَدَ اسْتَأْذِنْ لِعُمَرَ‏.‏ فَدَخَلَ، فَكَلَّمَ النَّبِيَّ صلى الله عليه وسلم ثُمَّ خَرَجَ، فَقَالَ ذَكَرْتُكَ لَهُ، فَصَمَتَ، فَانْصَرَفْتُ حَتَّى جَلَسْتُ مَعَ الرَّهْطِ الَّذِينَ عِنْدَ الْمِنْبَرِ، ثُمَّ غَلَبَنِي مَا أَجِدُ فَجِئْتُ، فَذَكَرَ مِثْلَهُ، فَجَلَسْتُ مَعَ الرَّهْطِ الَّذِينَ عِنْدَ الْمِنْبَرِ، ثُمَّ غَلَبَنِي مَا أَجِدُ فَجِئْتُ الْغُلاَمَ‏.‏ فَقُلْتُ اسْتَأْذِنْ لِعُمَرَ‏.‏ فَذَكَرَ مِثْلَهُ، فَلَمَّا وَلَّيْتُ مُنْصَرِفًا، فَإِذَا الْغُلاَمُ يَدْعُونِي قَالَ أَذِنَ لَكَ رَسُولُ اللَّهِ صلى الله عليه وسلم‏.‏ فَدَخَلْتُ عَلَيْهِ، فَإِذَا هُوَ مُضْطَجِعٌ عَلَى رِمَالِ حَصِيرٍ لَيْسَ بَيْنَهُ وَبَيْنَهُ فِرَاشٌ، قَدْ أَثَّرَ الرِّمَالُ بِجَنْبِهِ، مُتَّكِئٌ عَلَى وِسَادَةٍ مِنْ أَدَمٍ حَشْوُهَا لِيفٌ، فَسَلَّمْتُ عَلَيْهِ، ثُمَّ قُلْتُ وَأَنَا قَائِمٌ طَلَّقْتَ نِسَاءَكَ فَرَفَعَ بَصَرَهُ إِلَىَّ، فَقَالَ ‏\"‏ لاَ ‏\"‏‏.‏ ثُمَّ قُلْتُ ـ وَأَنَا قَائِمٌ أَسْتَأْنِسُ يَا رَسُولَ اللَّهِ، لَوْ رَأَيْتَنِي، وَكُنَّا مَعْشَرَ قُرَيْشٍ نَغْلِبُ النِّسَاءَ، فَلَمَّا قَدِمْنَا عَلَى قَوْمٍ تَغْلِبُهُمْ نِسَاؤُهُمْ، فَذَكَرَهُ، فَتَبَسَّمَ النَّبِيُّ صلى الله عليه وسلم، ثُمَّ قُلْتُ لَوْ رَأَيْتَنِي، وَدَخَلْتُ عَلَى حَفْصَةَ، فَقُلْتُ لاَ يَغُرَّنَّكِ أَنْ كَانَتْ جَارَتُكِ هِيَ أَوْضَأَ مِنْكِ وَأَحَبَّ إِلَى النَّبِيِّ صلى الله عليه وسلم ـ يُرِيدُ عَائِشَةَ ـ فَتَبَسَّمَ أُخْرَى، فَجَلَسْتُ حِينَ رَأَيْتُهُ تَبَسَّمَ، ثُمَّ رَفَعْتُ بَصَرِي فِي بَيْتِهِ، فَوَاللَّهِ مَا رَأَيْتُ فِيهِ شَيْئًا يَرُدُّ الْبَصَرَ غَيْرَ أَهَبَةٍ ثَلاَثَةٍ‏.‏ فَقُلْتُ ادْعُ اللَّهَ فَلْيُوَسِّعْ عَلَى أُمَّتِكَ، فَإِنَّ فَارِسَ وَالرُّومَ وُسِّعَ عَلَيْهِمْ وَأُعْطُوا الدُّنْيَا، وَهُمْ لاَ يَعْبُدُونَ اللَّهَ، وَكَانَ مُتَّكِئًا‏.‏ فَقَالَ ‏\"‏ أَوَفِي شَكٍّ أَنْتَ يَا ابْنَ الْخَطَّابِ أُولَئِكَ قَوْمٌ عُجِّلَتْ لَهُمْ طَيِّبَاتُهُمْ فِي الْحَيَاةِ الدُّنْيَا ‏\"‏‏.‏ فَقُلْتُ يَا رَسُولَ اللَّهِ اسْتَغْفِرْ لِي‏.‏ فَاعْتَزَلَ النَّبِيُّ صلى الله عليه وسلم مِنْ أَجْلِ ذَلِكَ الْحَدِيثِ حِينَ أَفْشَتْهُ حَفْصَةُ إِلَى عَائِشَةَ، وَكَانَ قَدْ قَالَ ‏\"‏ مَا أَنَا بِدَاخِلٍ عَلَيْهِنَّ شَهْرًا ‏\"‏‏.‏ مِنْ شِدَّةِ مَوْجَدَتِهِ عَلَيْهِنَّ حِينَ عَاتَبَهُ اللَّهُ‏.‏ فَلَمَّا مَضَتْ تِسْعٌ وَعِشْرُونَ دَخَلَ عَلَى عَائِشَةَ فَبَدَأَ بِهَا، فَقَالَتْ لَهُ عَائِشَةُ إِنَّكَ أَقْسَمْتَ أَنْ لاَ تَدْخُلَ عَلَيْنَا شَهْرًا، وَإِنَّا أَصْبَحْنَا لِتِسْعٍ وَعِشْرِينَ لَيْلَةً، أَعُدُّهَا عَدًّا‏.‏ فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ الشَّهْرُ تِسْعٌ وَعِشْرُونَ ‏\"‏‏.‏ وَكَانَ ذَلِكَ الشَّهْرُ تِسْعٌ وَعِشْرُونَ‏.‏ قَالَتْ عَائِشَةُ فَأُنْزِلَتْ آيَةُ التَّخْيِيرِ فَبَدَأَ بِي أَوَّلَ امْرَأَةٍ، فَقَالَ ‏\"‏ إِنِّي ذَاكِرٌ لَكِ أَمْرًا، وَلاَ عَلَيْكِ أَنْ لاَ تَعْجَلِي حَتَّى تَسْتَأْمِرِي أَبَوَيْكِ ‏\"‏‏.‏ قَالَتْ قَدْ أَعْلَمُ أَنَّ أَبَوَىَّ لَمْ يَكُونَا يَأْمُرَانِي بِفِرَاقِكَ‏.‏ ثُمَّ قَالَ ‏\"‏ إِنَّ اللَّهَ قَالَ ‏{‏يَا أَيُّهَا النَّبِيُّ قُلْ لأَزْوَاجِكَ‏}‏ إِلَى قَوْلِهِ ‏{‏ عَظِيمًا‏}‏ ‏\"‏‏.‏ قُلْتُ أَفِي هَذَا أَسْتَأْمِرُ أَبَوَىَّ فَإِنِّي أُرِيدُ اللَّهَ وَرَسُولَهُ وَالدَّارَ الآخِرَةَ‏.‏ ثُمَّ خَيَّرَ نِسَاءَهُ، فَقُلْنَ مِثْلَ مَا قَالَتْ عَائِشَةُ‏.‏","b":"‘আবদুল্লাহ ইবনু ‘আব্বাস (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর সহধর্মিণীদের মধ্যে ঐ দু’সহধর্মিণী সম্পর্কে উমার (রাঃ)-এর কাছে জিজ্ঞেস করতে সব সময় আগ্রহী ছিলাম, যাদের সম্পর্কে আল্লাহ তা‘আলা বলেছেনঃ ‘‘যদি তোমরা দু’জনে তাওবা কর (তাহলে সেটাই হবে কল্যাণকর)। কেননা, তোমাদের অন্তর বাঁকা হয়ে গেছে’’- (তাহরীমঃ ৪)। একবার আমি তাঁর [উমার (রাঃ)-এর] সঙ্গে হাজ্জে রওয়ানা করলাম। তিনি রাস্তা হতে সরে গেলেন। আমিও একটি পানির পাত্র নিয়ে তাঁর সঙ্গে গতি পরিবর্তন করলাম। তিনি প্রকৃতির ডাকে সাড়া দিয়ে ফিরে এলেন। আমি পানির পাত্র হতে তাঁর দু’হাতে পানি ঢাললাম, তিনি অযু করলেন। আমি তাঁকে জিজ্ঞেস করলাম, হে আমীরুল মু’মিনীন! নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর সহধর্মিণীদের মধ্যে দু’সহধর্মিণী কারা ছিলেন, যাদের সম্পর্কে আল্লাহ তা‘আলা বলেছেনঃ ‘‘যদি তোমরা দু’জন তওবা কর (তবে সেটাই হবে তোমাদের জন্য কল্যাণকর) কেননা, তোমাদের অন্তর বাঁকা হয়ে গেছে’’- (তাহরীমঃ ৪)। তিনি বললেন, হে ইবনু ‘আব্বাস! এটা তোমার জন্য তাজ্জবের বিষয় যে, তুমি তা জান না। তারা দু’জন হলেন, ‘আয়িশাহ ও হাফসা (রাযি.) অতঃপর উমার (রাঃ) পুরো ঘটনা বলতে শুরু করলেন। তিনি বললেন, আমি ও আমার এক আনসারী প্রতিবেশী মাদ্বীনার অদূরে বনূ উমাইয়া ইবনু যায়দের মহল্লায় বসবাস করতাম। আমরা দু’জন পালাক্রমে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর নিকট হাযির হতাম। একদিন তিনি যেতেন, আরেকদিন আমি যেতাম, আমি যে দিন যেতাম সে দিনের খবর (ওয়াহী) ইত্যাদি বিষয় তাঁকে অবহিত করতাম। আর তিনি যে দিন যেতেন, তিনিও অনুরূপ করতেন। আর আমরা কুরাইশ গোত্রের লোকেরা মহিলাদের উপর কর্তৃত্ব করতাম। কিন্তু আমরা যখন মাদ্বীনায় আনসারদের কাছে আসলাম তখন তাদেরকে এমন পেলাম, যাদের নারীরা তাদের উপর কর্তৃত্ব করে থাকে। ধীরে ধীরে আমাদের মহিলারাও আনসারী মহিলাদের রীতিনীতি গ্রহণ করতে লাগল। একদিন আমি আমার স্ত্রীকে ধমক দিলাম। সে সঙ্গে সঙ্গে প্রতিউত্তর করল। আর এই প্রতিউত্তর আমার পছন্দ হল না। তখন সে আমাকে বলল, আমার প্রতিউত্তরে তুমি অসন্তুষ্ট হও কেন? আল্লাহর কসম! নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর সহধর্মিণীরাওতো তাঁর কথার প্রতিউত্তর করে থাকেন এবং তাঁর কোন কোন সহধর্মিণী রাত পর্যন্ত পুরো দিন তাঁর কাছ হতে আলাদা থাকেন। এ কথা শুনে আমি ঘাবড়ে গেলাম। বললাম, যিনি এরূপ করেছেন তিনি অত্যন্ত ক্ষতিগ্রস্ত হয়েছেন। তারপর আমি জামা-কাপড় পরে (আমার মেয়ে) হাফসাহ (রাযি.)-এর কাছে গিয়ে বললাম, হে হাফসা! তোমাদের কেউ কেউ নাকি রাত পর্যন্ত পুরো দিন রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -কে অসন্তুষ্ট রাখে। সে বলল, হ্যাঁ। আমি বললাম, তবে তো সে বরবাদ এবং ক্ষতিগ্রস্ত হয়েছে। তোমার কি ভয় হয় না যে, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম অসন্তুষ্ট হলে আল্লাহও অসন্তুষ্ট হবেন। এর ফলে তুমি বরবাদ হয়ে যাবে। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর সঙ্গে বাড়াবাড়ি করো না এবং তাঁর কোন কথার প্রতিউত্তর দিও না এবং তাঁর হতে পৃথক থেক না। তোমার কোন কিছুর দরকার হয়ে থাকলে আমাকে বলবে। আর তোমার প্রতিবেশী তোমার চেয়ে অধিক সুন্দরী এবং রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর অধিক প্রিয় এ যেন তোমাকে ধোঁকায় না ফেলে। তিনি উদ্দেশ্য করেছেন ‘আয়িশাহ (রাযি.)-কে। সে সময় আমাদের মধ্যে আলোচনা চলছিল যে, গাস্সানের লোকেরা আমাদের বিরুদ্ধে যুদ্ধ করার জন্য ঘোড়াগুলিকে প্রস্তুত করছে। একদিন আমার সাথী তার পালার দিন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর কাছে গেলেন এবং ঈশার সময় এসে আমার দরজায় খুব জোরে করাঘাত করলেন এবং বললেন, তিনি [‘উমার (রাঃ)] কি ঘুমিয়েছেন? তখন আমি ঘাবড়িয়ে তাঁর কাছে বেরিয়ে এলাম। তিনি বললেন, সাংঘাতিক ঘটনা ঘটে গেছে। আমি বললাম, সেটা কী? গাস্সানের লোকেরা কি এসে গেছে? তিনি বললেন, না, বরং তার চেয়েও বড় ঘটনা ও বিরাট ব্যাপার। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তাঁর সহধর্মিণীদেরকে তালাক দিয়েছেন। ‘উমার (রাঃ) বললেন, তাহলে তো হাফসার সর্বনাশ হয়েছে এবং সে ক্ষতিগ্রস্ত হয়েছে। আমার তো ধারণা ছিল যে, এমন কিছু ঘটনা ঘটতে পারে। আমি কাপড় পরে বেরিয়ে এসে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর সঙ্গে ফজরের সালাত আদায় করলাম। সালাত শেষে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তাঁর কোঠায় প্রবেশ করে একাকী বসে থাকলেন। তখন আমি হাফসাহ (রাযি.)-এর কাছে গিয়ে দেখি সে কাঁদছে। আমি জিজ্ঞেস করলাম, কাঁদছ কেন? আমি কি তোমাকে আগেই সতর্ক করে দেইনি? রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কি তোমাদেরকে তালাক দিয়েছেন? সে বলল, আমি জানি না। তিনি তাঁর ঐ কোঠায় আছে
