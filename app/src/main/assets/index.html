he angels) replied, 'For a man from the Quraish.' \" The Prophet added, \"O Ibn Al-Khattab! Nothing stopped me from entering it except your Ghira.\" `Umar said, \"How dare I think of my Ghira being offended by you, O Allah's Messenger (ﷺ)?"},{"n":"7025","k":"","a":"حَدَّثَنِي يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، أَخْبَرَنِي سَعِيدُ بْنُ الْمُسَيَّبِ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ بَيْنَمَا نَحْنُ جُلُوسٌ عِنْدَ رَسُولِ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ بَيْنَا أَنَا نَائِمٌ رَأَيْتُنِي فِي الْجَنَّةِ، فَإِذَا امْرَأَةٌ تَتَوَضَّأُ إِلَى جَانِبِ قَصْرٍ، فَقُلْتُ لِمَنْ هَذَا الْقَصْرُ فَقَالُوا لِعُمَرَ‏.‏ فَذَكَرْتُ غَيْرَتَهُ فَوَلَّيْتُ مُدْبِرًا ‏\"‏‏.‏ فَبَكَى عُمَرُ وَقَالَ عَلَيْكَ بِأَبِي أَنْتَ وَأُمِّي يَا رَسُولَ اللَّهِ أَغَارُ","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, এক সময় আমরা রাসূলূল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর নিকট উপবিষ্ট ছিলাম। তখন তিনি বললেন: আমি একবার নিদ্রিত ছিলাম। আমি আমাকে জান্নাতে দেখতে পেলাম এবং (দেখতে পেলাম) যে এক মহিলা একটি প্রাসাদের পাশে ওযূ করছে। আমি বললাম: এ প্রাসাদটি কার? তারা বলল, উমরের। তখন তার আত্মমর্যাদাবোধের কথা মনে করে আমি ফিরে এলাম। তা শুনে ‘উমার (রাঃ) কেঁদে ফেললেন এবং বললেন, আমার পিতা-মাতা আপনার ওপর কুরবান হোক। হে আল্লাহর রাসূল! আপনার কাছেও কি আমি আত্মমর্যাদাবোধ দেখাব? [৩২৪২] (আধুনিক প্রকাশনী- ৬৫৩৯, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:We were sitting with Allah's Messenger (ﷺ) he said, \"While I was sleeping, I saw myself in Paradise, and behold, a woman was performing ablution by the side of a palace. I asked, 'For whom is this palace?' They replied, 'For `Umar' Then I remembered the Ghira of `Umar and returned immediately.\" `Umar wept (on hearing that) and said, \" Let my father and mother be sacrificed for you, O Allah's Messenger (ﷺ)! How dare I think of my Ghira being offended by you"},{"n":"7026","k":"","a":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، أَخْبَرَنِي سَالِمُ بْنُ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ ـ رضى الله عنهما ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ بَيْنَا أَنَا نَائِمٌ رَأَيْتُنِي أَطُوفُ بِالْكَعْبَةِ فَإِذَا رَجُلٌ آدَمُ سَبْطُ الشَّعَرِ بَيْنَ رَجُلَيْنٍ يَنْطِفُ رَأْسُهُ مَاءً، فَقُلْتُ مَنْ هَذَا قَالُوا ابْنُ مَرْيَمَ‏.‏ فَذَهَبْتُ أَلْتَفِتُ فَإِذَا رَجُلٌ أَحْمَرُ جَسِيمٌ جَعْدُ الرَّأْسِ أَعْوَرُ الْعَيْنِ الْيُمْنَى، كَأَنَّ عَيْنَهُ عِنَبَةٌ طَافِيَةٌ، قُلْتُ مَنْ هَذَا قَالُوا هَذَا الدَّجَّالُ‏.‏ أَقْرَبُ النَّاسِ بِهِ شَبَهًا ابْنُ قَطَنٍ ‏\"‏‏.‏ وَابْنُ قَطَنٍ رَجُلٌ مِنْ بَنِي الْمُصْطَلِقِ مِنْ خُزَاعَةَ‏.‏","b":"‘আবদুল্লাহ্ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, আমি একবার ঘুমিয়ে ছিলাম। তখন আমি আমাকে কা‘বা গৃহ তাওয়াফরত অবস্থায় দেখতে পেলাম। এমন সময় সোজা চুলওয়ালা একজন পুরুষকে দু’জন পুরুষের মাঝে দেখলাম, যার মাথা থেকে পানি ঝরছিল। আমি জিজ্ঞেস করলাম, ইনি কে? তারা বলল, ইবনু মারইয়াম। এরপর আমি ফিরে আসতে লাগলাম। এ সময় একজন লাল রঙের মোটাসোটা, কোঁকড়ান চুলওয়ালা, ডানচোখ কানা ব্যক্তিকে দেখলাম। তার চোখটি যেন ভাসমান আঙুর। আমি জিজ্ঞেস করলাম, এ ব্যক্তি কে? তারা বলল, এ হচ্ছে দাজ্জাল। তার সঙ্গে সবচেয়ে সাদৃশ্যপূর্ণ লোক হল ইবনু কাতান। আর ইবনু কাতান হল বনূ মুস্তালিক গোত্রের খুযাআ বংশের একজন লোক। [৩৪৪০] (আধুনিক প্রকাশনী- ৬৫৪০, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"While I was sleeping, I saw myself performing the Tawaf of the Ka`ba. Behold, there I saw a whitish-red lank-haired man (holding himself) between two men with water dropping from his hair. I asked, 'Who is this?' The people replied, 'He is the son of Mary.' Then I turned my face to see another man with red complexion, big body, curly hair, and blind in the right eye which looked like a protruding out grape. I asked, 'Who is he?' They replied, 'He is Ad-Dajjal.' Ibn Qatan resembles him more than anybody else among the people and Ibn Qatan was a man from Bani Al-Mustaliq from Khuza`a"},{"n":"7027","k":"","a":"حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، أَخْبَرَنِي حَمْزَةُ بْنُ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏\"‏ بَيْنَا أَنَا نَائِمٌ أُتِيتُ بِقَدَحِ لَبَنٍ فَشَرِبْتُ مِنْهُ، حَتَّى إِنِّي لأَرَى الرِّيَّ يَجْرِي، ثُمَّ أَعْطَيْتُ فَضْلَهُ عُمَرَ ‏\"‏‏.‏ قَالُوا فَمَا أَوَّلْتَهُ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ الْعِلْمُ ‏\"‏‏.‏","b":"‘আবদুল্লাহ্ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি যে, আমি একবার ঘুমিয়ে ছিলাম। আমি দেখলাম দুধের একটা পেয়ালা আমাকে দেয়া হল। তা থেকে আমি (এত অধিক) পান করলাম যে, আমা হতে তৃপ্তির চিহ্ন প্রকাশিত হচ্ছিল। অতঃপর (অবশিষ্টাংশ) উমরকে দিলাম। সহাবাগণ বললেন, এ স্বপ্নের ব্যাখ্যা কী দিলেন হে আল্লাহর রাসূল? তিনি বললেনঃ ইলম। [৮২] (আধুনিক প্রকাশনী- ৬৫৪১, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Abdullah bin `Umar:I heard Allah's Messenger (ﷺ) saying, \"While I was sleeping, I saw a bowl full of milk was brought to me and I drank of it (to my fill) till I noticed its wetness flowing (in my body). Then I gave the remaining of it to `Umar.\" They asked, \"O Allah's Messenger (ﷺ)! What have you interpreted (about the dream)? He said, \"(It is Religious) knowledge.\" (See Hadith No)"},{"n":"7029","k":"","a":"حَدَّثَنِي عُبَيْدُ اللَّهِ بْنُ سَعِيدٍ، حَدَّثَنَا عَفَّانُ بْنُ مُسْلِمٍ، حَدَّثَنَا صَخْرُ بْنُ جُوَيْرِيَةَ، حَدَّثَنَا نَافِعٌ، أَنَّ ابْنَ عُمَرَ، قَالَ إِنَّ رِجَالاً مِنْ أَصْحَابِ رَسُولِ اللَّهِ صلى الله عليه وسلم كَانُوا يَرَوْنَ الرُّؤْيَا عَلَى عَهْدِ رَسُولِ اللَّهِ صلى الله عليه وسلم فَيَقُصُّونَهَا عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَيَقُولُ فِيهَا رَسُولُ اللَّهِ صلى الله عليه وسلم مَا شَاءَ اللَّهُ، وَأَنَا غُلاَمٌ حَدِيثُ السِّنِّ وَبَيْتِي الْمَسْجِدُ قَبْلَ أَنْ أَنْكِحَ، فَقُلْتُ فِي نَفْسِي لَوْ كَانَ فِيكَ خَيْرٌ لَرَأَيْتَ مِثْلَ مَا يَرَى هَؤُلاَءِ‏.‏ فَلَمَّا اضْطَجَعْتُ لَيْلَةً قُلْتُ اللَّهُمَّ إِنْ كُنْتَ تَعْلَمُ فِيَّ خَيْرًا فَأَرِنِي رُؤْيَا‏.‏ فَبَيْنَمَا أَنَا كَذَلِكَ إِذْ جَاءَنِي مَلَكَانِ فِي يَدِ كُلِّ وَاحِدٍ مِنْهُمَا مَقْمَعَةٌ مِنْ حَدِيدٍ، يُقْبِلاَ بِي إِلَى جَهَنَّمَ، وَأَنَا بَيْنَهُمَا أَدْعُو اللَّهَ اللَّهُمَّ أَعُوذُ بِكَ مِنْ جَهَنَّمَ‏.‏ ثُمَّ أُرَانِي لَقِيَنِي مَلَكٌ فِي يَدِهِ مِقْمَعَةٌ مِنْ حَدِيدٍ فَقَالَ لَنْ تُرَاعَ، نِعْمَ الرَّجُلُ أَنْتَ لَوْ تُكْثِرُ الصَّلاَةَ‏.‏ فَانْطَلَقُوا بِي حَتَّى وَقَفُوا بِي عَلَى شَفِيرِ جَهَنَّمَ فَإِذَا هِيَ مَطْوِيَّةٌ كَطَىِّ الْبِئْرِ، لَهُ قُرُونٌ كَقَرْنِ الْبِئْرِ، بَيْنَ كُلِّ قَرْنَيْنِ مَلَكٌ بِيَدِهِ مِقْمَعَةٌ مِنْ حَدِيدٍ، وَأَرَى فِيهَا رِجَالاً مُعَلَّقِينَ بِالسَّلاَسِلِ، رُءُوسُهُمْ أَسْفَلَهُمْ، عَرَفْتُ فِيهَا رِجَالاً مِنْ قُرَيْشٍ، فَانْصَرَفُوا بِي عَنْ ذَاتِ الْيَمِينِ‏.‏ فَقَصَصْتُهَا عَلَى حَفْصَةَ فَقَصَّتْهَا حَفْصَةُ عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ إِنَّ عَبْدَ اللَّهِ رَجُلٌ صَالِحٌ ‏\"‏‏.‏ فَقَالَ نَافِعٌ لَمْ يَزَلْ بَعْدَ ذَلِكَ يُكْثِرُ الصَّلاَةَ‏.‏","b":"ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর বেশ ক’জন সাহাবী রাসূলূল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর যুগে স্বপ্ন দেখতেন। অতঃপর তারা রাসূলূল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে তা বর্ণনা করতেন। আর রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর ব্যাখ্যা দিতেন যা আল্লাহ্ ইচ্ছা করতেন। আমি তখন অল্প বয়সের যুবক। আর বিয়ের আগে মাসজিদই ছিল আমার ঘর। আমি মনে মনে নিজেকে সম্বোধন করে বললাম, যদি তোমার মধ্যে কোন কল্যাণ থাকত তাহলে তুমি তাদের মত স্বপ্ন দেখতে। আমি এক রাতে বিছানায় শুয়ে শুয়ে বললাম, হে আল্লাহ্! আপনি যদি জানেন যে, আমার মধ্যে কোন কল্যাণ আছে তাহলে আমাকে কোন একটি স্বপ্ন দেখান। আমি ঐ অবস্থায়ই (ঘুমিয়ে) থাকলাম। দেখলাম আমার কাছে দু’জন ফেরেশ্তা এসেছেন। তাদের প্রত্যেকের হাতেই লোহার একটি করে হাতুড়ি। তারা আমাকে নিয়ে (জাহান্নামের দিকে) এগোচ্ছে। আর আমি তাদের দু’জনের মাঝে থেকে আল্লাহর কাছে দু‘আ করছি, হে আল্লাহ্! আমি জাহান্নাম থেকে আপনার আশ্রয় প্রার্থনা করছি। এরপর আমাকে দেখান হল যে, একজন ফেরেশ্তা আমার কাছে এসেছেন। তাঁর হাতে লোহার একটি হাতুড়ি। সে আমাকে বলল, তোমার অবশ্যই কোন ভয় নেই। তুমি খুবই ভাল লোক, যদি অধিক করে সালাত আদায় করতে। তারা আমাকে নিয়ে চলল, অবশেষে তারা আমাকে জাহান্নামের (ধারে এনে) দাঁড় করাল, (যা দেখতে) কূপের মত গোল আকৃতির। আর কূপের মত এরও রয়েছে অনেক শিং। আর দু’ শিং-এর মাঝখানে একজন ফেরেশতা, যার হাতে লোহার একটি হাতুড়ি। আর আমি এতে কিছু লোককে (জাহান্নামে) শিকল পরিহিত দেখলাম। তাদের মাথা ছিল নিচের দিকে। কুরাইশের এক ব্যক্তিকে সেখানে আমি চিনে ফেললাম। অতঃপর তারা আমাকে ডান দিকে নিয়ে ফিরল। [৪৪০] (আধুনিক প্রকাশনী- ৬৫৪২, ইসলামিক ফাউন্ডেশন)","e":"Narrated Ibn `Umar:Men from the companions of Allah's Messenger (ﷺ) used to see dreams during the lifetime of Allah's Messenger (ﷺ) and they used to narrate those dreams to Allah's Messenger (ﷺ). Allah's Messenger (ﷺ) would interpret them as Allah wished. I was a young man and used to stay in the mosque before my wedlock. I said to myself, \"If there were any good in myself, I too would see what these people see.\" So when I went to bed one night, I said, \"O Allah! If you see any good in me, show me a good dream.\" So while I was in that state, there came to me (in a dream) two angels. In the hand of each of them, there was a mace of iron, and both of them were taking me to Hell, and I was between them, invoking Allah, \"O Allah! I seek refuge with You from Hell.\" Then I saw myself being confronted by another angel holding a mace of iron in his hand. He said to me, \"Do not be afraid, you will be an excellent man if you only pray more often.\" So they took me till they stopped me at the edge of Hell, and behold, it was built inside like a well and it had side posts like those of a well, and beside each post there was an angel carrying an iron mace. I saw therein many people hanging upside down with iron chains, and I recognized therein some men from the Quraish. Then (the angels) took me to the right side. I narrated this dream to (my sister) Hafsa and she told it to Allah's Messenger (ﷺ). Allah's Messenger (ﷺ) said, \"No doubt, `Abdullah is a good man.\" (Nafi` said, \"Since then `Abdullah bin `Umar used to pray much)"},{"n":"7031","k":"","a":"حَدَّثَنِي عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا هِشَامُ بْنُ يُوسُفَ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنِ ابْنِ عُمَرَ، قَالَ كُنْتُ غُلاَمًا شَابًّا عَزَبًا فِي عَهْدِ النَّبِيِّ صلى الله عليه وسلم وَكُنْتُ أَبِيتُ فِي الْمَسْجِدِ، وَكَانَ مَنْ رَأَى مَنَامًا قَصَّهُ عَلَى النَّبِيِّ صلى الله عليه وسلم فَقُلْتُ اللَّهُمَّ إِنْ كَانَ لِي عِنْدَكَ خَيْرٌ فَأَرِنِي مَنَامًا يُعَبِّرُهُ لِي رَسُولُ اللَّهِ صلى الله عليه وسلم، فَنِمْتُ فَرَأَيْتُ مَلَكَيْنِ أَتَيَانِي فَانْطَلَقَا بِي، فَلَقِيَهُمَا مَلَكٌ آخَرُ فَقَالَ لِي لَنْ تُرَاعَ، إِنَّكَ رَجُلٌ صَالِحٌ، فَانْطَلَقَا بِي إِلَى النَّارِ، فَإِذَا هِيَ مَطْوِيَّةٌ كَطَىِّ الْبِئْرِ، وَإِذَا فِيهَا نَاسٌ قَدْ عَرَفْتُ بَعْضَهُمْ، فَأَخَذَا بِي ذَاتَ الْيَمِينِ، فَلَمَّا أَصْبَحْتُ ذَكَرْتُ ذَلِكَ لِحَفْصَةَ‏.‏ فَزَعَمَتْ حَفْصَةُ أَنَّهَا قَصَّتْهَا عَلَى النَّبِيِّ صلى الله عليه وسلم فَقَالَ ‏ \"‏ إِنَّ عَبْدَ اللَّهِ رَجُلٌ صَالِحٌ لَوْ كَانَ يُكْثِرُ الصَّلاَةَ مِنَ اللَّيْلِ ‏\"‏‏.‏ قَالَ الزُّهْرِيُّ وَكَانَ عَبْدُ اللَّهِ بَعْدَ ذَلِكَ يُكْثِرُ الصَّلاَةَ مِنَ اللَّيْلِ‏.‏","b":"পরে হাফসাহ (রাঃ) বললেন যে, তিনি তা নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে বর্ণনা করেছেন। আর তিনি বলেছেনঃ ‘আবদুল্লাহ্ নেক্‌কার লোক। (তিনি আরও বলেছেন) যদি সে রাতে অধিক করে সালাত আদায় করত। যুহরী (রহ.) বলেন, এরপর থেকে ‘আবদুল্লাহ্ (ইবনু ‘উমার) (রাঃ) রাতে অধিক করে সালাত আদায় করতে লাগলেন। [১১২২] (আধুনিক প্রকাশনী- ৬৫৪৩ শেষাংশ, ইসলামিক ফাউন্ডেশন)","e":"Narrated Ibn `Umar:I was a young unmarried man during the lifetime of the Prophet. I used to sleep in the mosque. Anyone who had a dream, would narrate it to the Prophet. I said, \"O Allah! If there is any good for me with You, then show me a dream so that Allah's Messenger (ﷺ) may interpret it for me.\" So I slept and saw (in a dream) two angels came to me and took me along with them, and they met another angel who said to me, \"Don't be afraid, you are a good man.\" They took me towards the Fire, and behold, it was built inside like a well, and therein I saw people some of whom I recognized, and then the angels took me to the right side. In the morning, I mentioned that dream to Hafsa. Hafsa told me that she had mentioned it to the Prophet (ﷺ) and he said, \"`Abdullah is a righteous man if he only prays more at night.\" (Az-Zuhri said, \"After that, `Abdullah used to pray more at night)"},{"n":"7032","k":"","a":"حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، عَنْ حَمْزَةَ بْنِ عَبْدِ اللَّهِ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ ـ رضى الله عنهما ـ قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏\"‏ بَيْنَا أَنَا نَائِمٌ أُتِيتُ بِقَدَحِ لَبَنٍ فَشَرِبْتُ مِنْهُ، ثُمَّ أَعْطَيْتُ فَضْلِي عُمَرَ بْنَ الْخَطَّابِ ‏\"‏‏.‏ قَالُوا فَمَا أَوَّلْتَهُ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ الْعِلْمَ ‏\"‏‏.‏","b":"‘আবদুল্লাহ্ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি, আমি একবার ঘুমিয়ে ছিলাম। দেখলাম, আমার কাছে দুধের একটি পিয়ালা আনা হল। আমি তা থেকে পান করলাম। এরপর আমার বাকী অংশ ‘উমার ইবনু খাত্তাবকে দিলাম। সহাবাগণ বললেন, হে আল্লাহর রাসূল! আপনি এর ব্যাখ্যা কী দিলেন। তিনি বললেনঃ .....ইলম। [৮২] (আধুনিক প্রকাশনী- ৬৫৪৪, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Abdullah bin `Umar:I heard Allah's Messenger (ﷺ) saying, \"While I was sleeping, I saw that a cup full of milk was brought to me and I drank of it and gave the remaining of it to `Umar bin Al-Khattab.\" They asked. What have you interpreted (about the dream)? O Allah's Messenger (ﷺ)?\" The Prophet (ﷺ) said. \"(It is Religious) knowledge"},{"n":"7033","k":"","a":"حَدَّثَنِي سَعِيدُ بْنُ مُحَمَّدٍ، حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا أَبِي، عَنْ صَالِحٍ، عَنِ ابْنِ عُبَيْدَةَ بْنِ نَشِيطٍ، قَالَ قَالَ عُبَيْدُ اللَّهِ بْنُ عَبْدِ اللَّهِ سَأَلْتُ عَبْدَ اللَّهِ بْنَ عَبَّاسٍ ـ رضى الله عنهما ـ عَنْ رُؤْيَا، رَسُولِ اللَّهِ صلى الله عليه وسلم الَّتِي ذَكَرَ‏.‏","b":"‘উবাইদুল্লাহ্ ইবনু ‘আবদুল্লাহ্ (রহ.) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম যে সব স্বপ্নের উল্লেখ করেছেন আমি ‘আবদুল্লাহ্ ইবনু ‘আব্বাস (রাঃ)-কে সে ব্যাপারে জিজ্ঞেস করলাম। [৩৬২০] (আধুনিক প্রকাশনী- নাই, ইসলামিক ফাউন্ডেশন)","e":"Narated Ubaidullah bin Abdullah:I asked Ibn Abbas about the dream of Allah's Messenger which he mentioned. (see following hadith)"},{"n":"7034","k":"","a":"فَقَالَ ابْنُ عَبَّاسٍ ذُكِرَ لِي أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ بَيْنَا أَنَا نَائِمٌ رَأَيْتُ أَنَّهُ وُضِعَ فِي يَدَىَّ سِوَارَانِ مِنْ ذَهَبٍ، فَفُظِعْتُهُمَا وَكَرِهْتُهُمَا، فَأُذِنَ لِي، فَنَفَخْتُهُمَا فَطَارَا، فَأَوَّلْتُهُمَا كَذَّابَيْنِ يَخْرُجَانِ ‏\"‏‏.‏ فَقَالَ عُبَيْدُ اللَّهِ أَحَدُهُمَا الْعَنْسِيُّ الَّذِي قَتَلَهُ فَيْرُوزٌ بِالْيَمَنِ، وَالآخَرُ مُسَيْلِمَةُ‏.‏","b":"‘আবদুল্লাহ্ ইবনু ‘আব্বাস (রাঃ) বললেন, আমার কাছে উল্লেখ করা হয়েছে যে, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, আমি একবার ঘুমিয়ে ছিলাম, আমাকে দেখানো হলো যে আমার হাত দু’টিতে স্বর্ণের দু’টি চুড়ি রাখা হয়েছে। আমি সে দু’টি কেটে ফেললাম এবং অপছন্দ করলাম। অতঃপর আমাকে অনুমতি দেয়া হল, আমি উভয়টিকে ফুঁ দিলাম, ফলে উভয়টি উড়ে গেল। আমি চুড়ি দু’টির এ ব্যাখ্যা করলাম যে, দু’জন মিথ্যা নবুয়তের দাবিদার বের হবে। ‘উবাইদুল্লাহ্ (রহ.) বলেন, এদের একজন হল, আল আন্সী যাকে ইয়ামানে ফায়রূয (রাঃ) কতল করেছেন। আর অন্যজন হল মুসাইলিমা। [৩৬২১] (আধুনিক প্রকাশনী- ৬৫৪৫ , ইসলামিক ফাউন্ডেশন)","e":"Narrated `Abdullah bin `Abbas:Allah's Messenger (ﷺ) said, \"While I was sleeping, two golden bangles were put in my two hands, so I got scared (frightened) and disliked it, but I was given permission to blow them off, and they flew away. I interpret it as a symbol of two liars who will appear.\" 'Ubaidullah said, \"One of them was Al-`Ansi who was killed by Fairuz at Yemen and the other was Musailama (at Najd)"},{"n":"7035","k":"","a":"حَدَّثَنِي مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ جَدِّهِ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، أُرَاهُ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ رَأَيْتُ فِي الْمَنَامِ أَنِّي أُهَاجِرُ مِنْ مَكَّةَ إِلَى أَرْضٍ بِهَا نَخْلٌ، فَذَهَبَ وَهَلِي إِلَى أَنَّهَا الْيَمَامَةُ أَوْ هَجَرٌ، فَإِذَا هِيَ الْمَدِينَةُ يَثْرِبُ، وَرَأَيْتُ فِيهَا بَقَرًا وَاللَّهُ خَيْرٌ، فَإِذَا هُمُ الْمُؤْمِنُونَ يَوْمَ أُحُدٍ، وَإِذَا الْخَيْرُ مَا جَاءَ اللَّهُ مِنَ الْخَيْرِ وَثَوَابِ الصِّدْقِ الَّذِي أَتَانَا اللَّهُ بِهِ بَعْدَ يَوْمِ بَدْرٍ ‏\"‏‏.‏","b":"আবূ মূসা (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ আমি স্বপ্নে দেখলাম যে আমি মক্কা থেকে এমন এক জায়গার দিকে হিজরাত করছি যেখানে খেজুর গাছ আছে। তখন আমার ধারণা হল, সেই জায়গাটি ‘ইয়ামামা’ অথবা ‘হাজার’ হবে। অথচ সে জায়গাটি হল মাদ্বীনাহ তথা ইয়াসরিব। আর আমি (স্বপ্নে) সেখানে একটি গরু দেখলাম। আল্লাহর কসম! এটা কল্যাণকরই। গরুর ব্যাখ্যা হল উহুদের যুদ্ধে (শাহাদাত প্রাপ্ত) মু’মিনগণ। আর কল্যাণের ব্যাখ্যা হল এটাই, যে কল্যাণ আল্লাহ্ আমাদের দিয়েছেন এবং সত্যের বিনিময় যা আল্লাহ্ বাদর যুদ্ধের পর আমাদেরকে প্রদান করেছেন। [৩৬২২] (আধুনিক প্রকাশনী- ৬৫৪৬, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Musa:The Prophet (ﷺ) said, \"I saw in a dream that I was migrating from Mecca to a land where there were date palm trees. I thought that it might be the land of Al-Yamama or Hajar, but behold, it turned out to be Yathrib (i.e. Medina). And I saw cows (being slaughtered) there, but the reward given by Allah is better (than worldly benefits). Behold, those cows proved to symbolize the believers (who were killed) on the Day (of the battle) of Uhud, and the good (which I saw in the dream) was the good and the reward and the truth which Allah bestowed upon us after the Badr battle. (or the Battle of Uhud) and that was the victory bestowed by Allah in the Battle of Khaibar and the conquest of Mecca"},{"n":"7037","k":"","a":"حَدَّثَنِي إِسْحَاقُ بْنُ إِبْرَاهِيمَ الْحَنْظَلِيُّ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنْ هَمَّامِ بْنِ مُنَبِّهٍ، قَالَ هَذَا مَا حَدَّثَنَا بِهِ أَبُو هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم قَالَ ‏\"‏ نَحْنُ الآخِرُونَ السَّابِقُونَ ‏\"‏‏.‏ وَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ بَيْنَا أَنَا نَائِمٌ إِذْ أُوتِيتُ خَزَائِنَ الأَرْضِ، فَوُضِعَ فِي يَدَىَّ سِوَارَانِ مِنْ ذَهَبٍ، فَكَبُرَا عَلَىَّ وَأَهَمَّانِي، فَأُوحِيَ إِلَىَّ أَنِ انْفُخْهُمَا، فَنَفَخْتُهُمَا فَطَارَا، فَأَوَّلْتُهُمَا الْكَذَّابَيْنِ اللَّذَيْنِ أَنَا بَيْنَهُمَا صَاحِبَ صَنْعَاءَ وَصَاحِبَ الْيَمَامَةِ ‏\"‏‏.‏","b":"রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম আরও বলেছেনঃ একবার আমি নিদ্রিত ছিলাম। দেখলাম আমাকে পৃথিবীর ভান্ডারসমূহ দেয়া হয়েছে। আর আমার হাতে স্বর্ণের দু’টি চুড়ি রাখা হয়, যা আমার কাছে কষ্টকর মনে হল। আর আমাকে চিন্তায় ফেলে দিল। তখন আমাকে নির্দেশ করা হল, যেন আমি চুড়ি দু’টিতে ফুঁ দেই। তাই আমি ও দু’টিতে ফুঁ দিলাম (চুড়ি দু’টি উড়ে গেল)। আমি চুড়ি দু’টির ব্যাখ্যা এভাবে করলাম যে, (নবুয়তের) দু’জন মিথ্যা দাবিদার রয়েছে, যাদের মাঝখানে আমি আছি। সান‘আর বাসিন্দা (আলআনসী) ও ইয়ামামার বাসিন্দা (মুসায়লিমা)। [৩৬২১] (আধুনিক প্রকাশনী- ৬৫৪৭, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"We (Muslims) are the last (to come) but (will be) the foremost (on the Day of Resurrection).\" Allah's Messenger (ﷺ) further said, ''While sleeping, I was given the treasures of the world and two golden bangles were put in my hands, but I felt much annoyed, and those two bangles distressed me very much, but I was inspired that I should blow them off, so I blew them and they flew away. Then I interpreted that those two bangles were the liars between whom I was (i.e., the one of San`a' and the one of Yamama)"},{"n":"7038","k":"","a":"حَدَّثَنَا إِسْمَاعِيلُ بْنُ عَبْدِ اللَّهِ، حَدَّثَنِي أَخِي عَبْدُ الْحَمِيدِ، عَنْ سُلَيْمَانَ بْنِ بِلاَلٍ، عَنْ مُوسَى بْنِ عُقْبَةَ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ ‏ \"‏ رَأَيْتُ كَأَنَّ امْرَأَةً سَوْدَاءَ ثَائِرَةَ الرَّأْسِ، خَرَجَتْ مِنَ الْمَدِينَةِ، حَتَّى قَامَتْ بِمَهْيَعَةَ ـ وَهْىَ الْجُحْفَةُ ـ فَأَوَّلْتُ أَنَّ وَبَاءَ الْمَدِينَةِ نُقِلَ إِلَيْهَا ‏\"‏‏.‏","b":"সালিমের পিতা ‘আবদুল্লাহ্ (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ আমি দেখেছি যেন এলোমেলো চুলওয়ালা একজন কালো মহিলা মাদ্বীনাহ থেকে বের হয়ে মাহইয়াআ নামক স্থানে গিয়ে দাঁড়িয়েছে আর এটিকে জুহ্ফা বলা হয়। আমি এ স্বপ্নের ব্যাখ্যা করলাম যে, মাদ্বীনাহর মহামারী সেখানে স্থানান্তরিত হল। [৭০৩৯, ৭০৪০] (আধুনিক প্রকাশনী- ৬৫৪৮, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Abdullah:The Prophet (ﷺ) said, \"I saw (in a dream) a black woman with unkempt hair going out of Medina and settling at Mahai'a, i.e., Al-Juhfa. I interpreted that as a symbol of epidemic of Medina being transferred to that place (Al-Juhfa)"},{"n":"7039","k":"","a":"حَدَّثَنَا مُحَمَّدُ بْنُ أَبِي بَكْرٍ الْمُقَدَّمِيُّ، حَدَّثَنَا فُضَيْلُ بْنُ سُلَيْمَانَ، حَدَّثَنَا مُوسَى، حَدَّثَنِي سَالِمُ بْنُ عَبْدِ اللَّهِ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ ـ رضى الله عنهما ـ فِي رُؤْيَا النَّبِيِّ صلى الله عليه وسلم فِي الْمَدِينَةِ ‏ \"‏ رَأَيْتُ امْرَأَةً سَوْدَاءَ ثَائِرَةَ الرَّأْسِ، خَرَجَتْ مِنَ الْمَدِينَةِ، حَتَّى نَزَلَتْ بِمَهْيَعَةَ، فَتَأَوَّلْتُهَا أَنَّ وَبَاءَ الْمَدِينَةِ نُقِلَ إِلَى مَهْيَعَةَ، وَهْىَ الْجُحْفَةُ ‏\"‏‏.‏","b":"‘আবদুল্লাহ্ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি মাদ্বীনাহ সম্পর্কে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর স্বপ্নের বর্ণনা প্রসঙ্গে বলেন। তিনি বলেছেনঃ আমি দেখেছি এলোমেলো চুল ওয়ালা একজন কালো মহিলা মাদ্বীনাহ থেকে বের হয়েছে। অবশেষে মাহইয়ায়া নামক জায়গায় অবস্থান নিয়েছে। আমি এর ব্যাখ্যা করলাম যে, মাদ্বীনাহর মহামারী মাহইয়া‘আহ তথা জুহ্ফা নামক জায়গায় স্থানান্তরিত হল। [৭০৩৮] (আধুনিক প্রকাশনী- ৬৫৪৯, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Abdullah bin `Umar:concerning the dream of the Prophet (ﷺ) in Medina: The Prophet (ﷺ) said, \"I saw (in a dream) a black woman with unkempt hair going out of Medina and settling at Mahai'a. I interpreted that as (a symbol of) the epidemic of Medina being transferred to Mahai'a, namely, Al-Juhfa"},{"n":"7040","k":"","a":"حَدَّثَنَا إِبْرَاهِيمُ بْنُ الْمُنْذِرِ، حَدَّثَنِي أَبُو بَكْرِ بْنُ أَبِي أُوَيْسٍ، حَدَّثَنِي سُلَيْمَانُ، عَنْ مُوسَى بْنِ عُقْبَةَ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، أَنَّ النَّبِيَّ صلى الله عليه وسلم قَالَ ‏ \"‏ رَأَيْتُ امْرَأَةً سَوْدَاءَ ثَائِرَةَ الرَّأْسِ، خَرَجَتْ مِنَ الْمَدِينَةِ، حَتَّى قَامَتْ بِمَهْيَعَةَ فَأَوَّلْتُ أَنَّ وَبَاءَ الْمَدِينَةِ نُقِلَ إِلَى مَهْيَعَةَ، وَهْىَ الْجُحْفَةُ ‏\"‏‏.‏","b":"সালিমের পিতা ‘আবদুল্লাহ্ (রাঃ) হতে বর্ণিত। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ আমি স্বপ্নে দেখেছি। এলোমেলো চুলওয়ালা একজন কালো মহিলা মাদ্বীনাহ থেকে বের হয়ে মাহইয়াআ তথা জুহ্ফা নামক জায়গায় গিয়ে থেমেছে। আমি এর ব্যাখ্যা করলাম যে, মাদ্বীনাহর মহামারী সেখানে স্থানান্তরিত হল। ৭০৩৮] (আধুনিক প্রকাশনী- ৬৫৫০, ইসলামিক ফাউন্ডেশন)","e":"Narrated Salim's father:The Prophet (ﷺ) said, \"I saw (in a dream) a black woman with unkempt hair going out of Medina and settling in Mahai'a. I interpreted that as (a symbol of) epidemic of Medina being transferred to Mahai'a, namely, Al-Juhfa"},{"n":"7041","k":"","a":"حَدَّثَنَا مُحَمَّدُ بْنُ الْعَلاَءِ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدِ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي بُرْدَةَ، عَنْ جَدِّهِ أَبِي بُرْدَةَ، عَنْ أَبِي مُوسَى، أُرَاهُ عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ رَأَيْتُ فِي رُؤْيَا أَنِّي هَزَزْتُ سَيْفًا فَانْقَطَعَ صَدْرُهُ، فَإِذَا هُوَ مَا أُصِيبَ مِنَ الْمُؤْمِنِينَ يَوْمَ أُحُدٍ، ثُمَّ هَزَزْتُهُ أُخْرَى، فَعَادَ أَحْسَنَ مَا كَانَ، فَإِذَا هُوَ مَا جَاءَ اللَّهُ بِهِ مِنَ الْفَتْحِ، وَاجْتِمَاعِ الْمُؤْمِنِينَ ‏\"‏‏.‏","b":"আবূ মূসা (রাঃ) হতে বর্ণিত। তিনি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর স্বপ্ন বর্ণনা প্রসঙ্গে বলেন, তিনি বলেছেনঃ আমি স্বপ্নে দেখলাম একটা তরবারী নাড়াচাড়া করছি। আর এ মধ্যভাগ ভেঙ্গে গেল। এর ব্যাখ্যা হল বিপদ, যা উহুদের যুদ্ধে মু’মিনদের ভাগ্যে ঘটেছে। আবার আমি তরবারিটি নাড়লাম। এতে তরবারীটি আগের থেকে সুন্দর অবস্থায় ফিরে এল। এর ব্যাখ্যা হল আল্লাহর দেয়া বিজয় ও মু’মিনদের ঐক্য। [৩৬২২] (আধুনিক প্রকাশনী- ৬৫৫১, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Musa:The Prophet (ﷺ) said, \"I saw in a dream that I waved a sword and it broke in the middle, and behold, that symbolized the casualties the believers suffered on the Day (of the battle) of Uhud. Then I waved the sword again, and it became better than it had ever been before, and behold, that symbolized the Conquest (of Mecca) which Allah brought about and the gathering of the believers"},{"n":"7042","k":"","a":"حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، عَنْ أَيُّوبَ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبَّاسٍ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏\"‏ مَنْ تَحَلَّمَ بِحُلُمٍ لَمْ يَرَهُ، كُلِّفَ أَنْ يَعْقِدَ بَيْنَ شَعِيرَتَيْنِ، وَلَنْ يَفْعَلَ، وَمَنِ اسْتَمَعَ إِلَى حَدِيثِ قَوْمٍ وَهُمْ لَهُ كَارِهُونَ أَوْ يَفِرُّونَ مِنْهُ، صُبَّ فِي أُذُنِهِ الآنُكُ يَوْمَ الْقِيَامَةِ، وَمَنْ صَوَّرَ صُورَةً، عُذِّبِ وَكُلِّفَ أَنْ يَنْفُخَ فِيهَا، وَلَيْسَ بِنَافِخٍ ‏\"‏‏.‏ قَالَ سُفْيَانُ وَصَلَهُ لَنَا أَيُّوبُ‏.‏ وَقَالَ قُتَيْبَةُ حَدَّثَنَا أَبُو عَوَانَةَ، عَنْ قَتَادَةَ، عَنْ عِكْرِمَةَ، عَنْ أَبِي هُرَيْرَةَ، قَوْلَهُ مَنْ كَذَبَ فِي رُؤْيَاهُ‏.‏ وَقَالَ شُعْبَةُ عَنْ أَبِي هَاشِمٍ الرُّمَّانِيِّ سَمِعْتُ عِكْرِمَةَ قَالَ أَبُو هُرَيْرَةَ قَوْلَهُ مَنْ صَوَّرَ، وَمَنْ تَحَلَّمَ، وَمَنِ اسْتَمَعَ‏.‏ حَدَّثَنِي إِسْحَاقُ حَدَّثَنَا خَالِدٌ عَنْ خَالِدٍ عَنْ عِكْرِمَةَ عَنِ ابْنِ عَبَّاسٍ قَالَ ‏\"‏ مَنِ اسْتَمَعَ، وَمَنْ تَحَلَّمَ، وَمَنْ صَوَّرَ ‏\"‏‏.‏ نَحْوَهُ‏.‏ تَابَعَهُ هِشَامٌ عَنْ عِكْرِمَةَ عَنِ ابْنِ عَبَّاسٍ قَوْلَهُ‏.‏","b":"ইবনু ‘আব্বাস (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি বলেছেন, যে লোক এমন স্বপ্ন দেখার ভান করল যা সে দেখেনি তাকে দু’টি যবের দানায় গিট দেয়ার জন্য বাধ্য করা হবে। অথচ সে তা কখনও পারবে না। যে কেউ কোন এক দলের কথার দিকে কান লাগাল। অথচ তারা এটা পছন্দ করে না অথবা বলেছেন, অথচ তারা তার থেকে পলায়নপর। কিয়ামতের দিন তার উভয় কানে সীসা ঢেলে দেয়া হবে। আর যে কেউ প্রাণীর ছবি আঁকে তাকে শাস্তি দেয়া হবে এবং তাতে প্রাণ ফুঁকে দেয়ার জন্য বাধ্য করা হবে। কিন্তু সে প্রাণ ফুঁকতে পারবে না। সুফ্ইয়ান বলেছেন, আইউব এ হাদীসটি আমাদেরকে মওসুল রূপে বর্ণনা করেছেন। (আধুনিক প্রকাশনী- ৬৫৫২, ইসলামিক ফাউন্ডেশন- ৬৫৬৫) কুতাইবাহ (রহ.) বলেন, আবূ আওয়ানা (রহ.).....আবূ হুরাইরাহ (রাঃ) থেকে তাঁর উক্তি বর্ণনা করেন, যে ব্যক্তি নিজের স্বপ্ন মিথ্যা বর্ণনা করে। শু’বা (রহ.) আবূ হুরাইরাহ (রাঃ) থেকে তাঁর উক্তি বর্ণনা করেন, যে কেউ ছবি আঁকে......যে কেউ মিথ্যা স্বপ্ন বর্ণনা করে.....যে কেউ কান লাগায়.....। ইবনু ‘আব্বাস (রাঃ) হতে বর্ণিত। (তিনি বলেন) যে কেউ কান লাগাবে.....যে কেউ মিথ্যা স্বপ্ন বর্ণনা করবে.....যে কেউ ছবি আঁকবে.....অবশিষ্ট হাদীস একই রকম বর্ণনা করেছেন......। হিশাম (রহ.) ইকরামাহ থেকে ইবনু ‘আব্বাস সূত্রে খালিদ এর অনুসরণ করেছেন।[1] [২২২৫] (আধুনিক প্রকাশনী- ৬৫৫৩, ইসলামিক ফাউন্ডেশন)","e":"Narrated Ibn `Abbas:The Prophet (ﷺ) said, \"Whoever claims to have seen a dream which he did not see, will be ordered to make a knot between two barley grains which he will not be able to do; and if somebody listens to the talk of some people who do not like him (to listen) or they run away from him, then molten lead will be poured into his ears on the Day of Resurrection; and whoever makes a picture, will be punished on the Day of Resurrection and will be ordered to put a soul in that picture, which he will not be able to do.\" Ibn `Abbas also narrated a similar hadith"},{"n":"7043","k":"","a":"حَدَّثَنَا عَلِيُّ بْنُ مُسْلِمٍ، حَدَّثَنَا عَبْدُ الصَّمَدِ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ عَبْدِ اللَّهِ بْنِ دِينَارٍ، مَوْلَى ابْنِ عُمَرَ عَنْ أَبِيهِ، عَنِ ابْنِ عُمَرَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ مِنْ أَفْرَى الْفِرَى أَنْ يُرِيَ عَيْنَيْهِ مَا لَمْ تَرَ ‏\"‏‏.‏","b":"ইবনু ‘উমার (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, সবচেয়ে নিকৃষ্ট মিথ্যা হল আপন চক্ষু দিয়ে এমন কিছু দেখার (দাবি করা) যা চক্ষুদ্বয় দেখতে পায়নি। (আধুনিক প্রকাশনী- ৬৫৫৪, ইসলামিক ফাউন্ডেশন)","e":"Narrated Ibn `Umar:Allah's Messenger (ﷺ) said, \"The worst lie is that a person claims to have seen a dream which he has not seen"},{"n":"7044","k":"","a":"حَدَّثَنَا سَعِيدُ بْنُ الرَّبِيعِ، حَدَّثَنَا شُعْبَةُ، عَنْ عَبْدِ رَبِّهِ بْنِ سَعِيدٍ، قَالَ سَمِعْتُ أَبَا سَلَمَةَ، يَقُولُ لَقَدْ كُنْتُ أَرَى الرُّؤْيَا فَتُمْرِضُنِي حَتَّى سَمِعْتُ أَبَا قَتَادَةَ يَقُولُ وَأَنَا كُنْتُ لأَرَى الرُّؤْيَا تُمْرِضُنِي، حَتَّى سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏ \"‏ الرُّؤْيَا الْحَسَنَةُ مِنَ اللَّهِ، فَإِذَا رَأَى أَحَدُكُمْ مَا يُحِبُّ فَلاَ يُحَدِّثْ بِهِ إِلاَّ مَنْ يُحِبُّ، وَإِذَا رَأَى مَا يَكْرَهُ فَلْيَتَعَوَّذْ بِاللَّهِ مِنْ شَرِّهَا، وَمِنْ شَرِّ الشَّيْطَانِ وَلْيَتْفِلْ ثَلاَثًا وَلاَ يُحَدِّثْ بِهَا أَحَدًا فَإِنَّهَا لَنْ تَضُرَّهُ ‏\"‏‏.‏","b":"আবূ সালামাহ (রহ.) হতে বর্ণিত। তিনি বলেন, আমি এমন স্বপ্ন দেখতাম যা আমাকে রোগাক্রান্ত করে ফেলত। অবশেষে আমি আবূ ক্বাতাদাহ (রাঃ)-কে বলতে শুনেছি, তিনি বলেন, আমি এমন স্বপ্ন দেখতাম যা আমাকে রোগাক্রান্ত করে দিত। শেষে আমি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি, ভাল স্বপ্ন আল্লাহর পক্ষ থেকে হয়ে থাকে। তাই যখন কেউ পছন্দনীয় কোন স্বপ্ন দেখে তখন এমন লোকের কাছেই বলবে, যাকে সে পছন্দ করে। আর যখন অপছন্দনীয় কোন স্বপ্ন দেখে তখন যেন সে এর ক্ষতি ও শয়তানের ক্ষতি থেকে আল্লাহর আশ্রয় চায় এবং তিনবার থু থু ফেলে আর সে যেন তা কারো কাছে বর্ণনা না করে। তাহলে এ স্বপ্ন তার কোন ক্ষতি করবে না। [২৩৯২] (আধুনিক প্রকাশনী- ৬৫৫৫, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Salama:I used to see a dream which would make me sick till I heard Abu Qatada saying, \"I too, used to see a dream which would make me sick till I heard the Prophet (ﷺ) saying, \"A good dream is from Allah, so if anyone of you saw a dream which he liked, he should not tell it to anybody except to the one whom he loves, and if he saw a dream which he disliked, then he should seek refuge with Allah from its evil and from the evil of Satan, and spit three times (on his left) and should not tell it to anybody, for it will not harm him"},{"n":"7045","k":"","a":"حَدَّثَنَا إِبْرَاهِيمُ بْنُ حَمْزَةَ، حَدَّثَنِي ابْنُ أَبِي حَازِمٍ، وَالدَّرَاوَرْدِيُّ، عَنْ يَزِيدَ، عَنْ عَبْدِ اللَّهِ بْنِ خَبَّابٍ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ إِذَا رَأَى أَحَدُكُمُ الرُّؤْيَا يُحِبُّهَا، فَإِنَّهَا مِنَ اللَّهِ، فَلْيَحْمَدِ اللَّهَ عَلَيْهَا، وَلْيُحَدِّثْ بِهَا، وَإِذَا رَأَى غَيْرَ ذَلِكَ مِمَّا يَكْرَهُ، فَإِنَّمَا هِيَ مِنَ الشَّيْطَانِ، فَلْيَسْتَعِذْ مِنْ شَرِّهَا، وَلاَ يَذْكُرْهَا لأَحَدٍ، فَإِنَّهَا لَنْ تَضُرَّهُ ‏\"‏","b":"আবূ সা‘ঈদ খুদরী (রাঃ) হতে বর্ণিত। তিনি রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছেন, যখন কেউ এমন কোন স্বপ্ন দেখে যা সে পছন্দ করে, তবে মনে করবে যে তা আল্লাহর তরফ থেকে হয়েছে। তখন যেন সে এজন্য আল্লাহর শোকর আদায় করে এবং তা বর্ণনা করে। আর যখন এর বিপরীত কোন স্বপ্ন দেখে, যা সে পছন্দ করে না, মনে করবে তা শয়তানের তরফ থেকে হয়েছে। তখন যেন সে এর অনিষ্ট থেকে আল্লাহর আশ্রয় চায় এবং তা কারো কাছে বর্ণনা না করে। তাহলে এ স্বপ্ন তার কোন ক্ষতি করবে না। (আধুনিক প্রকাশনী- ৬৫৫৬, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Sa`id Al-Khudri:I heard Allah's Messenger (ﷺ) saying, \"If anyone of you saw a dream which he liked, then that was from Allah, and he should thank Allah for it and tell it to others; but if he saw something else, i.e, a dream which he did not like, then that is from Satan and he should seek refuge with Allah from it and should not tell it to anybody for it will not harm him"},{"n":"7046","k":"","a":"حَدَّثَنِي يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، أَنَّ ابْنَ عَبَّاسٍ ـ رضى الله عنهما ـ كَانَ يُحَدِّثُ أَنَّ رَجُلاً أَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ إِنِّي رَأَيْتُ اللَّيْلَةَ فِي الْمَنَامِ ظُلَّةً تَنْطِفُ السَّمْنَ وَالْعَسَلَ، فَأَرَى النَّاسَ يَتَكَفَّفُونَ مِنْهَا فَالْمُسْتَكْثِرُ وَالْمُسْتَقِلُّ، وَإِذَا سَبَبٌ وَاصِلٌ مِنَ الأَرْضِ إِلَى السَّمَاءِ، فَأَرَاكَ أَخَذْتَ بِهِ فَعَلَوْتَ، ثُمَّ أَخَذَ بِهِ رَجُلٌ آخَرُ فَعَلاَ بِهِ، ثُمَّ أَخَذَ بِهِ رَجُلٌ آخَرُ فَعَلاَ بِهِ ثُمَّ أَخَذَ بِهِ رَجُلٌ آخَرُ فَانْقَطَعَ ثُمَّ وُصِلَ‏.‏ فَقَالَ أَبُو بَكْرٍ يَا رَسُولَ اللَّهِ بِأَبِي أَنْتَ وَاللَّهِ لَتَدَعَنِّي فَأَعْبُرَهَا‏.‏ فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ اعْبُرْ ‏\"‏‏.‏ قَالَ أَمَّا الظُّلَّةُ فَالإِسْلاَمُ، وَأَمَّا الَّذِي يَنْطِفُ مِنَ الْعَسَلِ وَالسَّمْنِ فَالْقُرْآنُ حَلاَوَتُهُ تَنْطُفُ، فَالْمُسْتَكْثِرُ مِنَ الْقُرْآنِ وَالْمُسْتَقِلُّ، وَأَمَّا السَّبَبُ الْوَاصِلُ مِنَ السَّمَاءِ إِلَى الأَرْضِ فَالْحَقُّ الَّذِي أَنْتَ عَلَيْهِ تَأْخُذُ بِهِ فَيُعْلِيكَ اللَّهُ، ثُمَّ يَأْخُذُ بِهِ رَجُلٌ مِنْ بَعْدِكَ فَيَعْلُو بِهِ، ثُمَّ يَأْخُذُ رَجُلٌ آخَرُ فَيَعْلُو بِهِ، ثُمَّ يَأْخُذُهُ رَجُلٌ آخَرُ فَيَنْقَطِعُ بِهِ ثُمَّ يُوَصَّلُ لَهُ فَيَعْلُو بِهِ، فَأَخْبِرْنِي يَا رَسُولَ اللَّهِ بِأَبِي أَنْتَ أَصَبْتُ أَمْ أَخْطَأْتُ‏.‏ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏\"‏ أَصَبْتَ بَعْضًا وَأَخْطَأْتَ بَعْضًا ‏\"‏‏.‏ قَالَ فَوَاللَّهِ لَتُحَدِّثَنِّي بِالَّذِي أَخْطَأْتُ‏.‏ قَالَ ‏\"‏ لاَ تُقْسِمْ ‏\"‏‏.‏","b":"ইবনু ‘আব্বাস (রাঃ) হতে বর্ণিত। তিনি বলেন, এক লোক রাসূলূল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে এসে বলল, আমি গত রাতে স্বপ্নে একখন্ড মেঘ দেখলাম, যা থেকে ঘি ও মধু ঝরছে। আমি লোকদেরকে দেখলাম তারা তা থেকে তুলে নিচ্ছে। কেউ অধিক পরিমাণ আবার কেউ কম পরিমাণ। আর দেখলাম, একটা রশি যমীন থেকে আসমান পর্যন্ত মিলে রয়েছে। আমি দেখলাম আপনি তা ধরে উপরে উঠছেন। তারপর অন্য এক লোক তা ধরল ও এর সাহায্যে উপরে উঠে গেল। এরপর আরেক লোক তা ধরে এর দ্বারা উপরে উঠে গেল। এরপর আরেক লোক তা ধরল। কিন্তু তা ছিঁড়ে গেল। পুনরায় তা জোড়া লেগে গেল। তখন আবূ বকর (রাঃ) বললেন, হে আল্লাহর রাসূল! আপনার প্রতি আমার পিতা কুরবান হোক! আল্লাহর কসম! আপনি অবশ্যই আমাকে এ স্বপ্নের ব্যাখ্যা দেয়ার সুযোগ দিবেন। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেনঃ তুমি এর ব্যাখ্যা দাও। আবূ বকর (রাঃ) বললেন, মেঘের ব্যাখ্যা হল ইসলাম। আর তার থেকে যে ঘি ও মধু ঝরছে তা হল কুরআন যার মিষ্টতা ঝরছে। কুরআন থেকে কেউ বেশি সংগ্রহ করছে, আর কেউ কম। আসমান থেকে যমীন পর্যন্ত ঝুলন্ত দড়িটি হচ্ছে ঐ হক (মহাসত্য) যার উপর আপনি প্রতিষ্ঠিত রয়েছেন। আপনি তা ধরবেন, আর আল্লাহ্ আপনাকে উচ্চে উঠাবেন। আপনার পরে আকেরজন তা ধরবে। ফলে এর দ্বারা সে উচ্চে উঠবে। অতঃপর আরেকজন তা ধরে এর মাধ্যমে সে উচ্চে উঠবে। এরপর আকেরজন তা ধরবে। কিন্তু তা ছিঁড়ে যাবে। পুনরায় তা জোড়া লেগে যাবে, ফলে সে এর দ্বারা উচ্চে উঠবে। হে আল্লাহর রাসূল। আমার পিতা আপনার উপর কুরবান হোক। আমাকে বলুন, আমি ঠিক বলেছি, না ভুল? নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেনঃ কিছু ঠিক বলেছ। আর কিছু ভুল বলেছ। তিনি বললেন, হে আল্লাহর রাসূল! আল্লাহর কসম! আপনি অবশ্যই আমাকে বলে দিবেন যা আমি ভুল করেছি। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেনঃ কসম করো না। [মুসলিম ৪২/৩, হাঃ ২২৬৯, আহমাদ ১৮৯৪] (আধুনিক প্রকাশনী- ৬৫৫৭, ইসলামিক ফাউন্ডেশন)","e":"Narrated Ibn `Abbas:A man came to Allah's Messenger (ﷺ) and said, \"I saw in a dream, a cloud having shade. Butter and honey were dropping from it and I saw the people gathering it in their hands, some gathering much and some a little. And behold, there was a rope extending from the earth to the sky, and I saw that you (the Prophet) held it and went up, and then another man held it and went up and (after that) another (third) held it and went up, and then after another (fourth) man held it, but it broke and then got connected again.\" Abu Bakr said, \"O Allah's Messenger (ﷺ)! Let my father be sacrificed for you! Allow me to interpret this dream.\" The Prophet (ﷺ) said to him, \"Interpret it.\" Abu Bakr said, \"The cloud with shade symbolizes Islam, and the butter and honey dropping from it, symbolizes the Qur'an, its sweetness dropping and some people learning much of the Qur'an and some a little. The rope which is extended from the sky to the earth is the Truth which you (the Prophet) are following. You follow it and Allah will raise you high with it, and then another man will follow it and will rise up with it and another person will follow it and then another man will follow it but it will break and then it will be connected for him and he will rise up with it. O Allah's Messenger (ﷺ)! Let my father be sacrificed for you! Am I right or wrong?\" The Prophet replied, \"You are right in some of it and wrong in some.\" Abu Bakr said, \"O Allah's Prophet! By Allah, you must tell me in what I was wrong.\" The Prophet (ﷺ) said, \"Do not swear"},{"n":"7047","k":"","a":"حَدَّثَنِي مُؤَمَّلُ بْنُ هِشَامٍ أَبُو هِشَامٍ، حَدَّثَنَا إِسْمَاعِيلُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا عَوْفٌ، حَدَّثَنَا أَبُو رَجَاءٍ، حَدَّثَنَا سَمُرَةُ بْنُ جُنْدَبٍ ـ رضى الله عنه ـ قَالَ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم مِمَّا يُكْثِرُ أَنْ يَقُولَ لأَصْحَابِهِ ‏\"‏ هَلْ رَأَى أَحَدٌ مِنْكُمْ مِنْ رُؤْيَا ‏\"‏‏.‏ قَالَ فَيَقُصُّ عَلَيْهِ مَنْ شَاءَ اللَّهُ أَنْ يَقُصَّ، وَإِنَّهُ قَالَ ذَاتَ غَدَاةٍ ‏\"‏ إِنَّهُ أَتَانِي اللَّيْلَةَ آتِيَانِ، وَإِنَّهُمَا ابْتَعَثَانِي، وَإِنَّهُمَا قَالاَ لِي انْطَلِقْ‏.‏ وَإِنِّي انْطَلَقْتُ مَعَهُمَا، وَإِنَّا أَتَيْنَا عَلَى رَجُلٍ مُضْطَجِعٍ، وَإِذَا آخَرُ قَائِمٌ عَلَيْهِ بِصَخْرَةٍ، وَإِذَا هُوَ يَهْوِي بِالصَّخْرَةِ لِرَأْسِهِ، فَيَثْلَغُ رَأْسَهُ فَيَتَهَدْهَدُ الْحَجَرُ هَا هُنَا، فَيَتْبَعُ الْحَجَرَ فَيَأْخُذُهُ، فَلاَ يَرْجِعُ إِلَيْهِ حَتَّى يَصِحَّ رَأْسُهُ كَمَا كَانَ، ثُمَّ يَعُودُ عَلَيْهِ، فَيَفْعَلُ بِهِ مِثْلَ مَا فَعَلَ الْمَرَّةَ الأُولَى‏.‏ قَالَ قُلْتُ لَهُمَا سُبْحَانَ اللَّهِ مَا هَذَانِ قَالَ قَالاَ لِي انْطَلِقْ ـ قَالَ ـ فَانْطَلَقْنَا فَأَتَيْنَا عَلَى رَجُلٍ مُسْتَلْقٍ لِقَفَاهُ، وَإِذَا آخَرُ قَائِمٌ عَلَيْهِ بِكَلُّوبٍ مِنْ حَدِيدٍ، وَإِذَا هُوَ يَأْتِي أَحَدَ شِقَّىْ وَجْهِهِ فَيُشَرْشِرُ شِدْقَهُ إِلَى قَفَاهُ، وَمَنْخِرَهُ إِلَى قَفَاهُ وَعَيْنَهُ إِلَى قَفَاهُ ـ قَالَ وَرُبَّمَا قَالَ أَبُو رَجَاءٍ فَيَشُقُّ ـ قَالَ ثُمَّ يَتَحَوَّلُ إِلَى الْجَانِبِ الآخَرِ، فَيَفْعَلُ بِهِ مِثْلَ مَا فَعَلَ بِالْجَانِبِ الأَوَّلِ، فَمَا يَفْرُغُ مِنْ ذَلِكَ الْجَانِبِ حَتَّى يَصِحَّ ذَلِكَ الْجَانِبُ كَمَا كَانَ، ثُمَّ يَعُودُ عَلَيْهِ فَيَفْعَلُ مِثْلَ مَا فَعَلَ الْمَرَّةَ الأُولَى‏.‏ قَالَ قُلْتُ سُبْحَانَ اللَّهِ مَا هَذَانِ قَالَ قَالاَ لِي انْطَلِقْ‏.‏ فَانْطَلَقْنَا فَأَتَيْنَا عَلَى مِثْلِ التَّنُّورِ ـ قَالَ فَأَحْسِبُ أَنَّهُ كَانَ يَقُولُ ـ فَإِذَا فِيهِ لَغَطٌ وَأَصْوَاتٌ ـ قَالَ ـ فَاطَّلَعْنَا فِيهِ، فَإِذَا فِيهِ رِجَالٌ وَنِسَاءٌ عُرَاةٌ، وَإِذَا هُمْ يَأْتِيهِمْ لَهَبٌ مِنْ أَسْفَلَ مِنْهُمْ، فَإِذَا أَتَاهُمْ ذَلِكَ اللَّهَبُ ضَوْضَوْا ـ قَالَ ـ قُلْتُ لَهُمَا مَا هَؤُلاَءِ قَالَ قَالاَ لِي انْطَلِقِ انْطَلِقْ‏.‏ قَالَ فَانْطَلَقْنَا فَأَتَيْنَا عَلَى نَهَرٍ ـ حَسِبْتُ أَنَّهُ كَانَ يَقُولُ ـ أَحْمَرَ مِثْلِ الدَّمِ، وَإِذَا فِي النَّهَرِ رَجُلٌ سَابِحٌ يَسْبَحُ، وَإِذَا عَلَى شَطِّ النَّهَرِ رَجُلٌ قَدْ جَمَعَ عِنْدَهُ حِجَارَةً كَثِيرَةً، وَإِذَا ذَلِكَ السَّابِحُ يَسْبَحُ مَا يَسْبَحُ، ثُمَّ يَأْتِي ذَلِكَ الَّذِي قَدْ جَمَعَ عِنْدَهُ الْحِجَارَةَ فَيَفْغَرُ لَهُ فَاهُ فَيُلْقِمُهُ حَجَرًا فَيَنْطَلِقُ يَسْبَحُ، ثُمَّ يَرْجِعُ إِلَيْهِ، كُلَّمَا رَجَعَ إِلَيْهِ فَغَرَ لَهُ فَاهُ فَأَلْقَمَهُ حَجَرًا ـ قَالَ ـ قُلْتُ لَهُمَا مَا هَذَانِ قَالَ قَالاَ لِي انْطَلِقِ انْطَلِقْ‏.‏ قَالَ فَانْطَلَقْنَا فَأَتَيْنَا عَلَى رَجُلٍ كَرِيهِ الْمَرْآةِ كَأَكْرَهِ مَا أَنْتَ رَاءٍ رَجُلاً مَرْآةً، وَإِذَا عِنْدَهُ نَارٌ يَحُشُّهَا وَيَسْعَى حَوْلَهَا ـ قَالَ ـ قُلْتُ لَهُمَا مَا هَذَا قَالَ قَالاَ لِي انْطَلِقِ انْطَلِقْ‏.‏ فَانْطَلَقْنَا فَأَتَيْنَا عَلَى رَوْضَةٍ مُعْتَمَّةٍ فِيهَا مِنْ كُلِّ نَوْرِ الرَّبِيعِ، وَإِذَا بَيْنَ ظَهْرَىِ الرَّوْضَةِ رَجُلٌ طَوِيلٌ لاَ أَكَادُ أَرَى رَأْسَهُ طُولاً فِي السَّمَاءِ، وَإِذَا حَوْلَ الرَّجُلِ مِنْ أَكْثَرِ وِلْدَانٍ رَأَيْتُهُمْ قَطُّ ـ قَالَ ـ قُلْتُ لَهُمَا مَا هَذَا مَا هَؤُلاَءِ قَالَ قَالاَ لِي انْطَلِقِ انْطَلِقْ‏.‏ ـ قَالَ ـ فَانْطَلَقْنَا فَانْتَهَيْنَا إِلَى رَوْضَةٍ عَظِيمَةٍ لَمْ أَرَ رَوْضَةً قَطُّ أَعْظَمَ مِنْهَا وَلاَ أَحْسَنَ‏.‏ ـ قَالَ ـ قَالاَ لِي ارْقَ فِيهَا‏.‏ قَالَ فَارْتَقَيْنَا فِيهَا فَانْتَهَيْنَا إِلَى مَدِينَةٍ مَبْنِيَّةٍ بِلَبِنِ ذَهَبٍ وَلَبِنِ فِضَّةٍ، فَأَتَيْنَا باب الْمَدِينَةِ فَاسْتَفْتَحْنَا فَفُتِحَ لَنَا، فَدَخَلْنَاهَا فَتَلَقَّانَا فِيهَا رِجَالٌ شَطْرٌ مِنْ خَلْقِهِمْ كَأَحْسَنِ مَا أَنْتَ رَاءٍ، وَشَطْرٌ كَأَقْبَحِ مَا أَنْتَ رَاءٍ ـ قَالَ ـ قَالاَ لَهُمُ اذْهَبُوا فَقَعُوا فِي ذَلِكَ النَّهَرِ‏.‏ قَالَ وَإِذَا نَهَرٌ مُعْتَرِضٌ يَجْرِي كَأَنَّ مَاءَهُ الْمَحْضُ فِي الْبَيَاضِ، فَذَهَبُوا فَوَقَعُوا فِيهِ، ثُمَّ رَجَعُوا إِلَيْنَا قَدْ ذَهَبَ ذَلِكَ السُّوءُ عَنْهُمْ، فَصَارُوا فِي أَحْسَنِ صُورَةٍ ـ قَالَ ـ قَالاَ لِي هَذِهِ جَنَّةُ عَدْنٍ، وَهَذَاكَ مَنْزِلُكَ‏.‏ قَالَ فَسَمَا بَصَرِي صُعُدًا، فَإِذَا قَصْرٌ مِثْلُ الرَّبَابَةِ الْبَيْضَاءِ ـ قَالَ ـ قَالاَ هَذَاكَ مَنْزِلُكَ‏.‏ قَالَ قُلْتُ لَهُمَا بَارَكَ اللَّهُ فِيكُمَا، ذَرَانِي فَأَدْخُلَهُ‏.‏ قَالاَ أَمَّا الآنَ فَلاَ وَأَنْتَ دَاخِلُهُ‏.‏ قَالَ قُلْتُ لَهُمَا فَإِنِّي قَدْ رَأَيْتُ مُنْذُ اللَّيْلَةِ عَجَبًا، فَمَا هَذَا الَّذِي رَأَيْتُ قَالَ قَالاَ لِي أَمَا إِنَّا سَنُخْبِرُكَ، أَمَّا الرَّجُلُ الأَوَّلُ الَّذِي أَتَيْتَ عَلَيْهِ يُثْلَغُ رَأْسُهُ بِالْحَجَرِ، فَإِنَّهُ الرَّجُلُ يَأْخُذُ الْقُرْآنَ فَيَرْفُضُهُ وَيَنَامُ عَنِ الصَّلاَةِ الْمَكْتُوبَةِ، وَأَمَّا الرَّجُلُ الَّذِي أَتَيْتَ عَلَيْهِ يُشَرْشَرُ شِدْقُهُ إِلَى قَفَاهُ، وَمَنْخِرُهُ إِلَى قَفَاهُ، وَعَيْنُهُ إِلَى قَفَاهُ، فَإِنَّهُ الرَّجُلُ يَغْدُو مِنْ بَيْتِهِ فَيَكْذِبُ الْكَذْبَةَ تَبْلُغُ الآفَاقَ، وَأَمَّا الرِّجَالُ وَالنِّسَاءُ الْعُرَاةُ الَّذِينَ فِي مِثْلِ بِنَاءِ التَّنُّورِ فَإِنَّهُمُ الزُّنَاةُ وَالزَّوَانِي‏.‏ وَأَمَّا الرَّجُلُ الَّذِي أَتَيْتَ عَلَيْهِ يَسْبَحُ فِي النَّهَرِ وَيُلْقَمُ الْحَجَرَ، فَإِنَّهُ آكِلُ الرِّبَا، وَأَمَّا الرَّجُلُ الْكَرِيهُ الْمَرْآةِ الَّذِي عِنْدَ النَّارِ يَحُشُّهَا وَيَسْعَى حَوْلَهَا، فَإِنَّهُ مَالِكٌ خَازِنُ جَهَنَّمَ، وَأَمَّا الرَّجُلُ الطَّوِيلُ الَّذِي فِي الرَّوْضَةِ فَإِنَّهُ إِبْرَاهِيمُ صلى الله عليه وسلم وَأَمَّا الْوِلْدَانُ الَّذِينَ حَوْلَهُ فَكُلُّ مَوْلُودٍ مَاتَ عَلَى الْفِطْرَةِ ‏\"‏‏.‏ قَالَ فَقَالَ بَعْضُ الْمُسْلِمِينَ يَا رَسُولَ اللَّهِ وَأَوْلاَدُ الْمُشْرِكِينَ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ وَأَوْلاَدُ الْمُشْرِكِينَ‏.‏ وَأَمَّا الْقَوْمُ الَّذِينَ كَانُوا شَطْرٌ مِنْهُمْ حَسَنًا وَشَطَرٌ مِنْهُمْ قَبِيحًا، فَإِنَّهُمْ قَوْمٌ خَلَطُوا عَمَلاً صَالِحًا وَآخَرَ سَيِّئًا، تَجَاوَزَ اللَّهُ عَنْهُمْ ‏\"‏‏.‏","b":"সামুরাহ ইবনু জুনদাব (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম প্রায়ই তাঁর সাহাবীদেরকে বলতেন, তোমাদের কেউ কোন স্বপ্ন দেখেছ কি? রাবী বলেন, যাদের ক্ষেত্রে আল্লাহর ইচ্ছা, তারা রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে স্বপ্ন বর্ণনা করত। তিনি একদিন সকালে আমাদেরকে বললেনঃ গত রাতে আমার কাছে দু’জন আগন্তুক আসল। তারা আমাকে উঠাল। আর আমাকে বলল, চলুন। আমি তাদের সঙ্গে চললাম। আমরা কাত হয়ে শুয়ে থাকা এক লোকের কাছে আসলাম। দেখলাম, অন্য এক লোক তার নিকট পাথর নিয়ে দাঁড়িয়ে রয়েছে। সে তার মাথায় পাথর নিক্ষেপ করছে। ফলে তার মাথা ফেটে যাচ্ছে। আর পাথর নিচে গিয়ে পড়ছে। এরপর আবার সে পাথরটি অনুসরণ করে তা আবার নিয়ে আসছে। ফিরে আসতে না আসতেই লোকটির মাথা আগের মত আবার ভাল হয়ে যায়। ফিরে এসে আবার তেমনি আচরণ করে, যা পূর্বে প্রথমবার করেছিল। তিনি বলেন, আমি তাদের (সাথীদ্বয়কে) বললাম, সুবহান্নাল্লাহ্! এরা কারা? তিনি বললেন, তারা আমাকে বলল, চলুন, চলুন। তিনি বলেন, আমরা চললাম, এরপর আমরা চিৎ হয়ে শোয়া এক লোকের কাছে আসলাম। এখানেও দেখলাম, তার নিকট এক লোক লোহার আঁকড়া নিয়ে দাঁড়িয়ে রয়েছে। আর সে তার চেহারার একদিকে এসে এটা দ্বারা মুখমন্ডলের একদিক মাথার পিছনের দিক পর্যন্ত এবং অনুরূপভাবে নাসারন্ধ্র,চোখ ও মাথার পিছন দিক পর্যন্ত চিরে ফেলছে। আওফ (রহ.) বলেন, আবূ রাজা (রহ.) কোন কোন সময় ‘ইয়ুশারশিরু’ শব্দের পরিবর্তে ‘ইয়াশুক্কু’ শব্দ বলতেন। এরপর ঐ লোকটি শায়িত লোকটির অপরদিকে যায় এবং প্রথম দিকের সঙ্গে যেমন আচরণ করেছে তেমনি আচরণই অপরদিকের সঙ্গেও করে। ঐ দিক হতে অবসর হতে না হতেই প্রথম দিকটি আগের মত ভাল হয়ে যায়। তারপর আবার প্রথমবারের মত আচরণ করে। তিনি বলেনঃ আমি বললাম, সুবহানাল্লাহ্! এরা কারা? তিনি বলেন, তারা আমাকে বলল, চলুন, চলুন। আমরা চললাম এবং চুলার মত একটি গর্তের কাছে পৌঁছলাম। রাবী বলেন, আমার মনে হয় যেন তিনি বলেছিলেন, আর তথায় শোরগোলের শব্দ ছিল। তিনি বলেন, আমরা তাতে উঁকি মারলাম, দেখলাম তাতে বেশ কিছু উলঙ্গ নারী ও পুরুষ রয়েছে। আর নিচ থেকে বের হওয়া আগুনের লেলিহান শিখা তাদেরকে স্পর্শ করছে। যখনই লেলিহান শিখা তাদেরকে স্পর্শ করে, তখনই তারা উচ্চস্বরে চিৎকার করে উঠে। তিনি বলেন, আমি তাদেরকে বললাম, এরা কারা? তারা আমাকে বলল, চলুন, চলুন। তিনি বলেন, আমরা চললাম এবং একটা নদীর (তীরে) গিয়ে পৌঁছলাম। রাবী বলেন, আমার যতদূর মনে পড়ে তিনি বলেছিলেন, নদীটি ছিল রক্তের মত লাল। আর দেখলাম, এই নদীতে এক ব্যক্তি সাঁতার কাটছে। আর নদীর তীরে অন্য এক লোক আছে এবং সে তার কাছে অনেকগুলো পাথর একত্রিত করে রেখেছে। আর ঐ সাঁতারকারী লোকটি বেশ কিছুক্ষণ সাঁতার কাটার পর সে লোক কাছে এসে পৌঁছে যে নিজের নিকট পাথর একত্রিত করে রেখেছে। সেখানে এসে সে তার মুখ খুলে দেয় আর ঐ লোক তার মুখে একটি পাথর ঢুকিয়ে দেয়। এরপর সে চলে যায়, সাঁতার কাটতে থাকে; আবার তার কাছে ফিরে আসে, যখনইসে তার কাছে ফিরে আসে তখনই সে তার মুখ খুলে দেয়, আর ঐ ব্যক্তি তার মুখে একটা পাথর ঢুকিয়ে দেয়। তিনি বলেন, আমি জিজ্ঞেস করলাম, এরা কারা? তারা বলল, চলুন, চলুন। তিনি বরৈন, আমরা চললাম এবং এমন একজন কুশ্রী লোকের কাছে এসে পৌঁছলাম, যা তোমার দৃষ্টিতে সবচেয়ে কুশ্রী বলে মনে হয়। আর দেখলাম, তার নিকট রয়েছে আগুন, যা সে জ্বালাচ্ছে ও তার চতুর্দিকে দৌড়াচ্ছে। তিনি বলেন, আমি তাদেরকে জিজ্ঞেস করলাম, ঐ লোকটি কে? তারা বলল, চলুন, চলুন। আমরা চললাম এবং একটা সজীব শ্যামল বাগানে হাজির হলাম, যেখানে বসন্তের হরেক রকম ফুলের কলি রয়েছে। আর বাগানের মাঝে আসমানের থেকে অধিক উঁচু দীর্ঘকায় একজন পুরুষ রয়েছে যার মাথা যেন আমি দেখতেই পাচ্ছি না। এমনিভাবে তার চারপাশে এত বিপুল সংখ্যক বালক-বালিকা দেখলাম যে, এত অধিক আর কখনো আমি দেখিনি। আমি তাদেরকে বললাম, উনি কে? এরা কারা? তারা আমাকে বলল, চলুন, চলুন। আমরা চললাম এবং একটা বিরাট বাগানে গিয়ে পৌঁছলাম। এমন বড় এবং সুন্দর বাগান আমি আর কখনো দেখিনি। তিনি বলেন, তারা আমাকে বলল, এর ওপরে চড়ুন। আমরা ওপরে চড়লাম। শেষ পর্যন্ত সোনা-রূপার ইটের তৈরি একটি শহরে গিয়ে আমরা হাজির হলাম। আমরা শহরের দরজায় পৌঁছলাম এবং দরজা খুলতে বললাম। আমাদের জন্য দরজা খুলে দেয়া হল, আমরা তাতে প্রবেশ করলাম। তখন সেখানে আমাদের সঙ্গে এমন কিছু লোক সাক্ষাৎ করল যাদের শরীরের অর্ধেক খুবই সুন্দর, যা তোমার দৃষ্টিতে সবচেয়ে সুন্দর মনে হয়। আর শরীরের অর্ধেক এমনই কুশ্রী ছিল যা তোমার দৃষ্টিতে সবচেয়ে কুশ্রী মনে হয়। তিনি বলেন, সাথীদ্বয় ওদেরকে বলল, যাও ঐ নদীতে গিয়ে নেমে পড়। আর সেটা ছিল প্রশস্ত প্রবাহিত নদী, যার পানি ছিল দুধের মত সাদা। ওরা তাতে গিয়ে নেমে পড়ল। অতঃপর এরা আমাদের কাছে ফিরে এল, দেখা গেল তাদের এ শ্রীহীনতা দূর হয়ে গেছে এবং তারা খুবই সুন্দর আকৃতির হয়ে গেছে। তিনি বলেন, তারা আমাকে বলল, এটা জান্নাতে আদন এবং এটা আপনার বাসস্থান। তিনি বলেন, আমি বেশ উপরের দিকে তাকালাম, দেখলাম ধবধবে সাদা মেঘের মত একটি প্রাসাদ আছে। তিনি বলেন, তারা আমাকে বলল, এটা আপনার বাসগৃহ। তিনি বলেন, আমি তাদেরকে বললাম, আল্লাহ্ তোমাদের মাঝে বরকত দিন! আমাকে ছেড়ে দাও। আমি এতে প্রবেশ করি। তারা বলল, আপনি অবশ্য এতে প্রবেশ করবেন। তবে এখন নয়। তিনি বলেন, আমি এ রাতে অনেক বিস্ময়কর বিষয় দেখতে পেলাম, এগুলোর তাৎপর্য কী? তারা আমাকে বলল, আচ্ছা! আমরা আপনাকে বলে দিচ্ছি। ঐ যে প্রথম ব্যক্তিকে যার কাছে আপনি পৌঁছেছিলেন, যার মাথা পাথর দিয়ে চূর্ণ-বিচূর্ণ করা হচ্ছিল, সে হল ঐ ব্যক্তি যে কুরআন গ্রহণ করে তা ছেড়ে দিয়েছে। আর ফরজ সালাত ছেড়ে ঘুমিয়ে থাকে। আর ঐ ব্যক্তি যার কাছে গিয়ে দেখেছেন যে, তার মুখের এক ভাগ মাথার পিছন দিক পর্যন্ত, এমনিভাবে নাসারন্ধ্র ও চোখ মাথার পিছন দিক পর্যন্ত চিরে ফেলা হচ্ছিল সে হল ঐ ব্যক্তি, যে সকালে নিজ ঘর থেকে বের হয়ে এমন কোন মিথ্যা বলে যা চারদিকে ছড়িয়ে পড়ে। আর এ সকল উলঙ্গ নারী-পুরুষ যারা চুলা সদৃশ গর্তের ভিতর আছে তারা হল ব্যভিচারী ও ব্যভিচারিণীর দল। আর ঐ ব্যক্তি, যার কাছে পৌঁছে দেখেছিলেন যে, সে নদীতে সাঁতার কাটছে ও তার মুখে পাথর ঢুকিয়ে দেয়া হচ্ছে সে হল সুদখোর। আর ঐ কুশ্রী ব্যক্তি, যে আগুনের কাছে ছিল এবং আগুন জ্বালাচ্ছিল আর সে এর চারপাশে দৌড়াচ্ছিল, সে হল জাহান্নামের দারোগা, মালিক ফেরেশ্তা। আর এ দীর্ঘকায় ব্যক্তি যিনি বাগানে ছিলেন, তিনি হলেন, ইবরাহীম (আঃ)। আর তাঁর আশেপাশের বালক-বালিকারা হলো ঐসব শিশু, যারা ফিত্রাতের (স্বভাবধর্মের) ওপর মৃত্যুবরণ করেছে। তিনি বলেন, তখন কিছু সংখ্যক মুসলিম জিজ্ঞেস করলেন, হে আল্লাহর রাসূল! মুশরিকদের শিশু সন্তানরাও কি? তখন রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন ঃ মুশরিকদের শিশু সন্তানরাও। আর ঐসব লোক যাদের অর্ধাংশ অতি সুন্দর ও অর্ধাংশ অতি কুশ্রী তারা হল ঐ সম্প্রদায় যারা সৎ-অসৎ উভয় কাজ মিশ্রিতভাবে করেছে। আল্লাহ্ তাদেরকে ক্ষমা করে দিয়েছেন। [৮৪৫; মুসলিম ৪২/৪, হাঃ ২২৭৫, আহমাদ ২০১১৫] (আধুনিক প্রকাশনী- ৬৫৫৮, ইসলামিক ফাউন্ডেশন)","e":"Narrated Samura bin Jundub:Allah's Messenger (ﷺ) very often used to ask his companions, \"Did anyone of you see a dream?\" So dreams would be narrated to him by those whom Allah wished to tell. One morning the Prophet (ﷺ) said, \"Last night two persons came to me (in a dream) and woke me up and said to me, 'Proceed!' I set out with them and we came across a man lying down, and behold, another man was standing over his head, holding a big rock. Behold, he was throwing the rock at the man's head, injuring it. The rock rolled away and the thrower followed it and took it back. By the time he reached the man, his head returned to the normal state. The thrower then did the same as he had done before. I said to my two companions, 'Subhan Allah! Who are these two persons?' They said, 'Proceed!' So we proceeded and came to a man lying flat on his back and another man standing over his head with an iron hook, and behold, he would put the hook in one side of the man's mouth and tear off that side of his face to the back (of the neck) and similarly tear his nose from front to back and his eye from front to back. Then he turned to the other side of the man's face and did just as he had done with the other side. He hardly completed this side when the other side returned to its normal state. Then he returned to it to repeat what he had done before. I said to my two companions, 'Subhan Allah! Who are these two persons?' They said to me, 'Proceed!' So we proceeded and came across something like a Tannur (a kind of baking oven, a pit usually clay-lined for baking bread).\" I think the Prophet (ﷺ) said, \"In that oven there was much noise and voices.\" The Prophet (ﷺ) added, \"We looked into it and found naked men and women, and behold, a flame of fire was reaching to them from underneath, and when it reached them, they cried loudly. I asked them, 'Who are these?' They said to me, 'Proceed!' And so we proceeded and came across a river.\" I think he said, \".... red like blood.\" The Prophet (ﷺ) added, \"And behold, in the river there was a man swimming, and on the bank there was a man who had collected many stones. Behold, while the other man was swimming, he went near him. The former opened his mouth and the latter (on the bank) threw a stone into his mouth whereupon he went swimming again. He returned and every time the performance was repeated. I asked my two companions, 'Who are these (two) persons?' They replied, 'Proceed! Proceed!' And we proceeded till we came to a man with a repulsive appearance, the most repulsive appearance, you ever saw a man having! Beside him there was a fire and he was kindling it and running around it. I asked my companions, 'Who is this (man)?' They said to me, 'Proceed! Proceed!' So we proceeded till we reached a garden of deep green dense vegetation, having all sorts of spring colors. In the midst of the garden there was a very tall man and I could hardly see his head because of his great height, and around him there were children in such a large number as I have never seen. I said to my companions, 'Who is this?' They replied, 'Proceed! Proceed!' So we proceeded till we came to a majestic huge garden, greater and better than I have ever seen! My two companions said to me, 'Go up' and I went up. The Prophet (ﷺ) added, \"So we ascended till we reached a city built of gold and silver bricks and we went to its gate and asked (the gatekeeper) to open the gate, and it was opened and we entered the city and found in it, men with one side of their bodies as handsome as the handsomest person you have ever seen, and the other side as ugly as the ugliest person you have ever seen. My two companions ordered those men to throw themselves into the river. Behold, there was a river flowing across (the city), and its water was like milk in whiteness. Those men went and threw themselves in it and then returned to us after the ugliness (of their bodies) had disappeared and they became in the best shape.\" The Prophet (ﷺ) further added, \"My two companions (angels) said to me, 'This place is the Eden Paradise, and that is your place.' I raised up my sight, and behold, there I saw a palace like a white cloud! My two companions said to me, 'That (palace) is your place.' I said to them, 'May Allah bless you both! Let me enter it.' They replied, 'As for now, you will not enter it, but you shall enter it (one day). I said to them, 'I have seen many wonders tonight. What does all that mean which I have seen?' They replied, 'We will inform you: As for the first man you came upon whose head was being injured with the rock, he is the symbol of the one who studies the Qur'an and then neither recites it nor acts on its orders, and sleeps, neglecting the enjoined prayers. As for the man you came upon whose sides of mouth, nostrils and eyes were torn off from front to back, he is the symbol of the man who goes out of his house in the morning and tells so many lies that it spreads all over the world. And those naked men and women whom you saw in a construction resembling an oven, they are the adulterers and the adulteresses. And the man whom you saw swimming in the river and given a stone to swallow, is the eater of usury (Riba). And the bad looking man whom you saw near the fire kindling it and going round it, is Malik, the gatekeeper of Hell. And the tall man whom you saw in the garden, is Abraham and the children around him are those children who die with Al-Fitra (the Islamic Faith). The narrator added: Some Muslims asked the Prophet, \"O Allah's Messenger (ﷺ)! What about the children of pagans?\" The Prophet (ﷺ) replied, \"And also the children of pagans.\" The Prophet (ﷺ) added, \"My two companions added, 'The men you saw half handsome and half ugly were those persons who had mixed an act that was good with another that was bad, but Allah forgave them"}]},{"id":"m","name":"সহীহ মুসলিম","short":"মুসলিম","sub":"কিতাব ৪২ · কিতাবুর রুইয়া","items":[{"n":"5897","k":"2261.01","a":"حَدَّثَنَا عَمْرٌو النَّاقِدُ، وَإِسْحَاقُ بْنُ إِبْرَاهِيمَ، وَابْنُ أَبِي عُمَرَ، جَمِيعًا عَنِ ابْنِ عُيَيْنَةَ، - وَاللَّفْظُ لاِبْنِ أَبِي عُمَرَ - حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ أَبِي سَلَمَةَ، قَالَ كُنْتُ أَرَى الرُّؤْيَا أُعْرَى مِنْهَا غَيْرَ أَنِّي لاَ أُزَمَّلُ حَتَّى لَقِيتُ أَبَا قَتَادَةَ فَذَكَرْتُ ذَلِكَ لَهُ فَقَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ الرُّؤْيَا مِنَ اللَّهِ وَالْحُلْمُ مِنَ الشَّيْطَانِ فَإِذَا حَلَمَ أَحَدُكُمْ حُلْمًا يَكْرَهُهُ فَلْيَنْفُثْ عَنْ يَسَارِهِ ثَلاَثًا وَلْيَتَعَوَّذْ بِاللَّهِ مِنْ شَرِّهَا فَإِنَّهَا لَنْ تَضُرَّهُ ‏\"‏ ‏.‏","b":"আমর আন নাকিদ (রহঃ), ইসহাক ইবনু ইব্রাহীম (রহঃ) ও ইবনু আবূ উমার (রহঃ) .... আবূ সালামাহ্ (রহঃ) হতে বর্ণিত। তিনি বলেন, আমি এমন স্বপ্ন দেখতাম যাতে ভয় পেয়ে জ্বর জ্বর ভাব অনুভব করতাম। তবে আমাকে কম্বল দিয়ে ঢাকতে হতো না। অবশেষে আমি আবূ কাতাদাহ্ (রাযিঃ) এর সঙ্গে দেখা করলাম এবং এ বিষয়টি তার নিকট বর্ণনা করলাম। তিনি বললেন, আমি রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কে বলতে শুনেছি الرُّؤْيَا সু-স্বপ্ন আল্লাহর তরফ হতে, আর الْحُلْمُ খারাপ স্বপ্ন শাইতানের তরফ হতে। অতএব তোমাদের কেউ যখন এমন স্বপ্ন দেখে, যা সে পছন্দ করে না, তখন যেন সে তার বাম পাশে তিনবার থু থু ফেলে এবং এর অনিষ্ট থেকে আল্লাহর কাছে আশ্রয় প্রার্থনা করে (অর্থাৎ- আউয়ুবিল্লাহ্ পড়ে), তাহলে সেটি তার ক্ষতি করবে না। (ইসলামিক ফাউন্ডেশন ৫৭০০, ইসলামিক সেন্টার)","e":"Abu Salama reported:I used to see dreams (and was so much perturbed) that I began to quiver and have temperature, but did not cover myself with a mantle. I met Abu Qatada and made a mention of that to him. He said: I heard Allah's Messenger (ﷺ) as saying: A good vision comes from Allah and a (bad) dream (hulm) from devil. So when one of you sees a bad dream (hulm) which he does not like, he should spit on his left side thrice and seek refuge with Allah from its evil; then it will not harm him"},{"n":"5898","k":"2261.02","a":"وَحَدَّثَنَا ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ، عَنْ مُحَمَّدِ بْنِ عَبْدِ الرَّحْمَنِ، مَوْلَى آلِ طَلْحَةَ وَعَبْدِ رَبِّهِ وَيَحْيَى ابْنَىْ سَعِيدٍ وَمُحَمَّدِ بْنِ عَمْرِو بْنِ عَلْقَمَةَ عَنْ أَبِي سَلَمَةَ عَنْ أَبِي قَتَادَةَ عَنِ النَّبِيِّ صلى الله عليه وسلم ‏.‏ مِثْلَهُ وَلَمْ يَذْكُرْ فِي حَدِيثِهِمْ قَوْلَ أَبِي سَلَمَةَ كُنْتُ أَرَى الرُّؤْيَا أُعْرَى مِنْهَا غَيْرَ أَنِّي لاَ أُزَمَّلُ ‏.‏","b":"ইবনু আবূ উমর (রহঃ) ..... আবূ কাতাদাহ্ (রাযিঃ) এর সানাদে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে হুবহু হাদীস বর্ণনা করেছেন। তবে এরা এদের বর্ণিত হাদীসে (পূর্বোল্লিখিত হাদীসের) বর্ণনাকারী আবূ সালামাহ (রহঃ) এর কথা— আমি স্বপ্ন দেখে ভয় পাওয়ার দরুন জ্বর জ্বর ভাব দেখা দিতো, কিন্তু আমাকে কম্বল দিয়ে ঢাকতে হতো না কথাটি বর্ণনা করেননি। (ইসলামিক ফাউন্ডেশন ৫৭০১, ইসলামিক সেন্টার)","e":"This hadith has been narrated on the authority of Abu Qatada, but there is no mention of the words of Abu Salama:\"I saw dreams (which perturbed me) but I did not cover myself with a mantle"},{"n":"5899","k":"2261.03","a":"وَحَدَّثَنِي حَرْمَلَةُ بْنُ يَحْيَى، أَخْبَرَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي يُونُسُ، ح وَحَدَّثَنَا إِسْحَاقُ، بْنُ إِبْرَاهِيمَ وَعَبْدُ بْنُ حُمَيْدٍ قَالاَ أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، كِلاَهُمَا عَنِ الزُّهْرِيِّ، بِهَذَا الإِسْنَادِ ‏.‏ وَلَيْسَ فِي حَدِيثِهِمَا أُعْرَى مِنْهَا ‏.‏ وَزَادَ فِي حَدِيثِ يُونُسَ ‏ \"‏ فَلْيَبْصُقْ عَلَى يَسَارِهِ حِينَ يَهُبُّ مِنْ نَوْمِهِ ثَلاَثَ مَرَّاتٍ ‏\"‏ ‏.‏","b":"হারামালাহ্ ইবনু ইয়াহইয়া, ইসহাক ইবনু ইবরাহীম ও আব্‌দ ইবনু হুমায়দ (রহঃ) ..... যুহরী (রহঃ) হতে উপরোল্লিখিত সূত্রে হাদীস বর্ণনা করেছেন। কিন্তু তাদের উভয়ের বর্ণিত হাদীসে– ভয় পেয়ে জ্বরাক্রান্ত হয়ে পড়তাম' উক্তিটি নেই। আর (প্রথম সূত্রে) বর্ণনাকার ইউনুস (রহঃ) বর্ধিত করে বলেছেন, যখন সে ঘুম হতে জেগে উঠবে তখন সে যেন তিনবার তার বাম পাশে থুথু ফেলে। (ইসলামিক ফাউন্ডেশন ৫৭০২, ইসলামিক সেন্টার)","e":"This hadith has been reported on the authority of Zuhri with the same chain of transmitters, but it does not contain the words:\"I felt disturbed because of that,\" and there is an addition of these words in the hadith transmitted on the authority of Yunus: \"Then spit thrice on the left side when you get up from sleep"},{"n":"5900","k":"2261.04","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ بْنِ قَعْنَبٍ، حَدَّثَنَا سُلَيْمَانُ، - يَعْنِي ابْنَ بِلاَلٍ - عَنْ يَحْيَى بْنِ سَعِيدٍ، قَالَ سَمِعْتُ أَبَا سَلَمَةَ بْنَ عَبْدِ الرَّحْمَنِ، يَقُولُ سَمِعْتُ أَبَا قَتَادَةَ، يَقُولُ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ الرُّؤْيَا مِنَ اللَّهِ وَالْحُلْمُ مِنَ الشَّيْطَانِ فَإِذَا رَأَى أَحَدُكُمْ شَيْئًا يَكْرَهُهُ فَلْيَنْفِثْ عَنْ يَسَارِهِ ثَلاَثَ مَرَّاتٍ وَلْيَتَعَوَّذْ بِاللَّهِ مِنْ شَرِّهَا فَإِنَّهَا لَنْ تَضُرَّهُ ‏\"‏ ‏.‏ فَقَالَ إِنْ كُنْتُ لأَرَى الرُّؤْيَا أَثْقَلَ عَلَىَّ مِنْ جَبَلٍ فَمَا هُوَ إِلاَّ أَنْ سَمِعْتُ بِهَذَا الْحَدِيثِ فَمَا أُبَالِيهَا ‏.‏","b":"আবদুল্লাহ ইবনু মসলামাহ্ ইবনু কা'নাব (রহঃ) .... আবূ কাতাদাহ (রাযিঃ) হতে বর্ণিত। তিনি বলেন, আমি রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি যে, الرُّؤْيَا সু-স্বপ্ন আল্লাহর তরফ হতে, আর الْحُلْمُ দুঃস্বপ্ন শাইতানের তরফ থেকে। অতএব তোমাদের কেউ যখন এমন কোন ব্যাপারে স্বপ্নে দেখে, যা সে পছন্দ করে না, তখন সে যেন তার বাম পাশে তিন বার থুথু ফেলে এবং (আউযুবিল্লাহ্ বা সূরা আল ফালাক ও সূরা আন নাস পড়ে) স্বপ্লের অনিষ্ট হতে আশ্রয় চায়। কারণ (এভাবে করলে) তা তার কোন খারাবী করতে পারবে না। রাবী বলেন, আমি এমন স্বপ্নও দেখতাম যা আমার জন্য পাহাড়ের চাইতেও কঠিন (ও ভয়াবহ) কিন্তু এখন অবস্থা এই যে, এ হাদীস যখন আমি শুনে ফেলেছি, এখন আর সে সবের পরোয়া করি না। (ইসলামিক ফাউন্ডেশন ৫৭০৩, ইসলামিক সেন্টার)","e":"Abu Qatada reported Allah's Messenger (ﷺ) as saying:A good vision is from Allah and a bad dream (hulm) is from the satan; so if one of you sees anything (in a dream) which he dislikes, he should spit on his left side thrice and seek refuge with Allah from its evil, and then it will never harm him. Abu Salama said: I used to see dreams weighing more heavily upon me than a mountain; but since I heard this hadith I don't care for it (its burden)"},{"n":"5901","k":"2261.05","a":"وَحَدَّثَنَاهُ قُتَيْبَةُ، وَمُحَمَّدُ بْنُ رُمْحٍ، عَنِ اللَّيْثِ بْنِ سَعْدٍ، ح وَحَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا عَبْدُ الْوَهَّابِ يَعْنِي الثَّقَفِيَّ، ح وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ نُمَيْرٍ، كُلُّهُمْ عَنْ يَحْيَى بْنِ سَعِيدٍ، بِهَذَا الإِسْنَادِ وَفِي حَدِيثِ الثَّقَفِيِّ قَالَ أَبُو سَلَمَةَ فَإِنْ كُنْتُ لأَرَى الرُّؤْيَا ‏.‏ وَلَيْسَ فِي حَدِيثِ اللَّيْثِ وَابْنِ نُمَيْرٍ قَوْلُ أَبِي سَلَمَةَ إِلَى آخِرِ الْحَدِيثِ ‏.‏ وَزَادَ ابْنُ رُمْحٍ فِي رِوَايَةِ هَذَا الْحَدِيثِ ‏ \"‏ وَلْيَتَحَوَّلْ عَنْ جَنْبِهِ الَّذِي كَانَ عَلَيْهِ ‏\"‏ ‏.‏","b":"কুতাইবাহ, মুহাম্মাদ ইবনু রুমূহ, মুহাম্মাদ ইবনুল মুসান্না ও আবূ বাকর ইবনু আবূ শাইবাহ (রহঃ) ..... ইয়াহইয়া ইবনু সাঈদ (রাযিঃ) হতে উপরোল্লিখিত সূত্রে হাদীস বর্ণনা করেছেন। কিন্তু বর্ণনাকারী আসূ-সাকাফী (রাযিঃ) কর্তৃক বর্ণিত হাদীসে আছে, (আমার উস্তায) বর্ণনাকারী আবূ সালামাহ্ (রাযিঃ) বলেছেন, আমি এমন স্বপ্নও দেখতাম যা.....। আর বর্ণনাকারী আল-লায়স ও ইবনু নুমায়র (রাযিঃ) সূত্রে বর্ণিত হাদীসে আবূ সালামাহ্ (রাযিঃ) এর কথা হতে হাদীসের শেষাংশ নেই এবং বর্ণনাকারী ইবনু রুমূহ এ হাদীসের রিওয়ায়াতে বর্ধিত বলেছেন যে, আর সে (স্বপ্নদ্রষ্টা) লোক যে পাশে ঘুমাচ্ছিল সে পাশ পরিবর্তন করে অন্যপাশে ঘুমাবে। (ইসলামিক ফাউন্ডেশন ৫৭০৪, ইসলামিক সেন্টার)","e":"Abu Salama reported:I used to see dreams, but the hadith transmitted on the authority of Laith b. Nu`man, the words of Abu Salama at the concluding part of the hadith are not mentioned. Ibn Rumh has reported in the hadith: \"He (one who sleeps) should change the side on which he had been lying before"},{"n":"5902","k":"2261.06","a":"وَحَدَّثَنِي أَبُو الطَّاهِرِ، أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ وَهْبٍ، أَخْبَرَنِي عَمْرُو بْنُ الْحَارِثِ، عَنْ عَبْدِ رَبِّهِ بْنِ سَعِيدٍ، عَنْ أَبِي سَلَمَةَ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِي قَتَادَةَ، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم أَنَّهُ قَالَ ‏ \"‏ الرُّؤْيَا الصَّالِحَةُ مِنَ اللَّهِ وَالرُّؤْيَا السَّوْءُ مِنَ الشَّيْطَانِ فَمَنْ رَأَى رُؤْيَا فَكَرِهَ مِنْهَا شَيْئًا فَلْيَنْفِثْ عَنْ يَسَارِهِ وَلْيَتَعَوَّذْ بِاللَّهِ مِنَ الشَّيْطَانِ لاَ تَضُرُّهُ وَلاَ يُخْبِرْ بِهَا أَحَدًا فَإِنْ رَأَى رُؤْيَا حَسَنَةً فَلْيُبْشِرْ وَلاَ يُخْبِرْ إِلاَّ مَنْ يُحِبُّ ‏\"‏ ‏.‏","b":"আবূ তাহির (রহঃ) ..... আবূ কাতাদাহ (রাযিঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত যে, তিনি বলেছেন, ভাল স্বপ্ন আল্লাহর তরফ থেকে আর মন্দ স্বপ্ন শাইতানের তরফ থেকে। সুতরাং যে ব্যক্তি কোন স্বপ্ন দেখল আর এতে কোন কিছু পছন্দ হলো না, তখন সে যেন তার বাম পাশে খু থু ফেলে এবং শাইতান (এর অনিষ্ট) হতে আল্লাহর আশ্রয় প্রার্থনা করে, (তাহলে) তা তাকে কোন সমস্যায় ফেলবে না। আর কারো কাছে ঐ স্বপ্নের কথা বর্ণনা করবে না। আর যদি কোন ভাল স্বপ্ন দেখে তাহলে সু-সংবাদ গ্রহণ করবে। আর যাকে সে মুহাব্বাত করে এমন ব্যক্তি ব্যতীত কারো নিকট তা বর্ণনা করবে না। (ইসলামিক ফাউন্ডেশন ৫৭০৫, ইসলামিক সেন্টার)","e":"Abu Qatada reported Allah's Messenger (ﷺ) as saying:The good vision are from Allah and the evil dreams are from the satan. If one sees a dream which one does not like, one should spit on one's left side and seek the refuge of Allah from the satan; it will not do one any harm, and one should not disclose it to anyone and if one sees a good vision one should feel pleased but should not disclose it to anyone but whom one loves"},{"n":"5903","k":"2261.07","a":"حَدَّثَنَا أَبُو بَكْرِ بْنُ خَلاَّدٍ الْبَاهِلِيُّ، وَأَحْمَدُ بْنُ عَبْدِ اللَّهِ بْنِ الْحَكَمِ، قَالاَ حَدَّثَنَا مُحَمَّدُ، بْنُ جَعْفَرٍ حَدَّثَنَا شُعْبَةُ، عَنْ عَبْدِ رَبِّهِ بْنِ سَعِيدٍ، عَنْ أَبِي سَلَمَةَ، قَالَ إِنْ كُنْتُ لأَرَى الرُّؤْيَا تُمْرِضُنِي - قَالَ - فَلَقِيتُ أَبَا قَتَادَةَ فَقَالَ وَأَنَا كُنْتُ لأَرَى الرُّؤْيَا فَتُمْرِضُنِي حَتَّى سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ الرُّؤْيَا الصَّالِحَةُ مِنَ اللَّهِ فَإِذَا رَأَى أَحَدُكُمْ مَا يُحِبُّ فَلاَ يُحَدِّثُ بِهَا إِلاَّ مَنْ يُحِبُّ وَإِنْ رَأَى مَا يَكْرَهُ فَلْيَتْفِلْ عَنْ يَسَارِهِ ثَلاَثًا وَلْيَتَعَوَّذْ بِاللَّهِ مِنْ شَرِّ الشَّيْطَانِ وَشَرِّهَا وَلاَ يُحَدِّثْ بِهَا أَحَدًا فَإِنَّهَا لَنْ تَضُرَّهُ ‏\"‏ ‏.‏","b":"(…) আবূ বকর ইবনু খাল্লাদ বাহিলী ও আহমাদ ইবনু আবদুল্লাহ ইবনু হাকম (রহঃ) ..... আবূ সালামাহ্ (রহঃ) হতে বর্ণিত। তিনি বলেন, আমি এমন স্বপ্ন দেখতাম, যা আমাকে রোগগ্রস্ত করে দিত। তিনি বলেন, পরে আমি আবূ কাতাদাহ (রাযিঃ) এর সঙ্গে দেখা করলাম (এবং আমার সমস্যার ব্যাপারটি তাকে বললাম)। তখন তিনি বললেন, আমিও এমন স্বপ্ন দেখতাম, যা আমাকে অসুস্থ করে দিত। অবশেষে আমি রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনলাম, ভাল স্বপ্ন আল্লাহর তরফ থেকে। অতএব তোমাদের কেউ যখন এমন (স্বপ্ন) দেখে যা সে পছন্দ করে তাহলে তা তার ঘনিষ্ঠ লোক ব্যতীত অন্য কারো নিকট যেন প্রকাশ না করে। আর যখন এমন (স্বপ্ন) দেখে, যা সে অপছন্দ করে তাহলে সে যেন তার বামপাশে তিন (বার) থুথু নিক্ষেপ করে এবং শাইতানের অনিষ্ট ও স্বপ্লের অমঙ্গল থেকে আল্লাহর নিকট আশ্রয় প্রার্থনা করে ও কাউকে তা না বলে। কারণ (এভাবে করলে) সে স্বপ্ন তার কোন অকল্যাণ হবে না। (ইসলামিক ফাউন্ডেশন ৫৭০৬, ইসলামিক সেন্টার)","e":"Abu Salama reported:I used to see (such horrible dreams) that I fell ill. I saw Abu Qatada who also said: I used to see dreams which made me sick until I heard Allah's Messenger (ﷺ) as saying: Good dreams are from Allah, so if any one of you sees which he likes he should not disclose it to one but whom he loves, but if he sees something which he does not like he should spit on his left side thrice and seek refuge with Allah from the mischief of the Satan and its mischief (i.e. of the dream), and he should not relate it to anyone, then it would not harm him"},{"n":"5904","k":"2262","a":"حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا لَيْثٌ، ح وَحَدَّثَنَا ابْنُ رُمْحٍ، أَخْبَرَنَا اللَّيْثُ، عَنْ أَبِي، الزُّبَيْرِ عَنْ جَابِرٍ، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم أَنَّهُ قَالَ ‏ \"‏ إِذَا رَأَى أَحَدُكُمُ الرُّؤْيَا يَكْرَهُهَا فَلْيَبْصُقْ عَنْ يَسَارِهِ ثَلاَثًا وَلْيَسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ ثَلاَثًا وَلْيَتَحَوَّلْ عَنْ جَنْبِهِ الَّذِي كَانَ عَلَيْهِ ‏\"‏ ‏.‏","b":"কুতাইবাহ ইবনু সাঈদ ও ইবনু রুমূহ (রহঃ) ..... জাবির (রাযিঃ) এর সানাদে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি বলেন, তোমাদের কেউ যখন এমন স্বপ্ন দেখে, যা সে পছন্দ করে না তখন সে যেন তার বামপাশে তিনবার খু থু ফেলে এবং শাইতান (এর খারাবী) থেকে আল্লাহর নিকট তিনবার আশ্রয় প্রার্থনা করে। আর যে পাশে ঘুমন্ত ছিল তা হতে যেন বিপরীত পাশে ঘুমায়। (ইসলামিক ফাউন্ডেশন ৫৭০৭, ইসলামিক সেন্টার)","e":"Jabir reported Allah's Messenger (ﷺ) as saying:If anyone sees a dream which he does not like, he should spit on his left side three times, and seek refuge with Allah from the Satan three times, and let him turn over from the side on which he was sleeping"},{"n":"5905","k":"2263.01","a":"حَدَّثَنَا مُحَمَّدُ بْنُ أَبِي عُمَرَ الْمَكِّيُّ، حَدَّثَنَا عَبْدُ الْوَهَّابِ الثَّقَفِيُّ، عَنْ أَيُّوبَ السَّخْتِيَانِيِّ، عَنْ مُحَمَّدِ بْنِ سِيرِينَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏\"‏ إِذَا اقْتَرَبَ الزَّمَانُ لَمْ تَكَدْ رُؤْيَا الْمُسْلِمِ تَكْذِبُ وَأَصْدَقُكُمْ رُؤْيَا أَصْدَقُكُمْ حَدِيثًا وَرُؤْيَا الْمُسْلِمِ جُزْءٌ مِنْ خَمْسٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ وَالرُّؤْيَا ثَلاَثَةٌ فَرُؤْيَا الصَّالِحَةِ بُشْرَى مِنَ اللَّهِ وَرُؤْيَا تَحْزِينٌ مِنَ الشَّيْطَانِ وَرُؤْيَا مِمَّا يُحَدِّثُ الْمَرْءُ نَفْسَهُ فَإِنْ رَأَى أَحَدُكُمْ مَا يَكْرَهُ فَلْيَقُمْ فَلْيُصَلِّ وَلاَ يُحَدِّثْ بِهَا النَّاسَ ‏\"‏ ‏.‏ قَالَ ‏\"‏ وَأُحِبُّ الْقَيْدَ وَأَكْرَهُ الْغُلَّ وَالْقَيْدُ ثَبَاتٌ فِي الدِّينِ ‏\"‏ ‏.‏ فَلاَ أَدْرِي هُوَ فِي الْحَدِيثِ أَمْ قَالَهُ ابْنُ سِيرِينَ ‏.‏","b":"মুহাম্মাদ ইবনু আবূ উমার আল-মাক্কী (রহঃ) ..... আবূ হুরাইরাহ (রাযিঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি বলেন, যখন যুগ ও সময় (কিয়ামতের) সন্নিকটে হয়ে আসবে তখন প্রায়শ (খাঁটি) মুসলিমের স্বপ্ন মিথ্যা ও ভ্রান্ত হবে না। তোমাদের (মাঝে) অধিক সত্যভাষী লোক সর্বাধিক সত্য (ও বাস্তব) স্বপ্নদ্রষ্টা হবে। আর মুসলিমের স্বপ্ন নুবুওয়াতের পয়তাল্লিশ ভাগের এক ভাগ। আর স্বপ্ন তিন (প্রকার)- ভাল স্বপ্ন আল্লাহর তরফ হতে সুসংবাদ (বাহক)। আর (এক ধরনের) স্বপ্ন শাইতানের পক্ষ হতে দুর্ভাবনা তৈরি করে। আর (এক ধরনের) স্বপ্ন যা মানুষ তার মনের সাথে কথা বলে (এবং ভাবনা-চিন্তা করে) তা থেকে (উদ্ভূত)। অতএব তোমাদের কেউ যদি এমন কিছু (স্বপ্ন) দর্শন করে- যা সে পছন্দ করে না, তাহলে সে যেন (ঘুম থেকে) উঠে দাঁড়ায় এবং সালাত (সালাত/নামাজ/নামায) আদায় করে আর মানুষের নিকট সে (স্বপ্নের) কথা গোপন রাখে। তিনি (আরও) বলেছেন যে, আমি (স্বপ্লে) হাত কড়া (দেখা) পছন্দ করি এবং গলায় বেড়ী (দেখা) পছন্দ করি না। কারণ, হাত কড়া দীন-ধর্মে অবিচলতা ('র পরিচায়ক)। বর্ণনাকারী বলেন, তবে আমি জানি না যে, তা (রিওয়ায়াতের এ শেষাংশটি) মূল হাদীসের অংশ (নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর বাণী) নাকি তা [জাবির (রাযিঃ) থেকে রিওয়ায়াতকারী] ইবনু সীরীন (রহঃ) বলেছেন। (ইসলামিক ফাউন্ডেশন ৫৭০৮, ইসলামিক সেন্টার)","e":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:When the time draws near (when the Resurrection is near) a believer's dream can hardly be false. And the truest vision will be of one who is himself the most truthful in speech, for the vision of a Muslim is the forty-fifth part of Prophecy, and dreams are of three types: one good dream which is a sort of good tidings from Allah; the evil dream which causes pain is from the satan; and the third one is a suggestion of one's own mind; so if any one of you sees a dream which he does not like he should stand up and offer prayer and he should not relate it to people, and he said: I would love to see fetters (in the dream), but I dislike wearing of necklace, for the fetters is (an indication of) one's steadfastness in religion. The narrator said: I do not know whether this is a part of the hadith or the words of Ibn Sirin"},{"n":"5906","k":"2263.02","a":"وَحَدَّثَنِي مُحَمَّدُ بْنُ رَافِعٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنْ أَيُّوبَ، بِهَذَا الإِسْنَادِ وَقَالَ فِي الْحَدِيثِ قَالَ أَبُو هُرَيْرَةَ فَيُعْجِبُنِي الْقَيْدُ وَأَكْرَهُ الْغُلَّ وَالْقَيْدُ ثَبَاتٌ فِي الدِّينِ ‏.‏ وَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ رُؤْيَا الْمُؤْمِنِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏ ‏.‏","b":"মুহাম্মাদ ইবনু রাফি (রহঃ) ..... আইয়্যুব (রহঃ) হতে উপরোল্লিখিত সূত্রে হাদীস বর্ণনা করেছেন। আর তিনি (তার বর্ণিত) হাদীসে বলেছেন, আবূ হুরাইরাহ্ (রাযিঃ) বলেন, হাত কড়া (দেখা) আমাকে বিমোহিত করে এবং গলায় বেড়ী (দেখা) আমি পছন্দ করি না। (কেননা) হাতকড়া হলো দীন ধর্মে অটল থাকার পরিচায়ক। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম আরো বলেছেন, (খাটি) ঈমানদারের স্বপ্ন নুবুওয়াতের (চল্লিশ অংশের) একটি অংশ। (ইসলামিক ফাউন্ডেশন ৫৭০৯, ইসলামিক সেন্টার)","e":"Abu Huraira reported:I love to see fetters but I hate necklace (in a dream), for fetters signifies one's steadfastness in religion, and he also reported Allah's Messenger (ﷺ) as saying: The vision of a believer is forty-sixth part of Prophecy"},{"n":"5907","k":"2263.03","a":"حَدَّثَنِي أَبُو الرَّبِيعِ، حَدَّثَنَا حَمَّادٌ، - يَعْنِي ابْنَ زَيْدٍ - حَدَّثَنَا أَيُّوبُ، وَهِشَامٌ، عَنْ مُحَمَّدٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ إِذَا اقْتَرَبَ الزَّمَانُ ‏.‏ وَسَاقَ الْحَدِيثَ وَلَمْ يَذْكُرْ فِيهِ النَّبِيَّ صلى الله عليه وسلم ‏.‏","b":"(…/...) আবূ রাবী’ (রহঃ) ..... আবূ হুরাইরাহ (রাযিঃ) হতে বর্ণিত। তিনি বলেন, যখন যুগ বা সময় কিয়ামতের সন্নিকটে এসে যাবে ..... বর্ণনাকারী (এভাবেই) হাদীসটি রিওয়ায়াত করেছেন এবং তিনি তাতে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর নামোল্লেখ করেননি। (ইসলামিক ফাউন্ডেশন ৫৭১০, ইসলামিক সেন্টার)","e":"This hadith has been transmitted on the authority of Abu Huraira and the words are:\"When the time draws near,\" the rest of the hadith is the same"},{"n":"5908","k":"2263.04","a":"وَحَدَّثَنَاهُ إِسْحَاقُ بْنُ إِبْرَاهِيمَ، أَخْبَرَنَا مُعَاذُ بْنُ هِشَامٍ، حَدَّثَنَا أَبِي، عَنْ قَتَادَةَ، عَنْ مُحَمَّدِ بْنِ سِيرِينَ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم ‏.‏ وَأَدْرَجَ فِي الْحَدِيثِ قَوْلَهُ وَأَكْرَهُ الْغُلَّ ‏.‏ إِلَى تَمَامِ الْكَلاَمِ وَلَمْ يَذْكُرِ ‏ \"‏ الرُّؤْيَا جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏ ‏.‏","b":"ইসহাক ইবনু ইবরাহীম (রহঃ) ..... আবূ হুরাইরাহ (রাযিঃ) এর সানাদে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি তার বর্ণনায় আর আমি গলায় বেড়ী দেখা পছন্দ করি না ..... পর্যন্ত অংশ সংযোজন করেছেন। আর স্বপ্ন নুবুওয়াতের ছিচল্লিশ ভাগের এক ভাগ- উক্তিটি তিনি বর্ণনা করেননি। (ইসলামিক ফাউন্ডেশন ৫৭১১, ইসলামিক সেন্টার)","e":"Muhammad b. Sirin reported from Abu Huraira a hadith from Allah's Apostle (ﷺ) and he mentioned in his hadith his words:\"I dislike shackles,\" up to the end of his statement, but he made no mention of this: \"A vision is a forty-sixth part of Prophecy"},{"n":"5909","k":"2264.01","a":"حَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، وَابْنُ، بَشَّارٍ قَالاَ حَدَّثَنَا مُحَمَّدُ بْنُ جَعْفَرٍ، وَأَبُو دَاوُدَ ح وَحَدَّثَنِي زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا عَبْدُ الرَّحْمَنِ بْنُ مَهْدِيٍّ، كُلُّهُمْ عَنْ شُعْبَةَ، ح وَحَدَّثَنَا عُبَيْدُ، اللَّهِ بْنُ مُعَاذٍ - وَاللَّفْظُ لَهُ - حَدَّثَنَا أَبِي، حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، عَنْ عُبَادَةَ بْنِ الصَّامِتِ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ رُؤْيَا الْمُؤْمِنِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏ ‏.‏","b":"মুহাম্মাদ ইবনুল মুসান্না, ইবনু বাশশার, যুহায়র ইবনু হারব ও উবাইদুল্লাহ ইবনু মুআয (রহঃ) ..... উবাদাহ ইবনু সামিত (রাযিঃ) হতে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ মুমিনের স্বপ্ন নুবুওয়াতের ছিচল্লিশ ভাগের এক ভাগ। (ইসলামিক ফাউন্ডেশন ৫৭১২, ইসলামিক সেন্টার)","e":"Ubada b. as-Samit reported Allah's Messenger (ﷺ) as saying:The vision of a believer is the forty-sixth part of Prophecy"},{"n":"5910","k":"2264.02","a":"وَحَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ مُعَاذٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا شُعْبَةُ، عَنْ ثَابِتٍ الْبُنَانِيِّ، عَنْ أَنَسِ، بْنِ مَالِكٍ عَنِ النَّبِيِّ صلى الله عليه وسلم مِثْلَ ذَلِكَ ‏.‏","b":"উবাইদুল্লাহ ইবনু মুআয (রহঃ) ..... আনাস ইবনু মালিক (রাযিঃ) নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে উপরে বর্ণিত হাদীসের হুবহু বর্ণনা করেছেন। (ইসলামিক ফাউন্ডেশন ৫৭১৩, ইসলামিক সেন্টার)","e":"This hadith has been narrated on the authority of Anas b. Malik through another chain of transmitters"},{"n":"5911","k":"2263.05","a":"حَدَّثَنَا عَبْدُ بْنُ حُمَيْدٍ، أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنِ ابْنِ، الْمُسَيَّبِ عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ إِنَّ رُؤْيَا الْمُؤْمِنِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏ ‏.‏","b":"আবদ ইবনু হুমায়দ (রহঃ) ...... আবূ হুরাইরাহ (রাযিঃ) হতে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, “অবশ্য ঈমানদারের স্বপ্ন নুবুওয়াতের ছিচল্লিশ ভাগের এক ভাগ। (ইসলামিক ফাউন্ডেশন ৫৭১৪, ইসলামিক সেন্টার)","e":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:Verily the vision of a believer is one of the forty-sixth part of Prophecy"},{"n":"5912","k":"2263.06","a":"وَحَدَّثَنَا إِسْمَاعِيلُ بْنُ الْخَلِيلِ، أَخْبَرَنَا عَلِيُّ بْنُ مُسْهِرٍ، عَنِ الأَعْمَشِ، ح وَحَدَّثَنَا ابْنُ نُمَيْرٍ، حَدَّثَنَا أَبِي، حَدَّثَنَا الأَعْمَشُ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ رُؤْيَا الْمُسْلِمِ يَرَاهَا أَوْ تُرَى لَهُ ‏\"‏ ‏.‏ وَفِي حَدِيثِ ابْنِ مُسْهِرٍ ‏\"‏ الرُّؤْيَا الصَّالِحَةُ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏ ‏.‏","b":"(…/…) ইসমাঈল ইবনু খলীল ও ইবনু নুমায়র (রহঃ) ..... আবূ হুরাইরাহ (রাযিঃ) হতে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ মুসলিমের স্বপ্ন, যা সে দেখে অথবা যা তার ব্যাপারে দৃশ্য হয়। বর্ণনাকারী ইবনু মুসহির বর্ণিত হাদীসে 'মুসলিমের স্বপ্ন' এ জায়গায় রয়েছে 'ভাল স্বপ্ন' নুবুওয়াতের ছিচল্লিশ ভাগের এক ভাগ। (ইসলামিক ফাউন্ডেশন ৫৭১৫, ইসলামিক সেন্টার)","e":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:The vision of a Muslim which he sees or which is shown to him, and in the hadith transmitted on the authority of Ibn Mushir (the words are): \"The pious dream is the forty-sixth part of Prophecy"},{"n":"5913","k":"2263.07","a":"وَحَدَّثَنَا يَحْيَى بْنُ يَحْيَى، أَخْبَرَنَا عَبْدُ اللَّهِ بْنُ يَحْيَى بْنِ أَبِي كَثِيرٍ، قَالَ سَمِعْتُ أَبِي يَقُولُ، حَدَّثَنَا أَبُو سَلَمَةَ، عَنْ أَبِي هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ رُؤْيَا الرَّجُلِ الصَّالِحِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏ ‏.‏","b":"ইয়াহইয়া ইবনু ইয়াহইয়া (রহঃ) ..... আবূ হুরাইরাহ্ (রাযিঃ) এর সানাদে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি বলেন, সৎ লোকের স্বপ্ন নুবুওয়াতের ছিচল্লিশ ভাগের এক ভাগ। (ইসলামিক ফাউন্ডেশন ৫৭১৬, ইসলামিক সেন্টার)","e":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:The vision of a pious man is the forty-sixth part of Prophecy"},{"n":"5914","k":"2263.08","a":"وَحَدَّثَنَا مُحَمَّدُ بْنُ الْمُثَنَّى، حَدَّثَنَا عُثْمَانُ بْنُ عُمَرَ، حَدَّثَنَا عَلِيٌّ، - يَعْنِي ابْنَ الْمُبَارَكِ - ح وَحَدَّثَنَا أَحْمَدُ بْنُ الْمُنْذِرِ، حَدَّثَنَا عَبْدُ الصَّمَدِ، حَدَّثَنَا حَرْبٌ، - يَعْنِي ابْنَ شَدَّادٍ - كِلاَهُمَا عَنْ يَحْيَى بْنِ أَبِي كَثِيرٍ، بِهَذَا الإِسْنَادِ ‏.‏","b":"মুহাম্মাদ ইবনুল মুসান্না ও আহমাদ ইবনু মুনযির (রহঃ) ...... ইয়াহইয়া ইবনু আবূ কাসীর (রহঃ) হতে উপরোল্লিখিত সূত্রে হাদীস বর্ণনা করেছেন। (ইসলামিক ফাউন্ডেশন ৫৭১৭, ইসলামিক সেন্টার)","e":"This hadith has been narrated on the authority of Yahya b. Abu Kathir with the same chain of transmitters"},{"n":"5915","k":"2263.09","a":"وَحَدَّثَنَا مُحَمَّدُ بْنُ رَافِعٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، حَدَّثَنَا مَعْمَرٌ، عَنْ هَمَّامِ بْنِ مُنَبِّهٍ، عَنْ أَبِي هُرَيْرَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم بِمِثْلِ حَدِيثِ عَبْدِ اللَّهِ بْنِ يَحْيَى بْنِ أَبِي كَثِيرٍ عَنْ أَبِيهِ ‏.‏","b":"(…/...) মুহাম্মাদ ইবনু রাফি' (রহঃ) ... আবূ হুরাইরাহ্ (রাযিঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম থেকে আবদুল্লাহ ইবনু ইয়াহইয়া ইবনু আবূ কাসীর (রহঃ) তাঁর পিতার সূত্রে বর্ণিত হাদীসের অনুরূপ হাদীস রিওয়ায়াত করেছেন। (ইসলামিক ফাউন্ডেশন ৫৭১৮, ইসলামিক সেন্টার)","e":"This hadith has been narrated on the authority of Abu Huraira through another chain of transmitters"},{"n":"5916","k":"2265.01","a":"حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا أَبُو أُسَامَةَ، ح وَحَدَّثَنَا ابْنُ نُمَيْرٍ، حَدَّثَنَا أَبِي، قَالاَ جَمِيعًا حَدَّثَنَا عُبَيْدُ اللَّهِ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ الرُّؤْيَا الصَّالِحَةُ جُزْءٌ مِنْ سَبْعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏ ‏.‏","b":"আবূ বাকর ইবনু আবূ শাইবাহ ও ইবনু নুমায়র (রহঃ) ..... ইবনু উমর (রাযিঃ) হতে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ ভাল স্বপ্ন নুবুওয়াতের সত্তর ভাগের এক ভাগ। (ইসলামিক ফাউন্ডেশন ৫৭১৯, ইসলামিক সেন্টার)","e":"Ibn `Umar reported Allah's Messenger (ﷺ) as saying:The pious dreams are the seventieth part of Prophecy"},{"n":"5917","k":"2265.02","a":"وَحَدَّثَنَاهُ ابْنُ الْمُثَنَّى، وَعُبَيْدُ اللَّهِ بْنُ سَعِيدٍ، قَالاَ حَدَّثَنَا يَحْيَى، عَنْ عُبَيْدِ اللَّهِ، بِهَذَا الإِسْنَادِ ‏.‏","b":"ইবনুল মুসান্না ও উবাইদুল্লাহ ইবনু সাঈদ (রহঃ) ইয়াহইয়া সূত্রে উবাইদুল্লাহ (রহঃ) হতে অবিকল রিওয়ায়াত করেছেন। (ইসলামিক ফাউন্ডেশন ৫৭২০, ইসলামিক সেন্টার, নেই)","e":"This hadith has been reported on the authority of `Ubaidullah with the same chain of transmitters"},{"n":"5918","k":"2265.03","a":"وَحَدَّثَنَاهُ قُتَيْبَةُ، وَابْنُ، رُمْحٍ عَنِ اللَّيْثِ بْنِ سَعْدٍ، ح وَحَدَّثَنَا ابْنُ رَافِعٍ، حَدَّثَنَا ابْنُ، أَبِي فُدَيْكٍ أَخْبَرَنَا الضَّحَّاكُ، - يَعْنِي ابْنَ عُثْمَانَ - كِلاَهُمَا عَنْ نَافِعٍ، بِهَذَا الإِسْنَادِ وَفِي حَدِيثِ اللَّيْثِ قَالَ نَافِعٌ حَسِبْتُ أَنَّ ابْنَ عُمَرَ قَالَ ‏ \"‏ جُزْءٌ مِنْ سَبْعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏ ‏.‏","b":"(…/...) কুতাইবাহ ও ইবনু রুমল্লাহ্ (রহঃ) লায়স ইবনু সা'দ থেকে (ভিন্ন সানাদে) ইবনু রাফি ও ইবনু ফুদায়ক (রহঃ) নাফি’ (রহঃ) হতে হুবহু রিওয়ায়াত করেছেন। লায়স-এর হাদীসে আছে নাফি' (রহঃ) বলেন, আমার ধারণা ইবনু উমর (রাযিঃ) বলেছেনঃ স্বপ্ন নুবুওয়াতের সত্তর ভাগের এক ভাগের এক ভাগ * (ইসলামিক ফাউন্ডেশন, ৫৭২১, ইসলামিক সেন্টার, নেই)","e":"A hadith like this has been reported on the authority of Nafi` with the same chain of transmitters (and the words are):\"I think Ibn `Umar said: The seventieth part from Prophecy"},{"n":"5919","k":"2266.01","a":"حَدَّثَنَا أَبُو الرَّبِيعِ، سُلَيْمَانُ بْنُ دَاوُدَ الْعَتَكِيُّ حَدَّثَنَا حَمَّادٌ، - يَعْنِي ابْنَ زَيْدٍ - حَدَّثَنَا أَيُّوبُ، وَهِشَامٌ، عَنْ مُحَمَّدٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَنْ رَآنِي فِي الْمَنَامِ فَقَدْ رَآنِي فَإِنَّ الشَّيْطَانَ لاَ يَتَمَثَّلُ بِي ‏\"‏ ‏.‏","b":"আবূ রাবী' সুলাইমান ইবনু দাউদ আতাকী (রহঃ) ..... আবূ হুরাইরাহ (রাযিঃ) হতে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে লোক আমাকে স্বপ্নে দেখে সে (অবশ্যই) আমাকে দেখেছে। কারণ, শাইতান আমার আকৃতি ধারণ করতে পারে না। (ইসলামিক ফাউন্ডেশন ৫৭২২, ইসলামিক সেন্টার)","e":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:He who saw me in a dream in fact saw me, for the satan does not appear in my form"},{"n":"5920","k":"2266.02","a":"وَحَدَّثَنِي أَبُو الطَّاهِرِ، وَحَرْمَلَةُ، قَالاَ أَخْبَرَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ، شِهَابٍ حَدَّثَنِي أَبُو سَلَمَةَ بْنُ عَبْدِ الرَّحْمَنِ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ مَنْ رَآنِي فِي الْمَنَامِ فَسَيَرَانِي فِي الْيَقَظَةِ أَوْ لَكَأَنَّمَا رَآنِي فِي الْيَقَظَةِ لاَ يَتَمَثَّلُ الشَّيْطَانُ بِي ‏\"‏ ‏.‏","b":"আবূ তাহির ও হারমালাহ্ (রহঃ) ..... আবূ হুরাইরাহ্ (রাযিঃ) হতে বর্ণিত। তিনি বলেন, আমি রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কে বলতে শুনেছি, যে লোক আমাকে স্বপ্নে দেখে, শীঘ্রই সে আমাকে জ
