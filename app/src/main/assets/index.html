ন। আমি বের হয়ে মিম্বরের কাছে আসলাম, দেখি যে লোকজন মিম্বরের চারপাশ জুড়ে বসে আছেন এবং কেউ কেউ কাঁদছেন। আমি তাঁদের সঙ্গে কিছুক্ষণ বসলাম। তারপর আমার ঔৎসুক্য প্রবল হল, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম যে কোঠায় ছিলেন, আমি সে কোঠার কাছে আসলাম। আমি তাঁর এক কালো গোলামকে বললাম, উমারের জন্য অনুমতি গ্রহণ কর। সে প্রবেশ করে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর সাথে আলাপ করে বেরিয়ে এসে বলল, আমি আপনার কথা তাঁর কাছে উল্লেখ করেছি, কিন্তু তিনি নীরব রইলেন। আমি ফিরে এলাম এবং মিম্বরের পাশে বসা লোকদের কাছে গিয়ে বসে পড়লাম। কিছুক্ষণ পর আমার আবার উদ্বেগ প্রবল হল। তাই আমি আবার এসে গোলামকে বললাম। (‘উমারের জন্য অনুমতি গ্রহণ কর) এবারও সে আগের মতোই বলল। তারপর যখন আমি ফিরে আসছিলাম, গোলাম আমাকে ডেকে বলল, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম আপনাকে অনুমতি দিয়েছেন। এখন আমি তাঁর নিকট প্রবেশ করে দেখি, তিনি খেজুরের পাতায় তৈরী ছোবড়া ভর্তি একটা চামড়ার বালিশে হেলান দিয়ে খালি চাটাই এর উপর কাত হয়ে শুয়ে আছেন। তাঁর শরীর ও চাটাই এর মাঝখানে কোন ফরাশ ছিল না। ফলে তাঁর শরীরের পার্শ্বদেশে চাটাইয়ের দাগ পড়ে গেছে। আমি তাঁকে সালাম করলাম এবং দাঁড়িয়ে আবার আরয করলাম, আপনি কি আপনার সহধর্মিণীদেরকে তালাক দিয়েছেন? তখন তিনি আমার দিকে চোখ তুলে তাকালেন এবং বললেন, না। তারপর আমি (থমথমে ভাব কাটিয়ে) অনুকূল ভাব সৃষ্টির জন্য দাঁড়িয়ে থেকেই বললাম, হে আল্লাহর রাসূল! সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম দেখুন, আমরা কুরাইশ গোত্রের লোকেরা নারীদের উপর কর্তৃত্ব করতাম। তারপর যখন আমরা এমন একটি সম্প্রদায়ের নিকট এলাম, যাদের উপর তাদের নারীরা কর্তৃত্ব করছে। তিনি এ ব্যাপারে আলোচনা করলেন। এতে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম মুচকি হাসলেন। তারপর আমি বললাম, আপনি হয়তো লক্ষ্য করছেন যে, আমি হাফসার ঘরে গিয়েছি এবং তাকে বলেছি, তোমাকে এ কথা যেন ধোঁকায় না ফেলে যে, তোমার প্রতিবেশিনী (সতীন) তোমার চেয়ে অধিক আকর্ষণীয় এবং নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর অধিক প্রিয়। এ কথা দ্বারা তিনি ‘আয়িশাহ (রাযি.)-কে বুঝিয়েছেন। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম আবার মুচকি হাসলেন। তাঁকে একা দেখে আমি বসে পড়লাম। তারপর আমি তাঁর সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ঘরের ভিতর এদিক সেদিক দৃষ্টি করলাম। কিন্তু তাঁর সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ঘরে তিনটি কাঁচা চামড়া ব্যতীত দৃষ্টিপাত করার মতো আর কিছুই দেখতে পেলাম না, তখন আমি আরয করলাম, আল্লাহ তা‘আলার কাছে দু‘আ করুন, তিনি যেন আপনার উম্মাতকে পার্থিব স্বচ্ছলতা দান করেন। কেননা, পারস্য ও রোমের অধিবাসীদেরকে স্বচ্ছলতা দান করা হয়েছে এবং তাদেরকে পার্থিব (অনেক প্রাচুর্য) দেয়া হয়েছে, অথচ তারা আল্লাহর ইবাদত করে না। তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তখন হেলান দিয়ে ছিলেন। তিনি বললেন, হে ইবনু খাত্তাব! তোমার কি এতে সন্দেহ রয়েছে যে, তারা তো এমন এক জাতি, যাদেরকে তাদের ভালো কাজের প্রতিদান দুনিয়ার জীবনেই দিয়ে দেয়া হয়েছে। আমি আরয করলাম, হে আল্লাহর রাসূল! আমার জন্য ক্ষমার দু‘আ করুন। হাফসাহ (রাযি.) ‘আয়িশাহ (রাযি.)-এর কাছে এ কথা প্রকাশ করলেই নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম সহধর্মিণীদের হতে আলাদা হয়েছিলেন। তিনি বলেছিলেন, আল্লাহর কসম! আমি এক মাস তাদের কাছে যাব না। তাঁদের উপর রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -এর ভীষণ রাগের কারণে তা হয়েছিল। যেহেতু আল্লাহ তা‘আলা তার প্রতি অসন্তোষ প্রকাশ করেন। যখন ঊনত্রিশ দিন কেটে গেল, তিনি সর্বপ্রথম ‘আয়িশাহ (রাযি.)-এর কাছে এলেন। ‘আয়িশাহ (রাযি.) তাঁকে বললেন, আপনি কসম করেছেন যে, এক মাসের মধ্যে আমাদের কাছে আসবেন না। আর এ পর্যন্ত আমরা ঊনত্রিশ রাত অতিবাহিত করেছি, যা আমি ঠিক ঠিক গণনা করে রেখেছি। তখন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, মাস ঊনত্রিশ দিনেও হয়। আর মূলত এ মাসটি ঊনত্রিশ দিনেরই ছিল। ‘আয়িশাহ (রাযি.) বলেন, যখন ইখতিয়ারের আয়াত নাযিল হল, তখন তিনি তাঁর সহধর্মিণীদের মধ্যে সর্বপ্রথম আমার কাছে আসলেন এবং বললেন, আমি তোমাকে একটি কথা বলতে চাই, তবে তোমার পিতা-মাতার সঙ্গে পরামর্শ না করে এর জওয়াবে তুমি তাড়াহুড়ো করবে না। ‘আয়িশাহ (রাযি.) বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এ কথা জানতেন যে, আমার পিতা-মাতা তাঁর সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে আলাদা হওয়ার পরামর্শ আমাকে কখনো দিবেন না। তারপর নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, আল্লাহ তা‘আলা ইরশাদ করেনঃ ‘‘হে নবী! আপনি আপনার সহধর্মিণীদের বলুন। তোমরা যদি পার্থিব জীবন এবং তার চাকচিক্য কামনা কর, তবে আস; আমি তোমাদেরকে কিছু সম্বল প্রদান করি আর তোমাদেরকে সদ্ভাবে বিদায় করে দেই। আর যদি তোমরা আল্লাহ তা‘আলাকে (এবং) তাঁর রাসূলকে চাও এবং কামনা কর পরলোক, তবে তোমার অন্তর্গত সৎকর্মশীলদের জন্য আল্লাহ তা‘আলা মহাপ্রতিদান প্রস্তুত রেখেছেন’’- (আহযাবঃ ২৮-২৯)। আমি বললাম, এ ব্যাপারে আমি আমার পিতা-মাতার কাছে কী পরামর্শ নিব? আমি তো আল্লাহ ও তাঁর রাসূলের সন্তুষ্টি এবং পরকালীন (সাফল্য) পেতে চাই। তারপর তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তাঁর অন্য সহধর্মিণীদেরকেও ইখতিয়ার দিলেন এবং প্রত্যেকে সে একই জবাব দিলেন, যা ‘আয়িশাহ (রাযি.) দিয়েছিলেন। (৮৯) (আধুনিক প্রকাশনীঃ ২২৮৯, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated `Abdullah bin `Abbas:I had been eager to ask `Umar about the two ladies from among the wives of the Prophet (ﷺ) regarding whom Allah said (in the Qur'an saying): If you two (wives of the Prophet (ﷺ) namely Aisha and Hafsa) turn in repentance to Allah your hearts are indeed so inclined (to oppose what the Prophet (ﷺ) likes) (66.4), till performed the Hajj along with `Umar (and on our way back from Hajj) he went aside (to answer the call of nature) and I also went aside along with him carrying a tumbler of water. When he had answered the call of nature and returned. I poured water on his hands from the tumbler and he performed ablution. I said, \"O Chief of the believers! ' Who were the two ladies from among the wives of the Prophet (ﷺ) to whom Allah said: 'If you two return in repentance (66.4)? He said, \"I am astonished at your question, O Ibn `Abbas. They were Aisha and Hafsa.\" Then `Umar went on relating the narration and said. \"I and an Ansari neighbor of mine from Bani Umaiya bin Zaid who used to live in `Awali Al-Medina, used to visit the Prophet (ﷺ) in turns. He used to go one day, and I another day. When I went I would bring him the news of what had happened that day regarding the instructions and orders and when he went, he used to do the same for me. We, the people of Quraish, used to have authority over women, but when we came to live with the Ansar, we noticed that the Ansari women had the upper hand over their men, so our women started acquiring the habits of the Ansari women. Once I shouted at my wife and she paid me back in my coin and I disliked that she should answer me back. She said, 'Why do you take it ill that I retort upon you? By Allah, the wives of the Prophet (ﷺ) retort upon him, and some of them may not speak with him for the whole day till night.' What she said scared me and I said to her, 'Whoever amongst them does so, will be a great loser.' Then I dressed myself and went to Hafsa and asked her, 'Does any of you keep Allah's Messenger (ﷺ) angry all the day long till night?' She replied in the affirmative. I said, 'She is a ruined losing person (and will never have success)! Doesn't she fear that Allah may get angry for the anger of Allah's Messenger (ﷺ) and thus she will be ruined? Don't ask Allah's Messenger (ﷺ) too many things, and don't retort upon him in any case, and don't desert him. Demand from me whatever you like, and don't be tempted to imitate your neighbor (i.e. `Aisha) in her behavior towards the Prophet), for she (i.e. Aisha) is more beautiful than you, and more beloved to Allah's Messenger (ﷺ). In those days it was rumored that Ghassan, (a tribe living in Sham) was getting prepared their horses to invade us. My companion went (to the Prophet (ﷺ) on the day of his turn, went and returned to us at night and knocked at my door violently, asking whether I was sleeping. I was scared (by the hard knocking) and came out to him. He said that a great thing had happened. I asked him: What is it? Have Ghassan come? He replied that it was worse and more serious than that, and added that Allah's Apostle had divorced all his wives. I said, Hafsa is a ruined loser! I expected that would happen some day.' So I dressed myself and offered the Fajr prayer with the Prophet. Then the Prophet (ﷺ) entered an upper room and stayed there alone. I went to Hafsa and found her weeping. I asked her, 'Why are you weeping? Didn't I warn you? Has Allah's Messenger (ﷺ) divorced you all?' She replied, 'I don't know. He is there in the upper room.' I then went out and came to the pulpit and found a group of people around it and some of them were weeping. Then I sat with them for some time, but could not endure the situation. So I went to the upper room where the Prophet (ﷺ) was and requested to a black slave of his: \"Will you get the permission of (Allah's Apostle) for `Umar (to enter)? The slave went in, talked to the Prophet (ﷺ) about it and came out saying, 'I mentioned you to him but he did not reply.' So, I went and sat with the people who were sitting by the pulpit, but I could not bear the situation, so I went to the slave again and said: \"Will you get he permission for `Umar? He went in and brought the same reply as before. When I was leaving, behold, the slave called me saying, \"Allah's Messenger (ﷺ) has granted you permission.\" So, I entered upon the Prophet and saw him lying on a mat without bedding on it, and the mat had left its mark on the body of the Prophet, and he was leaning on a leather pillow stuffed with palm fibres. I greeted him and while still standing, I said: \"Have you divorced your wives?' He raised his eyes to me and replied in the negative. And then while still standing, I said chatting: \"Will you heed what I say, 'O Allah's Messenger (ﷺ)! We, the people of Quraish used to have the upper hand over our women (wives), and when we came to the people whose women had the upper hand over them...\" `Umar told the whole story (about his wife). \"On that the Prophet (ﷺ) smiled.\" `Umar further said, \"I then said, 'I went to Hafsa and said to her: Do not be tempted to imitate your companion (`Aisha) for she is more beautiful than you and more beloved to the Prophet.' The Prophet (ﷺ) smiled again. When I saw him smiling, I sat down and cast a glance at the room, and by Allah, I couldn't see anything of importance but three hides. I said (to Allah's Messenger (ﷺ)) \"Invoke Allah to make your followers prosperous for the Persians and the Byzantines have been made prosperous and given worldly luxuries, though they do not worship Allah?' The Prophet (ﷺ) was leaning then (and on hearing my speech he sat straight) and said, 'O Ibn Al-Khattab! Do you have any doubt (that the Hereafter is better than this world)? These people have been given rewards of their good deeds in this world only.' I asked the Prophet (ﷺ) . 'Please ask Allah's forgiveness for me. The Prophet (ﷺ) did not go to his wives because of the secret which Hafsa had disclosed to `Aisha, and he said that he would not go to his wives for one month as he was angry with them when Allah admonished him (for his oath that he would not approach Maria). When twenty-nine days had passed, the Prophet (ﷺ) went to Aisha first of all. She said to him, 'You took an oath that you would not come to us for one month, and today only twenty-nine days have passed, as I have been counting them day by day.' The Prophet (ﷺ) said, 'The month is also of twenty-nine days.' That month consisted of twenty-nine days. `Aisha said, 'When the Divine revelation of Choice was revealed, the Prophet (ﷺ) started with me, saying to me, 'I am telling you something, but you need not hurry to give the reply till you can consult your parents.\" `Aisha knew that her parents would not advise her to part with the Prophet (ﷺ) . The Prophet (ﷺ) said that Allah had said: 'O Prophet! Say To your wives; If you desire The life of this world And its glitter, ... then come! I will make a provision for you and set you free In a handsome manner. But if you seek Allah And His Apostle, and The Home of the Hereafter, then Verily, Allah has prepared For the good-doers amongst you A great reward.' (33.28) `Aisha said, 'Am I to consult my parents about this? I indeed prefer Allah, His Apostle, and the Home of the Hereafter.' After that the Prophet (ﷺ) gave the choice to his other wives and they also gave the same reply as `Aisha did"},{"n":"2469","k":"","a":"حَدَّثَنَا ابْنُ سَلاَمٍ، حَدَّثَنَا الْفَزَارِيُّ، عَنْ حُمَيْدٍ الطَّوِيلِ، عَنْ أَنَسٍ ـ رضى الله عنه ـ قَالَ آلَى رَسُولُ اللَّهِ صلى الله عليه وسلم مِنْ نِسَائِهِ شَهْرًا، وَكَانَتِ انْفَكَّتْ قَدَمُهُ فَجَلَسَ فِي عِلِّيَّةٍ لَهُ، فَجَاءَ عُمَرُ، فَقَالَ أَطَلَّقْتَ نِسَاءَكَ قَالَ ‏ \"‏ لاَ، وَلَكِنِّي آلَيْتُ مِنْهُنَّ شَهْرًا ‏\"‏‏.‏ فَمَكُثَ تِسْعًا وَعِشْرِينَ، ثُمَّ نَزَلَ، فَدَخَلَ عَلَى نِسَائِهِ‏.‏","b":"আনাস (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এক মাস তাঁর সহধর্মিণীদের কাছে যাবেন না বলে কসম করেন। এ সময় তাঁর পা মচ্কে গিয়েছিল। তাই তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম একটি চিলেকোঠায় অবস্থান করেন। একদিন ‘উমার (রাঃ) এসে বললেন, আপনি কি আপনার সহধর্মিণীদেরকে তালাক দিয়েছেন? তিনি বললেন, না, তবে আমি একমাস তাদের কাছে যাবো না বলে কসম করেছি। তিনি ঊনত্রিশ দিন সেখানে অবস্থান করেন এরপর তিনি অবতরণ করেন এবং নিজের সহধর্মিণীদের কাছে আসেন। (৩৭৮) (আধুনিক প্রকাশনীঃ ২২৯০, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Anas:Allah's Messenger (ﷺ) took an oath that he would not go to his wives for one month as his foot had been sprained. He stayed in an upper room when `Umar went to him and said, \"Have you divorced your wives?\" He said, \"No, but I have taken an oath that I would not go to them for one month.\" The Prophet stayed there for twenty-nine days, and then came down and went to his wives"},{"n":"2470","k":"","a":"حَدَّثَنَا مُسْلِمٌ، حَدَّثَنَا أَبُو عَقِيلٍ، حَدَّثَنَا أَبُو الْمُتَوَكِّلِ النَّاجِيُّ، قَالَ أَتَيْتُ جَابِرَ بْنَ عَبْدِ اللَّهِ ـ رضى الله عنهما ـ قَالَ دَخَلَ النَّبِيُّ صلى الله عليه وسلم الْمَسْجِدَ، فَدَخَلْتُ إِلَيْهِ، وَعَقَلْتُ الْجَمَلَ فِي نَاحِيَةِ الْبَلاَطِ فَقُلْتُ هَذَا جَمَلُكَ‏.‏ فَخَرَجَ فَجَعَلَ يُطِيفُ بِالْجَمَلِ قَالَ ‏ \"‏ الثَّمَنُ وَالْجَمَلُ لَكَ ‏\"‏‏.‏","b":"জাবির ইবনু ‘আবদুল্লাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম মসজিদে প্রবেশ করলেন। আমি উটটাকে মসজিদের উঠানের পাশে বেঁধে রেখে তাঁর কাছে গেলাম এবং বললাম, এটা আপনার উট। তিনি বেরিয়ে এলেন এবং উটের পাশে ঘুরাফিরা করতে লাগলেন। তারপর বললেন, উট ও তার মূল্য দু’টোই তোমার। (৪৪৩) (আধুনিক প্রকাশনীঃ ২২৯১, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Jabir:The Prophet (ﷺ) entered the Mosque, and I too went there after tying the camel at the pavement of the Mosque. I said (to the Prophet (ﷺ) ), \"This is your camel.\" He came out and started examining the camel and said, \"Both the camel and its price are for you"},{"n":"2471","k":"","a":"حَدَّثَنَا سُلَيْمَانُ بْنُ حَرْبٍ، عَنْ شُعْبَةَ، عَنْ مَنْصُورٍ، عَنْ أَبِي وَائِلٍ، عَنْ حُذَيْفَةَ ـ رضى الله عنه ـ قَالَ لَقَدْ رَأَيْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم، أَوْ قَالَ لَقَدْ أَتَى النَّبِيُّ صلى الله عليه وسلم سُبَاطَةَ قَوْمٍ فَبَالَ قَائِمًا‏.‏","b":"হুযাইফাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -কে দেখেছি। (রাবী বলেন) অথবা তিনি বলেছেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এলেন লোকেদের ময়লা-আবর্জনা ফেলার স্থানে এরপর তিনি দাঁড়িয়ে পেশাব করলেন। (২২৪) (আধুনিক প্রকাশনীঃ ২২৯২, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Hudhaifa:I saw Allah's Messenger (ﷺ) coming (or the Prophet (ﷺ) came) to the dumps of some people and urinated there while standing"},{"n":"2472","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا مَالِكٌ، عَنْ سُمَىٍّ، عَنْ أَبِي صَالِحٍ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ بَيْنَمَا رَجُلٌ يَمْشِي بِطَرِيقٍ، وَجَدَ غُصْنَ شَوْكٍ فَأَخَذَهُ، فَشَكَرَ اللَّهُ لَهُ، فَغَفَرَ لَهُ ‏\"‏‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত যে, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, এক ব্যক্তি রাস্তা দিয়ে চলার সময় কাঁটাদার গাছের একটি ডাল রাস্তায় পেল, তখন সেটাকে রাস্তা হতে অপসারণ করল, আল্লাহ তার এ কাজকে কবূল করলেন এবং তাকে মাফ করে দিলেন। (৬৫২) (আধুনিক প্রকাশনীঃ ২২৯৩, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"While a man was on the way, he found a thorny branch of a tree there on the way and removed it. Allah thanked him for that deed and forgave him"},{"n":"2473","k":"","a":"حَدَّثَنَا مُوسَى بْنُ إِسْمَاعِيلَ، حَدَّثَنَا جَرِيرُ بْنُ حَازِمٍ، عَنِ الزُّبَيْرِ بْنِ خِرِّيتٍ، عَنْ عِكْرِمَةَ، سَمِعْتُ أَبَا هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَضَى النَّبِيُّ صلى الله عليه وسلم إِذَا تَشَاجَرُوا فِي الطَّرِيقِ بِسَبْعَةِ أَذْرُعٍ‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, যখন মালিকেরা রাস্তার ব্যাপারে পরস্পরে বিবাদ করল, তখন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম রাস্তার জন্য সাত হাত জমি ছেড়ে দেয়ার ফয়সালা দেন। (আধুনিক প্রকাশনীঃ ২২৯৪, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Huraira:The Prophet (ﷺ) judged that seven cubits should be left as a public way when there was a dispute about the land"},{"n":"2474","k":"","a":"حَدَّثَنَا آدَمُ بْنُ أَبِي إِيَاسٍ، حَدَّثَنَا شُعْبَةُ، حَدَّثَنَا عَدِيُّ بْنُ ثَابِتٍ، سَمِعْتُ عَبْدَ اللَّهِ بْنَ يَزِيدَ الأَنْصَارِيّ َ ـ وَهُوَ جَدُّهُ أَبُو أُمِّهِ ـ قَالَ نَهَى النَّبِيُّ صلى الله عليه وسلم عَنِ النُّهْبَى وَالْمُثْلَةِ‏.‏","b":"وَقَالَ عُبَادَةُ بَايَعْنَا النَّبِيَّ صلى الله عليه وسلم أَنْ لاَ نَنْتَهِبَ ‘উবাদাহ (রাঃ) বলেন, আমরা নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর কাছে এ মর্মে বায়‘আত করেছি যে, আমরা লুটপাট করব না। ২৪৭৪. ‘আদী ইবনু সাবিত (রহ.)-এর নানা ‘আবদুল্লাহ ইবনু ইয়াযীদ আনসারী (রাঃ) হতে বর্ণিত, তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম লুটতরাজ করতে এবং জীবকে বিকলাঙ্গ করতে নিষেধ করেছেন। (৫৫১৬) (আধুনিক প্রকাশনীঃ ২২৯৫, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated `Abdullah bin Yazid Al-Ansari:The Prophet (ﷺ) forbade robbery (taking away what belongs to others without their permission), and also forbade mutilation (or maiming) of bodies"},{"n":"2475","k":"","a":"حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، قَالَ حَدَّثَنِي اللَّيْثُ، حَدَّثَنَا عُقَيْلٌ، عَنِ ابْنِ شِهَابٍ، عَنْ أَبِي بَكْرِ بْنِ عَبْدِ الرَّحْمَنِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ لاَ يَزْنِي الزَّانِي حِينَ يَزْنِي وَهْوَ مُؤْمِنٌ، وَلاَ يَشْرَبُ الْخَمْرَ حِينَ يَشْرَبُ وَهْوَ مُؤْمِنٌ، وَلاَ يَسْرِقُ حِينَ يَسْرِقُ وَهْوَ مُؤْمِنٌ، وَلاَ يَنْتَهِبُ نُهْبَةً يَرْفَعُ النَّاسُ إِلَيْهِ فِيهَا أَبْصَارَهُمْ حِينَ يَنْتَهِبُهَا وَهْوَ مُؤْمِنٌ ‏\"‏‏.‏ وَعَنْ سَعِيدٍ وَأَبِي سَلَمَةَ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ صلى الله عليه وسلم مِثْلَهُ إِلاَّ النُّهْبَةَ‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, কোন ব্যভিচারী মু’মিন অবস্থায় ব্যভিচার করে না এবং কোন মদ্যপায়ী মু’মিন অবস্থায় মদ পান করে না। কোন চোর মু’মিন অবস্থায় চুরি করে না। কোন লুটতরাজকারী মু’মিন অবস্থায় এরূপ লুটতরাজ করে না যে, যখন সে লুটতরাজ করে তখন তার প্রতি লোকজন চোখ তুলে তাকিয়ে থাকে। সা‘ঈদ ও আবূ সালামাহ (রাঃ) আবূ হুরাইরাহ (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে অনুরূপ বর্ণিত, তবে তাতে লুটতরাজের উল্লেখ নেই। ফিরাবরী (রহ.) বলেন, আমি আবূ জা‘ফর (রহ.)-এর লেখা পান্ডুলিপিতে পেয়েছি যে, আবূ ‘আবদুল্লাহ (ইমাম বুখারী) (রহ.) বলেন, এ হাদীসের ব্যাখ্যায় ইবনু ‘আব্বাস (রাঃ) বলেছেন, এর অর্থ হল, তার হতে ঈমানের নূর ছিনিয়ে নেয়া হয়। (৫৫৭৮, ৬৭৭২, ৬৮১০) (আধুনিক প্রকাশনীঃ ২২৯৬, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"When an adulterer commits illegal sexual intercourse, then he is not a believer at the time, he is doing it, and when a drinker of an alcoholic liquor drinks it, then he is not a believer at the time of drinking it, and when a thief steals, then he is not a believer at the time of stealing, and when a robber robs, and the people look at him, then he is not a believer at the time of doing robbery"},{"n":"2476","k":"","a":"حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا الزُّهْرِيُّ، قَالَ أَخْبَرَنِي سَعِيدُ بْنُ الْمُسَيَّبِ، سَمِعَ أَبَا هُرَيْرَةَ ـ رضى الله عنه ـ عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لاَ تَقُومُ السَّاعَةُ حَتَّى يَنْزِلَ فِيكُمُ ابْنُ مَرْيَمَ حَكَمًا مُقْسِطًا، فَيَكْسِرَ الصَّلِيبَ، وَيَقْتُلَ الْخِنْزِيرَ، وَيَضَعَ الْجِزْيَةَ، وَيَفِيضَ الْمَالُ حَتَّى لاَ يَقْبَلَهُ أَحَدٌ ‏\"‏‏.‏","b":"আবূ হুরাইরাহ (রাঃ) রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণনা করেন, তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, ইবনু মারইয়াম [ঈসা (আ.)] তোমাদের মাঝে ন্যায়বিচারক হয়ে অবতরণ না করা পর্যন্ত কিয়ামত হবে না। তিনি এসে ক্রুশ ভেঙ্গে ফেলবেন, শূকর হত্যা করবেন এবং জিয্য়া কর তুলে দিবেন। তখন ধন-সম্পদের এত প্রাচুর্য হবে যে, তা গ্রহণ করার মতো কেউ থাকবে না। (২২২২) (আধুনিক প্রকাশনীঃ ২২৯৭, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The Hour will not be established until the son of Mary (i.e. Jesus) descends amongst you as a just ruler, he will break the cross, kill the pigs, and abolish the Jizya tax. Money will be in abundance so that nobody will accept it (as charitable gifts)"},{"n":"2477","k":"","a":"حَدَّثَنَا أَبُو عَاصِمٍ الضَّحَّاكُ بْنُ مَخْلَدٍ، عَنْ يَزِيدَ بْنِ أَبِي عُبَيْدٍ، عَنْ سَلَمَةَ بْنِ الأَكْوَعِ ـ رضى الله عنه ـ أَنَّ النَّبِيَّ صلى الله عليه وسلم رَأَى نِيرَانًا تُوقَدُ يَوْمَ خَيْبَرَ‏.‏ قَالَ ‏\"‏ عَلَى مَا تُوقَدُ هَذِهِ النِّيرَانُ ‏\"‏‏.‏ قَالُوا عَلَى الْحُمُرِ الإِنْسِيَّةِ‏.‏ قَالَ ‏\"‏ اكْسِرُوهَا، وَأَهْرِقُوهَا ‏\"‏‏.‏ قَالُوا أَلاَ نُهْرِيقُهَا وَنَغْسِلُهَا قَالَ ‏\"‏ اغْسِلُوا ‏\"‏‏.‏ قَالَ أَبُو عَبْد اللَّهِ كَانَ ابْنُ أَبِي أُوَيْسٍ يَقُولُ الْحُمُرِ الْأَنْسِيَّةِ بِنَصْبِ الْأَلِفِ وَالنُّونِ","b":"وَأُتِيَ شُرَيْحٌ فِي طُنْبُورٍ كُسِرَ فَلَمْ يَقْضِ فِيهِ بِشَيْءٍ শুরাইহ (রহ.)-এর কাছে তান্বুরা ভেঙ্গে ফেলার জন্য মামলা দায়ের করা হলে তিনি এর জন্য কোন জরিমানার ফায়সালা দেননি। ২৪৭৭. সালামাহ ইবনু আকওয়া (রাঃ) হতে বর্ণিত যে, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম খায়বার যুদ্ধে আগুন প্রজ্বলিত দেখে জিজ্ঞেস করলেন, এ আগুন কেন জ্বালানো হচ্ছে? সাহাবীগণ বললেন, গৃহপালিত গাধার গোশত রান্না করার জন্য। তিনি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, পাত্রটি ভেঙ্গে দাও এবং গোশত ফেলে দাও। তাঁরা বললেন, আমরা গোশত ফেলে দিয়ে পাত্রটা ধুয়ে নিব কি? তিনি বললেন, ধুয়ে নাও। আবূ ‘আবদুল্লাহ (বুখারী) (রহ.) বলেন, ইবনু আবূ উয়াইস বললেন, (الإِنْسِيَّةِ) শব্দটি আলিফ ও নুনে যবর হবে। (৪১৯৬, ৫৪৯৭, ৬১৪৮, ৬৩৩১, ৬৮৯১) (আধুনিক প্রকাশনীঃ ২২৯৮, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Salama bin Al-Akwa`:On the day of Khaibar the Prophet (ﷺ) saw fires being lighted. He asked, \"Why are these fires being lighted?\" The people replied that they were cooking the meat of donkeys. He said, \"Break the pots and throw away their contents.\" The people said, \"Shall we throw away their contents and wash the pots (rather than break them)?\" He said, \"Wash them"},{"n":"2478","k":"","a":"حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا سُفْيَانُ، حَدَّثَنَا ابْنُ أَبِي نَجِيحٍ، عَنْ مُجَاهِدٍ، عَنْ أَبِي مَعْمَرٍ، عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ ـ رضى الله عنه ـ قَالَ دَخَلَ النَّبِيُّ صلى الله عليه وسلم مَكَّةَ، وَحَوْلَ الْكَعْبَةِ ثَلاَثُمِائَةٍ وَسِتُّونَ نُصُبًا فَجَعَلَ يَطْعَنُهَا بِعُودٍ فِي يَدِهِ وَجَعَلَ يَقُولُ ‏{‏جَاءَ الْحَقُّ وَزَهَقَ الْبَاطِلُ‏}‏ الآيَةَ‏.‏","b":"‘আবদুল্লাহ ইবনু মাসঊদ (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম যখন (বিজয়ীর বেশে) মক্কায় প্রবেশ করেন, তখন কা‘বা শরীফের চারপাশে তিনশ’ ষাটটি মূর্তি ছিল। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম নিজের হাতের লাঠি দিয়ে মূর্তিগুলোকে আঘাত করতে থাকেন আর বলতে থাকেনঃ ‘‘সত্য এসেছে এবং মিথ্যা বিলুপ্ত হয়েছে, (আয়াতের শেষ পর্যন্ত)’’- (বনী ইসরাঈল/ইসরাঃ ৮১)। (৪২৮৭, ৪৭২০) (আধুনিক প্রকাশনীঃ ২২৯৯, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated `Abdullah bin Mas`ud:The Prophet (ﷺ) entered Mecca and (at that time) there were three hundred-and-sixty idols around the Ka`ba. He started stabbing the idols with a stick he had in his hand and reciting: \"Truth (Islam) has come and Falsehood (disbelief) has vanished"},{"n":"2479","k":"","a":"حَدَّثَنَا إِبْرَاهِيمُ بْنُ الْمُنْذِرِ، حَدَّثَنَا أَنَسُ بْنُ عِيَاضٍ، عَنْ عُبَيْدِ اللَّهِ، عَنْ عَبْدِ الرَّحْمَنِ بْنِ الْقَاسِمِ، عَنْ أَبِيهِ الْقَاسِمِ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ أَنَّهَا كَانَتِ اتَّخَذَتْ عَلَى سَهْوَةٍ لَهَا سِتْرًا فِيهِ تَمَاثِيلُ، فَهَتَكَهُ النَّبِيُّ صلى الله عليه وسلم، فَاتَّخَذَتْ مِنْهُ نُمْرُقَتَيْنِ، فَكَانَتَا فِي الْبَيْتِ يَجْلِسُ عَلَيْهِمَا‏.‏","b":"‘আয়িশাহ (রাযি.) হতে বর্ণিত যে, তিনি তার (কামরার) তাকের সম্মুখে একটি পর্দা ঝুলিয়ে দিলেন, যাতে ছিল প্রাণীর ছবি। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তা ছিঁড়ে ফেললেন। এরপর ‘আয়িশাহ (রাযি.) তা দিয়ে দু’খানা গদি তৈরী করেন। এই গদি দু’খানা ঘরেই ছিল। নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তার উপর বসতেন। (৫৯৫৪, ৫৯৫৫, ৬১০৯) (আধুনিক প্রকাশনীঃ ২৩০০, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Al-Qasim:Aisha said that she hung a curtain decorated with pictures (of animals) on a cupboard. The Prophet (ﷺ) tore that curtain and she turned it into two cushions which remained in the house for the Prophet (ﷺ) to sit on"},{"n":"2480","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يَزِيدَ، حَدَّثَنَا سَعِيدٌ ـ هُوَ ابْنُ أَبِي أَيُّوبَ ـ قَالَ حَدَّثَنِي أَبُو الأَسْوَدِ، عَنْ عِكْرِمَةَ، عَنْ عَبْدِ اللَّهِ بْنِ عَمْرٍو ـ رضى الله عنهما ـ قَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏ \"‏ مَنْ قُتِلَ دُونَ مَالِهِ فَهُوَ شَهِيدٌ ‏\"‏‏.‏","b":"‘আবদুল্লাহ ইবনু আমর (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম -কে বলতে শুনেছি, যে ব্যক্তি তার সম্পদ রক্ষা করতে গিয়ে নিহত হয়, সে শহীদ। (আধুনিক প্রকাশনীঃ ২৩০১, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated `Abdullah bin `Amr bin Al-`As:I heard the Prophet (ﷺ) saying, \"Whoever is killed while protecting his property then he is a martyr"},{"n":"2481","k":"","a":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا يَحْيَى بْنُ سَعِيدٍ، عَنْ حُمَيْدٍ، عَنْ أَنَسٍ ـ رضى الله عنه ـ أَنَّ النَّبِيَّ صلى الله عليه وسلم كَانَ عِنْدَ بَعْضِ نِسَائِهِ، فَأَرْسَلَتْ إِحْدَى أُمَّهَاتِ الْمُؤْمِنِينَ مَعَ خَادِمٍ بِقَصْعَةٍ فِيهَا طَعَامٌ فَضَرَبَتْ بِيَدِهَا، فَكَسَرَتِ الْقَصْعَةَ، فَضَمَّهَا، وَجَعَلَ فِيهَا الطَّعَامَ وَقَالَ ‏ \"‏ كُلُوا ‏\"‏‏.‏ وَحَبَسَ الرَّسُولَ وَالْقَصْعَةَ حَتَّى فَرَغُوا، فَدَفَعَ الْقَصْعَةَ الصَّحِيحَةَ وَحَبَسَ الْمَكْسُورَةَ‏.‏ وَقَالَ ابْنُ أَبِي مَرْيَمَ أَخْبَرَنَا يَحْيَى بْنُ أَيُّوبَ، حَدَّثَنَا حُمَيْدٌ، حَدَّثَنَا أَنَسٌ، عَنِ النَّبِيِّ صلى الله عليه وسلم‏.‏","b":"আনাস (রাঃ) হতে বর্ণিত যে, একদিন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তাঁর কোন এক সহধর্মিণীর কাছে ছিলেন। উম্মুল মু’মিনীনদের অপর একজন খাদিমের মারফত এক পাত্রে খাবার পাঠালেন। তিনি তার হাতের আঘাতে পাত্রটি ভেঙ্গে ফেলেন। তখন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তা জোড়া লাগিয়ে তাতে খাবার রাখলেন এবং (সাথীদেরকে) বললেন, তোমরা খাও। যে পর্যন্ত তাঁরা খাওয়া শেষ না করলেন, সে পর্যন্ত নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম পাত্রটি ও প্রেরিত খাদেমকে আটকিয়ে রাখলেন। তারপর তিনি ভাঙ্গা পাত্রটি রেখে দিয়ে একটি ভাল পাত্র ফেরত দিলেন। ইবনু আবূ মারইয়াম (রহ.) ...... আনাস (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত আছে। (৫২২৫) (আধুনিক প্রকাশনীঃ ২৩০২, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Anas:While the Prophet (ﷺ) was with one of his wives, one of the mothers of the believers (i.e. one of his wives) sent a wooden bowl containing food with a servant. The wife (in whose house he was sitting) stroke the bowl with her hand and broke it. The Prophet (ﷺ) collected the shattered pieces and put the food back in it and said, \"Eat.\" He kept the servant and the bowl till he had eaten the food. Then the Prophet gave another unbroken. bowl to the servant and kept the broken one"},{"n":"2482","k":"","a":"حَدَّثَنَا مُسْلِمُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا جَرِيرُ بْنُ حَازِمٍ، عَنْ مُحَمَّدِ بْنِ سِيرِينَ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ كَانَ رَجُلٌ فِي بَنِي إِسْرَائِيلَ، يُقَالُ لَهُ جُرَيْجٌ، يُصَلِّي، فَجَاءَتْهُ أُمُّهُ فَدَعَتْهُ، فَأَبَى أَنْ يُجِيبَهَا، فَقَالَ أُجِيبُهَا أَوْ أُصَلِّي ثُمَّ أَتَتْهُ، فَقَالَتِ اللَّهُمَّ لاَ تُمِتْهُ حَتَّى تُرِيَهُ الْمُومِسَاتِ‏.‏ وَكَانَ جُرَيْجٌ فِي صَوْمَعَتِهِ، فَقَالَتِ امْرَأَةٌ لأَفْتِنَنَّ جُرَيْجًا‏.‏ فَتَعَرَّضَتْ لَهُ فَكَلَّمَتْهُ فَأَبَى، فَأَتَتْ رَاعِيًا، فَأَمْكَنَتْهُ مِنْ نَفْسِهَا فَوَلَدَتْ غُلاَمًا، فَقَالَتْ هُوَ مِنْ جُرَيْجٍ‏.‏ فَأَتَوْهُ، وَكَسَرُوا صَوْمَعَتَهُ فَأَنْزَلُوهُ وَسَبُّوهُ، فَتَوَضَّأَ وَصَلَّى ثُمَّ أَتَى الْغُلاَمَ، فَقَالَ مَنْ أَبُوكَ يَا غُلاَمُ قَالَ الرَّاعِي‏.‏ قَالُوا نَبْنِي صَوْمَعَتَكَ مِنْ ذَهَبٍ‏.‏ قَالَ لاَ إِلاَّ مِنْ طِينٍ ‏\"‏‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, বনী ইসরাঈলের মধ্যে জুরাইজ নামক একজন লোক ছিলেন। একদিন তিনি সালাত আদায় করছিলেন। এমন সময় তাঁর মা তাকে ডাকলেন। কিন্তু তিনি তাঁর ডাকে সাড়া দিলেন না। তিনি বললেন, সালাত আদায় করব, না কি তার জবাব দেব। তারপর মা তাঁর কাছে এলেন এবং বললেন, হে আল্লাহ! তাকে মৃত্যু দিও না যে পর্যন্ত তুমি তাকে কোন বেশ্যার মুখ না দেখাও। একদিন জুরাইজ তার ইবাদত খানায় ছিলেন। এমন সময় এক মহিলা বললেন, আমি জুরাইজকে ফাঁসিয়ে ছাড়ব। তখন সে তার নিকট গেল এবং তার সাথে কথাবার্তা বলল। কিন্তু তিনি অস্বীকৃতি জানালেন। তারপর সে মহিলা এক রাখালের কাছে এসে স্বেচ্ছায় নিজেকে তার হাতে সঁপে দিল। তার কিছুদিন পর সে একটি ছেলে প্রসব করল। তখন সে বলে বেড়াতে লাগল যে, এ ছেলে জুরাইজের! এ কথা শুনে লোকেরা জুরাইজের নিকট এল এবং তার ইবাদতখানা ভেঙ্গে তাকে বের করে দিল এবং তাকে গালিগালাজ করল। এরপর তিনি (জুরাইজ) অযু করলেন এবং সালাত আদায় করলেন। তারপর তিনি ছেলেটির কাছে এসে বললেন, হে ছেলে! তোমার পিতা কে? সে জবাব দিল, রাখাল। তখন লোকেরা বলল, আমরা তোমার ইবাদতখানাটি সোনা দিয়ে তৈরী করে দিব। জুরাইজ বললেন, না মাটি দিয়েই তৈরী করে দাও (যেমনটা পূর্বে ছিল)। (১২০৬) (আধুনিক প্রকাশনীঃ ২৩০৩, ইসলামিক ফাউন্ডেশনঃ)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"There was an Israeli man called Juraij, while he was praying, his mother came and called him, but he did not respond to her call. He said (to himself) whether he should continue the prayer or reply to his mother. She came to him the second time and called him and said, \"O Allah! Do not let him die until he sees the faces of prostitutes.\" Juraij used to live in a hermitage. A woman said that she would entice Juraij, so she went to him and presented herself (for an evil act) but he refused. She then went to a shepherd and allowed him to commit an illegal sexual intercourse with her and later she gave birth to a boy. She alleged that the baby was from Juraij. The people went to Juraij and broke down his hermitage, pulled him out of it and abused him. He performed ablution and offered the prayer, then he went to the male (baby) and asked him; \"O boy! Who is your father?\" The baby replied that his father was the shepherd. The people said that they would build for him a hermitage of gold but Juraij asked them to make it of mud only"}]},{"id":"zm","name":"সহীহ মুসলিম","short":"মুসলিম","sub":"কিতাবুল বির্র · জুলুম হারাম ও মাযলুমের সাহায্য","items":[{"n":"6572","k":"2577.01","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الرَّحْمَنِ بْنِ بَهْرَامَ الدَّارِمِيُّ، حَدَّثَنَا مَرْوَانُ، - يَعْنِي ابْنَ مُحَمَّدٍ الدِّمَشْقِيَّ - حَدَّثَنَا سَعِيدُ بْنُ عَبْدِ الْعَزِيزِ، عَنْ رَبِيعَةَ بْنِ يَزِيدَ، عَنْ أَبِي إِدْرِيسَ الْخَوْلاَنِيِّ، عَنْ أَبِي ذَرٍّ، عَنِ النَّبِيِّ صلى الله عليه وسلم فِيمَا رَوَى عَنِ اللَّهِ، تَبَارَكَ وَتَعَالَى أَنَّهُ قَالَ ‏ \"‏ يَا عِبَادِي إِنِّي حَرَّمْتُ الظُّلْمَ عَلَى نَفْسِي وَجَعَلْتُهُ بَيْنَكُمْ مُحَرَّمًا فَلاَ تَظَالَمُوا يَا عِبَادِي كُلُّكُمْ ضَالٌّ إِلاَّ مَنْ هَدَيْتُهُ فَاسْتَهْدُونِي أَهْدِكُمْ يَا عِبَادِي كُلُّكُمْ جَائِعٌ إِلاَّ مَنْ أَطْعَمْتُهُ فَاسْتَطْعِمُونِي أُطْعِمْكُمْ يَا عِبَادِي كُلُّكُمْ عَارٍ إِلاَّ مَنْ كَسَوْتُهُ فَاسْتَكْسُونِي أَكْسُكُمْ يَا عِبَادِي إِنَّكُمْ تُخْطِئُونَ بِاللَّيْلِ وَالنَّهَارِ وَأَنَا أَغْفِرُ الذُّنُوبَ جَمِيعًا فَاسْتَغْفِرُونِي أَغْفِرْ لَكُمْ يَا عِبَادِي إِنَّكُمْ لَنْ تَبْلُغُوا ضَرِّي فَتَضُرُّونِي وَلَنْ تَبْلُغُوا نَفْعِي فَتَنْفَعُونِي يَا عِبَادِي لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَتْقَى قَلْبِ رَجُلٍ وَاحِدٍ مِنْكُمْ مَا زَادَ ذَلِكَ فِي مُلْكِي شَيْئًا يَا عِبَادِي لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ كَانُوا عَلَى أَفْجَرِ قَلْبِ رَجُلٍ وَاحِدٍ مَا نَقَصَ ذَلِكَ مِنْ مُلْكِي شَيْئًا يَا عِبَادِي لَوْ أَنَّ أَوَّلَكُمْ وَآخِرَكُمْ وَإِنْسَكُمْ وَجِنَّكُمْ قَامُوا فِي صَعِيدٍ وَاحِدٍ فَسَأَلُونِي فَأَعْطَيْتُ كُلَّ إِنْسَانٍ مَسْأَلَتَهُ مَا نَقَصَ ذَلِكَ مِمَّا عِنْدِي إِلاَّ كَمَا يَنْقُصُ الْمِخْيَطُ إِذَا أُدْخِلَ الْبَحْرَ يَا عِبَادِي إِنَّمَا هِيَ أَعْمَالُكُمْ أُحْصِيهَا لَكُمْ ثُمَّ أُوَفِّيكُمْ إِيَّاهَا فَمَنْ وَجَدَ خَيْرًا فَلْيَحْمَدِ اللَّهَ وَمَنْ وَجَدَ غَيْرَ ذَلِكَ فَلاَ يَلُومَنَّ إِلاَّ نَفْسَهُ ‏\"‏ ‏.‏ قَالَ سَعِيدٌ كَانَ أَبُو إِدْرِيسَ الْخَوْلاَنِيُّ إِذَا حَدَّثَ بِهَذَا الْحَدِيثِ جَثَا عَلَى رُكْبَتَيْهِ ‏.‏","b":"‘আবদুল্লাহ ইবনু আবদুর রহমান ইবনু বাহরাম আদ দারিমী (রহঃ) ..... আবু যার (রাযিঃ) থেকে বর্ণিত যে, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ইরশাদ করেনঃ আল্লাহ তা’আলা বলেছেন, ওহে আমার বান্দারা! আমি আমার নিজ সত্তার উপর অত্যাচারকে হারাম করে নিয়েছি এবং তোমাদের মধ্যেও তা হারাম বলে ঘোষণা করছি। অতএব তোমরা একে অপরের উপর অত্যাচার করো না। হে আমার বান্দারা! তোমরা সবাই ছিলে দিশেহারা, তবে আমি যাকে সুপথ দেখিয়েছি সে ব্যতীত। তোমরা আমার কাছে হিদায়াত প্রার্থনা কর আমি তোমাদের হিদায়াত দান করব। হে আমার বান্দারা! তোমরা সবাই ক্ষুধার্ত, তবে আমি যাকে খাদ্য দান করি সে ব্যতীত। তোমরা আমার কাছে আহার্য চাও, আমি তোমাদের আহার করাব। হে আমার বান্দারা! তোমরা সবাই বস্ত্রহীন, কিন্তু আমি যাকে পরিধান করাই সে ব্যতীত। তোমরা আমার কাছে পরিধেয় চাও, আমি তোমাদের পরিধান করাব। হে আমার বান্দারা! তোমরা রাতদিন অপরাধ করে থাকো। আর আমিই সব অপরাধ ক্ষমা করি। সুতরাং তোমরা আমার কাছে মাগফিরাত প্রার্থনা করো, আমি তোমাদেরকে ক্ষমা করে দিব। হে আমার বান্দারা তোমরা কখনো আমার অনিষ্ট করতে পারবে না, যাতে আমি ক্ষতিগ্রস্ত হই এবং তোমরা কখনো আমার উপকার করতে পারবে না, যাতে আমি উপকৃত হই। হে আমার বান্দারা! তোমাদের আদি, তোমাদের অন্ত, তোমাদের মানুষ ও জিন জাতির মধ্যে যার অন্তর আমাকে সবচাইতে বেশী ভয় পায়, তোমরা সবাই যদি তার মতো হয়ে যাও তাতে আমার রাজত্ব একটুও বৃদ্ধি পাবে না। হে আমার বান্দাগণ! তোমাদের আদি, তোমাদের অন্ত, তোমাদের সকল মানুষ ও সকল জিন জাতির মধ্যে যার অন্তর সবচাইতে পাপিষ্ঠ তোমরা সবাই যদি তার মতো হয়ে যাও তাহলে আমার রাজত্ব কিছুমাত্র হ্রাস পাবে না। হে আমার বান্দা! তোমাদের আদি থেকে অন্ত পর্যন্ত সকল মানুষ ও জিন যদি কোন বিশাল মাঠে দাঁড়িয়ে সবাই আমার কাছে আবদার করে আর আমি প্রত্যেক ব্যক্তির চাহিদা পূরণ করি তাহলে আমার কাছে যা আছে তাতে এর চাইতে বেশী হ্রাস পাবে না, যেমন কেউ সমুদ্রে একটি সূচ ডুবিয়ে দিলে যতটুকু তাথেকে হ্রাস পায়। হে আমার বান্দারা। আমি তোমাদের ‘আমলই তোমাদের জন্য সংরক্ষিত রাখি। এরপর পুরোপুরিভাবে তার বিনিময় প্রদান করে থাকি। সুতরাং যে ব্যক্তি কোন কল্যাণ অর্জন করে সে যেন আল্লাহর প্রশংসা করে। আর যে তা ব্যতীত অন্য কিছু পায়, তবে সে যেন নিজেকেই দোষারোপ করে। সাঈদ (রহঃ) বলেন, আবু ইদরীস আল খাওলানী (রহঃ) যখন এ হাদীস বর্ণনা করতেন তখন তিনি দু’হাটুর উপর ভর দিয়ে বসতেন। (ইসলামিক ফাউন্ডেশন ৬৩৩৮, ইসলামিক সেন্টার)","e":"Abu Dharr reported Allah's Messenger (ﷺ) as saying that Allah, the Exalted and Glorious, said:\"O My servants, I have forbidden oppression for Myself and have made it forbidden amongst you, so do not oppress one another. O My servants, all of you are astray except for those I have guided, so seek guidance of Me and I shall guide you, O My servants, all of you are hungry except for those I have fed, so seek food of Me and I shall feed you. O My servants, all of you are naked except for those I have clothed, so seek clothing of Me and I shall clothe you. O My servants, you sin by night and by day, and I forgive all sins, so seek forgiveness of Me and I shall forgive you. O My servants, you will not attain harming Me so as to harm Me, and will not attain benefitting Me so as to benefit Me. O My servants, were the first of you and the last of you, the human of you and the jinn of you to be as pious as the most pious heart of any one man of you, that would not increase My dominion in anything. O My servants, were the first of you and the last of you, the human of you and the jinn of you to be as wicked as the most wicked heart of any one man of you, that would not decrease My dominion in anything. O My servants, were the first of you and the last of you, the human of you and the jinn of you to rise up in one place and make a request of Me, and were I to give everyone what he requested, that would not decrease what I have, any more that a needle decreases the sea if put into it. O My servants, it is but your deeds that I record for you and then recompense you for. So let him who finds good, praise Allah, and let him who finds other than that blame no one but himself.\" Sa'id said that when Abu Idris Khaulini narrated this hadith he knelt upon his knees"},{"n":"6573","k":"2577.02","a":"حَدَّثَنِيهِ أَبُو بَكْرِ بْنُ إِسْحَاقَ، حَدَّثَنَا أَبُو مُسْهِرٍ، حَدَّثَنَا سَعِيدُ بْنُ عَبْدِ الْعَزِيزِ، بِهَذَا الإِسْنَادِ غَيْرَ أَنَّ مَرْوَانَ أَتَمُّهُمَا حَدِيثًا ‏.‏","b":"আবূ বাকর ইবনু ইসহাক (রহঃ) ..... সাঈদ ইবনু আবদুল আযীয (রাযিঃ) এ সানাদে রিওয়ায়াত করেন। তবে তাদের উভয়ের মধ্যে মারওয়ান পূর্ণাঙ্গ হাদীস বর্ণনা করেছেন। (ইসলামিক ফাউন্ডেশন ৬৩৩৮, ইসলামিক সেন্টার)","e":"The hadith is narrated through Abu Mushir from Sa'id bin 'Abdil'Aziz except that the previous hadith through Marwan was the more complete of the two"},{"n":"6574","k":"2577.03","a":"قَالَ أَبُو إِسْحَاقَ حَدَّثَنَا بِهَذَا الْحَدِيثِ الْحَسَنُ، وَالْحُسَيْنُ، ابْنَا بِشْرٍ وَمُحَمَّدُ بْنُ يَحْيَى قَالُوا حَدَّثَنَا أَبُو مُسْهِرٍ، ‏.‏ فَذَكَرُوا الْحَدِيثَ بِطُولِهِ ‏.‏","b":"আবু ইসহাক (রহঃ) বলেন, বিশর (রহঃ) এর পুত্রদ্বয় হাসান ও হুসায়ন এবং মুহাম্মাদ ইবনু ইয়াহইয়া বলেছেন, আমাদের নিকট আবূ মুসহির এ হাদীসটি পুরোটাই বর্ণনা করেছেন। (ইসলামিক ফাউন্ডেশন ৬৩৩৮, ইসলামিক সেন্টার)","e":"This hadith is also transmitted through Ibna Bashr and Muhammad bin Muhammad through Abu Mashur through the same chain, narrated to its (full) extent"},{"n":"6575","k":"2577.04","a":"حَدَّثَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، وَمُحَمَّدُ بْنُ الْمُثَنَّى، كِلاَهُمَا عَنْ عَبْدِ الصَّمَدِ بْنِ عَبْدِ، الْوَارِثِ حَدَّثَنَا هَمَّامٌ، حَدَّثَنَا قَتَادَةُ، عَنْ أَبِي قِلاَبَةَ، عَنْ أَبِي أَسْمَاءَ، عَنْ أَبِي ذَرٍّ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم فِيمَا يَرْوِي عَنْ رَبِّهِ تَبَارَكَ وَتَعَالَى ‏ \"‏ إِنِّي حَرَّمْتُ عَلَى نَفْسِي الظُّلْمَ وَعَلَى عِبَادِي فَلاَ تَظَالَمُوا ‏\"‏ ‏.‏ وَسَاقَ الْحَدِيثَ بِنَحْوِهِ وَحَدِيثُ أَبِي إِدْرِيسَ الَّذِي ذَكَرْنَاهُ أَتَمُّ مِنْ هَذَا ‏.‏","b":"ইসহাক ইবনু ইবরাহীম ও মুহাম্মাদ ইবনুল মুসান্না (রহঃ) ..... আবু যার (রাযিঃ) থেকে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ তার মহিমাম্বিত পরওয়ারদিগার ইরশাদ করেন, আমি আমার নিজের উপর ও বান্দাদের উপর অত্যাচারকে হারাম করে নিয়েছি। অতএব তোমরা পরস্পর পরস্পরকে অত্যাচার করো না। অতঃপর রাবী হাদীসটি অনুরূপ বর্ণনা করেছেন। আর আবু ইদরীস (রহঃ) বর্ণিত যে হাদীসটি আমরা বিবৃত করেছি তা এর চাইতে অধিক পূর্ণাঙ্গ। (ইসলামিক ফাউন্ডেশন ৬৩৩৯, ইসলামিক সেন্টার)","e":"Abu Dharr reported Allah's Messenger (ﷺ) as saying that he reported it from his Lord, the Exalted and Glorious:Verily I have made oppression unlawful for Me and for My servants too, so do not commit oppression. The rest of the hadith is the same"},{"n":"6576","k":"2578","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ بْنِ قَعْنَبٍ، حَدَّثَنَا دَاوُدُ، - يَعْنِي ابْنَ قَيْسٍ - عَنْ عُبَيْدِ، اللَّهِ بْنِ مِقْسَمٍ عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ اتَّقُوا الظُّلْمَ فَإِنَّ الظُّلْمَ ظُلُمَاتٌ يَوْمَ الْقِيَامَةِ وَاتَّقُوا الشُّحَّ فَإِنَّ الشُّحَّ أَهْلَكَ مَنْ كَانَ قَبْلَكُمْ حَمَلَهُمْ عَلَى أَنْ سَفَكُوا دِمَاءَهُمْ وَاسْتَحَلُّوا مَحَارِمَهُمْ ‏\"‏ ‏.‏","b":"আবদুল্লাহ ইবনু মাসলামাহ্ ইবনু কা'নাব (রহঃ) ..... জাবির ইবনু আবদুল্লাহ (রাযিঃ) থেকে বর্ণিত যে, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ তোমরা অত্যাচার করা থেকে বিরত থাক। কেননা কিয়ামত দিবসে অত্যাচার অন্ধকারে পরিণত হবে। তোমরা কৃপণতা থেকে সাবধান হও। কেননা এ কৃপণতাই তোমাদের আগেকার কাওমকে ধ্বংস করেছে। এ কৃপণতা তাদের খুন-খারাবী ও রক্তপাতে উৎসাহ যুগিয়েছে এবং হারাম বস্তুসমূহ হালাল জ্ঞান করতে প্রলোভন দিয়েছে। (ইসলামিক ফাউন্ডেশন ৬৩৪০, ইসলামিক সেন্টার)","e":"Jabir b. Abdullah reported that Allah's Messenger (ﷺ) said:Be on your guard against committing oppression, for oppression is a darkness on the Day of Resurrection, and be on your guard against stinginess for stinginess destroyed those who were before you, as it incited them to shed blood and make lawful what was unlawful for them"},{"n":"6577","k":"2579","a":"حَدَّثَنِي مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا شَبَابَةُ، حَدَّثَنَا عَبْدُ الْعَزِيزِ الْمَاجِشُونُ، عَنْ عَبْدِ اللَّهِ، بْنِ دِينَارٍ عَنِ ابْنِ عُمَرَ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ إِنَّ الظُّلْمَ ظُلُمَاتٌ يَوْمَ الْقِيَامَةِ ‏\"‏ ‏.‏","b":"মুহাম্মাদ ইবনু হাতিম (রহঃ) ..... ইবনু উমার (রাযিঃ) থেকে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, অবশ্যই যুলম কিয়ামত দিবসে ঘোরতর অন্ধকারে পরিণত হবে। (ইসলামিক ফাউন্ডেশন ৬৩৪১, ইসলামিক সেন্টার)","e":"Ibu 'Umar reported Allah's Messenger (ﷺ) as saying:Oppression is the darkness on the Day of Resurrection"},{"n":"6578","k":"2580","a":"حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا لَيْثٌ، عَنْ عُقَيْلٍ، عَنِ الزُّهْرِيِّ، عَنْ سَالِمٍ، عَنْ أَبِيهِ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ الْمُسْلِمُ أَخُو الْمُسْلِمِ لاَ يَظْلِمُهُ وَلاَ يُسْلِمُهُ مَنْ كَانَ فِي حَاجَةِ أَخِيهِ كَانَ اللَّهُ فِي حَاجَتِهِ وَمَنْ فَرَّجَ عَنْ مُسْلِمٍ كُرْبَةً فَرَّجَ اللَّهُ عَنْهُ بِهَا كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ وَمَنْ سَتَرَ مُسْلِمًا سَتَرَهُ اللَّهُ يَوْمَ الْقِيَامَةِ ‏\"‏ ‏.‏","b":"কুতাইবাহ ইবনু সাঈদ (রহঃ) ..... সালিম-এর পিতা থেকে বর্ণিত যে, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ইরশাদ করেনঃ এক মুসলিম আরেক মুসলিমের ভাই। সে তার প্রতি অত্যাচার করে না এবং তাকে দুশমনের হাতে সোপর্দও করে না। যে ব্যক্তি তার ভাই এর অভাব-অনটন পূরণ করবে আল্লাহ তার অভাব-অনটন দূরীভূত করবেন। আর যে ব্যক্তি কোন মুসলিমের বিপদ দূর করবে, আল্লাহ তা’আলা তার প্রতিদানে কিয়ামত দিবসে তাকে বিপদ থেকে পরিত্রাণ দিবেন। আর যে ব্যক্তি মুসলিমের দোষ-ত্রুটি লুকিয়ে রাখবে, আল্লাহ তা’আলা কিয়ামত দিবসে তার দোষ-ত্রুটি লুকিয়ে রাখবেন। (ইসলামিক ফাউন্ডেশন ৬৩৪২, ইসলামিক সেন্টার)","e":"Salim reported on the authority of his father that Allah's Messenger (ﷺ) said:A Muslim is the brother of a fellow-Muslim. He should neither commit oppression upon him nor ruin him, and he who meets the need of a brot'ier, Allah would meet big needs, and he who relieved a Muslim from hardship Allah would relieve him from the hardships to which he would be put on the Day of Resurrection, and he who did not expose (the follies of a Muslim) Allah would conceal his follies on the Day of Resurrection"},{"n":"6579","k":"2581","a":"حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، وَعَلِيُّ بْنُ حُجْرٍ، قَالاَ حَدَّثَنَا إِسْمَاعِيلُ، - وَهُوَ ابْنُ جَعْفَرٍ - عَنِ الْعَلاَءِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏\"‏ أَتَدْرُونَ مَا الْمُفْلِسُ ‏\"‏ ‏.‏ قَالُوا الْمُفْلِسُ فِينَا مَنْ لاَ دِرْهَمَ لَهُ وَلاَ مَتَاعَ ‏.‏ فَقَالَ ‏\"‏ إِنَّ الْمُفْلِسَ مِنْ أُمَّتِي يَأْتِي يَوْمَ الْقِيَامَةِ بِصَلاَةٍ وَصِيَامٍ وَزَكَاةٍ وَيَأْتِي قَدْ شَتَمَ هَذَا وَقَذَفَ هَذَا وَأَكَلَ مَالَ هَذَا وَسَفَكَ دَمَ هَذَا وَضَرَبَ هَذَا فَيُعْطَى هَذَا مِنْ حَسَنَاتِهِ وَهَذَا مِنْ حَسَنَاتِهِ فَإِنْ فَنِيَتْ حَسَنَاتُهُ قَبْلَ أَنْ يُقْضَى مَا عَلَيْهِ أُخِذَ مِنْ خَطَايَاهُمْ فَطُرِحَتْ عَلَيْهِ ثُمَّ طُرِحَ فِي النَّارِ ‏\"‏ ‏.‏","b":"কুতাইবাহ ইবনু সাঈদ ও ‘আলী ইবনু হুজর (রহঃ) ..... আবু হুরাইরাহ (রাযিঃ) থেকে বর্ণিত। রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেনঃ তোমরা কি বলতে পার, অভাবী লোক কে? তারা বললেন, আমাদের মাঝে যার দিরহাম (টাকা কড়ি) ও ধন-সম্পদ নেই সে তো অভাবী লোক। তখন তিনি বললেন, আমার উম্মাতের মধ্যে সে প্রকৃত অভাবী লোক, যে ব্যক্তি কিয়ামতের দিন সালাত, সাওম ও যাকাত নিয়ে আসবে; অথচ সে এ অবস্থায় আসবে যে, সে কাউকে গালি দিয়েছে, কাউকে অপবাদ দিয়েছে, অমুকের সম্পদ ভোগ করেছে, অমুককে হত্যা করেছে ও আরেকজনকে প্রহার করেছে। এরপর সে ব্যক্তিকে তার নেক ‘আমল থেকে দেয়া হবে, অমুককে নেক আমল থেকে দেয়া হবে। এরপর যদি পাওনাদারের হাক তার নেক ‘আমল থেকে পূরণ করা না যায় সে ঋণের পরিবর্তে তাদের পাপের একাংশ তার প্রতি নিক্ষেপ করা হবে। এরপর তাকে জাহান্নামে নিক্ষেপ করা হবে। (ইসলামিক ফাউন্ডেশন ৬৩৪৩, ইসলামিক সেন্টার)","e":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:Do you know who is poor? They (the Companions of the Holy Prophet) said: A poor man amongst us is one who has neither dirham with him nor wealth. He (the Holy Prophet) said: The poor of my Umma would be he who would come on the Day of Resurrection with prayers and fasts and Zakat but (he would find himself bankrupt on that day as he would have exhausted his funds of virtues) since he hurled abuses upon others, brought calumny against others and unlawfully consumed the wealth of others and shed the blood of others and beat others, and his virtues would be credited to the account of one (who suffered at his hand). And if his good deeds fall short to clear the account, then his sins would be entered in (his account) and he would be thrown in the Hell-Fire"},{"n":"6580","k":"2582","a":"حَدَّثَنَا يَحْيَى بْنُ أَيُّوبَ، وَقُتَيْبَةُ، وَابْنُ، حُجْرٍ قَالُوا حَدَّثَنَا إِسْمَاعِيلُ، - يَعْنُونَ ابْنَ جَعْفَرٍ - عَنِ الْعَلاَءِ، عَنْ أَبِيهِ، عَنْ أَبِي هُرَيْرَةَ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ لَتُؤَدُّنَّ الْحُقُوقَ إِلَى أَهْلِهَا يَوْمَ الْقِيَامَةِ حَتَّى يُقَادَ لِلشَّاةِ الْجَلْحَاءِ مِنَ الشَّاةِ الْقَرْنَاءِ ‏\"‏ ‏.‏","b":"ইয়াহইয়া ইবনু আইয়্যুব, কুতাইবাহ ও ইবনু হুজর (রহঃ) ..... আবু হুরাইরাহ্ (রাযিঃ) থেকে বর্ণিত যে, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ কিয়ামতের দিন প্রত্যেক পাওনাদারকে তার পাওনা চুকিয়ে দিতে হবে। এমনকি শিং বিশিষ্ট বকরী থেকে শিং বিহীন বকরীর প্রতিশোধ গ্রহণ করা হবে। (ইসলামিক ফাউন্ডেশন ৬৩৪৪, ইসলামিক সেন্টার)","e":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:“Rights will certainly be restored to those entitled to them on the Day of Resurrection, (to the point that) even the hornless sheep will lay claim upon the horned one.”"},{"n":"6581","k":"2583","a":"حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ اللَّهِ بْنِ نُمَيْرٍ، حَدَّثَنَا أَبُو مُعَاوِيَةَ، حَدَّثَنَا بُرَيْدُ بْنُ أَبِي بُرْدَةَ، عَنْ أَبِيهِ، عَنْ أَبِي مُوسَى، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ إِنَّ اللَّهَ عَزَّ وَجَلَّ يُمْلِي لِلظَّالِمِ فَإِذَا أَخَذَهُ لَمْ يُفْلِتْهُ ‏\"‏ ‏.‏ ثُمَّ قَرَأَ ‏{‏ وَكَذَلِكَ أَخْذُ رَبِّكَ إِذَا أَخَذَ الْقُرَى وَهِيَ ظَالِمَةٌ إِنَّ أَخْذَهُ أَلِيمٌ شَدِيدٌ‏}‏","b":"মুহাম্মাদ ইবনু আবদুল্লাহ ইবনু নুমায়র (রহঃ) ..... আবূ মুসা আশ’আরী (রাযিঃ) থেকে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ অবশ্যই মহান আল্লাহ যালিমকে সুযোগ দেন। এরপর তিনি যখন তাকে পাকড়াও করেন তখন তাকে ছাড়েন না। এরপর তিনি তিলাওয়াত করেন, \"এভাবেই তোমার প্রতিপালকের পাকড়াও- যখন কোন অত্যাচারী জনপদবাসীকে তিনি পাকড়াও করেন। নিশ্চয়ই তার পাকড়াও চরম মর্মাত্তিক, অতিশয় কঠোর\"— (সূরা হুদ ১১ঃ ১০২)। (ইসলামিক ফাউন্ডেশন ৬৩৪৫, ইসলামিক সেন্টার)","e":"Abu Musa reported Allah's Messenger (ﷺ) as saying:Allah, the Exalted and Glorious, grants respite to the oppessor. But when He lays Hand upon him, He does not then let him off. Re (the Holy Prophet) then recited this verse:\" Such is the chastisement of thy Lord when He chastises the towns (inhabited by) wrongdoing persons. Surely, His punishment is painful, severe\" (xi)"},{"n":"6582","k":"2584.01","a":"حَدَّثَنَا أَحْمَدُ بْنُ عَبْدِ اللَّهِ بْنِ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا أَبُو الزُّبَيْرِ، عَنْ جَابِرٍ، قَالَ اقْتَتَلَ غُلاَمَانِ غُلاَمٌ مِنَ الْمُهَاجِرِينَ وَغُلاَمٌ مِنَ الأَنْصَارِ فَنَادَى الْمُهَاجِرُ أَوِ الْمُهَاجِرُونَ يَا لَلْمُهَاجِرِينَ ‏.‏ وَنَادَى الأَنْصَارِيُّ يَا لَلأَنْصَارِ ‏.‏ فَخَرَجَ رَسُولُ اللَّهِ صلى الله عليه وسلم فَقَالَ ‏\"‏ مَا هَذَا دَعْوَى أَهْلِ الْجَاهِلِيَّةِ ‏\"‏ ‏.‏ قَالُوا لاَ يَا رَسُولَ اللَّهِ إِلاَّ أَنَّ غُلاَمَيْنِ اقْتَتَلاَ فَكَسَعَ أَحَدُهُمَا الآخَرَ قَالَ ‏\"‏ فَلاَ بَأْسَ وَلْيَنْصُرِ الرَّجُلُ أَخَاهُ ظَالِمًا أَوْ مَظْلُومًا إِنْ كَانَ ظَالِمًا فَلْيَنْهَهُ فَإِنَّهُ لَهُ نَصْرٌ وَإِنْ كَانَ مَظْلُومًا فَلْيَنْصُرْهُ ‏\"‏ ‏.‏","b":"আহমাদ ইবনু আবদুল্লাহ ইবনু ইউনুস (রহঃ) ..... জাবির (রাযিঃ) থেকে বর্ণিত। তিনি বলেন, আনসার ও মুহাজিরদের দু'টি গোলাম হাতাহাতি করছিল। তখন মুহাজির গোলাম এ বলে চীৎকার দিল, হে মুহাজিরগণ! পক্ষান্তরে আনসারী গোলামও ডাকল, হে আনসারগণ! তখন রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বের হয়ে বললেন, এ কী ব্যাপার! জাহিলী যুগের লোকেদের মতো হাক-ডাক করছ? তারা বললেন, হে আল্লাহর রসূল সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম! না, দু'টি গোলাম ঝগড়া করেছে। তাদের একজন অপরজনের পশ্চাতে আঘাত করেছে। তখন তিনি বললেন, এতো মামুলী ব্যাপার। প্রত্যেক ব্যক্তির জন্য উচিত যেন সে তার ভাইয়ের সাহায্য করে, সে অত্যাচারী হোক কিংবা অত্যাচারিত। যদি সে অত্যাচারী হয় তাহলে তাকে (যুলম থেকে) বিরত রাখবে। এ হচ্ছে তার জন্য সাহায্য। আর যদি সে অত্যাচারিত হয় তাহলে তাকে সাহায্য করবে। (ইসলামিক ফাউন্ডেশন ৬৩৪৬, ইসলামিক সেন্টার)","e":"Jabir b. Abdullah reported that two young men, one from the Muhajirin (emigrants) and the other one from the Angr (helpers) fell into dispute and the Muhajir called his fellow Muhajirin, and the Ansari (the helper) called the Ansar (for help). In the meanwhile, Allah's Messenger (ﷺ) came there and said:What is this, the proclamation of the days of jahiliya (ignorance)? They said: Allah's Messenger, there is nothing serious. The two young men fell into dispute and the one struck at the back of the other. Thereupon he (the Holy Prophet) said: Well, a person should help his brother whether he is an oppressor or an oppressed. If he is the oppressor he should prevent him from doing it, for that is his help; and if he is the oppressed he should be helped (against oppression)"},{"n":"6583","k":"2584.02","a":"حَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَزُهَيْرُ بْنُ حَرْبٍ، وَأَحْمَدُ بْنُ عَبْدَةَ الضَّبِّيُّ، وَابْنُ أَبِي، عُمَرَ - وَاللَّفْظُ لاِبْنِ أَبِي شَيْبَةَ - قَالَ ابْنُ عَبْدَةَ أَخْبَرَنَا وَقَالَ الآخَرُونَ، حَدَّثَنَا سُفْيَانُ بْنُ، عُيَيْنَةَ قَالَ سَمِعَ عَمْرٌو، جَابِرَ بْنَ عَبْدِ اللَّهِ يَقُولُ كُنَّا مَعَ النَّبِيِّ صلى الله عليه وسلم فِي غَزَاةٍ فَكَسَعَ رَجُلٌ مِنَ الْمُهَاجِرِينَ رَجُلاً مِنَ الأَنْصَارِ فَقَالَ الأَنْصَارِيُّ يَا لَلأَنْصَارِ وَقَالَ الْمُهَاجِرِيُّ يَا لَلْمُهَاجِرِينَ ‏.‏ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ مَا بَالُ دَعْوَى الْجَاهِلِيَّةِ ‏\"‏ ‏.‏ قَالُوا يَا رَسُولَ اللَّهِ كَسَعَ رَجُلٌ مِنَ الْمُهَاجِرِينَ رَجُلاً مِنَ الأَنْصَارِ ‏.‏ فَقَالَ ‏\"‏ دَعُوهَا فَإِنَّهَا مُنْتِنَةٌ ‏\"‏ ‏.‏ فَسَمِعَهَا عَبْدُ اللَّهِ بْنُ أُبَىٍّ فَقَالَ قَدْ فَعَلُوهَا وَاللَّهِ لَئِنْ رَجَعْنَا إِلَى الْمَدِينَةِ لَيُخْرِجَنَّ الأَعَزُّ مِنْهَا الأَذَلَّ ‏.‏ قَالَ عُمَرُ دَعْنِي أَضْرِبْ عُنُقَ هَذَا الْمُنَافِقِ فَقَالَ ‏\"‏ دَعْهُ لاَ يَتَحَدَّثُ النَّاسُ أَنَّ مُحَمَّدًا يَقْتُلُ أَصْحَابَهُ ‏\"‏ ‏.‏","b":"আবূ বাকর ইবনু আবু শাইবাহ, যুহায়র ইবনু হারব, আহমাদ ইবনু আবদাল্লাহু আয যাব্বী ও ইবনু আবু উমর (রহঃ) ..... সুফইয়ান ইবনু উয়াইনাহ্ (রহঃ) বলেন যে, আমর (রহঃ) জাবির (রাযিঃ) কে বলতে শুনেছেন, আমরা এক যুদ্ধে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর সাথে ছিলাম। তখন একজন মুহাজির একজন আনসারের পশ্চাতাঘাত করেছিল। সে সময় আনসারী চীৎকার করে বলল, হে আনসার! আর মুহাজির ব্যক্তি ডাক দিল, হে মুহাজিরগণ! তখন রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, কী ব্যাপার! জাহিলী যুগের মতো হাক-ডাক করছ কেন? তারা বলল, হে আল্লাহর রসূল সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম! একজন মুহাজির একজন আনসারীর পশ্চাতে আঘাত করেছে। রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, তোমরা এ ধরনের হাক-ডাক ছেড়ে দাও। কেননা এতো নিন্দনীয় কাজ। এরপর ঘটনাটি আবদুল্লাহ ইবনু উবাই শুনে বলল, তারা কি এরূপ কাণ্ড ঘটিয়েছে? আল্লাহর কসম! আমরা মাদীনায় ফিরে গেলে সেখানকার শক্তিশালীরা অবশ্যই দুর্বলকে বহিষ্কৃত করে দিবে। উমর (রাযিঃ) বললেন, (হে আল্লাহর রসূল সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম!) আমাকে অনুমতি দিন, আমি এ মুনাফিকের মস্তক উড়িয়ে দেই। তখন তিনি বললেন, একে ছেড়ে দাও, যাতে লোকেরা বলতে না পারে যে, মুহাম্মাদ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তার সহাবাদের হত্যা করেন। (ইসলামিক ফাউন্ডেশন ৬৩৪৭, ইসলামিক সেন্টার)","e":"Jabir b. Abdullah reported:We were along with Allah's Messenger (ﷺ) in an expedition that a person from amongst the emigrants struck at the back of a person from the Ansir. The Ansiri said: O Ansar! And the Muhijir said: O Emigrants! Thereupon Allah's Messenger (ﷺ) said: What are these proclamations of the Days of Ignorance? They said: Allah's Messenger, a person from the emigrants struck at the back of an Ansari, whereupon he said: It is something disgusting. 'Abdullah b. Ubayy heard it and said: They have indeed done it. By Allah, when we would return to Medina the respectable amongst them (the Ansar) would turn away the mean (the emigrants). Thereupon 'Umar said: Permit me so that I should strike the neck of this hypocrite. But he (the Holy Prophet) said: Leave him, the people may not say that Muhammad kills his companions"},{"n":"6584","k":"2584.03","a":"حَدَّثَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، وَإِسْحَاقُ بْنُ مَنْصُورٍ، وَمُحَمَّدُ بْنُ رَافِعٍ، قَالَ ابْنُ رَافِعٍ حَدَّثَنَا وَقَالَ الآخَرَانِ، أَخْبَرَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنْ أَيُّوبَ، عَنْ عَمْرِو بْنِ دِينَارٍ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ كَسَعَ رَجُلٌ مِنَ الْمُهَاجِرِينَ رَجُلاً مِنَ الأَنْصَارِ فَأَتَى النَّبِيَّ صلى الله عليه وسلم فَسَأَلَهُ الْقَوَدَ فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ دَعُوهَا فَإِنَّهَا مُنْتِنَةٌ ‏\"‏ ‏.‏ قَالَ ابْنُ مَنْصُورٍ فِي رِوَايَتِهِ عَمْرٌو قَالَ سَمِعْتُ جَابِرًا ‏.‏","b":"ইসহাক ইবনু ইবরাহীম, ইসহাক ইবনু মানসূর ও মুহাম্মাদ ইবনু রাফি (রহঃ) ..... জাবির ইবনু আবদুল্লাহ (রাযিঃ) থেকে বর্ণিত। তিনি বলেন, একজন মুহাজির একজন আনসারীকে পশ্চাতে আঘাত করেছিল। এরপর সে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর নিকট এলো এবং তার কাছে প্রতিশোধ চাইল। তখন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, এটা বাদ দাও। কেননা এ-তো নোংরা কাজ। ইবনু মানসূর (রহঃ) আমর বর্ণিত হাদীসে বলেছেন যে, তিনি জাবির (রাযিঃ) কে বলতে শুনেছেন। (ইসলামিক ফাউন্ডেশন ৬৩৪৮, ইসলামিক সেন্টার)","e":"Jabir b. 'Abdullah reported that a person from the emigrants struck the back of an Ansari. He came to Allah's Apostle (ﷺ) and asked for compensation. Thereupon Allah's Apostle (ﷺ) said:Leave it. for it is something disgusting. Ibn Mansur said that in the narration transmitted on the authority of Amr (these words are also found):\" I heard Jabir"}]}],"adab":[{"t":"স্বপ্নের তিন ধরন","items":[{"x":"স্বপ্ন তিন রকম: আল্লাহর পক্ষ থেকে সুসংবাদ, শয়তানের পক্ষ থেকে কষ্টদায়ক স্বপ্ন এবং নিজের মনের ভাবনা।","r":["m:5905"]},{"x":"ভালো স্বপ্ন আল্লাহর পক্ষ থেকে, আর খারাপ স্বপ্ন শয়তানের পক্ষ থেকে।","r":["b:6984","b:6986","m:5900"]}]},{"t":"ভালো স্বপ্ন দেখলে","items":[{"x":"পছন্দের স্বপ্ন দেখলে আল্লাহর শুকরিয়া আদায় করা এবং খুশি হওয়া।","r":["b:6985","b:7045","m:5902"]},{"x":"সেই স্বপ্ন শুধু যাকে ভালোবাসেন তাকেই বলা।","r":["b:7044","m:5902","m:5903"]}]},{"t":"খারাপ বা অপছন্দের স্বপ্ন দেখলে","items":[{"x":"স্বপ্নের অনিষ্ট ও শয়তানের অনিষ্ট থেকে আল্লাহর কাছে আশ্রয় চাওয়া।","r":["b:6985","b:7044","m:5903"]},{"x":"বাম দিকে তিনবার থুথু ফেলা (আলিমদের ব্যাখ্যায় এটি হালকা ফুঁ, যাতে সামান্য থুথুর কণা থাকতে পারে)।","r":["b:6986","b:7005","b:7044","m:5900"]},{"x":"যে পাশে শুয়ে ছিলেন, সেই পাশ বদলে শোয়া।","r":["m:5904"]},{"x":"উঠে নামাজ আদায় করা।","r":["m:5905"]},{"x":"কাউকে সেই স্বপ্ন না বলা। হাদীসে এসেছে, এতে তার কোনো ক্ষতি হবে না।","r":["b:6985","b:7044","m:5903"]}]},{"t":"সতর্কতা","items":[{"x":"যে স্বপ্ন দেখেনি, তা দেখেছে বলে দাবি করা অত্যন্ত গর্হিত কাজ; হাদীসে একে সবচেয়ে বড় মিথ্যাগুলোর একটি বলা হয়েছে।","r":["b:7042","b:7043"]}]}]}</script>
<script>
(function(){
var DATA = JSON.parse(document.getElementById('hdata').textContent);
var BOOKS = {};
var BN = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function bn(s){ return String(s).replace(/[0-9]/g, function(d){ return BN[+d]; }); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normAr(s){
  return String(s).replace(/[ً-ٰٟۖ-ۭـ]/g,'').replace(/[آأإٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
}
function normAll(s){
  return normAr(s).toLowerCase().replace(/থুতু/g, 'থুথু');
}
DATA.books.forEach(function(bk){
  BOOKS[bk.id] = bk;
  bk.items.forEach(function(it, i){
    it._i = i;
    it._s = normAll(it.a + ' ' + it.b + ' ' + it.e + ' ' + it.n + ' ' + (it.k || ''));
    it._t = it._s.replace(/\s+/g, '');
  });
});

var st = { tab:'dream', sub:{ dream:'b', zulm:'zb' }, q:'', det:null, scroll:{}, fs:1, en:false, bm:[] };
function curId(){ return st.sub[st.tab]; }

function load(){
  try{ var v = localStorage.getItem('swapno_bm'); if(v){ st.bm = JSON.parse(v) || []; } }catch(e){}
  try{ var f = parseFloat(localStorage.getItem('swapno_fs')); if(f >= 0.8 && f <= 1.8){ st.fs = f; } }catch(e){}
  try{ st.en = localStorage.getItem('swapno_en') === '1'; }catch(e){}
}
function saveBm(){ try{ localStorage.setItem('swapno_bm', JSON.stringify(st.bm)); }catch(e){} }
function saveFs(){ try{ localStorage.setItem('swapno_fs', String(st.fs)); localStorage.setItem('swapno_en', st.en ? '1' : '0'); }catch(e){} }
function key(b, n){ return b + ':' + n; }
function isBm(b, n){ return st.bm.indexOf(key(b, n)) >= 0; }
function toggleBm(b, n){
  var k = key(b, n), i = st.bm.indexOf(k);
  if(i >= 0){ st.bm.splice(i, 1); toast('বুকমার্ক থেকে সরানো হয়েছে'); }
  else { st.bm.push(k); toast('বুকমার্ক করা হয়েছে'); }
  saveBm();
}

var main = document.getElementById('main');
var mask = document.getElementById('mask');
var box = document.getElementById('box');
var toastEl = document.getElementById('toast');
var toastTimer = null;

function toast(msg){
  toastEl.textContent = msg; toastEl.className = 'toast on';
  if(toastTimer){ clearTimeout(toastTimer); }
  toastTimer = setTimeout(function(){ toastEl.className = 'toast'; }, 1800);
}
function showModal(html){ box.innerHTML = html; mask.className = 'mask on'; }
function hideModal(){ mask.className = 'mask'; }
function modalOpen(){ return mask.className.indexOf('on') >= 0; }

function refLabel(bk, it){
  var s = bk.short + ' ' + bn(it.n);
  return s;
}

function renderNav(){
  var bs = document.querySelectorAll('#nav button');
  for(var i = 0; i < bs.length; i++){
    bs[i].className = (bs[i].getAttribute('data-t') === st.tab && !st.det) ? 'on' : '';
  }
}

function listItems(bk, q){
  var qq = normAll(q).trim();
  if(!qq){ return bk.items; }
  var parts = qq.split(/\s+/);
  return bk.items.filter(function(it){
    for(var i = 0; i < parts.length; i++){
      if(it._s.indexOf(parts[i]) < 0 && it._t.indexOf(parts[i]) < 0){ return false; }
    }
    return true;
  });
}

function cardHtml(bkid, it){
  var bk = BOOKS[bkid];
  var pv = it.b.length > 260 ? it.b.substring(0, 260) + '…' : it.b;
  return '<div class="card tap" data-b="' + bkid + '" data-i="' + it._i + '">' +
    '<div class="row"><span class="num">' + esc(refLabel(bk, it)) + '</span>' +
    (isBm(bkid, it.n) ? '<span class="star">★</span>' : '') + '</div>' +
    '<div class="pv">' + esc(pv) + '</div></div>';
}

function renderList(){
  var ids = st.tab === 'dream' ? ['b','m'] : ['zb','zm'];
  var seg = '<div class="seg">';
  for(var s = 0; s < ids.length; s++){ seg += '<button data-sub="' + ids[s] + '"' + (ids[s] === curId() ? ' class="on"' : '') + '>' + esc(BOOKS[ids[s]].name) + '</button>'; }
  seg += '</div>';
  var note = st.tab === 'zulm' ? '<div class="note">এই তালিকা সহীহ বুখারীর কিতাবুল মাযালিম (সম্পূর্ণ) এবং সহীহ মুসলিমের জুলুম-সংক্রান্ত অংশ থেকে নেওয়া। অন্যান্য অধ্যায়েও জুলুম প্রসঙ্গ থাকতে পারে।</div>' : '';
  main.innerHTML = seg + note + '<input class="sb" id="q" type="search" placeholder="খুঁজুন: বাংলা, আরবি, English বা নম্বর" value="' + esc(st.q) + '"><div id="res"></div>';
  fillRes();
  var q = document.getElementById('q');
  q.addEventListener('input', function(){
    st.q = q.value;
    fillRes();
  });
}
function fillRes(){
  // re-render only the results so the keyboard stays open
  var bk = BOOKS[curId()];
  var items = listItems(bk, st.q);
  var h = '<div class="cnt">' + esc(bk.name) + ' · ' + esc(bk.sub) + ' — ' + bn(items.length) + 'টি হাদীস</div>';
  if(!items.length){ h += '<div class="empty">কোনো ফল পাওয়া যায়নি</div>'; }
  for(var i = 0; i < items.length; i++){ h += cardHtml(curId(), items[i]); }
  document.getElementById('res').innerHTML = h;
}

function renderBm(){
  var h = '<div class="cnt">বুকমার্ক করা হাদীস — ' + bn(st.bm.length) + 'টি</div>';
  var n = 0;
  for(var i = 0; i < st.bm.length; i++){
    var p = st.bm[i].split(':'), bk = BOOKS[p[0]];
    if(!bk){ continue; }
    var it = null;
    for(var j = 0; j < bk.items.length; j++){ if(bk.items[j].n === p[1]){ it = bk.items[j]; break; } }
    if(it){ h += cardHtml(p[0], it); n++; }
  }
  if(!n){ h += '<div class="empty">এখনো কোনো বুকমার্ক নেই।<br>হাদীস খুলে ☆ বোতাম চাপুন।</div>'; }
  main.innerHTML = h;
}

function renderDetail(){
  var bk = BOOKS[st.det.b], it = bk.items[st.det.i];
  var fs = st.fs;
  var h = '<div class="top"><button class="bk" id="back">← ফিরুন</button>' +
    '<span class="num">' + esc(refLabel(bk, it)) + '</span></div>';
  var kk = (it.k && String(it.k) !== String(it.n)) ? ' · গ্রন্থ-ক্রম ' + bn(it.k) : '';
  h += '<div class="cnt">' + esc(bk.name) + ' · ' + esc(bk.sub) + kk + '</div>';
  h += '<div class="card"><div class="sec">আরবি</div><div class="ar" style="font-size:' + (22 * fs) + 'px">' + esc(it.a) + '</div>' +
    '<div class="sec">বাংলা</div><div class="bn" style="font-size:' + (16 * fs) + 'px">' + esc(it.b) + '</div>';
  if(st.en){ h += '<div class="sec">English</div><div class="en" style="font-size:' + (15 * fs) + 'px">' + esc(it.e) + '</div>'; }
  h += '</div>';
  h += '<div class="bar">' +
    '<button class="btn fill" id="bBm">' + (isBm(st.det.b, it.n) ? '★ বুকমার্কড' : '☆ বুকমার্ক') + '</button>' +
    '<button class="btn" id="bCp">কপি</button>' +
    '<button class="btn" id="bEn">' + (st.en ? 'English লুকান' : 'English দেখুন') + '</button></div>';
  h += '<div class="bar"><button class="btn" id="bMin">অ−</button><button class="btn" id="bPlus">অ+</button>' +
    '<button class="btn" id="bPrev"' + (st.det.i <= 0 ? ' disabled' : '') + '>← আগের</button>' +
    '<button class="btn" id="bNext"' + (st.det.i >= bk.items.length - 1 ? ' disabled' : '') + '>পরের →</button></div>';
  main.innerHTML = h;
  main.scrollTop = 0;
}

function renderAdab(){
  var h = '<div class="note">এই পাতার সারকথাগুলো সহীহ বুখারী ও মুসলিমের এই অধ্যায়ের হাদীস থেকে সংকলিত। প্রতিটি পয়েন্টের নিচের বোতামে চাপ দিলে মূল হাদীস খুলবে। এটি ফতোয়া নয়; বিস্তারিত জানতে নির্ভরযোগ্য আলিমের শরণাপন্ন হোন।</div>';
  DATA.adab.forEach(function(sec){
    h += '<h3>' + esc(sec.t) + '</h3>';
    sec.items.forEach(function(x){
      h += '<div class="li">' + esc(x.x) + '<div>';
      x.r.forEach(function(r){
        var p = r.split(':'), bk = BOOKS[p[0]];
        h += '<button class="chip" data-ref="' + esc(r) + '">' + esc(bk.short + ' ' + bn(p[1])) + '</button>';
      });
      h += '</div></div>';
    });
  });
  main.innerHTML = h;
}

function render(){
  renderNav();
  if(st.det){ renderDetail(); return; }
  if(st.tab === 'dream' || st.tab === 'zulm'){ renderList(); }
  else if(st.tab === 'bm'){ renderBm(); }
  else { renderAdab(); }
  var sc = st.scroll[st.tab] || 0;
  main.scrollTop = sc;
}

function setTab(t){
  if(!st.det){ st.scroll[st.tab] = main.scrollTop; }
  st.tab = t; st.det = null; st.q = ''; render();
  main.scrollTop = 0;
}
function openDetail(b, i){
  st.scroll[st.tab] = main.scrollTop;
  st.det = { b:b, i:i }; render();
}
function closeDetail(){
  st.det = null; render();
}
function openRef(r){
  var p = r.split(':'), bk = BOOKS[p[0]];
  for(var j = 0; j < bk.items.length; j++){
    if(bk.items[j].n === p[1]){
      st.scroll[st.tab] = main.scrollTop;
      st.det = { b:p[0], i:j, from:'adab' }; render(); return;
    }
  }
}

function copyText(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.setAttribute('readonly', '');
  ta.style.position = 'absolute'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, txt.length);
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  toast(ok ? 'কপি হয়েছে' : 'কপি করা যায়নি');
}

main.addEventListener('click', function(ev){
  var t = ev.target;
  var sg = t.closest ? t.closest('[data-sub]') : null;
  if(sg){ st.sub[st.tab] = sg.getAttribute('data-sub'); st.q = ''; render(); main.scrollTop = 0; return; }
  var chip = t.closest ? t.closest('[data-ref]') : null;
  if(chip){ openRef(chip.getAttribute('data-ref')); return; }
  var card = t.closest ? t.closest('.card.tap') : null;
  if(card){ openDetail(card.getAttribute('data-b'), parseInt(card.getAttribute('data-i'), 10)); return; }
  var id = t.id;
  if(!st.det){ return; }
  var bk = BOOKS[st.det.b], it = bk.items[st.det.i];
  if(id === 'back'){ closeDetail(); }
  else if(id === 'bBm'){ toggleBm(st.det.b, it.n); var y = main.scrollTop; renderDetail(); main.scrollTop = y; }
  else if(id === 'bCp'){
    copyText(it.a + '\n\n' + it.b + '\n\n— ' + bk.name + ', হাদীস ' + bn(it.n));
  }
  else if(id === 'bEn'){ st.en = !st.en; saveFs(); var y2 = main.scrollTop; renderDetail(); main.scrollTop = y2; }
  else if(id === 'bPlus'){ if(st.fs < 1.8){ st.fs = Math.round((st.fs + 0.1) * 10) / 10; saveFs(); var y3 = main.scrollTop; renderDetail(); main.scrollTop = y3; } }
  else if(id === 'bMin'){ if(st.fs > 0.8){ st.fs = Math.round((st.fs - 0.1) * 10) / 10; saveFs(); var y4 = main.scrollTop; renderDetail(); main.scrollTop = y4; } }
  else if(id === 'bPrev'){ if(st.det.i > 0){ st.det.i--; renderDetail(); } }
  else if(id === 'bNext'){ if(st.det.i < bk.items.length - 1){ st.det.i++; renderDetail(); } }
});

document.getElementById('nav').addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('button') : null;
  if(b){ setTab(b.getAttribute('data-t')); }
});

document.getElementById('btnAbout').addEventListener('click', function(){
  showModal('<h4>তথ্যসূত্র ও সতর্কতা</h4>' +
    '<p><b>হাদীসের পাঠ:</b> স্বপ্ন: সহীহ বুখারী কিতাব ৯১ (কিতাবুত তা‘বীর) ও সহীহ মুসলিম কিতাব ৪২ (কিতাবুর রুইয়া)। জুলুম: সহীহ বুখারী কিতাব ৪৬ (কিতাবুল মাযালিম) ও সহীহ মুসলিম কিতাব ৪৫-এর জুলুম-সংক্রান্ত অংশ।</p>' +
    '<p><b>ডেটা উৎস:</b> উন্মুক্ত Hadith API ডেটাসেট (github.com/fawazahmed0/hadith-api)। আরবি, বাংলা ও ইংরেজি পাঠ সেখান থেকে নেওয়া। ইংরেজি অনুবাদক: বুখারী — মুহসিন খান; মুসলিম — আব্দুল হামীদ সিদ্দিকী। বাংলা অনুবাদকের নাম ডেটাসেটে উল্লেখ নেই।</p>' +
    '<p><b>সতর্কতা:</b> অনুবাদ ও ক্রমিক নম্বর ছাপা সংস্করণের সাথে সামান্য ভিন্ন হতে পারে। গুরুত্বপূর্ণ প্রয়োজনে ছাপা সহীহ গ্রন্থ বা আলিমের সাথে মিলিয়ে নিন। অ্যাপের ‘আদব’ পাতার সারকথা হাদীসের ভাবার্থ, ফতোয়া নয়।</p>' +
    '<p style="text-align:right"><button class="btn fill" id="mClose">বন্ধ করুন</button></p>');
});
mask.addEventListener('click', function(ev){
  if(ev.target === mask || ev.target.id === 'mClose'){ hideModal(); }
});

window.__back = function(){
  if(modalOpen()){ hideModal(); return true; }
  if(st.det){ closeDetail(); return true; }
  if(st.tab !== 'dream'){ setTab('dream'); return true; }
  return false;
};

load();
render();
})();
</script>
</body>
</html>
