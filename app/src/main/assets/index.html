نِ قُصَىٍّ ـ وَهْوَ ابْنُ عَمِّ خَدِيجَةَ أَخُو أَبِيهَا، وَكَانَ امْرَأً تَنَصَّرَ فِي الْجَاهِلِيَّةِ، وَكَانَ يَكْتُبُ الْكِتَابَ الْعَرَبِيَّ فَيَكْتُبُ بِالْعَرَبِيَّةِ مِنَ الإِنْجِيلِ مَا شَاءَ اللَّهُ أَنْ يَكْتُبَ، وَكَانَ شَيْخًا كَبِيرًا قَدْ عَمِيَ ـ فَقَالَتْ لَهُ خَدِيجَةُ أَىِ ابْنَ عَمِّ اسْمَعْ مِنِ ابْنِ أَخِيكَ‏.‏ فَقَالَ وَرَقَةُ ابْنَ أَخِي مَاذَا تَرَى فَأَخْبَرَهُ النَّبِيُّ صلى الله عليه وسلم مَا رَأَى فَقَالَ وَرَقَةُ هَذَا النَّامُوسُ الَّذِي أُنْزِلَ عَلَى مُوسَى، يَا لَيْتَنِي فِيهَا جَذَعًا أَكُونُ حَيًّا، حِينَ يُخْرِجُكَ قَوْمُكَ‏.‏ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ أَوَمُخْرِجِيَّ هُمْ ‏\"‏‏.‏ فَقَالَ وَرَقَةُ نَعَمْ، لَمْ يَأْتِ رَجُلٌ قَطُّ بِمَا جِئْتَ بِهِ إِلاَّ عُودِيَ، وَإِنْ يُدْرِكْنِي يَوْمُكَ أَنْصُرْكَ نَصْرًا مُؤَزَّرًا‏.‏ ثُمَّ لَمْ يَنْشَبْ وَرَقَةُ أَنْ تُوُفِّيَ، وَفَتَرَ الْوَحْىُ فَتْرَةً حَتَّى حَزِنَ النَّبِيُّ صلى الله عليه وسلم فِيمَا بَلَغَنَا حُزْنًا غَدَا مِنْهُ مِرَارًا كَىْ يَتَرَدَّى مِنْ رُءُوسِ شَوَاهِقِ الْجِبَالِ، فَكُلَّمَا أَوْفَى بِذِرْوَةِ جَبَلٍ لِكَىْ يُلْقِيَ مِنْهُ نَفْسَهُ، تَبَدَّى لَهُ جِبْرِيلُ فَقَالَ يَا مُحَمَّدُ إِنَّكَ رَسُولُ اللَّهِ حَقًّا‏.‏ فَيَسْكُنُ لِذَلِكَ جَأْشُهُ وَتَقِرُّ نَفْسُهُ فَيَرْجِعُ، فَإِذَا طَالَتْ عَلَيْهِ فَتْرَةُ الْوَحْىِ غَدَا لِمِثْلِ ذَلِكَ، فَإِذَا أَوْفَى بِذِرْوَةِ جَبَلٍ تَبَدَّى لَهُ جِبْرِيلُ فَقَالَ لَهُ مِثْلَ ذَلِكَ‏.‏ قَالَ ابْنُ عَبَّاسٍ ‏{‏فَالِقُ الإِصْبَاحِ‏}‏ ضَوْءُ الشَّمْسِ بِالنَّهَارِ، وَضَوْءُ الْقَمَرِ بِاللَّيْلِ‏.‏","b":"‘আয়িশাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর ওয়াহীর শুরু হয় ঘুমের ঘোরে ভালো স্বপ্নের মাধ্যমে। তিনি যে স্বপ্নই দেখতেন তা ভোরের আলোর মত উদ্ভাসিত হতো। তিনি হেরা গুহায় গিয়ে সেখানে বেশ কয়েক রাত ‘ইবাদাতে কাটিয়ে দিতেন এবং এজন্য খাদ্য দ্রব্যও সঙ্গে নিয়ে যেতেন। এরপর খাদীজাহ (রাঃ)-এর কাছে ফিরে আসতেন এবং তিনি তাকে এরূপ খাদ্য দ্রব্য তৈরি করে দিতেন। শেষে তাঁর কাছে সত্যের বাণী (ওয়াহী) আসল। আর এ সময় তিনি হেরা গুহায় ছিলেন। সেখানে ফেরেশতা এসে তাঁকে বলল, আপনি পড়ুন, রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেন, আমি বললামঃ আমি তো পাঠক নই। তখন তিনি আমাকে জড়িয়ে ধরে শক্ত করে চেপে ধরলেন। এমনকি এতে আমার খুব কষ্ট হল। তারপর তিনি আমাকে ছেড়ে দিলেন এবং বললেন, আপনি পড়ুন। আমি বললাম, আমি পাঠক নই। তিনি দ্বিতীয়বার আমাকে শক্ত করে চেপে ধরলেন। এবারেও এতে আমার খুব কষ্ট হল। অতঃপর তিনি আমাকে ছেড়ে দিয়ে বললেন, আপনি পড়ুন। আমি বললাম, আমি তো পাঠক নই। এরপর তিনি তৃতীয়বার আমাকে শক্ত করে এমন চেপে ধরলেন যে, এবারেও এতে আমার খুব কষ্ট হল। তারপর তিনি আমাকে ছেড়ে দিয়ে বললেন, পাঠ করুন, আপনার প্রতিপালকের নামে যিনি সৃষ্টি করেছেন......যা সে জানত না (সূরাহ আল-আলাক ৯৬/১-৫) এ আয়াত পর্যন্ত। এরপর তিনি তা নিয়ে খাদীজাহ (রাঃ)-এর কাছে কম্পিত হৃদয়ে ফিরে এলেন। আর বললেন, আমাকে কম্বল দিয়ে ঢেকে দাও। আমাকে কম্বল দিয়ে ঢেকে দাও। ফলে তাঁরা তাঁকে কম্বল দিয়ে ঢেকে দিলেন। অবশেষে তাঁর থেকে ভীতি দূর হয়ে গেল। এরপর তিনি বললেন, হে খাদীজাহ! আমার কী হল? এবং তাকে সমস্ত ঘটনা জানালেন। আর বললেনঃ আমি আমার জীবন সম্পর্কে শঙ্কাবোধ করছি। খাদীজাহ (রাঃ) তাকে বললেন, কক্ষনো না। আপনি সুসংবাদ গ্রহণ করুন। আল্লাহর কসম, আল্লাহ্ আপনাকে কখনই লাঞ্ছিত করবেন না। কেননা, আপনি তো আত্মীয়তার বন্ধন জুড়ে রাখেন, সত্যকথা বলেন, অনাথ অক্ষমদের বোঝা বহন করেন, মেহমানদের মেহমানদারী করেন এবং হকের পথে আগত যাবতীয় বিপদে সাহায্য করেন। অতপর খাদীজাহ (রাঃ) তাঁকে নিয়ে চললেন। অতঃপর তাঁকে নিয়ে ওরাকা ইবনু নাওফল ইবনু আসাদ ইবনু ‘আবদুল উযযা ইবনু কুসাই-এর কাছে এলেন। আর তিনি, খাজীদাহ (রাঃ)-এর চাচার পুত্র (চাচাত ভাই) এবং তার পিতার পক্ষ থেকে চাচাও ছিলেন। তিনি জাহিলীয়াতের যুগে খৃষ্ট ধর্ম গ্রহণ করেছিলেন। তিনি আরবী কিতাব লিখতেন। তাই সে ইন্জীল আরবীতে অনুবাদ করতেন- যতখানি লেখা আল্লাহর মনযুর হত। তিনি ছিলেন অতি বৃদ্ধ, দৃষ্টিশক্তিহীন লোক। খাদীজাহ (রাঃ) তাকে বললেন, হে আমার চাচাতো ভাই! তোমার ভাতিজার কথা শুন। তখন ওরাকা বললেন, হে ভাতিজা! তুমি কী দেখেছ? নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম যা কিছু দেখেছিলেন তা তাকে জানালেন। তখন ওরাকা বললেন, এতো আল্লাহর সেই নামুস (দূত) যাঁকে মূসা (আঃ)-এর কাছে প্রেরণ করা হয়েছিল। হায় আফসোস! যদি সেদিন আমি জীবিত থাকতাম যেদিন তোমার কাওম তোমাকে বের করে দেবে। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন ঃ তারা কি আমাকে বের করে দেবে? ওরাকা বললেন, হ্যাঁ তুমি যা নিয়ে এসেছ, এমন বস্তু নিয়ে কোনদিনই কেউ আসেনি যার সঙ্গে শত্রুতা করা হয়নি। যদি তোমার জীবনকাল আমাকে পায়, তাহলে আমি সর্বতোভাবে তোমাকে সাহায্য করব। এরপর কিছু দিনের মধ্যেই ওরাকার মৃত্যু হয়। আর কিছু দিনের জন্য ওয়াহীও বন্ধ থাকে। এমনকি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এ অবস্থার কারণে অত্যন্ত চিন্তিত হয়ে পড়লেন। এমনকি আমরা এ সম্পর্কে তার থেকে জানতে পেরেছি যে, তিনি পর্বতের চূড়া থেকে নিচে পড়ে যাবার জন্য একাধিকবার দ্রুত সেখানে চলে গেছেন। যখনই নিজেকে ফেলে দেয়ার জন্য পর্বতের চূড়ায় পৌঁছতেন, তখনই জিবরীল (আঃ) তাঁর সামনে আত্মপ্রকাশ করে বলতেন, হে মুহাম্মাদ! নিঃসন্দেহে আপনি আল্লাহর রাসূল। এতে তাঁর অস্থিরতা দূর হত এবং নিজ মনে শান্তিবোধ করতেন। তাই সেখান থেকে ফিরে আসতেন। ওয়াহী বন্ধ অবস্থা যখন তাঁর উপর দীর্ঘ হত তখনই তিনি ঐরূপ উদ্দেশে দ্রুত চলে যেতেন। যখনই তিনি পর্বতের চূড়ায় পৌঁছতেন, তখনই জিবরীল (আঃ) তাঁর সামনে আত্মপ্রকাশ করে আগের মত বলতেন। [৩] ইবনু ‘আব্বাস (রাঃ) বলেন, فَالِقُ الإِصْبَاحِ অর্থ দিনের বেলায় সূর্যের আলো ও রাতের বেলায় চাঁদের আলো। (আধুনিক প্রকাশনী- ৬৪৯৮, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Aisha:The commencement of the Divine Inspiration to Allah's Messenger (ﷺ) was in the form of good righteous (true) dreams in his sleep. He never had a dream but that it came true like bright day light. He used to go in seclusion (the cave of) Hira where he used to worship(Allah Alone) continuously for many (days) nights. He used to take with him the journey food for that (stay) and then come back to (his wife) Khadija to take his food like-wise again for another period to stay, till suddenly the Truth descended upon him while he was in the cave of Hira. The angel came to him in it and asked him to read. The Prophet (ﷺ) replied, \"I do not know how to read.\" (The Prophet (ﷺ) added), \"The angel caught me (forcefully) and pressed me so hard that I could not bear it anymore. He then released me and again asked me to read, and I replied, \"I do not know how to read,\" whereupon he caught me again and pressed me a second time till I could not bear it anymore. He then released me and asked me again to read, but again I replied, \"I do not know how to read (or, what shall I read?).\" Thereupon he caught me for the third time and pressed me and then released me and said, \"Read: In the Name of your Lord, Who has created (all that exists). Has created man from a clot. Read and Your Lord is Most Generous...up to..... ..that which he knew not.\" (96.15) Then Allah's Messenger (ﷺ) returned with the Inspiration, his neck muscles twitching with terror till he entered upon Khadija and said, \"Cover me! Cover me!\" They covered him till his fear was over and then he said, \"O Khadija, what is wrong with me?\" Then he told her everything that had happened and said, 'I fear that something may happen to me.\" Khadija said, 'Never! But have the glad tidings, for by Allah, Allah will never disgrace you as you keep good reactions with your Kith and kin, speak the truth, help the poor and the destitute, serve your guest generously and assist the deserving, calamityafflicted ones.\" Khadija then accompanied him to (her cousin) Waraqa bin Naufal bin Asad bin `Abdul `Uzza bin Qusai. Waraqa was the son of her paternal uncle, i.e., her father's brother, who during the Pre-Islamic Period became a Christian and used to write the Arabic writing and used to write of the Gospels in Arabic as much as Allah wished him to write. He was an old man and had lost his eyesight. Khadija said to him, \"O my cousin! Listen to the story of your nephew.\" Waraqa asked, \"O my nephew! What have you seen?\" The Prophet (ﷺ) described whatever he had seen. Waraqa said, \"This is the same Namus (i.e., Gabriel, the Angel who keeps the secrets) whom Allah had sent to Moses. I wish I were young and could live up to the time when your people would turn you out.\" Allah's Messenger (ﷺ) asked, \"Will they turn me out?\" Waraqa replied in the affirmative and said: \"Never did a man come with something similar to what you have brought but was treated with hostility. If I should remain alive till the day when you will be turned out then I would support you strongly.\" But after a few days Waraqa died and the Divine Inspiration was also paused for a while and the Prophet (ﷺ) became so sad as we have heard that he intended several times to throw himself from the tops of high mountains and every time he went up the top of a mountain in order to throw himself down, Gabriel would appear before him and say, \"O Muhammad! You are indeed Allah's Messenger (ﷺ) in truth\" whereupon his heart would become quiet and he would calm down and would return home. And whenever the period of the coming of the inspiration used to become long, he would do as before, but when he used to reach the top of a mountain, Gabriel would appear before him and say to him what he had said before. (Ibn `Abbas said regarding the meaning of: 'He it is that Cleaves the daybreak (from the darkness)' (6.96) that Al-Asbah. means the light of the sun during the day and the light of the moon at night"},{"n":"6983","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ الرُّؤْيَا الْحَسَنَةُ مِنَ الرَّجُلِ الصَّالِحِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏‏.‏","b":"وَقَوْلِهِ تَعَالَى : (لَقَدْ صَدَقَ اللهُ رَسُولَهُ الرُّؤْيَا بِالْحَقِّ لَتَدْخُلُنَّ الْمَسْجِدَ الْحَرَامَ إِنْ شَاءَ اللهُ اٰمِنِينَ مُحَلِّقِينَ رُءُوسَكُمْ وَمُقَصِّرِينَ لاَ تَخَافُونَ فَعَلِمَ مَا لَمْ تَعْلَمُوا فَجَعَلَ مِنْ دُونِ ذَلِكَ فَتْحًا قَرِيبًا) এবং আল্লাহর বাণীঃ আল্লাহ তাঁর রাসূলকে প্রকৃত সত্য স্বপ্নই দেখিয়েছিলেন। আল্লাহর ইচ্ছায় তোমরা অবশ্য অবশ্যই মসজিদে হারামে প্রবেশ করবে নিরাপদে, মস্তক মুন্ডিত অবস্থায় ও চুল কেটে, ভয়ভীতিহীন হয়ে। আল্লাহ জানেন, যা তোমরা জান না। (সেই স্বপ্ন তো পূর্ণ হবেই) তদুপরি তিনি দিলেন (হুদাইবিয়ার চুক্তি সম্পাদনের মাধ্যমে) তারক্ষণিক বিজয়। (সূরাহ আল-ফাত্হ ৪৮/২৭) ৬৯৮৩. আনাস ইবনু মালিক (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ নেককার লোকের ভাল স্বপ্ন নবুয়তের ছেচল্লিশ ভাগের এক ভাগ।[1] [৬৯৯৪] (আধুনিক প্রকাশনী- ,৬৪৯৯ ইসলামিক ফাউন্ডেশন)","e":"Narrated Anas bin Malik:Allah's Messenger (ﷺ) said, \"A good dream (that comes true) of a righteous man is one of forty-six parts of prophetism"},{"n":"6984","k":"","a":"حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا يَحْيَى ـ هُوَ ابْنُ سَعِيدٍ ـ قَالَ سَمِعْتُ أَبَا سَلَمَةَ، قَالَ سَمِعْتُ أَبَا قَتَادَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الرُّؤْيَا مِنَ اللَّهِ، وَالْحُلْمُ مِنَ الشَّيْطَانِ ‏\"‏‏.‏","b":"আবূ ক্বাতাদাহ (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি বলেছেনঃ ভাল স্বপ্ন আল্লাহর পক্ষ থেকে হয় আর খারাপ স্বপ্ন শয়তানের পক্ষ থেকে হয়ে থাকে। [৩২৯২] (আধুনিক প্রকাশনী- ৬৫০০, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Qatada:The Prophet (ﷺ) said, \"A true good dream is from Allah, and a bad dream is from Satan"},{"n":"6985","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، حَدَّثَنَا اللَّيْثُ، حَدَّثَنِي ابْنُ الْهَادِ، عَنْ عَبْدِ اللَّهِ بْنِ خَبَّابٍ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، أَنَّهُ سَمِعَ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏ \"‏ إِذَا رَأَى أَحَدُكُمْ رُؤْيَا يُحِبُّهَا فَإِنَّمَا هِيَ مِنَ اللَّهِ، فَلْيَحْمَدِ اللَّهَ عَلَيْهَا، وَلْيُحَدِّثْ بِهَا، وَإِذَا رَأَى غَيْرَ ذَلِكَ مِمَّا يَكْرَهُ، فَإِنَّمَا هِيَ مِنَ الشَّيْطَانِ، فَلْيَسْتَعِذْ مِنْ شَرِّهَا، وَلاَ يَذْكُرْهَا لأَحَدٍ، فَإِنَّهَا لاَ تَضُرُّهُ ‏\"‏‏.‏","b":"আবূ সা‘ঈদ খুদরী (রাঃ) হতে বর্ণিত। তিনি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছেন, যেখন তোমাদের কেউ এমন স্বপ্ন দেখে, যা সে পছন্দ করে, তাহলে তা আল্লাহর পক্ষ থেকে। তাই সে যেন এ জন্য আল্লাহর প্রশংসা করে এবং অন্যের কাছে তা বর্ণনা করে। আর যদি এর বিপরীত অপছন্দনীয় কিছু দেখে, তাহলে তা শয়তানের পক্ষ থেকে। তাই সে যেন এর ক্ষতি থেকে আল্লাহর আশ্রয় চায়। আর কারো কাছে যেন তা বর্ণনা না করে। তাহলে এ স্বপ্ন তার কোন ক্ষতি করবে না। (আধুনিক প্রকাশনী- ৬৫০১, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Sa`id Al-Khudri:The Prophet (ﷺ) said, \"If anyone of you sees a dream that he likes, then it is from Allah, and he should thank Allah for it and narrate it to others; but if he sees something else, i.e., a dream that he dislikes, then it is from Satan, and he should seek refuge with Allah from its evil, and he should not mention it to anybody, for it will not harm him"},{"n":"6986","k":"","a":"حَدَّثَنَا مُسَدَّدٌ، حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يَحْيَى بْنِ أَبِي كَثِيرٍ ـ وَأَثْنَى عَلَيْهِ خَيْرًا لَقِيتُهُ بِالْيَمَامَةِ ـ عَنْ أَبِيهِ، حَدَّثَنَا أَبُو سَلَمَةَ، عَنْ أَبِي قَتَادَةَ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ الرُّؤْيَا الصَّالِحَةُ مِنَ اللَّهِ، وَالْحُلْمُ مِنَ الشَّيْطَانِ، فَإِذَا حَلَمَ فَلْيَتَعَوَّذْ مِنْهُ وَلْيَبْصُقْ عَنْ شِمَالِهِ، فَإِنَّهَا لاَ تَضُرُّهُ ‏\"‏‏.‏ وَعَنْ أَبِيهِ حَدَّثَنَا عَبْدُ اللَّهِ بْنُ أَبِي قَتَادَةَ عَنْ أَبِيهِ عَنِ النَّبِيِّ صلى الله عليه وسلم مِثْلَهُ‏.‏","b":"আবূ ক্বাতাদাহ (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি বলেছেনঃ ভাল স্বপ্ন আল্লাহর পক্ষ থেকে হয়ে থাকে। আর খারাপ স্বপ্ন শয়তানের পক্ষ থেকে হয়ে থাকে। তাই যখন কেউ খারাপ স্বপ্ন দেখে তখন যেন তার থেকে আশ্রয় চায় এবং বাম দিকে থু থু ফেলে। তাহলে সে স্বপ্ন আর তার কোন ক্ষতি করবে না। [৩২৭২] আবূ ‘আবদুল্লাহ্ (ইয়াহ্ইয়া ইবনু আবূ কাসীর).....ক্বাতাদাহ (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম থেকে একই রূপ বর্ণনা করেছেন। (আধুনিক প্রকাশনী- ৬৫০২, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Qatada:The Prophet (ﷺ) said, \"A good dream that comes true is from Allah, and a bad dream is from Satan, so if anyone of you sees a bad dream, he should seek refuge with Allah from Satan and should spit on the left, for the bad dream will not harm him"},{"n":"6987","k":"","a":"حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا غُنْدَرٌ، حَدَّثَنَا شُعْبَةُ، عَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ، عَنْ عُبَادَةَ بْنِ الصَّامِتِ، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ رُؤْيَا الْمُؤْمِنِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏‏.‏","b":"‘উবাদাহ ইবনু সামিত (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। তিনি বলেছেনঃ মু’মিনের স্বপ্ন নবুয়তের ছেচল্লিশ ভাগের এক ভাগ। সাবিত, হুমায়দ, ইসহাক ইবনু ‘আবদুল্লাহ্ ও শু‘আয়ব (রহ.) আনাস (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম থেকে একই রূপ বর্ণনা করেছেন। [মুসলিম পর্ব ৪২/হাঃ ২২৬৪, আহমাদ ১২০৩৭] (আধুনিক প্রকাশনী- ৬৫০৩, ইসলামিক ফাউন্ডেশন)","e":"Narrated 'Ubada bin As-Samit:The Prophet (ﷺ) said, \"The (good) dreams of a faithful believer is a part of the forty-six parts of prophetism:"},{"n":"6988","k":"","a":"حَدَّثَنَا يَحْيَى بْنُ قَزَعَةَ، حَدَّثَنَا إِبْرَاهِيمُ بْنُ سَعْدٍ، عَنِ الزُّهْرِيِّ، عَنْ سَعِيدِ بْنِ الْمُسَيَّبِ، عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ رُؤْيَا الْمُؤْمِنِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏‏.‏ رَوَاهُ ثَابِتٌ وَحُمَيْدٌ وَإِسْحَاقُ بْنُ عَبْدِ اللَّهِ وَشُعَيْبٌ عَنْ أَنَسٍ عَنِ النَّبِيِّ صلى الله عليه وسلم‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ মু’মিনের স্বপ্ন নবুয়তের ছেচল্লিশ ভাগের এক ভাগ। [৭০১৭; মুসলিম পর্ব ৪২/হাঃ ২২৬৩, আহমাদ ৭১৮৬] (আধুনিক প্রকাশনী- ৬৫০৪, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"The (good) dream of a faithful believer is a part of the forty-six parts of prophetism"},{"n":"6989","k":"","a":"حَدَّثَنِي إِبْرَاهِيمُ بْنُ حَمْزَةَ، حَدَّثَنِي ابْنُ أَبِي حَازِمٍ، وَالدَّرَاوَرْدِيُّ، عَنْ يَزِيدَ، عَنْ عَبْدِ اللَّهِ بْنِ خَبَّابٍ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، أَنَّهُ سَمِعَ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ الرُّؤْيَا الصَّالِحَةُ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏‏.‏","b":"আবূ সা‘ঈদ খুদরী (রাঃ) হতে বর্ণিত। তিনি রাসূলূল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছেন, ভাল স্বপ্ন নবুয়তের ছেচল্লিশ ভাগের এক ভাগ। (আধুনিক প্রকাশনী- ৬৫০৫, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Sa`id Al-Khudri:I heard Allah's Messenger (ﷺ) saying, \"A good dream is a part of the forty six parts of prophetism"},{"n":"6990","k":"","a":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، حَدَّثَنِي سَعِيدُ بْنُ الْمُسَيَّبِ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏\"‏ لَمْ يَبْقَ مِنَ النُّبُوَّةِ إِلاَّ الْمُبَشِّرَاتُ ‏\"‏‏.‏ قَالُوا وَمَا الْمُبَشِّرَاتُ قَالَ ‏\"‏ الرُّؤْيَا الصَّالِحَةُ ‏\"‏‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি রাসূলূল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি। সু-সংবাদ বহনকারী বিষয়াদি ব্যতীত নবুয়তের আর কিছু অবশিষ্ট নেই। সাহাবীগণ জিজ্ঞেস করলেন, সু-সংবাদ বহনকারী বিষয়াদি কী? তিনি বললেন, ভাল স্বপ্ন।[1] (আধুনিক প্রকাশনী- ৬৫০৬, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying, \"Nothing is left of the prophetism except Al-Mubashshirat.\" They asked, \"What are Al-Mubashshirat?\" He replied, \"The true good dreams (that conveys glad tidings)"},{"n":"6991","k":"","a":"حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، عَنْ سَالِمِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عُمَرَ ـ رضى الله عنه ـ أَنَّ أُنَاسًا، أُرُوا لَيْلَةَ الْقَدْرِ فِي السَّبْعِ الأَوَاخِرِ، وَأَنَّ أُنَاسًا أُرُوا أَنَّهَا فِي الْعَشْرِ الأَوَاخِرِ، فَقَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ الْتَمِسُوهَا فِي السَّبْعِ الأَوَاخِرِ ‏\"‏‏.‏","b":"بَاب رُؤْيَا يُوسُفَ ৯১/৬. অধ্যায়: ইউসুফ (আঃ)-এর স্বপ্ন। وَقَوْلِهِ تَعَالَى : (إِذْ قَالَ يُوسُفُ لِأَبِيهِ يَا أَبَتِ إِنِّي رَأَيْتُ أَحَدَ عَشَرَ كَوْكَبًا وَالشَّمْسَ وَالْقَمَرَ رَأَيْتُهُمْ لِي سَاجِدِينَ قَالَ يَا بُنَيَّ لاَ تَقْصُصْ رُؤْيَاكَ عَلٰى إِخْوَتِكَ فَيَكِيدُوا لَكَ كَيْدًا إِنَّ الشَّيْطَانَ لِلْإِنْسَانِ عَدُوٌّ مُبِينٌ وَكَذٰلِكَ يَجْتَبِيكَ رَبُّكَ وَيُعَلِّمُكَ مِنْ تَأْوِيلِ الأَحَادِيثِ وَيُتِمُّ نِعْمَتَهُ عَلَيْكَ وَعَلٰى آلِ يَعْقُوبَ كَمَا أَتَمَّهَا عَلَى أَبَوَيْكَ مِنْ قَبْلُ إِبْرَاهِيمَ وَإِسْحَاقَ إِنَّ رَبَّكَ عَلِيمٌ حَكِيمٌ وَقَوْلِهِ تَعَالٰى يَا أَبَتِ هٰذَا تَأْوِيلُ رُؤْيَايَ مِنْ قَبْلُ قَدْ جَعَلَهَا رَبِّي حَقًّا وَقَدْ أَحْسَنَ بِي إِذْ أَخْرَجَنِي مِنْ السِّجْنِ وَجَاءَ بِكُمْ مِنْ الْبَدْوِ مِنْ بَعْدِ أَنْ نَزَغَ الشَّيْطَانُ بَيْنِي وَبَيْنَ إِخْوَتِي إِنَّ رَبِّي لَطِيفٌ لِمَا يَشَآءُ إِنَّه” هُوَ الْعَلِيمُ الْحَكِيمُ رَبِّ قَدْ آتَيْتَنِي مِنْ الْمُلْكِ وَعَلَّمْتَنِي مِنْ تَأْوِيلِ الأَحَادِيثِ فَاطِرَ السَّمَوَاتِ وَالأَرْضِ أَنْتَ وَلِيِّي فِي الدُّنْيَا وَالْاٰخِرَةِ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ) قَالَ أَبُو عَبْد اللهِ فَاطِرٌ وَالْبَدِيعُ وَالْمُبْدِعُ وَالْبَارِئُ وَالْخَالِقُ وَاحِدٌ (مِنَ الْبَدْو)ِ بَادِيَةٍ. এবং আল্লাহর বাণীঃ স্মরণ কর, ইউসুফ যখন তার পিতাকে বলেছিল, ‘হে আববাজান! আমি (স্বপ্নে) দেখেছি এগারটি তারকা আর সূর্য ও চন্দ্র; দেখলাম তারা আমাকে সিজদা করছে।’ তার পিতা বললেন, ‘হে আমার পুত্র! তোমার স্বপ্নের কথা তোমার ভাইদের কাছে বর্ণনা করো না। যদি কর তাহলে তারা তোমার বিরুদ্ধে চক্রান্ত করবে। শাইত্বন তো মানুষের প্রকাশ্য দুশমন। (স্বপ্নে যেমন দেখেছ) এভাবে তোমার প্রতিপালক তোমাকে মনোনীত করবেন, তোমাকে স্বপ্নের ব্যাখ্যা শিক্ষা দিবেন এবং তিনি তাঁর অনুগ্রহ তোমার প্রতি আর ইয়া‘কূব পরিবারের প্রতি পূর্ণ করবেন যেভাবে তিনি তা পূর্বে তোমার পিতৃ-পুরুষ ইব্রাহীম ও ইসহাকের প্রতি পূর্ণ করেছিলেন, নিশ্চয়ই তোমার রবব সর্বজ্ঞ, বড়ই প্রজ্ঞাবান।- (সূরাহ ইউসুফ ১২/৪-৬)। এবং আল্লাহর বাণীঃ ‘সে তার পিতামাতাকে সিংহাসনে উঠিয়ে নিল আর সকলে তার সম্মানে সিজদা্য় ঝুঁকে পড়ল। ইউসুফ বলল, ‘হে পিতা! এ-ই হচ্ছে আমার সে আগের দেখা স্বপ্নের ব্যাখ্যা। আমার রবব একে সত্যে পরিণত করেছেন, তিনি আমার প্রতি অনুগ্রহ করেছেন যে, তিনি আমাকে কয়েদখানা থেকে বের করে এনেছেন। আর শাইত্বন আমার আর আমার ভাইদের মধ্যে বিভেদ সৃষ্টি করার পরও তিনি আপনাদেরকে মরু অঞ্চল থেকে এখানে (মিশরে) এনে দিয়েছেন। আমার রবব যা করতে ইচ্ছে করেন তা সূক্ষ্ম উপায়ে বাস্তবায়িত করে থাকেন, তিনি বড়ই বিজ্ঞ, বড়ই প্রজ্ঞাময়। হে আমার প্রতিপালক! তুমি আমাকে রাজত্ব দান করেছ, আর আমাকে বিভিন্ন কথার ব্যাখ্যা বিদ্যা শিখিয়েছ। আসমান যমীনের সৃষ্টিকর্তা! তুমিই দুনিয়া আর আখিরাতে আমার অভিভাবক, তুমি মুসলিম অবস্থায় আমার মৃত্যু দান করো এবং সৎকর্মশীলদের মধ্যে আমাকে অন্তর্ভুক্ত করো।’- (সূরাহ ইউসুফ ১২/১০০-১০১)। আবূ আবদুল্লাহ বলেন, فَاطِرٌ وَالْبَدِيعُ وَالْمُبْدِعُ وَالْبَارِئُ وَالْخَالِقُ وَاحِدٌ সবগুলোর অর্থ একই। (مِنَ الْبَدْو) অর্থ পল্লী হতে। بَاب رُؤْيَا إِبْرَاهِيمَ عَلَيْهِ السَّلاَم ৯১/৭. অধ্যায়: ইব্রাহীম (আঃ)-এর স্বপ্ন وَقَوْلُهُ تَعَالَى : (فَلَمَّا بَلَغَ مَعَهُ السَّعْيَ قَالَ يَا بُنَيَّ إِنِّي أَرٰى فِي الْمَنَامِ أَنِّي أَذْبَحُكَ فَانْظُرْ مَاذَا تَرٰى قَالَ يَا أَبَتِ افْعَلْ مَا تُؤْمَرُ سَتَجِدُنِي إِنْ شَآءَ اللهُ مِنْ الصَّابِرِينَ فَلَمَّا أَسْلَمَا وَتَلَّهُ لِلْجَبِينِ وَنَادَيْنَاهُ أَنْ يَا إِبْرَاهِيمُ قَدْ صَدَّقْتَ الرُّؤْيَا إِنَّا كَذٰلِكَ نَجْزِي الْمُحْسِنِينَ) এবং আল্লাহর বাণীঃ ‘‘অতঃপর সে যখন তার পিতার সাথে চলাফিরা করার বয়সে পৌঁছল, তখন ইব্রাহীম বলল, ‘বৎস! আমি স্বপ্নে দেখেছি যে, আমি তোমাকে যব্হ করছি, এখন বল, তোমার অভিমত কী? সে বলল, ‘হে পিতঃ! আপনাকে যা আদেশ করা হয়েছে আপনি তাই করুন, আল্লাহ চাইলে আপনি আমাকে ধৈর্যশীলই পাবেন। দু’জনেই যখন আনুগত্যে মাথা নুইয়ে দিল। আর ইব্রাহীম তাকে উপুড় ক’রে শুইয়ে দিল। তখন আমি তাকে ডাক দিলাম, ‘হে ইব্রাহীম! স্বপ্নে দেয়া আদেশ তুমি সত্যে পরিণত করেই ছাড়লে। এভাবেই আমি সৎকর্মশীলদেরকে প্রতিদান দিয়ে থাকি।’’ (সূরাহ আস্-সাফফাত ৩৭/১০২-১০৫) قَالَ مُجَاهِدٌ أَسْلَمَا سَلَّمَا مَا أُمِرَا بِهِ (وَتَلَّهُ) وَضَعَ وَجْهَهُ بِالأَرْضِ মুজাহিদ (রহ.) বলেন, ‘আসলামা’ শব্দের অর্থ তাদেরকে যে বিষয়ের নির্দেশ দেয়া হয়েছিল তা তারা মেনে নিল। আর ‘তাল্লাহু’ শব্দের অর্থ তার চেহারা মাটিতে রাখল। ৬৯৯১. ইবনু ‘উমার (রাঃ) হতে বর্ণিত যে, একদল লোককে শবে কাদর (রমাযানের) শেষ সাত রাতের মধ্যে রয়েছে বলে স্বপ্নে দেখানো হয়েছে। আর কিছু সংখ্যক লোককে তা শেষ দশ রাতের মাঝে আছে দেখানো হয়েছে। তখন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেনঃ তোমরা শবে কাদ্র শেষ সাত রাতের মধ্যেই খোঁজ কর। [১১৫৮] (আধুনিক প্রকাশনী- ,৬৫০৭ ইসলামিক ফাউন্ডেশন)","e":"Narrated Ibn `Umar:Some people were shown the Night of Qadr as being in the last seven days (of the month of Ramadan). The Prophet (ﷺ) said, \"Seek it in the last seven days (of Ramadan)"},{"n":"6992","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ، حَدَّثَنَا جُوَيْرِيَةُ، عَنْ مَالِكٍ، عَنِ الزُّهْرِيِّ، أَنَّ سَعِيدَ بْنَ الْمُسَيَّبِ، وَأَبَا، عُبَيْدٍ أَخْبَرَاهُ عَنْ أَبِي هُرَيْرَةَ ـ رضى الله عنه ـ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ لَوْ لَبِثْتُ فِي السِّجْنِ مَا لَبِثَ يُوسُفُ، ثُمَّ أَتَانِي الدَّاعِي لأَجَبْتُهُ ‏\"‏‏.‏","b":"لِقَوْلِهِ تَعَالَى : (وَدَخَلَ مَعَهُ السِّجْنَ فَتَيَانِ قَالَ أَحَدُهُمَا إِنِّي أَرَانِي أَعْصِرُ خَمْرًا وَقَالَ الْاٰخَرُ إِنِّي أَرَانِيْ أَحْمِلُ فَوْقَ رَأْسِي خُبْزًا تَأْكُلُ الطَّيْرُ مِنْهُ نَبِّئْنَا بِتَأْوِيلِهِ إِنَّا نَرَاكَ مِنْ الْمُحْسِنِينَ قَالَ لاَ يَأْتِيكُمَا طَعَامٌ تُرْزَقَانِهِ إِلاَّ نَبَّأْتُكُمَا بِتَأْوِيلِهِ قَبْلَ أَنْ يَأْتِيَكُمَا ذَلِكُمَا مِمَّا عَلَّمَنِي رَبِّي إِنِّي تَرَكْتُ مِلَّةَ قَوْمٍ لاَ يُؤْمِنُونَ بِاللهِ وَهُمْ بِالْاٰخِرَةِ هُمْ كَافِرُونَ وَاتَّبَعْتُ مِلَّةَ آبَائِي إِبْرَاهِيمَ وَإِسْحَاقَ وَيَعْقُوبَ مَا كَانَ لَنَا أَنْ نُشْرِكَ بِاللهِ مِنْ شَيْءٍ ذَلِكَ مِنْ فَضْلِ اللهِ عَلَيْنَا وَعَلَى النَّاسِ وَلٰكِنَّ أَكْثَرَ النَّاسِ لاَ يَشْكُرُونَ يَا صَاحِبَيْ السِّجْنِ أَأَرْبَابٌ مُتَفَرِّقُونَ) (يوسف) وَقَالَ الْفُضَيْلُ عِنْدَ قَوْلِهٖ (يَا صَاحِبَيْ السِّجْنِ) ( أَأَرْبَابٌ مُتَفَرِّقُونَ خَيْرٌ أَمْ اللهُ الْوَاحِدُ الْقَهَّارُ مَا تَعْبُدُونَ مِنْ دُونِهٖ إِلاَّ أَسْمَآءً سَمَّيْتُمُوهَا أَنْتُمْ وَآبَاؤُكُمْ مَا أَنْزَلَ اللهُ بِهَا مِنْ سُلْطَانٍ إِنْ الْحُكْمُ إِلاَّ لِلَّهِ أَمَرَ أَنْ لاَ تَعْبُدُوا إِلاَّ إِيَّاهُ ذٰلِكَ الدِّينُ الْقَيِّمُ وَلٰكِنَّ أَكْثَرَ النَّاسِ لاَ يَعْلَمُونَ يَا صَاحِبَيْ السِّجْنِ أَمَّا أَحَدُكُمَا فَيَسْقِي رَبَّه” خَمْرًا وَأَمَّا الْاٰخَرُ فَيُصْلَبُ فَتَأْكُلُ الطَّيْرُ مِنْ رَأْسِهِ قُضِيَ الْأَمْرُ الَّذِي فِيهِ تَسْتَفْتِيَانِ وَقَالَ لِلَّذِي ظَنَّ أَنَّهُ نَاجٍ مِنْهُمَا اذْكُرْنِي عِنْدَ رَبِّكَ فَأَنْسَاهُ الشَّيْطَانُ ذِكْرَ رَبِّهِ فَلَبِثَ فِي السِّجْنِ بِضْعَ سِنِينَ وَقَالَ الْمَلِكُ إِنِّي أَرٰى سَبْعَ بَقَرَاتٍ سِمَانٍ يَأْكُلُهُنَّ سَبْعٌ عِجَافٌ وَسَبْعَ سُنْبُلاَتٍ خُضْرٍ وَأُخَرَ يَابِسَاتٍ يَا أَيُّهَا الْمَلاَ أَفْتُونِي فِي رُؤْيَايَ إِنْ كُنْتُمْ لِلرُّؤْيَا تَعْبُرُونَ قَالُوا أَضْغَاثُ أَحْلاَمٍ وَمَا نَحْنُ بِتَأْوِيلِ الْأَحْلاَمِ بِعَالِمِينَ وَقَالَ الَّذِي نَجَا مِنْهُمَا وَادَّكَرَ بَعْدَ أُمَّةٍ أَنَا أُنَبِّئُكُمْ بِتَأْوِيلِهِ فَأَرْسِلُونِ يُوسُفُ أَيُّهَا الصِّدِّيقُ أَفْتِنَا فِي سَبْعِ بَقَرَاتٍ سِمَانٍ يَأْكُلُهُنَّ سَبْعٌ عِجَافٌ وَسَبْعِ سُنْبُلاَتٍ خُضْرٍ وَأُخَرَ يَابِسَاتٍ لَعَلِّي أَرْجِعُ إِلَى النَّاسِ لَعَلَّهُمْ يَعْلَمُونَ قَالَ تَزْرَعُونَ سَبْعَ سِنِينَ دَأْبًا فَمَا حَصَدْتُمْ فَذَرُوهُ فِي سُنْبُلِهٖ إِلاَّ قَلِيلاً مِمَّا تَأْكُلُونَ ثُمَّ يَأْتِي مِنْ بَعْدِ ذٰلِكَ سَبْعٌ شِدَادٌ يَأْكُلْنَ مَا قَدَّمْتُمْ لَهُنَّ إِلاَّ قَلِيلاً مِمَّا تُحْصِنُونَ ثُمَّ يَأْتِي مِنْ بَعْدِ ذٰلِكَ عَامٌ فِيهِ يُغَاثُ النَّاسُ وَفِيهِ يَعْصِرُونَ وَقَالَ الْمَلِكُ ائْتُونِي بِهٖ فَلَمَّا جَآءَهُ الرَّسُولُ قَالَ ارْجِعْ إِلٰى رَبِّكَ) (وَادَّكَرَ) : افْتَعَلَ مِنْ ذَكَرَ (أُمَّةٍ) قَرْنٍ وَتُقْرَأُ أَمَهٍ نِسْيَانٍ وَقَالَ ابْنُ عَبَّاسٍ (يَعْصِرُونَ) الأَعْنَابَ وَالدُّهْنَ (تُحْصِنُونَ) تَحْرُسُونَ আল্লাহ্ বলেনঃ তার সঙ্গে দু’যুবকও কারাগারে প্রবেশ করেছিল। তাদের একজন বলল, ‘আমি স্বপ্নে দেখলাম যে আমি মদ তৈরি করছি।’ অন্যজন বলল, ‘আমি স্বপ্নে দেখলাম, আমি মাথায় রুটি বহন করছি আর পাখী তাত্থেকে খাচ্ছে। আমাদেরকে এর ব্যাখ্যা বলে দাও, আমরা দেখছি তুমি একজন সৎকর্মশীল লোক।’ সে (ইউসুফ) বলল, ‘তোমাদেরকে যে খাবার দেয়া হয় তা আসার আগেই আমি তোমাদেরকে তার ব্যাখ্যা জানিয়ে দেব। আমার প্রতিপালক আমাকে যে জ্ঞান দান করেছেন এটা সেই জ্ঞানেরই অংশ। যে সম্প্রদায় আল্লাহ্তে বিশ্বাস করে না আর আখিরাতে অবিশ্বাসী, আমি তাদের নিয়ম নীতি পরিত্যাগ করেছি। আমি আমার পূর্বপুরুষ ইব্রাহীম, ইসহাক ও ইয়া‘কূবের আদর্শের অনুসরণ করি। আল্লাহর সাথে কোন কিছুকে শরীক করা আমার কাজ নয়। এটা আমাদের প্রতি ও মানুষের প্রতি আল্লাহর অনুগ্রহ, কিন্তু অধিকাংশ লোকই শোকর করে না। হে আমার জেলের সঙ্গীদ্বয়! ভিন্ন ভিন্ন প্রতিপালক ভালো, না মহাপরাক্রমশালী এক আল্লাহ? তাঁকে বাদ দিয়ে তোমরা যার ‘ইবাদাত করছ তা কতকগুলো নাম ছাড়া আর কিছুই নয়, যে নামগুলো তোমরা আর তোমাদের পিতৃ পুরুষরা রেখেছ। এ ব্যাপারে আল্লাহ কোন প্রমাণ নাযিল করেননি। আল্লাহ ছাড়া কোন বিধান দাতা নেই। তিনি আদেশ করেছেন যে, তোমরা তাঁকে ছাড়া আর কারো ‘ইবাদাত করবে না, এটাই সঠিক দ্বীন, কিন্তু অধিকাংশ মানুষই তা জানে না। হে আমার জেলের সঙ্গীদ্বয়! তোমাদের দু’জনের একজন তার প্রভুকে মদ পান করাবে আর অন্যজনকে শূলে দেয়া হবে, আর পাখী তার মস্তক ঠুকরে খাবে। তোমরা দু’জন যে সম্পর্কে জানতে চেয়েছ তার ফায়সালা হয়ে গেছে। তাদের দু’জনের মধ্যে যে জন মুক্তি পাবে ব’লে সে (ইউসুফ) মনে করল তাকে বলল, ‘তোমার প্রভুর কাছে আমার সম্পর্কে বলিও।’ কিন্তু শয়তান তাকে তার প্রভুর কাছে ইউসুফের কথা উল্লেখ করতে ভুলিয়ে দিল। ফলে ইউসুফ বেশ কয়েক বছর কারাগারে আটক থেকে গেল। রাজা বললেন, ‘আমি স্বপ্নে দেখলাম সাতটি হৃষ্টপুষ্ট গাভী, সাতটি জীর্ণশীর্ণ গাভী তাদেরকে খাচ্ছে। (আর দেখলাম) সাতটি সবুজ সতেজ শীষ আর অন্য সাতটি শুকনো। ওহে সভাষদগণ! আমার কাছে তোমরা আমার স্বপ্নের ব্যাখ্যা কর যদি তোমরা ব্যাখ্যা করতে পার।’ তারা বলল, ‘এতো অস্পষ্ট স্বপ্নের কথা, আর আমরা এ ধরনের স্বপ্ন ব্যাখ্যায় অভিজ্ঞ নই।’ দু’জনের মধ্যে যে জন জেল থেকে মুক্তি পেয়েছিল আর দীর্ঘকাল পর যার স্মরণ হল সে বলল, ‘আমি তোমাদেরকে তার ব্যাখ্যা বলে দেব, তবে তোমরা আমাকে (জেলখানায় ইউসুফের কাছে) পাঠাও। সে বলল, ‘হে সত্যবাদী ইউসুফ! সাতটি হৃষ্টপুষ্ট গাভী, যাদেরকে খাচ্ছে জীর্ণশীর্ণ সাতটি গাভী আর সাতটি সবুজ সতেজ শীষ আর অন্যগুলো শুকনো। (আমাদেরকে এর ব্যাখ্যা জানিয়ে দাও) যাতে আমি তাদের কাছে ফিরে যেতে পারি আর তারা জেনে নিতে পারে।’ সে (ইউসুফ) বলল, ‘সাত বছর তোমরা এক নাগাড়ে চাষ করবে, অতঃপর যখন ফসল কাটবে তখন তোমরা যে সামান্য পরিমাণ খাবে তা বাদে শিষ সমেত সংরক্ষণ করবে। এরপর আসবে সাতটি কঠিন বছর। এ সময়ের জন্য পূর্বে যা তোমরা সঞ্চয় করেছিলে তা লোকে খাবে, কেবল সেই অল্পটুকু বাদে যা তোমরা সঞ্চয় করবে। এর পর আসবে একটা বছর যখন মানুষের জন্য প্রচুর বৃষ্টিপাত হবে আর মানুষ প্রচুর ভোগবিলাস করবে।’ রাজা বলল, ‘তোমরা তাকে (ইউসুফকে) আমার কাছে নিয়ে এসো।’ দূত যখন তার কাছে আসলো তখন ইউসুফ বলল, ‘তোমার প্রভুর কাছে ফিরে যাও। (সূরাহ ইউসুফ ১২/৩৬-৫০) ادَّكَرَ-এর আসল রূপ ذَكَرَ শব্দ থেকে ‘ইয়্তাকারা’। أُمَّةٍ অর্থ যুগ। أُمَّةٍ ও পড়া যায়, অর্থ ভুলে যাওয়া। ইবনু ‘আব্বাস (রাঃ) বলেন يَعْصِرُونَ আঙুর ও তেল নিংড়িয়ে রস বের করবে। تَحْرُسُونَ তোমরা সংরক্ষণ করবে। ৬৯৯২. আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ ইউসুফ (আঃ) যতদিন জেলে কাটিয়েছেন, যদি আমি ততদিন কাটাতাম, আর আমার কাছে (বাদশাহর) আহবানকারী আসত, সেক্ষেত্রে আমি অবশ্যই তার ডাকে সাড়া দিতাম।[1] [৩৩৭২] (আধুনিক প্রকাশনী- ৬৫০৮, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"If I stayed in prison as long as Joseph stayed and then the messenger came, I would respond to his call (to go out of the prison)"},{"n":"6993","k":"","a":"حَدَّثَنَا عَبْدَانُ، أَخْبَرَنَا عَبْدُ اللَّهِ، عَنْ يُونُسَ، عَنِ الزُّهْرِيِّ، حَدَّثَنِي أَبُو سَلَمَةَ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏ \"‏ مَنْ رَآنِي فِي الْمَنَامِ فَسَيَرَانِي فِي الْيَقَظَةِ، وَلاَ يَتَمَثَّلُ الشَّيْطَانُ بِي ‏\"‏‏.‏ قَالَ أَبُو عَبْدِ اللَّهِ قَالَ ابْنُ سِيرِينَ إِذَا رَآهُ فِي صُورَتِهِ‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছিঃ যে লোক আমাকে স্বপ্নে দেখে সে শীঘ্রই জাগ্রত অবস্থাতেও আমাকে দেখবে। কেননা শয়তান আমার আকৃতি ধরতে পারে না। [১১০; মুসলিম ৪২/১, হাঃ ২২৬৬, আহমাদ ৮৫১৬] (আধুনিক প্রকাশনী- ৬৫০৮, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:I heard the Prophet (ﷺ) saying, \"Whoever sees me in a dream will see me in his wakefulness, and Satan cannot imitate me in shape.\" Abu `Abdullah said, \"Ibn Seereen said, 'Only if he sees the Prophet (ﷺ) in his (real) shape"},{"n":"6994","k":"","a":"حَدَّثَنَا مُعَلَّى بْنُ أَسَدٍ، حَدَّثَنَا عَبْدُ الْعَزِيزِ بْنُ مُخْتَارٍ، حَدَّثَنَا ثَابِتٌ الْبُنَانِيُّ، عَنْ أَنَسٍ ـ رضى الله عنه ـ قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ مَنْ رَآنِي فِي الْمَنَامِ فَقَدْ رَآنِي، فَإِنَّ الشَّيْطَانَ لاَ يَتَخَيَّلُ بِي، وَرُؤْيَا الْمُؤْمِنِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ ‏\"‏‏.‏","b":"আনাস (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে আমাকে ঘুমন্ত অবস্থায় দেখল সে আমাকেই দেখল। কারণ শয়তান আমার আকৃতি ধরতে পারে না। আর মু’মিনের স্বপ্ন নবুয়তের ছেচল্লিশ ভাগের এক ভাগ। [৬৯৮৩; মুসলিম পর্ব ৪২/হাঃ ২২৬৪, আহমাদ ১২০৩৭] (আধুনিক প্রকাশনী- ৬৫১০, ইসলামিক ফাউন্ডেশন)","e":"Narrated Anas:The Prophet (ﷺ) said, \"Whoever has seen me in a dream, then no doubt, he has seen me, for Satan cannot imitate my shape"},{"n":"6995","k":"","a":"حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُبَيْدِ اللَّهِ بْنِ أَبِي جَعْفَرٍ، أَخْبَرَنِي أَبُو سَلَمَةَ، عَنْ أَبِي قَتَادَةَ، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ الرُّؤْيَا الصَّالِحَةُ مِنَ اللَّهِ، وَالْحُلْمُ مِنَ الشَّيْطَانِ، فَمَنْ رَأَى شَيْئًا يَكْرَهُهُ فَلْيَنْفِثْ عَنْ شِمَالِهِ ثَلاَثًا، وَلْيَتَعَوَّذْ مِنَ الشَّيْطَانِ، فَإِنَّهَا لاَ تَضُرُّهُ، وَإِنَّ الشَّيْطَانَ لاَ يَتَرَاءَى بِي ‏\"‏‏.‏","b":"আবূ ক্বাতাদাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ ভালো স্বপ্ন আল্লাহর তরফ থেকে ও খারাপ স্বপ্ন শয়তানের তরফ থেকে হয়ে থাকে। কেউ এমন কিছু দেখল, যা সে অপছন্দ করে, সে যেন বামদিকে তিনবার থুথু ফেলে এবং শয়তান থেকে আশ্রয় চায়। তাহলে এ স্বপ্ন তার কোন ক্ষতি করবে না। আর শয়তান আমার আকৃতি ধরতে পারে না। [৩২৯২] (আধুনিক প্রকাশনী- ৬৫১১, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Qatada:The Prophet (ﷺ) said, \"A good dream is from Allah, and a bad dream is from Satan. So whoever has seen (in a dream) something he dislikes, then he should spit without saliva, thrice on his left and seek refuge with Allah from Satan, for it will not harm him, and Satan cannot appear in my shape"},{"n":"6996","k":"","a":"حَدَّثَنَا خَالِدُ بْنُ خَلِيٍّ، حَدَّثَنَا مُحَمَّدُ بْنُ حَرْبٍ، حَدَّثَنِي الزُّبَيْدِيُّ، عَنِ الزُّهْرِيِّ، قَالَ أَبُو سَلَمَةَ قَالَ أَبُو قَتَادَةَ ـ رضى الله عنه ـ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ مَنْ رَآنِي فَقَدْ رَأَى الْحَقَّ ‏\"‏‏.‏ تَابَعَهُ يُونُسُ وَابْنُ أَخِي الزُّهْرِيِّ","b":"আবূ ক্বাতাদাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে আমাকে স্বপ্নে দেখে সে প্রকৃতই দেখে। ইউনুস ও ইবনু আখীয্ যুহরী (রহ.) যুবায়দীর অনুসরণ করেছেন। [৩২৯২]কাফ (আধুনিক প্রকাশনী- ৬৫১২, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Qatada:The Prophet (ﷺ) said, \"Whoever sees me (in a dream) then he indeed has seen the truth"},{"n":"6997","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، حَدَّثَنَا اللَّيْثُ، حَدَّثَنِي ابْنُ الْهَادِ، عَنْ عَبْدِ اللَّهِ بْنِ خَبَّابٍ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ، سَمِعَ النَّبِيَّ صلى الله عليه وسلم يَقُولُ ‏ \"‏مَنْ رَآنِي فَقَدْ رَأَى الْحَقَّ، فَإِنَّ الشَّيْطَانَ لاَ يَتَكَوَّنُنِي‏\"‏‏.‏","b":"আবূ সা‘ঈদ খুদরী (রাঃ) হতে বর্ণিত। তিনি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছেন, যে আমাকে স্বপ্ন দেখে সে প্রকৃতই দেখে। কারণ শয়তান আমার আকৃতি ধরতে পারে না। (আধুনিক প্রকাশনী- ৬৫১৩, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Sa`id Al-Khudri:The Prophet (ﷺ) said, \"Who ever sees me (in a dream) then he indeed has seen the truth, as Satan cannot appear in my shape"},{"n":"6998","k":"","a":"حَدَّثَنَا أَحْمَدُ بْنُ الْمِقْدَامِ الْعِجْلِيُّ، حَدَّثَنَا مُحَمَّدُ بْنُ عَبْدِ الرَّحْمَنِ الطُّفَاوِيُّ، حَدَّثَنَا أَيُّوبُ، عَنْ مُحَمَّدٍ، عَنْ أَبِي هُرَيْرَةَ، قَالَ قَالَ النَّبِيُّ صلى الله عليه وسلم ‏ \"‏ أُعْطِيتُ مَفَاتِيحَ الْكَلِمِ، وَنُصِرْتُ بِالرُّعْبِ، وَبَيْنَمَا أَنَا نَائِمٌ الْبَارِحَةَ إِذْ أُتِيتُ بِمَفَاتِيحِ خَزَائِنِ الأَرْضِ حَتَّى وُضِعَتْ فِي يَدِي ‏\"‏‏.‏ قَالَ أَبُو هُرَيْرَةَ فَذَهَبَ رَسُولُ اللَّهِ صلى الله عليه وسلم وَأَنْتُمْ تَنْتَقِلُونَهَا‏.‏","b":"সামুরাহ (রাঃ) এ সম্পর্কে হাদীস বর্ণনা করেছেন। ৬৯৯৮. আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ আমাকে সংক্ষিপ্ত অথচ বিস্তারিত অর্থবহ বাক্য দান করা হয়েছে। এবং আমাকে ভীতি সঞ্চারক প্রভাব দ্বারা সাহায্য করা হয়েছে। এক রাতে আমি ঘুমিয়ে ছিলাম। সে সময় ভূপৃষ্ঠের সকল ভান্ডারের চাবি আমার কাছে এনে আমার হাতে রাখা হলো। আবূ হুরাইরাহ (রাঃ) বললেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম চলে গেছেন। আর তোমরা ঐ ভান্ডারগুলো সংগ্রহ করে চলেছ।[1] [২৯৭৭] (আধুনিক প্রকাশনী- ৬৫১৪, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:The Prophet (ﷺ) said, \"I have been given the keys of eloquent speech and given victory with awe (cast into the hearts of the enemy), and while I was sleeping last night, the keys of the treasures of the earth were brought to me till they were put in my hand.\" Abu Huraira added: Allah's Messenger (ﷺ) left (this world) and now you people are carrying those treasures from place to place"},{"n":"6999","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ، عَنْ مَالِكٍ، عَنْ نَافِعٍ، عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ ـ رضى الله عنهما ـ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ أُرَانِي اللَّيْلَةَ عِنْدَ الْكَعْبَةِ فَرَأَيْتُ رَجُلاً آدَمَ كَأَحْسَنِ مَا أَنْتَ رَاءٍ مِنْ أُدْمِ الرِّجَالِ، لَهُ لِمَّةٌ كَأَحْسَنِ مَا أَنْتَ رَاءٍ مِنَ اللِّمَمِ، قَدْ رَجَّلَهَا تَقْطُرُ مَاءً، مُتَّكِئًا عَلَى رَجُلَيْنِ ـ أَوْ عَلَى عَوَاتِقِ رَجُلَيْنِ ـ يَطُوفُ بِالْبَيْتِ، فَسَأَلْتُ مَنْ هَذَا فَقِيلَ الْمَسِيحُ ابْنُ مَرْيَمَ‏.‏ ثُمَّ إِذَا أَنَا بِرَجُلٍ جَعْدٍ قَطَطٍ أَعْوَرِ الْعَيْنِ الْيُمْنَى كَأَنَّهَا عِنَبَةٌ طَافِيَةٌ، فَسَأَلْتُ مَنْ هَذَا فَقِيلَ الْمَسِيحُ الدَّجَّالُ ‏\"‏‏.‏","b":"‘আবদুল্লাহ্ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ এক রাতে আমাকে কা‘বার নিকট স্বপ্ন দেখানো হল। তখন আমি গৌর বর্ণের সুন্দর এক পুরুষকে দেখলাম। তার মাথায় খুবই সুন্দর লম্বা লম্বা চুল ছিল, যেগুলো আঁচড়ে রাখা হয়েছে। চুল থেকে ফোঁটা ফোঁটা পানি ঝরছিল। তিনি দু’জনের ওপর অথবা বলেছেন, দু’জনের কাঁধের ওপর ভর করে বায়তুল্লাহর তাওয়াফ করছেন। আমি জিজ্ঞেস করলাম, এ কে? বলা হলঃ মাসীহ্ ইবনু মারইয়াম। এরপর আরেক লোকের সঙ্গে আমার সাক্ষাৎ ঘটল। সে ছিল কোঁকড়ানো চুলওয়ালা, ডান চোখ কানা, চোখটি যেন (পানির ওপর) ভাসমান আঙুর। আমি জিজ্ঞেস করলাম, এ কে? বলা হল মাসীহ্ দাজ্জাল। [৪৩৩০] (আধুনিক প্রকাশনী- ৬৫১৫, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"I saw myself (in a dream) near the Ka`ba last night, and I saw a man with whitish red complexion, the best you may see amongst men of that complexion having long hair reaching his earlobes which was the best hair of its sort, and he had combed his hair and water was dropping from it, and he was performing the Tawaf around the Ka`ba while he was leaning on two men or on the shoulders of two men. I asked, 'Who is this man?' Somebody replied, '(He is) Messiah, son of Mary.' Then I saw another man with very curly hair, blind in the right eye which looked like a protruding out grape. I asked, 'Who is this?' Somebody replied, '(He is) Messiah, Ad-Dajjal"},{"n":"7000","k":"","a":"حَدَّثَنَا يَحْيَى، حَدَّثَنَا اللَّيْثُ، عَنْ يُونُسَ، عَنِ ابْنِ شِهَابٍ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، أَنَّ ابْنَ عَبَّاسٍ، كَانَ يُحَدِّثُ أَنَّ رَجُلاً، أَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ إِنِّي أُرِيتُ اللَّيْلَةَ فِي الْمَنَامِ، وَسَاقَ الْحَدِيثَ‏.‏ وَتَابَعَهُ سُلَيْمَانُ بْنُ كَثِيرٍ وَابْنُ أَخِي الزُّهْرِيِّ وَسُفْيَانُ بْنُ حُسَيْنٍ عَنِ الزُّهْرِيِّ عَنْ عُبَيْدِ اللَّهِ عَنِ ابْنِ عَبَّاسٍ عَنِ النَّبِيِّ صلى الله عليه وسلم‏.‏ وَقَالَ الزُّبَيْدِيُّ عَنِ الزُّهْرِيِّ عَنْ عُبَيْدِ اللَّهِ أَنَّ ابْنَ عَبَّاسٍ أَوْ أَبَا هُرَيْرَةَ عَنِ النَّبِيِّ صلى الله عليه وسلم‏.‏ وَقَالَ شُعَيْبٌ وَإِسْحَاقُ بْنُ يَحْيَى عَنِ الزُّهْرِيِّ كَانَ أَبُو هُرَيْرَةَ يُحَدِّثُ عَنِ النَّبِيِّ صلى الله عليه وسلم وَكَانَ مَعْمَرٌ لاَ يُسْنِدُهُ حَتَّى كَانَ بَعْدُ‏.‏","b":"ইবনু ‘আব্বাস (রাঃ) হতে বর্ণিত। তিনি বলেন, এক লোক রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে এসে বলল, আমি রাতে স্বপ্ন দেখেছি। এরপর পুরো হাদীসটি বর্ণনা করেন। সুলায়মান ইবনু কাসীর, ইবনু আখীয যুহরী ও সুফ্ইয়ান ইবনু হুসায়ন (রহ.).....ইবনু ‘আব্বাস (রাঃ) সূত্রে নবী ..... থেকে ইউনুস (রহ.) এর অনুসরণ করেছেন। যুবায়দী (রহ.) ..... ইবনু ‘আব্বাস অথবা আবূ হুরাইরাহ (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম থেকে বর্ণনা করেছেন শু‘আয়ব, ইসহাক ইবনু ইয়াহ্ইয়া, আবূ হুরাইরাহ (রাঃ) নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম থেকে বর্ণনা করতেন। মা‘মার (রহ.) প্রথম এ হাদীসের সনদ বর্ণনা করতেন না। কিন্তু পরবর্তীতে করতেন। [৭০৪৬] (আধুনিক প্রকাশনী- ৬৫১৬, ইসলামিক ফাউন্ডেশন)","e":"Narrated Ibn `Abbas:About a man who came to Allah's Messenger (ﷺ) and said, \"I was shown in a dream last night...\" Then Ibn `Abbas mentioned the narration"},{"n":"7002","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ يُوسُفَ، أَخْبَرَنَا مَالِكٌ، عَنْ إِسْحَاقَ بْنِ عَبْدِ اللَّهِ بْنِ أَبِي طَلْحَةَ، أَنَّهُ سَمِعَ أَنَسَ بْنَ مَالِكٍ، يَقُولُ كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَدْخُلُ عَلَى أُمِّ حَرَامٍ بِنْتِ مِلْحَانَ، وَكَانَتْ تَحْتَ عُبَادَةَ بْنِ الصَّامِتِ، فَدَخَلَ عَلَيْهَا يَوْمًا فَأَطْعَمَتْهُ، وَجَعَلَتْ تَفْلِي رَأْسَهُ، فَنَامَ رَسُولُ اللَّهِ صلى الله عليه وسلم ثُمَّ اسْتَيْقَظَ وَهْوَ يَضْحَكُ‏.‏ قَالَتْ فَقُلْتُ مَا يُضْحِكُكَ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ نَاسٌ مِنْ أُمَّتِي عُرِضُوا عَلَىَّ، غُزَاةً فِي سَبِيلِ اللَّهِ، يَرْكَبُونَ ثَبَجَ هَذَا الْبَحْرِ، مُلُوكًا عَلَى الأَسِرَّةِ أَوْ مِثْلَ الْمُلُوكِ عَلَى الأَسِرَّةِ ‏\"‏‏.‏ شَكَّ إِسْحَاقُ‏.‏ قَالَتْ فَقُلْتُ يَا رَسُولَ اللَّهِ ادْعُ اللَّهَ أَنْ يَجْعَلَنِي مِنْهُمْ، فَدَعَا لَهَا رَسُولُ اللَّهِ صلى الله عليه وسلم ثُمَّ وَضَعَ رَأْسَهُ ثُمَّ اسْتَيْقَظَ وَهْوَ يَضْحَكُ‏.‏ فَقُلْتُ مَا يُضْحِكُكَ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ نَاسٌ مِنْ أُمَّتِي عُرِضُوا عَلَىَّ، غُزَاةً فِي سَبِيلِ اللَّهِ ‏\"‏‏.‏ كَمَا قَالَ فِي الأُولَى‏.‏ قَالَتْ فَقُلْتُ يَا رَسُولَ اللَّهِ ادْعُ اللَّهَ أَنْ يَجْعَلَنِي مِنْهُمْ‏.‏ قَالَ ‏\"‏ أَنْتِ مِنَ الأَوَّلِينَ ‏\"‏‏.‏ فَرَكِبَتِ الْبَحْرَ فِي زَمَانِ مُعَاوِيَةَ بْنِ أَبِي سُفْيَانَ فَصُرِعَتْ عَنْ دَابَّتِهَا حِينَ خَرَجَتْ مِنَ الْبَحْرِ، فَهَلَكَتْ‏.‏","b":"উম্মু হারাম (রাঃ) বলেন, আমি বললাম, হে আল্লাহর রাসূল! আপনি কেন হাসলেন? তিনি বললেনঃ আমার উম্মাতের একদল লোককে আমার কাছে পেশ করা হয়েছে। যারা আল্লাহর রাস্তায় যুদ্ধরত সাগরের মধ্যে জাহাজের ওপর আরোহণ করে বাদশাহর সিংহাসনে অথবা বাদশাহ্দের মত তারা সিংহাসনে বসে আছে। ইসহাক রাবী সন্দেহ করেছেন। উম্মু হারাম (রাঃ) বলেন, আমি বললাম, হে আল্লাহর রাসূল। আপনি আল্লাহর কাছে দু‘আ করুন, তিনি যেন আমাকে তাদের দলে অন্তর্ভুক্ত করে দেন। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তার জন্য দু‘আ করলেন। এরপর আবার তিনি মাথা রেখে ঘুমিয়ে পড়লেন। কিছুক্ষণ পর আবার হেসে হেসে জেগে উঠলেন। আমি বললাম, আপনি হাসলেন কেন হে আল্লাহর রাসূল? তিনি বললেনঃ আল্লাহর রাস্তায় জিহাদে লিপ্ত আমার একদল উম্মাতকে আমার কাছে পেশ করা হয়েছে। আগের মত এ দল সম্পর্কেও বললেন। উম্মু হারাম (রাঃ) বলেন, আমি বললাম, হে আল্লাহর রাসূল। আপনি আল্লাহর কাছে দু‘আ করুন, তিনি যেন আমাকে এ দলভুক্ত করে দেন। তিনি বললেনঃ তুমি প্রথম দলের অন্তর্ভুক্ত। উম্মু হারাম (রাঃ) মু‘আবীয়াহ ইবনু সুফ্ইয়ান (রাঃ)-এর আমলে সামুদ্রিক জাহাজে উঠেন এবং সমুদ্র থেকে পেরিয়ে আসার সময় আপন সাওয়ারী থেকে মাটিতে পড়ে গিয়ে মারা যান। [৬৭৮৯] (আধুনিক প্রকাশনী- ৬৫১৭, ইসলামিক ফাউন্ডেশন)","e":"Narrated Anas bin Malik:Allah's Messenger (ﷺ) used to visit Um Haram bint Milhan she was the wife of 'Ubada bin As-Samit. One day the Prophet (ﷺ) visited her and she provided him with food and started looking for lice in his head. Then Allah's Messenger (ﷺ) slept and afterwards woke up smiling. Um Haram asked, \"What makes you smile, O Allah's Messenger (ﷺ)?\" He said, \"Some of my followers were presented before me in my dream as fighters in Allah's Cause, sailing in the middle of the seas like kings on the thrones or like kings sitting on their thrones.\" (The narrator 'Is-haq is not sure as to which expression was correct). Um Haram added, 'I said, \"O Allah's Messenger (ﷺ)! Invoke Allah, to make me one of them;\" So Allah's Messenger (ﷺ) invoked Allah for her and then laid his head down (and slept). Then he woke up smiling (again). (Um Haram added): I said, \"What makes you smile, O Allah's Messenger (ﷺ)?\" He said, \"Some people of my followers were presented before me (in a dream) as fighters in Allah's Cause.\" He said the same as he had said before. I said, \"O Allah's Messenger (ﷺ)! Invoke Allah to make me from them.\" He said, \"You are among the first ones.\" Then Um Haram sailed over the sea during the Caliphate of Muawiya bin Abu Sufyan, and she fell down from her riding animal after coming ashore, and died"},{"n":"7003","k":"","a":"حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، حَدَّثَنِي اللَّيْثُ، حَدَّثَنِي عُقَيْلٌ، عَنِ ابْنِ شِهَابٍ، أَخْبَرَنِي خَارِجَةُ بْنُ زَيْدِ بْنِ ثَابِتٍ، أَنَّ أُمَّ الْعَلاَءِ ـ امْرَأَةً مِنَ الأَنْصَارِ بَايَعَتْ رَسُولَ اللَّهِ صلى الله عليه وسلم ـ أَخْبَرَتْهُ أَنَّهُمُ اقْتَسَمُوا الْمُهَاجِرِينَ قُرْعَةً‏.‏ قَالَتْ فَطَارَ لَنَا عُثْمَانُ بْنُ مَظْعُونٍ، وَأَنْزَلْنَاهُ فِي أَبْيَاتِنَا، فَوَجِعَ وَجَعَهُ الَّذِي تُوُفِّيَ فِيهِ، فَلَمَّا تُوُفِّيَ غُسِّلَ وَكُفِّنَ فِي أَثْوَابِهِ دَخَلَ رَسُولُ اللَّهِ صلى الله عليه وسلم فَقُلْتُ رَحْمَةُ اللَّهِ عَلَيْكَ أَبَا السَّائِبِ، فَشَهَادَتِي عَلَيْكَ لَقَدْ أَكْرَمَكَ اللَّهُ‏.‏ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ وَمَا يُدْرِيكِ أَنَّ اللَّهَ أَكْرَمَهُ ‏\"‏‏.‏ فَقُلْتُ بِأَبِي أَنْتَ يَا رَسُولَ اللَّهِ فَمَنْ يُكْرِمُهُ اللَّهُ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ أَمَّا هُوَ فَوَاللَّهِ لَقَدْ جَاءَهُ الْيَقِينُ، وَاللَّهِ إِنِّي لأَرْجُو لَهُ الْخَيْرَ، وَوَاللَّهِ مَا أَدْرِي وَأَنَا رَسُولُ اللَّهِ مَاذَا يُفْعَلُ بِي ‏\"‏‏.‏ فَقَالَتْ وَاللَّهِ لاَ أُزَكِّي بَعْدَهُ أَحَدًا أَبَدًا‏.‏","b":"খারিজাহ ইবনু যায়দ ইবনু সাবিত (রাঃ) হতে বর্ণিত যে, উম্মুল আলা নামক এক আনসারী মহিলা রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে বাই‘আত গ্রহণ করেন। তিনি তাঁকে জানান যে, আনসারগণ লটারির সাহায্যে মুহাজিরগণকে ভাগ করে নিয়েছিল। আমাদের ভাগে আসলেন ‘উসমান ইবনু মাযউন (রাঃ)। আমরা তাকে আমাদের ঘরের মেহমান করে নিলাম। এরপর তিনি এমন এক ব্যথায় আক্রান্ত হলেন যে, সে ব্যথায় তার মৃত্যু হল। মৃত্যুর পর তাঁকে গোসল দেয়া হল। তাঁর কাপড় দিয়েই তাঁকে কাফন পরানো হল। এমন সময় রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এলেন। উম্মুল আলা (রাঃ) বলেন, আমি বললাম, তোমার ওপর আল্লাহর রহমত হোক, হে আবূ সাইব! আমার সাক্ষ্য তোমার বেলায় এটাই যে আল্লাহ্ তোমাকে সম্মানিত করেছেন। তখন রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেনঃ তুমি কী করে জানলে যে আল্লাহ্ তাকে সম্মানিত করেছেন? আমি বললাম, হে আল্লাহর রাসূল! আপনার প্রতি আমার পিতা কুরবান হোক! তাহলে কাকে আল্লাহ্ সম্মানিত করবেন? তখন রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন ঃ আল্লাহর কসম! তাঁর ব্যাপার তো হল, তার মৃত্যু হয়ে গেছে। আল্লাহর কসম! তার জন্য আমি কল্যাণই আশা করি। আল্লাহর কসম! আমি আল্লাহর রাসূল হওয়া সত্ত্বেও জানি না, আমার সঙ্গে কী ব্যবহার করা হবে? তখন উম্মুল আলা (রাঃ) বললেন, আল্লাহর কসম! আমি আগামীতে কখনো কারো পবিত্র হওয়ার সাক্ষ্য দেব না। [১২৪৩] (আধুনিক প্রকাশনী- ৬৫১৮, ইসলামিক ফাউন্ডেশন)","e":"Narrated Kharija bin Zaid bin Thabit:Um Al-`Ala an Ansari woman who had given a pledge of allegiance to Allah's Messenger (ﷺ) told me:, \"The Muhajirln (emigrants) were distributed amongst us by drawing lots, and we got `Uthman bin Maz'un in our share. We made him stay with us in our house. Then he suffered from a disease which proved fatal. When he died and was given a bath and was shrouded in his clothes. Allah's Messenger (ﷺ) came, I said, (addressing the dead body), 'O Aba As-Sa'ib! May Allah be Merciful to you! I testify that Allah has honored you.' Allah's Messenger (ﷺ) said, 'How do you know that Allah has honored him?\" I replied, 'Let my father be sacrificed for you, O Allah's Messenger (ﷺ)! On whom else shall Allah bestow. His honor?' Allah's Messenger (ﷺ) said, 'As for him, by Allah, death has come to him. By Allah, I wish him all good (from Allah). By Allah, in spite of the fact that I am Allah's Messenger (ﷺ), I do not know what Allah will do to me.\", Um Al-`Ala added, \"By Allah, I will never attest the righteousness of anybody after that"},{"n":"7004","k":"","a":"حَدَّثَنَا أَبُو الْيَمَانِ، أَخْبَرَنَا شُعَيْبٌ، عَنِ الزُّهْرِيِّ، بِهَذَا وَقَالَ ‏\"‏ مَا أَدْرِي مَا يُفْعَلُ بِهِ ‏\"‏‏.‏ قَالَتْ وَأَحْزَنَنِي فَنِمْتُ، فَرَأَيْتُ لِعُثْمَانَ عَيْنًا تَجْرِي، فَأَخْبَرْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ ‏\"‏ ذَلِكَ عَمَلُهُ ‏\"‏‏.‏","b":"যুহরী (রহ.) থেকে এ হাদীসে বলা হয়েছে রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেনঃ আমি জানি না, তার সঙ্গে কী ব্যবহার করা হবে? উম্মুল আলা (রাঃ) বললেন, আমি এতে চিন্তিত হয়ে ঘুমিয়ে গেলাম। তখন আমি স্বপ্নে ‘উসমান ইবনু মাযউন (রাঃ)এর জন্য প্রবহমান ঝর্ণা দেখতে পেলাম। আমি রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে এ সম্পর্কে জানালাম। তিনি বললেনঃ এটা তার ‘আমল। [১২৪৩] (আধুনিক প্রকাশনী- ৬৫১৯, ইসলামিক ফাউন্ডেশন)","e":"Narrated Az-Zuhri:Regarding the above narration, The Prophet (ﷺ) said, \"I do not know what Allah will do to him (Uthman bin Maz'un).\" Um Al-`Ala said, \"I felt very sorry for that, and then I slept and saw in a dream a flowing spring for `Uthman bin Maz'un, and told Allah's Messenger (ﷺ) of that, and he said, \"That flowing spring symbolizes his good deeds"},{"n":"7005","k":"","a":"حَدَّثَنَا يَحْيَى بْنُ بُكَيْرٍ، حَدَّثَنَا اللَّيْثُ، عَنْ عُقَيْلٍ، عَنِ ابْنِ شِهَابٍ، عَنْ أَبِي سَلَمَةَ، أَنَّ أَبَا قَتَادَةَ الأَنْصَارِيّ َ ـ وَكَانَ مِنْ أَصْحَابِ النَّبِيِّ صلى الله عليه وسلم وَفُرْسَانِهِ قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ الرُّؤْيَا مِنَ اللَّهِ، وَالْحُلْمُ مِنَ الشَّيْطَانِ، فَإِذَا حَلَمَ أَحَدُكُمُ الْحُلُمَ يَكْرَهُهُ فَلْيَبْصُقْ عَنْ يَسَارِهِ وَلْيَسْتَعِذْ بِاللَّهِ مِنْهُ، فَلَنْ يَضُرَّهُ ‏\"‏‏.‏","b":"আবূ ক্বাতাদাহ আনসারী (রাঃ) হতে বর্ণিত, যিনি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর সাহাবী ও অশ্বারোহী যোদ্ধা ছিলেন। তিনি বলেন, আমি রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি, ভাল স্বপ্ন আল্লাহর তরফ থেকে এবং খারাপ স্বপ্ন শয়তানের তরফ থেকে হয়ে থাকে। যখন তোমাদের কেউ খারাপ স্বপ্ন দেখে যা তার কাছে অপছন্দনীয় মনে হয়, তখন সে যেন তার বামদিকে থু থু নিক্ষেপ করে এবং এ স্বপ্ন থেকে আল্লাহর আশ্রয় চায়। সেক্ষেত্রে এ স্বপ্ন তার কোন ক্ষতি করবে না। [৩২৯২] (আধুনিক প্রকাশনী- ৬৫২০, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Qatada Al-Ansari:(a companion of the Prophet (ﷺ) and one of his cavalry men) \"I heard Allah's Messenger (ﷺ) saying, \"A good dream is from Allah, and a bad dream is from Satan; so, if anyone of you had a bad dream which he disliked, then he should spit on his left and seek refuge with Allah from it, for it will not harm him"},{"n":"7006","k":"","a":"حَدَّثَنَا عَبْدَانُ، أَخْبَرَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا يُونُسُ، عَنِ الزُّهْرِيِّ، أَخْبَرَنِي حَمْزَةُ بْنُ عَبْدِ اللَّهِ، أَنَّ ابْنَ عُمَرَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏\"‏ بَيْنَا أَنَا نَائِمٌ أُتِيتُ بِقَدَحِ لَبَنٍ، فَشَرِبْتُ مِنْهُ، حَتَّى إِنِّي لأَرَى الرِّيَّ يَخْرُجُ مِنْ أَظْفَارِي، ثُمَّ أَعْطَيْتُ فَضْلِي ‏\"‏‏.‏ يَعْنِي عُمَرَ‏.‏ قَالُوا فَمَا أَوَّلْتَهُ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ الْعِلْمَ ‏\"‏‏.‏","b":"ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি, আমি একবার ঘুমিয়ে ছিলাম। আমার কাছে একটি দুধের পেয়ালা পেশ করা হল, আমি তা থেকে পরিতৃপ্ত হয়ে পান করলাম। তৃপ্তির চিহ্ন আমার নখ দিয়ে প্রকাশ পেতে লাগল। অতঃপর বাকী অংশ অবশিষ্টাংশ ‘উমারকে দিলাম। সহাবাগণ জিজ্ঞেস করলেন, হে আল্লাহর রাসূল! আপনি এর কী ব্যাখ্যা দিলেন। তিনি বললেনঃ ইলম। [৩২৯২] (আধুনিক প্রকাশনী- ৬৫২১, ইসলামিক ফাউন্ডেশন)","e":"Narrated Ibn `Umar:I heard Allah's Messenger (ﷺ) saying, \"While I was sleeping, I was given a bowl full of milk (in a dream), and I drank of it to my fill until I noticed its wetness coming out of my nails, and then I gave the rest of it to `Umar.\" They (the people) asked, \"What have you interpreted (about the dream)? O Allah's Apostle?\" He said, \"(It is Religious) knowledge"},{"n":"7007","k":"","a":"حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا أَبِي، عَنْ صَالِحٍ، عَنِ ابْنِ شِهَابٍ، حَدَّثَنِي حَمْزَةُ بْنُ عَبْدِ اللَّهِ بْنِ عُمَرَ، أَنَّهُ سَمِعَ عَبْدَ اللَّهِ بْنَ عُمَرَ ـ رضى الله عنهما ـ يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ بَيْنَا أَنَا نَائِمٌ أُتِيتُ بِقَدَحِ لَبَنٍ، فَشَرِبْتُ مِنْهُ، حَتَّى إِنِّي لأَرَى الرِّيَّ يَخْرُجُ مِنْ أَطْرَافِي، فَأَعْطَيْتُ فَضْلِي عُمَرَ بْنَ الْخَطَّابِ ‏\"‏‏.‏ فَقَالَ مَنْ حَوْلَهُ فَمَا أَوَّلْتَ ذَلِكَ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ الْعِلْمَ ‏\"‏‏.‏","b":"‘আবদুল্লাহ্ ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, একবার আমি ঘুমিয়েছিলাম। আমার কাছে দুধের একটি পেয়ালা হাজির করা হল। আমি পরিতৃপ্ত হয়ে তা থেকে পান করলাম। এমনকি তৃপ্তির চিহ্ন আমার চারদিকে ছড়িয়ে পড়ছিল। অতঃপর বাকী অংশ ‘উমার ইবনু খাত্তাবকে দিলাম। তাঁর পাশের লোকজন জিজ্ঞেস করলেন, আপনি এর কী ব্যাখ্যা দিচ্ছেন হে আল্লাহর রাসূল? তিনি বললেনঃ ইলম।[1] [৮২] (আধুনিক প্রকাশনী- ৬৫২২, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Abdullah bin `Umar:Allah's Messenger (ﷺ) said, \"While I was sleeping, I was given a bowl full of milk (in the dream) and I drank from it (to my fill) till I noticed its wetness coming out of my limbs. Then I gave the rest of it to `Umar bin Al-Khattab.\" The persons sitting around him, asked, \"What have you interpreted (about the dream) O Allah's Messenger (ﷺ)?\" He said, \"(It is religious) knowledge"},{"n":"7008","k":"","a":"حَدَّثَنَا عَلِيُّ بْنُ عَبْدِ اللَّهِ، حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، حَدَّثَنِي أَبِي، عَنْ صَالِحٍ، عَنِ ابْنِ شِهَابٍ، قَالَ حَدَّثَنِي أَبُو أُمَامَةَ بْنُ سَهْلٍ، أَنَّهُ سَمِعَ أَبَا سَعِيدٍ الْخُدْرِيَّ، يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ بَيْنَمَا أَنَا نَائِمٌ رَأَيْتُ النَّاسَ يُعْرَضُونَ عَلَىَّ، وَعَلَيْهِمْ قُمُصٌ، مِنْهَا مَا يَبْلُغُ الثَّدْىَ، وَمِنْهَا مَا يَبْلُغُ دُونَ ذَلِكَ، وَمَرَّ عَلَىَّ عُمَرُ بْنُ الْخَطَّابِ وَعَلَيْهِ قَمِيصٌ يَجُرُّهُ ‏\"‏‏.‏ قَالُوا مَا أَوَّلْتَ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ الدِّينَ ‏\"‏‏.‏","b":"আবূ সা‘ঈদ খুদরী (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, আমি একবার ঘুমিয়েছিলাম। একদল লোককে স্বপ্নে দেখলাম, তাদেরকে আমার কাছে আনা হচ্ছে। তাদের গায়ে ছিল জামা। কারো কারো জামা স্তন পর্যন্ত, আর কারো কারো তার নিচ পর্যন্ত। ‘উমার ইবনু খাত্তাব আমার নিকট দিয়ে গেল। তার গায়ের জামা মাটিতে হেঁচড়ে চলছিল। সহাবাগণ জিজ্ঞেস করলেন, হে আল্লাহর রাসূল! আপনি কী ব্যাখ্যা দিলেন। তিনি বললেনঃ দ্বীন। [২৩] (আধুনিক প্রকাশনী- ৬৬২৩, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Sa`id Al-Khudri:Allah's Messenger (ﷺ) said, \"While I was sleeping, some people were displayed before me (in a dream). They were wearing shirts, some of which were merely covering their breasts, and some a bit longer. Then there passed before me, `Umar bin Al-Khattab wearing a shirt he was dragging it (on the ground behind him.)\" They (the people) asked, \"What have you interpreted (about the dream) O Allah's Apostle?\" He said, \"The Religion"},{"n":"7009","k":"","a":"حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، حَدَّثَنِي اللَّيْثُ، حَدَّثَنِي عُقَيْلٌ، عَنِ ابْنِ شِهَابٍ، أَخْبَرَنِي أَبُو أُمَامَةَ بْنُ سَهْلٍ، عَنْ أَبِي سَعِيدٍ الْخُدْرِيِّ ـ رضى الله عنه ـ قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏\"‏ بَيْنَا أَنَا نَائِمٌ رَأَيْتُ النَّاسَ عُرِضُوا عَلَىَّ، وَعَلَيْهِمْ قُمُصٌ، فَمِنْهَا مَا يَبْلُغُ الثَّدْىَ، وَمِنْهَا مَا يَبْلُغُ دُونَ ذَلِكَ، وَعُرِضَ عَلَىَّ عُمَرُ بْنُ الْخَطَّابِ وَعَلَيْهِ قَمِيصٌ يَجْتَرُّهُ ‏\"‏‏.‏ قَالُوا فَمَا أَوَّلْتَهُ يَا رَسُولَ اللَّهِ قَالَ ‏\"‏ الدِّينَ ‏\"‏‏.‏","b":"আবূ সা‘ঈদ খুদরী (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি। তিনি বলেছেনঃ আমি একসময় ঘুমিয়ে ছিলাম। আমি দেখলাম, আমরা কাছে একদল লোককে আনা হল, তাদের গায়ে ছিল জামা। কারো কারো জামা স্তন পর্যন্ত। আর কারো কারো এর নিচ পর্যন্ত। আর ‘উমার ইবনু খাত্তাবকে এমন অবস্থায় আমার কাছে আনা হল যে, সে তার গায়ের জামা হেঁচড়িয়ে চলছিল। সহাবাগণ বললেন, হে আল্লাহর রাসূল! আপনি এর কী ব্যাখ্যা দিলেন। তিনি বললেনঃ দ্বীন। (আধুনিক প্রকাশনী- ৬৫২৪, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Sa`id Al-Khudri:I heard Allah's Messenger (ﷺ) saying, \"While I was sleeping, I saw (in a dream) the people being displayed before me, wearing shirts, some of which (were so short that it) reached as far as their breasts and some reached below that. Then `Umar bin Al-Khattab was shown to me and he was wearing a shirt which he was dragging (behind him).\" They asked. What have you interpreted (about the dream)? O Allah's Messenger (ﷺ)?\" He said, \"The religion"},{"n":"7010","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ الْجُعْفِيُّ، حَدَّثَنَا حَرَمِيُّ بْنُ عُمَارَةَ، حَدَّثَنَا قُرَّةُ بْنُ خَالِدٍ، عَنْ مُحَمَّدِ بْنِ سِيرِينَ، قَالَ قَالَ قَيْسُ بْنُ عُبَادٍ كُنْتُ فِي حَلْقَةٍ فِيهَا سَعْدُ بْنُ مَالِكٍ وَابْنُ عُمَرَ فَمَرَّ عَبْدُ اللَّهِ بْنُ سَلاَمٍ فَقَالُوا هَذَا رَجُلٌ مِنْ أَهْلِ الْجَنَّةِ‏.‏ فَقُلْتُ لَهُ إِنَّهُمْ قَالُوا كَذَا وَكَذَا‏.‏ قَالَ سُبْحَانَ اللَّهِ مَا كَانَ يَنْبَغِي لَهُمْ أَنْ يَقُولُوا مَا لَيْسَ لَهُمْ بِهِ عِلْمٌ، إِنَّمَا رَأَيْتُ كَأَنَّمَا عَمُودٌ وُضِعَ فِي رَوْضَةٍ خَضْرَاءَ، فَنُصِبَ فِيهَا وَفِي رَأْسِهَا عُرْوَةٌ وَفِي أَسْفَلِهَا مِنْصَفٌ ـ وَالْمِنْصَفُ الْوَصِيفُ ـ فَقِيلَ ارْقَهْ‏.‏ فَرَقِيتُ حَتَّى أَخَذْتُ بِالْعُرْوَةِ‏.‏ فَقَصَصْتُهَا عَلَى رَسُولِ اللَّهِ صلى الله عليه وسلم فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ يَمُوتُ عَبْدُ اللَّهِ وَهْوَ آخِذٌ بِالْعُرْوَةِ الْوُثْقَى ‏\"‏‏.‏","b":"কায়স ইবনু ‘উবাদ (রহ.) হতে বর্ণিত। তিনি বলেন, আমি এক মজলিসে ছিলাম। যেখানে সা‘দ ইবনু মালিক (রাঃ) এবং ইবনু ‘উমার (রাঃ)-ও ছিলেন। এ সময় ‘আবদুল্লাহ্ ইবনু সালাম (রাঃ) ঐ পথ দিয়ে যাচ্ছিলেন। লোকেরা বলল, ঐ লোকটি জান্নাতবাসীদের একজন। আমি তাঁকে বললাম, লোকেরা এমন এমন বলছে। তিনি বললেন, সুবহানাল্লাহ্! তাদের জন্য উচিত নয় মতামত ব্যক্ত করা, যে বিষয় সম্পর্কে তাদের কোন জ্ঞান নেই। আমি স্বপ্নে দেখেছিলাম, যেন একটা স্তম্ভ একটি সবুজ বাগানে রাখা হয়েছে এবং সেটা যেখানে রাখা হয়েছে তার উপর ভাগে একটি রশি ছিল। আর নিচের দিকে ছিল একজন খাদিম। ‘মিনসাফ’ অর্থ খাদিম। বলা হল, এ স্তম্ভ বেয়ে উপরে উঠ। আমি উপরের দিকে উঠে রশিটি ধরে ফেললাম। এরপর এ স্বপ্ন রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে বর্ণনা করেছিলাম। তখন রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছিলেন, ‘আবদুল্লাহ্ মযবূত রশি ধরা অবস্থায় মারা যাবে। [৩৮১৩] (আধুনিক প্রকাশনী- ৬৫২৫, ইসলামিক ফাউন্ডেশন)","e":"Narrated Qais bin 'Ubada:I was sitting in a gathering in which there was Sa`d bin Malik and Ibn `Umar. `Abdullah bin Salam passed in front of them and they said, \"This man is from the people of Paradise.\" I said to `Abdullah bin Salam, \"They said so-and-so.\" He replied, \"Subhan Allah! They ought not to have said things of which they have no knowledge, but I saw (in a dream) that a post was fixed in a green garden. At the top of the post there was a handhold and below it there was a servant. I was asked to climb (the post). So I climbed it till I got hold of the handhold.\" Then I narrated this dream to Allah's Messenger (ﷺ). Allah's Apostle said, \"`Abdullah will die while still holding the firm reliable handhold (i.e., Islam)"},{"n":"7011","k":"","a":"حَدَّثَنَا عُبَيْدُ بْنُ إِسْمَاعِيلَ، حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ هِشَامٍ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ ـ رضى الله عنها ـ قَالَتْ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ أُرِيتُكِ فِي الْمَنَامِ مَرَّتَيْنِ، إِذَا رَجُلٌ يَحْمِلُكِ فِي سَرَقَةِ حَرِيرٍ فَيَقُولُ هَذِهِ امْرَأَتُكَ‏.‏ فَأَكْشِفُهَا فَإِذَا هِيَ أَنْتِ فَأَقُولُ إِنْ يَكُنْ هَذَا مِنْ عِنْدِ اللَّهِ يُمْضِهِ ‏\"‏‏.‏","b":"‘আয়িশাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, তোমাকে আমায় দু’বার স্বপ্নে দেখানো হয়েছে। আমি দেখলাম, এক ব্যক্তি তোমাকে রেশমী এক টুকরা কাপড়ে জড়িয়ে বয়ে নিয়ে আসছে আর বলছে ইনি আপনার স্ত্রী। আমি তার নিকাব উন্মোচন করে দেখতে পাই যে ঐ মহিলাটি তুমিই এবং আমি বলছি, যদি এটা আল্লাহর তরফ থেকে হয়ে থাকে তা হলে তিনি তা সত্যে পরিণত করবেন। (আধুনিক প্রকাশনী- ৬৫২৬, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Aisha:Allah's Messenger (ﷺ) said (to me), \"You were shown to me twice in (my) dream. Behold, a man was carrying you in a silken piece of cloth and said to me, \"She is your wife, so uncover her,' and behold, it was you. I would then say (to myself), 'If this is from Allah, then it must happen"},{"n":"7012","k":"","a":"حَدَّثَنَا مُحَمَّدٌ، أَخْبَرَنَا أَبُو مُعَاوِيَةَ، أَخْبَرَنَا هِشَامٌ، عَنْ أَبِيهِ، عَنْ عَائِشَةَ، قَالَتْ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ أُرِيتُكِ قَبْلَ أَنْ أَتَزَوَّجَكِ مَرَّتَيْنِ، رَأَيْتُ الْمَلَكَ يَحْمِلُكِ فِي سَرَقَةٍ مِنْ حَرِيرٍ فَقُلْتُ لَهُ اكْشِفْ‏.‏ فَكَشَفَ فَإِذَا هِيَ أَنْتِ، فَقُلْتُ إِنْ يَكُنْ هَذَا مِنْ عِنْدِ اللَّهِ يُمْضِهِ‏.‏ ثُمَّ أُرِيتُكِ يَحْمِلُكِ فِي سَرَقَةٍ مِنْ حَرِيرٍ فَقُلْتُ اكْشِفْ‏.‏ فَكَشَفَ فَإِذَا هِيَ أَنْتِ فَقُلْتُ إِنْ يَكُ هَذَا مِنْ عِنْدِ اللَّهِ يُمْضِهِ ‏\"‏‏.‏","b":"‘আয়িশাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ তোমাকে (‘আয়িশাহকে) বিয়ে করার আগে দু’বার আমাকে দেখানো হয়েছে। আমি দেখেছি, একজন ফেরেশতা তোমাকে রেশমী এক টুকরা কাপড়ে জড়িয়ে বয়ে নিয়ে আসছে। আমি বললাম, আপনি নিকাব সরিয়ে দিন। যখন সে নিকার সরিয়ে দিল তখন আমি দেখতে পেলাম যে, সেই মহিলা তুমিই। আমি তখন বললাম, এটা যদি আল্লাহর তরফ থেকে হয়ে থাকে তাহলে তিনি তা সত্যে পরিণত করবেন। এরপর আবার আমাকে দেখানো হল যে, ফেরেশতা তোমাকে রেশমী এক টুকরা কাপড়ে জড়িয়ে বহন করে নিয়ে আসছে। আমি বললাম, আপনি (তার নিকাব) সরিয়ে দিন। সে তা সরিয়ে দিলে আমি দেখতে পাই যে, সেই মহিলা তুমিই। তখন আমি বললামঃ এটা যদি আল্লাহর তরফ থেকে হয়ে থাকে তাহলে তিনি সত্যে পরিণত করবেন। [৩৮৯৫] (আধুনিক প্রকাশনী- ৬৫২৭, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Aisha:Allah's Messenger (ﷺ) said to me, \"You were shown to me twice (in my dream) before I married you. I saw an angel carrying you in a silken piece of cloth, and I said to him, 'Uncover (her),' and behold, it was you. I said (to myself), 'If this is from Allah, then it must happen.' Then you were shown to me, the angel carrying you in a silken piece of cloth, and I said (to him), 'Uncover (her), and behold, it was you. I said (to myself), 'If this is from Allah, then it must happen"},{"n":"7013","k":"","a":"حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، حَدَّثَنَا اللَّيْثُ، حَدَّثَنِي عُقَيْلٌ، عَنِ ابْنِ شِهَابٍ، أَخْبَرَنِي سَعِيدُ بْنُ الْمُسَيَّبِ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ ‏ \"‏ بُعِثْتُ بِجَوَامِعِ الْكَلِمِ، وَنُصِرْتُ بِالرُّعْبِ، وَبَيْنَا أَنَا نَائِمٌ أُتِيتُ بِمَفَاتِيحِ خَزَائِنِ الأَرْضِ، فَوُضِعَتْ فِي يَدِي ‏\"‏‏.‏ قَالَ مُحَمَّدٌ وَبَلَغَنِي أَنَّ جَوَامِعَ الْكَلِمِ أَنَّ اللَّهَ يَجْمَعُ الأُمُورَ الْكَثِيرَةَ الَّتِي كَانَتْ تُكْتَبُ فِي الْكُتُبِ قَبْلَهُ فِي الأَمْرِ الْوَاحِدِ وَالأَمْرَيْنِ‏.‏ أَوْ نَحْوَ ذَلِكَ‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-কে বলতে শুনেছি যে, আমাকে সংক্ষিপ্ত অথচ বিস্তারিত অর্থবহ বাণী দিয়ে পাঠানো হয়েছে এবং ভীতি সঞ্চারকারী প্রভাব দিয়ে আমাকে সাহায্য করা হয়েছে। একবার আমি ঘুমিয়েছিলাম। আমার কাছে পৃথিবীর ভান্ডারসমূহের চাবি পেশ করে আমার সামনে দেয়া হল। (আবূ ‘আবদুল্লাহ্) মুহাম্মাদ বুখারী (রহ.) বলেন, আমার কাছে এ কথা পৌঁছেছে যে, ‘সংক্ষিপ্ত অথচ বিশদ অর্থবহ বাণী’-এর অর্থ হল, আল্লাহর অনেক বিষয় যা আগের কিতাবসমূহে লেখা হত একটি অথবা দু’টি বিষয়ে বিন্যস্ত করে দেন। অথবা এর অর্থ তেমনি কিছু। [২৯৭৭] (আধুনিক প্রকাশনী- ৬৫২৮, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:I heard Allah's Messenger (ﷺ) saying, \"I have been sent with Jawami al-Kalim (i.e., the shortest expression carrying the widest meanings), and I was made victorious with awe (cast into the hearts of the enemy), and while I was sleeping, the keys of the treasures of the earth were brought to me and were put in my hand.\" Muhammad said, Jawami'-al-Kalim means that Allah expresses in one or two statements or thereabouts the numerous matters that used to be written in the books revealed before (the coming of) the Prophet"},{"n":"7014","k":"","a":"حَدَّثَنِي عَبْدُ اللَّهِ بْنُ مُحَمَّدٍ، حَدَّثَنَا أَزْهَرُ، عَنِ ابْنِ عَوْنٍ، ح وَحَدَّثَنِي خَلِيفَةُ، حَدَّثَنَا مُعَاذٌ، حَدَّثَنَا ابْنُ عَوْنٍ، عَنْ مُحَمَّدٍ، حَدَّثَنَا قَيْسُ بْنُ عُبَادٍ، عَنْ عَبْدِ اللَّهِ بْنِ سَلاَمٍ، قَالَ رَأَيْتُ كَأَنِّي فِي رَوْضَةٍ، وَسَطَ الرَّوْضَةِ عَمُودٌ فِي أَعْلَى الْعَمُودِ عُرْوَةٌ، فَقِيلَ لِي ارْقَهْ‏.‏ قُلْتُ لاَ أَسْتَطِيعُ‏.‏ فَأَتَانِي وَصِيفٌ فَرَفَعَ ثِيَابِي فَرَقِيتُ، فَاسْتَمْسَكْتُ بِالْعُرْوَةِ، فَانْتَبَهْتُ وَأَنَا مُسْتَمْسِكٌ بِهَا، فَقَصَصْتُهَا عَلَى النَّبِيِّ صلى الله عليه وسلم فَقَالَ ‏ \"‏ تِلْكَ الرَّوْضَةُ رَوْضَةُ الإِسْلاَمِ، وَذَلِكَ الْعَمُودُ عَمُودُ الإِسْلاَمِ، وَتِلْكَ الْعُرْوَةُ عُرْوَةُ الْوُثْقَى، لاَ تَزَالُ مُسْتَمْسِكًا بِالإِسْلاَمِ حَتَّى تَمُوتَ ‏\"‏‏.‏","b":"‘আবদুল্লাহ্ ইবনু সালাম (রাঃ) হতে বর্ণিত। তিনি বলেন, আমি স্বপ্নে দেখলাম যেন আমি একটি বাগানে আছি। বাগানের মাঝে একটি স্তম্ভ। স্তম্ভের শিরোভাগে একটি হাতল। তখন আমাকে বলা হল, উপরের দিকে উঠ। আমি বললাম, পারছি না। তখন আমার কাছে একজন খাদিম আসল এবং আমার কাপড় গুটিয়ে দিল। আমি উপরের দিকে উঠতে উঠতে হাতলটি ধরে ফেললাম। হাতলটি ধরে থাকা অবস্থায় আমি জেগে গেলাম। তারপর এ স্বপ্ন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে বর্ণনা করলাম। তিনি বললেনঃ ঐ বাগান ইসলামের বাগান, ঐ স্তম্ভ ইসলামের স্তম্ভ, আর ঐ হাতল হল মযবুত হাতল। তুমি মৃত্যু অবধি ইসলামকে শক্তভাবে ধরে থাকবে। [৩৮১৩] (আধুনিক প্রকাশনী- ৬৫২৯, ইসলামিক ফাউন্ডেশন)","e":"Narrated `Abdullah bin Salam:(In a dream) I saw myself in a garden, and there was a pillar in the middle of the garden, and there was a handhold at the top of the pillar. I was asked to climb it. I said, \"I cannot.\" Then a servant came and lifted up my clothes and I climbed (the pillar), and then got hold of the handhold, and I woke up while still holding it. I narrated that to the Prophet (ﷺ) who said, \"The garden symbolizes the garden of Islam, and the handhold is the firm Islamic handhold which indicates that you will be adhering firmly to Islam until you die"},{"n":"7016","k":"","a":"حَدَّثَنَا مُعَلَّى بْنُ أَسَدٍ، حَدَّثَنَا وُهَيْبٌ، عَنْ أَيُّوبَ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ ـ رضى الله عنهما ـ قَالَ رَأَيْتُ فِي الْمَنَامِ كَأَنَّ فِي يَدِي سَرَقَةً مِنْ حَرِيرٍ لاَ أَهْوِي بِهَا إِلَى مَكَانٍ فِي الْجَنَّةِ إِلاَّ طَارَتْ بِي إِلَيْهِ، فَقَصَصْتُهَا عَلَى حَفْصَةَ‏.‏ فَقَصَّتْهَا حَفْصَةُ عَلَى النَّبِيِّ صلى الله عليه وسلم فَقَالَ ‏\"‏ إِنَّ أَخَاكِ رَجُلٌ صَالِحٌ ‏\"‏‏.‏ أَوْ قَالَ ‏\"‏ إِنَّ عَبْدَ اللَّهِ رَجُلٌ صَالِحٌ ‏\"‏‏.‏","b":"আর হাফসাহ (রাঃ) তা নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর নিকট বর্ণনা করলেন। তখন তিনি বললেনঃ তোমার ভাই একজন নেককার লোক। অথবা বললেনঃ ‘আবদুল্লাহ্ তো একজন নেককার লোক। [১১২২] (আধুনিক প্রকাশনী- ৬৫৩০ শেষাংশ, ইসলামিক ফাউন্ডেশন- ৬৫৪৩ শেষাংশ)","e":"Narrated Ibn `Umar:I saw in a dream a piece of silken cloth in my hand, and in whatever direction in Paradise I waved it, it flew, carrying me there. I narrated this (dream) to (my sister) Hafsa and she told it to the Prophet (ﷺ) who said, (to Hafsa), \"Indeed, your brother is a righteous man,\" or, \"Indeed, `Abdullah is a righteous man"},{"n":"7017","k":"","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ صَبَّاحٍ، حَدَّثَنَا مُعْتَمِرٌ، سَمِعْتُ عَوْفًا، حَدَّثَنَا مُحَمَّدُ بْنُ سِيرِينَ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ، يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ إِذَا اقْتَرَبَ الزَّمَانُ لَمْ تَكَدْ تَكْذِبُ رُؤْيَا الْمُؤْمِنِ، وَرُؤْيَا الْمُؤْمِنِ جُزْءٌ مِنْ سِتَّةٍ وَأَرْبَعِينَ جُزْءًا مِنَ النُّبُوَّةِ‏.‏ ‏\"‏ قَالَ مُحَمَّدٌ وَأَنَا أَقُولُ هَذِهِ قَالَ وَكَانَ يُقَالُ الرُّؤْيَا ثَلاَثٌ حَدِيثُ النَّفْسِ، وَتَخْوِيفُ الشَّيْطَانِ، وَبُشْرَى مِنَ اللَّهِ، فَمَنْ رَأَى شَيْئًا يَكْرَهُهُ فَلاَ يَقُصُّهُ عَلَى أَحَدٍ، وَلْيَقُمْ فَلْيُصَلِّ‏.‏ قَالَ وَكَانَ يُكْرَهُ الْغُلُّ فِي النَّوْمِ، وَكَانَ يُعْجِبُهُمُ الْقَيْدُ، وَيُقَالُ الْقَيْدُ ثَبَاتٌ فِي الدِّينِ‏.‏ وَرَوَى قَتَادَةُ وَيُونُسُ وَهِشَامٌ وَأَبُو هِلاَلٍ عَنِ ابْنِ سِيرِينَ عَنْ أَبِي هُرَيْرَةَ عَنِ النَّبِيِّ صلى الله عليه وسلم وَأَدْرَجَهُ بَعْضُهُمْ كُلَّهُ فِي الْحَدِيثِ، وَحَدِيثُ عَوْفٍ أَبْيَنُ‏.‏ وَقَالَ يُونُسُ لاَ أَحْسِبُهُ إِلاَّ عَنِ النَّبِيِّ صلى الله عليه وسلم فِي الْقَيْدِ‏.‏ قَالَ أَبُو عَبْدِ اللَّهِ لاَ تَكُونُ الأَغْلاَلُ إِلاَّ فِي الأَعْنَاقِ‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যখন ক্বিয়ামাত (কিয়ামত) নিকটবর্তী হবে তখন মু’মিনের স্বপ্ন খুব কমই অবাস্তবায়িত থাকবে। আর মু’মিনের স্বপ্ন নবুয়তের ছেচল্লিশ ভাগের এক ভাগ। আর নবুয়তের কোন কিছুই অসত্য হতে পারে না। রাবী মুহাম্মাদ (রহ.) বলেন, আমি এমন বলছি। তিনি বলেন, এ কথা বলা হয় যে, স্বপ্ন তিন প্রকার, মনের কল্পনা, শয়তানের তরফ থেকে ভয় দেখানো এবং আল্লাহর তরফ হতে সুসংবাদ। তাই যদি কেউ অপছন্দনীয় কিছু দেখে তবে সে যেন তা কারো কাছে বর্ণনা না করে। বরং উঠে যেন (নফল) সালাত আদায় করে নেয়। রাবী বলেন, স্বপ্নে শিকল দেখা অপছন্দনীয় মনে করা হত এবং পায়ে বেড়ি দেখাকে তারা পছন্দ করতেন। বলা হত, পায়ে বেড়ি দেখার ব্যাখ্যা হলো দ্বীনের ওপর অবিচল থাকা। ক্বাতাদাহ, ইউনুস, হিশাম ও আবূ হিলাল (রহ.) আবূ হুরাইরাহ (রাঃ) সূত্রে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম থেকে উক্ত হাদীসকে বর্ণনা করেছেন। আর কেউ কেউ এসবকে হাদীসের মধ্যে অন্তর্ভুক্ত করেছেন। (অপরদিকে) আউফের বর্ণনা কৃত হাদীস সুস্পষ্ট। ইউনুস (রহ.) বলেছেন, আমি বন্ধনের ব্যাখ্যাকে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর তরফ থেকেই মনে করি। আবূ ‘আবদুল্লাহ্ [ইমামু বুখারী (রহ.)] বলেন, শিকল গলাতেই বাঁধা হয়। [মুসলিম পর্ব ৪২/হাঃ ২২৬৩, আহমাদ ১০৫৯৫] (আধুনিক প্রকাশনী- ৬৫৩১, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"When the Day of Resurrection approaches, the dreams of a believer will hardly fail to come true, and a dream of a believer is one of forty-six parts of prophetism, and whatever belongs to prothetism can never be false.\" Muhammad bin Seereen said, \"But I say this.\" He said, \"It used to be said, 'There are three types of dreams: The reflection of one's thoughts and experiences one has during wakefulness, what is suggested by Satan to frighten the dreamer, or glad tidings from Allah. So, if someone has a dream which he dislikes, he should not tell it to others, but get up and offer a prayer.\" He added, \"He (Abu Huraira) hated to see a Ghul (i.e., iron collar around his neck in a dream) and people liked to see fetters (on their feet in a dream). The fetters on the feet symbolizes one's constant and firm adherence to religion.\" And Abu `Abdullah said, \"Ghuls (iron collars) are used only for necks"},{"n":"7018","k":"","a":"حَدَّثَنَا عَبْدَانُ، أَخْبَرَنَا عَبْدُ اللَّهِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ خَارِجَةَ بْنِ زَيْدِ بْنِ ثَابِتٍ، عَنْ أُمِّ الْعَلاَء ِ ـ وَهْىَ امْرَأَةٌ مِنْ نِسَائِهِمْ بَايَعَتْ رَسُولَ اللَّهِ صلى الله عليه وسلم ـ قَالَتْ طَارَ لَنَا عُثْمَانُ بْنُ مَظْعُونٍ فِي السُّكْنَى حِينَ اقْتَرَعَتِ الأَنْصَارُ عَلَى سُكْنَى الْمُهَاجِرِينَ، فَاشْتَكَى فَمَرَّضْنَاهُ حَتَّى تُوُفِّيَ، ثُمَّ جَعَلْنَاهُ فِي أَثْوَابِهِ فَدَخَلَ عَلَيْنَا رَسُولُ اللَّهِ صلى الله عليه وسلم فَقُلْتُ رَحْمَةُ اللَّهِ عَلَيْكَ أَبَا السَّائِبِ، فَشَهَادَتِي عَلَيْكَ لَقَدْ أَكْرَمَكَ اللَّهُ‏.‏ قَالَ ‏\"‏ وَمَا يُدْرِيكِ ‏\"‏‏.‏ قُلْتُ لاَ أَدْرِي وَاللَّهِ‏.‏ قَالَ ‏\"‏ أَمَّا هُوَ فَقَدْ جَاءَهُ الْيَقِينُ، إِنِّي لأَرْجُو لَهُ الْخَيْرَ مِنَ اللَّهِ، وَاللَّهِ مَا أَدْرِي وَأَنَا رَسُولُ اللَّهِ مَا يُفْعَلُ بِي وَلاَ بِكُمْ ‏\"‏‏.‏ قَالَتْ أُمُّ الْعَلاَءِ فَوَاللَّهِ لاَ أُزَكِّي أَحَدًا بَعْدَهُ‏.‏ قَالَتْ وَرَأَيْتُ لِعُثْمَانَ فِي النَّوْمِ عَيْنًا تَجْرِي، فَجِئْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم فَذَكَرْتُ ذَلِكَ لَهُ فَقَالَ ‏\"‏ ذَاكِ عَمَلُهُ يَجْرِي لَهُ ‏\"‏","b":"উম্মুল ‘আলা (রাঃ) হতে বর্ণিত। যিনি রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর হাতে বায়‘আত করেছিলেন তিনি তাদের একজন। তিনি বলেন, যখন মুহাজিরদের বাসস্থান নির্ধারণের জন্য আনসারগণ লটারী দিলেন, তখন আমাদের ঘরে বসবাসের জন্য ‘উসমান ইবনু মাযউন (রাঃ) আমাদের ভাগে পড়েন। তিনি রোগগ্রস্ত হয়ে পড়লে আমরা তাঁর সেবা-শুশ্রূষা করি। অবশেষে তিনি মারা যান। এরপর আমরা তাকে তার কাপড় দিয়েই কাফন পরিয়ে দেই। তখন রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম আমাদের ঘরে আসলেন। আমি বললাম, হে আবূ সাঈব! তোমার ওপর আল্লাহর রহমত হোক। তোমার বেলায় আমার সাক্ষ্য এই যে, আল্লাহ্ তোমাকে সম্মানিত করেছেন। তিনি বললেনঃ তুমি কী করে জানলে? আমি বললাম, আল্লাহর কসম! আমি জানি না। তিনি বললেনঃ তার তো মৃত্যু হয়ে গেছে, আমি তার জন্য আল্লাহর পক্ষ থেকে কল্যাণই আশা করছি। আল্লাহর কসম! আমি আল্লাহর রাসূল হওয়া সত্ত্বেও জানি না যে, আমার সঙ্গে এবং তোমাদের সঙ্গে কী ব্যবহার করা হবে? উম্মুল আলা (রাঃ) বললেন, আল্লাহর কসম! আমি আর কক্ষনো কারো পবিত্রতার প্রত্যয়ন করব না। উম্মুল আলা (রাঃ) বলেন, আমি স্বপ্নে ‘উসমান (রাঃ)-এর জন্য প্রবাহিত ঝর্ণা দেখেছি। রাসূলুল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে এসে সেটা বর্ণনা করলাম। তখন তিনি বললেনঃ এটা তাঁর ‘আমল’ তার জন্য জারি থাকবে। [১২৪৩] (আধুনিক প্রকাশনী- ৬৫৩২, ইসলামিক ফাউন্ডেশন)","e":"Narrated Kharija bin Zaid bin Thabit:Um Al-`Ala an Ansari woman who had given the Pledge of allegiance to Allah's Messenger (ﷺ) said, \"`Uthman bin Maz'un came in our share when the Ansars drew lots to distribute the emigrants (to dwell) among themselves, He became sick and we looked after (nursed) him till he died. Then we shrouded him in his clothes. Allah's Messenger (ﷺ) came to us, I (addressing the dead body) said, \"May Allah's Mercy be on you, O Aba As-Sa'ib! I testify that Allah has honored you.\" The Prophet (ﷺ) said, 'How do you know that?' I replied, 'I do not know, by Allah.' He said, 'As for him, death has come to him and I wish him all good from Allah. By Allah, though I am Allah's Messenger (ﷺ), I neither know what will happen to me, nor to you.'\" Um Al-`Ala said, \"By Allah, I will never attest the righteousness of anybody after that.\" She added, \"Later I saw in a dream, a flowing spring for `Uthman. So I went to Allah's Messenger (ﷺ) and mentioned that to him. He said, 'That is (the symbol of) his good deeds (the reward for) which is going on for him"},{"n":"7019","k":"","a":"حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ بْنِ كَثِيرٍ، حَدَّثَنَا شُعَيْبُ بْنُ حَرْبٍ، حَدَّثَنَا صَخْرُ بْنُ جُوَيْرِيَةَ، حَدَّثَنَا نَافِعٌ، أَنَّ ابْنَ عُمَرَ ـ رضى الله عنهما ـ حَدَّثَهُ قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ بَيْنَا أَنَا عَلَى بِئْرٍ أَنْزِعُ مِنْهَا إِذْ جَاءَ أَبُو بَكْرٍ وَعُمَرُ، فَأَخَذَ أَبُو بَكْرٍ الدَّلْوَ، فَنَزَعَ ذَنُوبًا أَوْ ذَنُوبَيْنِ، وَفِي نَزْعِهِ ضَعْفٌ، فَغَفَرَ اللَّهُ لَهُ، ثُمَّ أَخَذَهَا ابْنُ الْخَطَّابِ مِنْ يَدِ أَبِي بَكْرٍ فَاسْتَحَالَتْ فِي يَدِهِ غَرْبًا، فَلَمْ أَرَ عَبْقَرِيًّا مِنَ النَّاسِ يَفْرِي فَرْيَهُ، حَتَّى ضَرَبَ النَّاسُ بِعَطَنٍ ‏\"‏‏.‏","b":"ইবনু ‘উমার (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন ঃ একবার (আমি স্বপ্নে দেখলাম) আমি একটি কুপের কাছে বসে কূপ থেকে পানি তুলছি। এমন সময় আমার কাছে আবূ বকর ও ‘উমার আসল। আবূ বকর বালতিটি হাতে নিয়ে এক বা দু’বালতি পানি উঠাল। আর তার উঠানোতে কিছুটা দুর্বলতা ছিল। আল্লাহ্ তাকে ক্ষমা করুন। এরপর আবূ বকরের হাত থেকে ‘উমার তা নিল। তার হাতে বালতিটি বেশ বড় হয়ে গেল। আমি কোন শক্তিশালী লোককে ‘উমারের মত এত অভিজ্ঞ কর্মঠ দেখিনি। যার ফলে লোকেরা তাদের পরিতৃপ্ত উটগুলো নিয়ে বাসস্থানে পৌঁছে গেল।[1] [৩৬৩৪] (আধুনিক প্রকাশনী- ৬৫৩৩, ইসলামিক ফাউন্ডেশন)","e":"Narrated Ibn `Umar:Allah's Messenger (ﷺ) said, \"(I saw in a dream that) while I was standing at a well and drawing water therefrom, suddenly Abu Bakr and `Umar came to me. Abu Bakr took the bucket and drew one or two buckets (full of water), but there was weakness in his pulling, but Allah forgave him. Then Ibn Al- Khattab took the bucket from Abu Bakr's hand and the bucket turned into a very large one in his hand. I have never seen any strong man among the people doing such a hard job as `Umar did, till (the people drank to their satisfaction) and water their camels to their fill and they sat near the water"},{"n":"7020","k":"","a":"حَدَّثَنَا أَحْمَدُ بْنُ يُونُسَ، حَدَّثَنَا زُهَيْرٌ، حَدَّثَنَا مُوسَى، عَنْ سَالِمٍ، عَنْ أَبِيهِ، عَنْ رُؤْيَا النَّبِيِّ، صلى الله عليه وسلم فِي أَبِي بَكْرٍ وَعُمَرَ قَالَ ‏ \"‏ رَأَيْتُ النَّاسَ اجْتَمَعُوا فَقَامَ أَبُو بَكْرٍ فَنَزَعَ ذَنُوبًا أَوْ ذَنُوبَيْنِ، وَفِي نَزْعِهِ ضَعْفٌ وَاللَّهُ يَغْفِرُ لَهُ، ثُمَّ قَامَ ابْنُ الْخَطَّابِ، فَاسْتَحَالَتْ غَرْبًا فَمَا رَأَيْتُ مِنَ النَّاسِ يَفْرِي فَرْيَهُ، حَتَّى ضَرَبَ النَّاسُ بِعَطَنٍ ‏\"‏‏.‏","b":"সালিমের পিতা [‘আবদুল্লাহ্ ইবনু ‘উমার (রাঃ)] হতে বর্ণিত। তিনি আবূ বকর ও ‘উমার (রাঃ) সম্পর্কে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর স্বপ্ন বর্ণনা করতে গিয়ে বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ আমি লোকদেরকে জড় হতে দেখলাম। তখন আবূ বকর দাঁড়িয়ে এক বা দু’বালতি পানি উঠালো। আর তার উঠানোতে কিছু দুর্বলতা ছিল। আল্লাহ্ তাকে ক্ষমা করুন। এরপর ইবনুল খাত্তাব দাঁড়াল। আর তার হাতে বালতিটি বেশ বড় হয়ে গেল। আমি লোকদের মধ্যে ‘উমারের মত এতটা অভিজ্ঞ কর্মঠ কাউকে দেখিনি। যার ফলে লোকেরা তাদের পরিতৃপ্ত উটগুলো নিয়ে বাসস্থানে পৌঁছে গেল। [৩৬৩৪] (আধুনিক প্রকাশনী- ৬৫৩৪, ইসলামিক ফাউন্ডেশন)","e":"Narrated Salim's father:about the Prophet's dream in which he has seen Abu Bakr and `Umar: The Prophet (ﷺ) said, \"I saw (in a dream) that the people had gathered. Then Abu Bakr stood up and pulled out one or two buckets full of water (from a well) and there was weakness in his pulling -- may Allah forgive him. Then Ibn Al- Khattab stood up, and the bucket turned into a very large one and I have never seen any strong man among the people doing such a hard job. He pulled out so much water that the people (drank to their satisfaction) and watered their camels to their fill, (and then after quenching their thirst) they sat beside the water"},{"n":"7021","k":"","a":"حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، حَدَّثَنِي اللَّيْثُ، قَالَ حَدَّثَنِي عُقَيْلٌ، عَنِ ابْنِ شِهَابٍ، أَخْبَرَنِي سَعِيدٌ، أَنَّ أَبَا هُرَيْرَةَ، أَخْبَرَهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ بَيْنَا أَنَا نَائِمٌ رَأَيْتُنِي عَلَى قَلِيبٍ وَعَلَيْهَا دَلْوٌ، فَنَزَعْتُ مِنْهَا مَا شَاءَ اللَّهُ، ثُمَّ أَخَذَهَا ابْنُ أَبِي قُحَافَةَ فَنَزَعَ مِنْهَا ذَنُوبًا أَوْ ذَنُوبَيْنِ، وَفِي نَزْعِهِ ضَعْفٌ وَاللَّهُ يَغْفِرُ لَهُ، ثُمَّ اسْتَحَالَتْ غَرْبًا، فَأَخَذَهَا عُمَرُ بْنُ الْخَطَّابِ، فَلَمْ أَرَ عَبْقَرِيًّا مِنَ النَّاسِ يَنْزِعُ نَزْعَ عُمَرَ بْنِ الْخَطَّابِ، حَتَّى ضَرَبَ النَّاسُ بِعَطَنٍ ‏\"‏‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, একবার আমি ঘুমিয়ে ছিলাম। দেখলাম, আমি একটি কূপের কাছে আছি। আর এর নিকট একটি বালতি আছে। আমি কুপ থেকে পানি উঠালাম- যতখানি আল্লাহর ইচ্ছা ছিল। এরপর বালতিটি ইবনু আবূ কুহাফা নিলেন। তিনি কূপ থেকে এক বা দু’বালতি পানি উঠালেন। তার উঠানোতে কিছুটা দুর্বলতা ছিল। আল্লাহ্ তাকে ক্ষমা করুন। তারপর বালতিটি বেশ বড় হয়ে গেল। তখন তা ‘উমার ইবনুল খাত্তাব নিলেন। আমি কোন শক্তিশালী লোককে ‘উমারের মত পানি উঠাতে দেখিনি। অবশেষে লোকেরা তাদের পরিতৃপ্ত উটগুলো নিয়ে বাসস্থানে পৌঁছে গেল। [৩৬৬৪] (আধুনিক প্রকাশনী- ৬৫৩৫, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"While I was sleeping, I saw myself standing at a well over which there was a bucket. I pulled out from it as many buckets of water as Allah wished, and then Ibn Abi Quhafa (Abu Bakr) took the bucket from me and pulled out one or two full buckets, and there was weakness in his pull--may Allah forgive him. Then the bucket turned into a very large one and `Umar bin Al-Khattab took it. I have never seen any strong man among the people, drawing water with such strength as `Umar did, till the people (drank to their satisfaction and) watered their camels to their fill; whereupon the camels sat beside the water"},{"n":"7022","k":"","a":"حَدَّثَنَا إِسْحَاقُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، عَنْ مَعْمَرٍ، عَنْ هَمَّامٍ، أَنَّهُ سَمِعَ أَبَا هُرَيْرَةَ ـ رضى الله عنه ـ يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ بَيْنَا أَنَا نَائِمٌ رَأَيْتُ أَنِّي عَلَى حَوْضٍ أَسْقِي النَّاسَ، فَأَتَانِي أَبُو بَكْرٍ فَأَخَذَ الدَّلْوَ مِنْ يَدِي لِيُرِيحَنِي، فَنَزَعَ ذَنُوبَيْنِ وَفِي نَزْعِهِ ضَعْفٌ وَاللَّهُ يَغْفِرُ لَهُ، فَأَتَى ابْنُ الْخَطَّابِ فَأَخَذَ مِنْهُ، فَلَمْ يَزَلْ يَنْزِعُ، حَتَّى تَوَلَّى النَّاسُ وَالْحَوْضُ يَتَفَجَّرُ ‏\"‏‏.‏","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, আমি একবার ঘুমিয়ে ছিলাম। দেখলাম, আমি একটি হাউযের নিকট হতে লোকদেরকে পানি পান করাচ্ছি। তখন আমার কাছে আবূ বকর আসল। আমাকে বিশ্রাম দেয়ার জন্য আমার হাত থেকে সে বালতিটি নিয়ে গেল এবং দু’বালতি পানি উঠাল। আর তার উঠানোতে কিছুটা দুর্বলতা ছিল। আল্লাহ্ তাকে ক্ষমা করুন। এরপর ইবনুল খাত্তাব এসে তার নিকট হতে তা নিয়ে নিল এবং পানি উঠাতে থাকল। অবশেষে লোকেরা (তৃপ্ত হয়ে) ফিরে গেল, অথচ হাউযের পানি প্রবাহিত হচ্ছিল। [৩৬৬৪] (আধুনিক প্রকাশনী- ৬৫৩৬, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:Allah's Messenger (ﷺ) said, \"While I was sleeping, I saw myself standing over a tank (well) giving water to the people to drink. Then Abu Bakr came to me and took the bucket from me in order to relieve me and he pulled out one or two full buckets, and there was weakness in his pulling --may Allah forgive him. Then Ibn Al-Khattab took it from him and went on drawing water till the people left (after being satisfied) while the tank was over flowing with water"},{"n":"7023","k":"","a":"حَدَّثَنَا سَعِيدُ بْنُ عُفَيْرٍ، حَدَّثَنِي اللَّيْثُ، حَدَّثَنِي عُقَيْلٌ، عَنِ ابْنِ شِهَابٍ، قَالَ أَخْبَرَنِي سَعِيدُ بْنُ الْمُسَيَّبِ، أَنَّ أَبَا هُرَيْرَةَ، قَالَ بَيْنَا نَحْنُ جُلُوسٌ عِنْدَ رَسُولِ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ بَيْنَا أَنَا نَائِمٌ رَأَيْتُنِي فِي الْجَنَّةِ، فَإِذَا امْرَأَةٌ تَتَوَضَّأُ إِلَى جَانِبِ قَصْرٍ، قُلْتُ لِمَنْ هَذَا الْقَصْرُ قَالُوا لِعُمَرَ بْنِ الْخَطَّابِ‏.‏ فَذَكَرْتُ غَيْرَتَهُ فَوَلَّيْتُ مُدْبِرًا ‏\"‏‏.‏ قَالَ أَبُو هُرَيْرَةَ فَبَكَى عُمَرُ بْنُ الْخَطَّابِ ثُمَّ قَالَ أَعَلَيْكَ بِأَبِي أَنْتَ وَأُمِّي يَا رَسُولَ اللَّهِ أَغَارُ","b":"আবূ হুরাইরাহ (রাঃ) হতে বর্ণিত। তিনি বলেন, একবার আমরা রাসূলূল্লাহ্ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম-এর কাছে উপবিষ্ট ছিলাম। তখন তিনি বললেনঃ আমি একবার নিদ্রিত ছিলাম। আমি আমাকে জান্নাতে দেখতে পেলাম। একজন মহিলা একটি প্রাসাদের পাশে উযূ করছে। আমি জিজ্ঞেস করলাম, এই প্রাসাদটি কার? তারা বলল, ‘উমারের। তখন তার আত্মমর্যাদাবোধের কথা স্মরণ করলাম। তাই আমি ফিরে এলাম। আবূ হুরাইরাহ (রাঃ) বলেন, এ কথা শুনে ‘উমার ইবনুল খাত্তাব (রাঃ) কেঁদে ফেললেন এবং বললেন, আমার পিতা-মাতা আপনার ওপর কুরবান হোক! হে আল্লাহর রাসূল (আপনার কাছেও কি) আমি আত্মমর্যাদাবোধ প্রদর্শন করব? [৩২৪২] (আধুনিক প্রকাশনী- ৬৫৩৭, ইসলামিক ফাউন্ডেশন)","e":"Narrated Abu Huraira:We were sitting with Allah's Messenger (ﷺ), he said, \"While I was sleeping, I saw myself in Paradise. Suddenly I saw a woman performing ablution beside a palace. I asked, \"For whom is this palace?\" They (the angels) replied, \"It is for `Umar bin Al-Khattab.\" Then I remembered `Umar's ghira and went back hurriedly.\" On hearing that, `Umar started weeping and said, \" Let my father and mother be sacrificed for you. O Allah's Messenger (ﷺ)! How dare I think of my Ghira being offended by you?"},{"n":"7024","k":"","a":"حَدَّثَنَا عَمْرُو بْنُ عَلِيٍّ، حَدَّثَنَا مُعْتَمِرُ بْنُ سُلَيْمَانَ، حَدَّثَنَا عُبَيْدُ اللَّهِ بْنُ عُمَرَ، عَنْ مُحَمَّدِ بْنِ الْمُنْكَدِرِ، عَنْ جَابِرِ بْنِ عَبْدِ اللَّهِ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ دَخَلْتُ الْجَنَّةَ فَإِذَا أَنَا بِقَصْرٍ مِنْ ذَهَبٍ، فَقُلْتُ لِمَنْ هَذَا فَقَالُوا لِرَجُلٍ مِنْ قُرَيْشٍ‏.‏ فَمَا مَنَعَنِي أَنْ أَدْخُلَهُ يَا ابْنَ الْخَطَّابِ إِلاَّ مَا أَعْلَمُ مِنْ غَيْرَتِكَ ‏\"‏‏.‏ قَالَ وَعَلَيْكَ أَغَارُ يَا رَسُولَ اللَّهِ","b":"জাবির ইবনু ‘আবদুল্লাহ্ (রাঃ) হতে বর্ণিত। তিনি বলেন, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ আমি জান্নাতে প্রবেশ করলাম। আমি আমাকে একটা স্বর্ণের প্রাসাদের কাছে দেখতে পেলাম। তখন আমি জিজ্ঞেস করলাম, এটা কার? তারা বলল, কুরাইশের এক লোকের। হে ইবনুল খাত্তাব! এ প্রাসাদে ঢুকতে আমাকে কিছুই বাধা দিচ্ছিল না। কেবল তোমার আত্মমর্যাদাবোধ, যা আমার জানা ছিল। ‘উমার (রাঃ) বললেন, হে আল্লাহর রাসূল! আপনার কাছেও কি আমি আত্মমর্যাদাবোধ দেখাবো? [৩৬৭৯] (আধুনিক প্রকাশনী- ৬৫৩৮, ইসলামিক ফাউন্ডেশন)","e":"Narrated Jabir bin `Abdullah:Allah's Messenger (ﷺ) said: (I saw in a dream that) I entered Paradise, and behold, there was a palace built of gold! I asked, 'For whom is this palace?' They (t
