েগে থাকাবস্থায় দেখতে পাবে। অথবা তিনি বলেছেন, সে যেন আমাকে জাগ্রত অবস্থায় প্রত্যক্ষ করলো। কারণ শাইতান আমার আকৃতি ধারণ করতে পারে না। (ইসলামিক ফাউন্ডেশন ৫৭২৩, ইসলামিক সেন্টার)","e":"Abu Huraira reported:I heard Allah's Messenger (ﷺ) as saying: He who saw me in a dream would soon see me in the state of wakefulness, or as if he saw me in a state of wakefulness, for the satan does not appear in my form"},{"n":"5921","k":"2267.01","a":"وَقَالَ فَقَالَ أَبُو سَلَمَةَ قَالَ أَبُو قَتَادَةَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَنْ رَآنِي فَقَدْ رَأَى الْحَقَّ ‏\"‏ ‏.‏","b":"আবূ সালামাহ্ (রহঃ) বলেন, আবূ কাতাদাহ্ (রাযিঃ) বলেছেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেনঃ যে আমাকে দেখলো সে যেন (অবশ্যই) সত্যই দেখলো। (ইসলামিক ফাউন্ডেশন ৫৭২৩, ইসলামিক সেন্টার)","e":"Abu Qatada reported Allah's Messenger (ﷺ) as saying:He who saw me in dream in fact saw the truth (what is true)"},{"n":"5922","k":"2267.02","a":"وَحَدَّثَنِيهِ زُهَيْرُ بْنُ حَرْبٍ، حَدَّثَنَا يَعْقُوبُ بْنُ إِبْرَاهِيمَ، حَدَّثَنَا ابْنُ أَخِي الزُّهْرِيِّ، حَدَّثَنَا عَمِّي، ‏.‏ فَذَكَرَ الْحَدِيثَيْنِ جَمِيعًا بِإِسْنَادَيْهِمَا سَوَاءً مِثْلَ حَدِيثِ يُونُسَ ‏.‏","b":"(…/...) যুহরীর ভাইয়ের ছেলে বলেন, তার চাচা (অর্থাৎ যুহরী) তাকে হাদীস রিওয়ায়াত করেছেন। এ ব্যাপারে তিনি ইউনুস বর্ণিত হাদীসের অনুরূপ দুটি হাদীস সানাদসহ রিওয়ায়াত করেন। (ইসলামিক ফাউন্ডেশন ৫৭২৩, ইসলামিক সেন্টার)","e":"The above two hadith have been narrated likewise through another chain of transmitters"},{"n":"5923","k":"2268.01","a":"وَحَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا لَيْثٌ، ح وَحَدَّثَنَا ابْنُ رُمْحٍ، أَخْبَرَنَا اللَّيْثُ، عَنْ أَبِي، الزُّبَيْرِ عَنْ جَابِرٍ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏\"‏ مَنْ رَآنِي فِي النَّوْمِ فَقَدْ رَآنِي إِنَّهُ لاَ يَنْبَغِي لِلشَّيْطَانِ أَنْ يَتَمَثَّلَ فِي صُورَتِي ‏\"‏ ‏.‏ وَقَالَ ‏\"‏ إِذَا حَلَمَ أَحَدُكُمْ فَلاَ يُخْبِرْ أَحَدًا بِتَلَعُّبِ الشَّيْطَانِ بِهِ فِي الْمَنَامِ ‏\"‏ ‏.‏","b":"কুতাইবাহ ইবনু সাঈদ ও ইবনু রুমূহ (রহঃ) ..... জাবির (রাযিঃ) হতে বর্ণিত যে, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে লোক স্বপ্নযোগে আমাকে দেখল, সে নিশ্চয়ই আমাকে (স্বপ্নে) দেখল। কারণ, শাইতানের পক্ষে আমার আকৃতি ধারণ করা অসম্ভব। তিনি আরও বলেন, তোমাদের কেউ যখন খারাপ স্বপ্ন দেখে সে যেন ঘুমের মধ্যে তার সাথে শাইতানের চক্রান্তের সংবাদ কাউকে না দেয়। (ইসলামিক ফাউন্ডেশন ৫৭২৪, ইসলামিক সেন্টার)","e":"Jabir reported Allah's Messenger (ﷺ) as saying:He who saw me in sleep in fact saw me, for it is not possible for the satan to appear in my form; and he also said: When any one of you sees a hulm he should not inform anyone, for it is a sort of vain sport of devil in the state of sleep"},{"n":"5924","k":"2268.02","a":"وَحَدَّثَنِي مُحَمَّدُ بْنُ حَاتِمٍ، حَدَّثَنَا رَوْحٌ، حَدَّثَنَا زَكَرِيَّاءُ بْنُ إِسْحَاقَ، حَدَّثَنِي أَبُو الزُّبَيْرِ، أَنَّهُ سَمِعَ جَابِرَ بْنَ عَبْدِ اللَّهِ، يَقُولُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ مَنْ رَآنِي فِي النَّوْمِ فَقَدْ رَآنِي فَإِنَّهُ لاَ يَنْبَغِي لِلشَّيْطَانِ أَنْ يَتَشَبَّهَ بِي ‏\"‏ ‏.‏","b":"মুহাম্মাদ ইবনু হাতিম (রহঃ) ..... জাবির ইবনু আবদুল্লাহ (রাযিঃ) হতে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ যে লোক স্বপ্নযোগে আমাকে দেখল সে অবশ্যই আমাকেই দেখল। কারণ আমার রূপ ধারণ করা শাইতানের পক্ষে অসম্ভব। (ইসলামিক ফাউন্ডেশন ৫৭২৫, ইসলামিক সেন্টার)","e":"Jabir b. `Abdullah reported Allah's Messenger (ﷺ) as saying:He who saw me in a dream in fact saw me, for the satan cannot assume my form"},{"n":"5925","k":"2268.03","a":"حَدَّثَنَا قُتَيْبَةُ بْنُ سَعِيدٍ، حَدَّثَنَا لَيْثٌ، ح وَحَدَّثَنَا ابْنُ رُمْحٍ، أَخْبَرَنَا اللَّيْثُ، عَنْ أَبِي، الزُّبَيْرِ عَنْ جَابِرٍ، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم أَنَّهُ قَالَ لأَعْرَابِيٍّ جَاءَهُ فَقَالَ إِنِّي حَلَمْتُ أَنَّ رَأْسِي قُطِعَ فَأَنَا أَتَّبِعُهُ فَزَجَرَهُ النَّبِيُّ صلى الله عليه وسلم وَقَالَ ‏ \"‏ لاَ تُخْبِرْ بِتَلَعُّبِ الشَّيْطَانِ بِكَ فِي الْمَنَامِ ‏\"‏ ‏.‏","b":"কুতাইবাহ ও ইবনু রুমূহ (রহঃ) ..... জাবির (রাযিঃ) এর সানাদে রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম হতে বর্ণিত। একবার এক বেদুঈন তার নিকট এসে বলল, আমি স্বপ্নে প্রত্যক্ষ করলাম যে, আমার মস্তিষ্ক কর্তন করা হয়েছে আর আমি তার পিছু পিছু ছুটে চলছি। সে সময় নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম তাকে রাগাম্বিত হয়ে বললেনঃ ঘুমের মধ্যে তোমার সঙ্গে শাইতানের খেলাধূলার সংবাদ কাউকে প্রকাশ করো না। (ইসলামিক ফাউন্ডেশন ৫৭২৬, ইসলামিক সেন্টার)","e":"Jabir reported Allah's Messenger (ﷺ) as saying:There came to him (the Holy Prophet) a desert Arab and said: I saw in a dream that I had been beheaded and I had been following it (the severed head). Allah's Apostle (ﷺ) reprimanded him saying: Do not inform about the vain sporting of devil with you during the night"},{"n":"5926","k":"2268.04","a":"وَحَدَّثَنَا عُثْمَانُ بْنُ أَبِي شَيْبَةَ، حَدَّثَنَا جَرِيرٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرٍ، قَالَ جَاءَ أَعْرَابِيٌّ إِلَى النَّبِيِّ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ رَأَيْتُ فِي الْمَنَامِ كَأَنَّ رَأْسِي ضُرِبَ فَتَدَحْرَجَ فَاشْتَدَدْتُ عَلَى أَثَرِهِ ‏.‏ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم لِلأَعْرَابِيِّ ‏\"‏ لاَ تُحَدِّثِ النَّاسَ بِتَلَعُّبِ الشَّيْطَانِ بِكَ فِي مَنَامِكَ ‏\"‏ ‏.‏ وَقَالَ سَمِعْتُ النَّبِيَّ صلى الله عليه وسلم بَعْدُ يَخْطُبُ فَقَالَ ‏\"‏ لاَ يُحَدِّثَنَّ أَحَدُكُمْ بِتَلَعُّبِ الشَّيْطَانِ بِهِ فِي مَنَامِهِ ‏\"‏ ‏.‏","b":"উসমান ইবনু আবূ শইবাহ (রহঃ) ..... জাবির (রাযিঃ) হতে বর্ণিত তিনি বলেন, এক বেদুঈন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর নিকট এসে বলল, হে আল্লাহর রসূল! আমি স্বপ্নে দেখলাম যেন আমার মাথা কর্তন করা হয়েছে এবং তা গড়াতে শুরু করেছে, আর আমি তার পিছনে পিছনে খুব জোরে দৌড় লাগালাম। তখন রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম সে বেদুঈন আরবকে বললেন, তোমার ঘুমের মধ্যে তোমার সঙ্গে শাইতানের ক্রীড়া-কৌতুকের ব্যাপারে কারো নিকটেই প্রকাশ করো না। বর্ণনাকারী জাবির (রাযিঃ) বলেন, এ ঘটনার পর আমি নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কে ভাষণ দিতে শুনলাম। তাতে তিনি বললেন, তোমাদের কেউ ঘুমের মধ্যে তার সঙ্গে শাইতানের ক্রীড়া-কৌতুকের ব্যাপারে বলে দিও না। (ইসলামিক ফাউন্ডেশন ৫৭২৭, ইসলামিক সেন্টার)","e":"Jabir reported that there came to Allah's Apostle (ﷺ) a desert Arab and said:Allah's Messenger, I saw in the state of sleep as if my head had been cut off and I had been moving on haltingly after it. Thereupon Allah's Messenger (ﷺ) said to that desert Arab: Do not narrate to the people the vain sporting of satan with you in your sleep and (the narrator) also said: I heard Allah's Messenger (ﷺ) in his subsequent address: None amongst you should narrate the vain sporting of devil with him in the dream"},{"n":"5927","k":"2268.05","a":"وَحَدَّثَنَا أَبُو بَكْرِ بْنُ أَبِي شَيْبَةَ، وَأَبُو سَعِيدٍ الأَشَجُّ قَالاَ حَدَّثَنَا وَكِيعٌ، عَنِ الأَعْمَشِ، عَنْ أَبِي سُفْيَانَ، عَنْ جَابِرٍ، قَالَ جَاءَ رَجُلٌ إِلَى النَّبِيِّ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ رَأَيْتُ فِي الْمَنَامِ كَأَنَّ رَأْسِي قُطِعَ ‏.‏ قَالَ فَضَحِكَ النَّبِيُّ صلى الله عليه وسلم وَقَالَ ‏\"‏ إِذَا لَعِبَ الشَّيْطَانُ بِأَحَدِكُمْ فِي مَنَامِهِ فَلاَ يُحَدِّثْ بِهِ النَّاسَ ‏\"‏ ‏.‏ وَفِي رِوَايَةِ أَبِي بَكْرٍ ‏\"‏ إِذَا لُعِبَ بِأَحَدِكُمْ ‏\"‏ ‏.‏ وَلَمْ يَذْكُرِ الشَّيْطَانَ ‏.‏","b":"আবূ বাকর ইবনু আবূ শাইবাহ ও আবূ সাঈদ আশাজ্জ (রহঃ) ..... জাবির (রাযিঃ) হতে বর্ণিত। তিনি বলেন, এক লোক নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর নিকট এসে বলল, হে আল্লাহর রসূল! আমি স্বপ্নে দেখলাম যেন আমার মস্তিষ্ক কর্তন করা হয়েছে। বর্ণনাকারী বলেন, তখন নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম মুচকি হেসে বললেন, শাইতান যখন তোমাদের কারো সঙ্গে তার ঘুমের মধ্যে খেলাধূলা করে, তখন সে যেন কোন ব্যক্তির নিকট তা প্রকাশ না করে। আর বর্ণনাকারী আবূ বাকর (রহঃ)-এর বর্ণনাতে আছে- ‘যখন তোমাদের কারো সঙ্গে ক্রীড়া-কৌতুহল করা হয়। তিনি 'শাইতান' শব্দ বর্ণনা করেননি। (ইসলামিক ফাউন্ডেশন ৫৭২৮, ইসলামিক সেন্টার)","e":"Jabir reported that a person came to Allah's Apostle (ﷺ) and said:Allah's Messenger, I have seen in the state of sleep as if my head had been cut off. Thereupon Allah's Apostle (ﷺ) laughed and said: When the satan plays with any one of you in the state of sleep, do not mention it to the people; and in the hadith transmitted by Abu Bakr (the words are): \"If one of you is played with, and he did not make any mention of the word: \"Satan"},{"n":"5928","k":"2269.01","a":"حَدَّثَنَا حَاجِبُ بْنُ الْوَلِيدِ، حَدَّثَنَا مُحَمَّدُ بْنُ حَرْبٍ، عَنِ الزُّبَيْدِيِّ، أَخْبَرَنِي الزُّهْرِيُّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، أَنَّ ابْنَ عَبَّاسٍ، أَوْ أَبَا هُرَيْرَةَ كَانَ يُحَدِّثُ أَنَّ رَجُلاً، أَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم ح وَحَدَّثَنِي حَرْمَلَةُ بْنُ يَحْيَى التُّجِيبِيُّ، - وَاللَّفْظُ لَهُ - أَخْبَرَنَا ابْنُ وَهْبٍ، أَخْبَرَنِي يُونُسُ، عَنِ ابْنِ شِهَابٍ، أَنَّ عُبَيْدَ اللَّهِ بْنَ عَبْدِ اللَّهِ بْنِ عُتْبَةَ، أَخْبَرَهُ أَنَّ ابْنَ عَبَّاسٍ كَانَ يُحَدِّثُ أَنَّ رَجُلاً أَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي أَرَى اللَّيْلَةَ فِي الْمَنَامِ ظُلَّةً تَنْطِفُ السَّمْنَ وَالْعَسَلَ فَأَرَى النَّاسَ يَتَكَفَّفُونَ مِنْهَا بِأَيْدِيهِمْ فَالْمُسْتَكْثِرُ وَالْمُسْتَقِلُّ وَأَرَى سَبَبًا وَاصِلاً مِنَ السَّمَاءِ إِلَى الأَرْضِ فَأَرَاكَ أَخَذْتَ بِهِ فَعَلَوْتَ ثُمَّ أَخَذَ بِهِ رَجُلٌ مِنْ بَعْدِكَ فَعَلاَ ثُمَّ أَخَذَ بِهِ رَجُلٌ آخَرُ فَعَلاَ ثُمَّ أَخَذَ بِهِ رَجُلٌ آخَرُ فَانْقَطَعَ بِهِ ثُمَّ وُصِلَ لَهُ فَعَلاَ ‏.‏ قَالَ أَبُو بَكْرٍ يَا رَسُولَ اللَّهِ بِأَبِي أَنْتَ وَاللَّهِ لَتَدَعَنِّي فَلأَعْبُرَنَّهَا ‏.‏ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ اعْبُرْهَا ‏\"‏ ‏.‏ قَالَ أَبُو بَكْرٍ أَمَّا الظُّلَّةُ فَظُلَّةُ الإِسْلاَمِ وَأَمَّا الَّذِي يَنْطِفُ مِنَ السَّمْنِ وَالْعَسَلِ فَالْقُرْآنُ حَلاَوَتُهُ وَلِينُهُ وَأَمَّا مَا يَتَكَفَّفُ النَّاسُ مِنْ ذَلِكَ فَالْمُسْتَكْثِرُ مِنَ الْقُرْآنِ وَالْمُسْتَقِلُّ وَأَمَّا السَّبَبُ الْوَاصِلُ مِنَ السَّمَاءِ إِلَى الأَرْضِ فَالْحَقُّ الَّذِي أَنْتَ عَلَيْهِ تَأْخُذُ بِهِ فَيُعْلِيكَ اللَّهُ بِهِ ثُمَّ يَأْخُذُ بِهِ رَجُلٌ مِنْ بَعْدِكَ فَيَعْلُو بِهِ ثُمَّ يَأْخُذُ بِهِ رَجُلٌ آخَرُ فَيَعْلُو بِهِ ثُمَّ يَأْخُذُ بِهِ رَجُلٌ آخَرُ فَيَنْقَطِعُ بِهِ ثُمَّ يُوصَلُ لَهُ فَيَعْلُو بِهِ ‏.‏ فَأَخْبِرْنِي يَا رَسُولَ اللَّهِ بِأَبِي أَنْتَ أَصَبْتُ أَمْ أَخْطَأْتُ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏\"‏ أَصَبْتَ بَعْضًا وَأَخْطَأْتَ بَعْضًا ‏\"‏ ‏.‏ قَالَ فَوَاللَّهِ يَا رَسُولَ اللَّهِ لَتُحَدِّثَنِّي مَا الَّذِي أَخْطَأْتُ قَالَ ‏\"‏ لاَ تُقْسِمْ ‏\"‏ ‏.‏","b":"—(১৭/২২৬৯) হাজিব ইবনু ওয়ালীদ (রহঃ) ..... উবাইদুল্লাহ ইবনু আবদুল্লাহ (রহঃ) হতে বর্ণিত যে, ইবনু আব্বাস (রাযিঃ) অথবা আবূ হুরাইরাহ (রাযিঃ) হাদীস রিওয়ায়াত করতেন যে, জনৈক লোক রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর নিকট উপস্থিত হলো .....। ভিন্ন সূত্রে হারমালাহ ইবনু ইয়াহইয়া তুজীবী (রহঃ) উবাইদুল্লাহ ইবনু আবদুল্লাহ ইবনু উতবাহ (রাযিঃ) ইবনু শিহাব (রহঃ) কে সংবাদ দিয়েছেন যে, ইবনু আব্বাস (রাযিঃ) এ হাদীসটি রিওয়ায়াত করতেন যে, জনৈক লোক রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর দরবারে এসে বলল, হে আল্লাহর রসূল! আমি আজ রাতে স্বপ্ন দেখলাম যে, শামিয়ানা হতে ঘি ও মধু ঝরে পড়ছে আর লোকদের দেখলাম- তারা তা থেকে তাদের হাতের অঞ্জলি ভরে ভরে নিয়ে যাচ্ছে। কেউ বেশি পরিমাণ নিচ্ছে, কেউ স্বল্প পরিমাণে। আর একটি রশি দেখলাম আসমান থেকে জমিন পর্যন্ত সংযোগ স্থাপনকারী, আর দেখলাম আপনি তা ধরলেন এবং উপর উঠে গেলেন, এরপর এক ব্যক্তি তা ধরল এবং সে উপর উঠে গেল, তারপর আর এক ব্যক্তি তা ধরল এবং তা ছিড়ে পড়ে গেল। পরিশেষে তা তার জন্য জুড়ে দেয়া হলো এবং সেও উপরে উঠে গেল। স্বপ্ন বর্ণনার এ পর্যায়ে আবূ বাকর (রাযীঃ) বললেন, হে আল্লাহর রসূল! আমার পিতা আপনার জন্য উৎসর্গিত। আল্লাহর শপথ! আপনি অবশ্য আমাকে অনুমতি দিবেন, তাহলে আমি এ স্বপ্লটির ব্যাখ্যা করব। রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, আপনি ব্যাখ্যা করুন। আবূ বাকর (রাযিঃ) বললেন, শামিয়ানাটি হলো ইসলামের (রূপক) শামিয়ানা, আর যে ঘি ও মধু ফোটা ঝরে পড়ছিল, তা হচ্ছে আল-কুরআনের মধুরতা ও কোমলতা আর মানুষেরা যে তা থেকে অঞ্জলি ভরে ভরে নিয়ে যাচ্ছিল তা হলো- কেউ বেশি পরিমাণে আর কেউ সামান্য পরিমাণে আল কুরআন হতে সংগ্রহ করছে। আর আসমান হতে জমিন পর্যন্ত সংযুক্ত রশিটি হলো হক ও সত্য (পথ), যার উপরে আপনি রয়েছেন তা ধারণ করলেন, আর আল্লাহ তা দিয়ে আপনাকে উপরে উঠিয়ে নিলেন। তারপর আপনার পরে এক লোক তা ধারণ করলেন এবং তা দিয়ে সেও উপরে উঠে যাবে, তারপর আর এক লোক তা ধারণ করবে এবং তা ছিড়ে পড়ে যাবে, পরে তা তার জন্য জুড়ে দেয়া হবে এবং তা দিয়ে সে উপরে উঠে যাবে। হে আল্লাহর রসূল! এখন আমাকে বলে দিন, আমার পিতা আপনার উদ্দেশে উৎসর্গিত, আমি ঠিক বলেছি নাকি ভুল বলেছি? রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেনঃ কতক ঠিক বলেছেন আর কতক ভুল করেছেন। তিনি বললেন, তাহলে আল্লাহর শপথ! হে আল্লাহর রসূল! যা আমি ভুল করেছি তা আপনি অবশ্যই আমাকে বর্ণনা করে দিবেন। তিনি বললেন, এভাবে শপথ করবে না। (ইসলামিক ফাউন্ডেশন ৫৭২৯, ইসলামিক সেন্টার)","e":"It is reported either on the authority of Ibn `Abbas or on the authority of Abu Huraira that a person came to Allah's Messenger (ﷺ) and said:Allah's Messenger, I saw while I was sleeping during the night (this vision) that there was a canopy from which butter and honey were trickling and I also saw people collecting them in the palms of their hands, some more, some less, and I also saw a rope connecting the earth with the sky and I saw you catching hold of it and rising towards the heaven; then another person after you catching hold of it and rising towards (Heaven); then another person catching hold of it, but it was broken while it was rejoined for him and he also climbed up. Abu Bakr said: Allah's Messenger, may my father be sacrificed for you, by Allah, allow me to interpret it. Allah's Messenger (ﷺ) said: Well, give its interpretation. Thereupon Abu Bakr said: The canopy signifies the canopy of Islam and that what trickles out of it in the form of butter and honey is the Holy Qur'an and its sweetness and softness and what the people get hold of it in their palms implies major portion of the Qur'an or the small portion; and so far as the rope joining the sky with the earth is concerned, it is the Truth by which you stood (in the worldly life) and by which Allah would raise you (to Heaven). Then the person after you would take hold of it and he would also climb up with the help of it. Then another person would take hold of it and climb up with the help of it. Then another person would take hold of it and it would be broken; then it would be rejoined for him and he would climb up with the help of it. Allah's Messenger, may my father be taken as a ransom for you, tell me whether I have interpreted it correctly or I have made an error. Allah's Messenger (ﷺ) said: You have interpreted a part of it correctly and you have erred in interpreting a part of it. Thereupon he said: Allah's Messenger, by Allah, tell me that part where I have committed an error. Thereupon he said: Don't take an oath"},{"n":"5929","k":"2269.02","a":"وَحَدَّثَنَاهُ ابْنُ أَبِي عُمَرَ، حَدَّثَنَا سُفْيَانُ، عَنِ الزُّهْرِيِّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، قَالَ جَاءَ رَجُلٌ النَّبِيَّ صلى الله عليه وسلم مُنْصَرَفَهُ مِنْ أُحُدٍ فَقَالَ يَا رَسُولَ اللَّهِ إِنِّي رَأَيْتُ هَذِهِ اللَّيْلَةَ فِي الْمَنَامِ ظُلَّةً تَنْطِفُ السَّمْنَ وَالْعَسَلَ ‏.‏ بِمَعْنَى حَدِيثِ يُونُسَ ‏.‏","b":"ইবনু আবূ উমর (রহঃ) ..... ইবনু আব্বাস (রাযিঃ) হতে বর্ণিত। তিনি বলেন, উহুদ (যুদ্ধক্ষেত্র) হতে তার ফিরে আসার সময় জনৈক লোক নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর দরবারে এলো। সে বলল, হে আল্লাহর রসূল! আজ রাতে আমি স্বপ্নে দেখলাম- একটি শামিয়ানা তা থেকে ফোটা ফোটা ঘি ও মধু ঝরছে। হাদীসের পরবর্তী অংশ ইউনুস (রহঃ) বর্ণিত হাদীসের অর্থানুরূপ। (ইসলামিক ফাউন্ডেশন ৫৭৩০, ইসলামিক সেন্টার)","e":"Ibn `Abbas reported that there came to Allah's Apostle (ﷺ) a person as he was returning from Uhud and he said:Allah's Messenger, I saw in sleep during the night a canopy trickling butter and honey; the rest of the hadith is the same"},{"n":"5930","k":"2269.03","a":"وَحَدَّثَنَا مُحَمَّدُ بْنُ رَافِعٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنِ الزُّهْرِيِّ، عَنْ عُبَيْدِ، اللَّهِ بْنِ عَبْدِ اللَّهِ بْنِ عُتْبَةَ عَنِ ابْنِ عَبَّاسٍ، أَوْ أَبِي هُرَيْرَةَ قَالَ عَبْدُ الرَّزَّاقِ كَانَ مَعْمَرٌ أَحْيَانًا يَقُولُ عَنِ ابْنِ عَبَّاسٍ وَأَحْيَانًا يَقُولُ عَنْ أَبِي هُرَيْرَةَ أَنَّ رَجُلاً أَتَى رَسُولَ اللَّهِ صلى الله عليه وسلم فَقَالَ إِنِّي أَرَى اللَّيْلَةَ ظُلَّةً ‏.‏ بِمَعْنَى حَدِيثِهِمْ ‏.‏","b":"মুহাম্মাদ ইবনু রাফি (রহঃ) ..... ইবনু আব্বাস (রাযিঃ) কিংবা আবূ হুরাইরাহ (রাযিঃ) হতে বর্ণিত যে, আবদুর রাযযাক বলেন (আমার ঊর্ধ্বতন বর্ণনাকারী উস্তায) মা'মার (রহঃ) কখনো বর্ণনা করতেন ইবনু আব্বাস (রাযিঃ) হতে আবার কখনো বর্ণনা করতেন আবূ হুরাইরাহ (রাযিঃ) হতে এ মর্মে যে, জনৈক লোক রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম এর দরবারে উপস্থিত হয়ে বললেন, আজ রাতে (স্বপ্নে) আমি একটি শামিয়ানা দেখতে পাই, তারপর পূর্বোল্লিখিত বর্ণনাকারীগণের বর্ণিত হাদীসের অর্থে হাদীস বর্ণনা করেছেন। (ইসলামিক ফাউন্ডেশন ৫৭৩১, ইসলামিক সেন্টার)","e":"It is reported either on the authority of Ibn 'Abbas or on that of Abu Huraira that a person came to Allah's Messenger (ﷺ) and said:Verily I saw during the night a canopy; the rest of the hadith is the same"},{"n":"5931","k":"2269.04","a":"وَحَدَّثَنَا عَبْدُ اللَّهِ بْنُ عَبْدِ الرَّحْمَنِ الدَّارِمِيُّ، حَدَّثَنَا مُحَمَّدُ بْنُ كَثِيرٍ، حَدَّثَنَا سُلَيْمَانُ، - وَهُوَ ابْنُ كَثِيرٍ - عَنِ الزُّهْرِيِّ، عَنْ عُبَيْدِ اللَّهِ بْنِ عَبْدِ اللَّهِ، عَنِ ابْنِ عَبَّاسٍ، أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ مِمَّا يَقُولُ لأَصْحَابِهِ ‏ \"‏ مَنْ رَأَى مِنْكُمْ رُؤْيَا فَلْيَقُصَّهَا أَعْبُرْهَا لَهُ ‏\"‏ ‏.‏ قَالَ فَجَاءَ رَجُلٌ فَقَالَ يَا رَسُولَ اللَّهِ رَأَيْتُ ظُلَّةً ‏.‏ بِنَحْوِ حَدِيثِهِمْ ‏.‏","b":"আবদুল্লাহ ইবনু আবদুর রহমান দারিমী (রহঃ) ..... ইবনু আব্বাস (রাযিঃ) হতে বর্ণিত যে, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম (যেসব অভ্যাসে অভ্যস্ত) ছিলেন (সে সবের মধ্যে একটি ছিল এই) যে, তিনি তার সাহাবীগণকে (ফজরের সালাতের পরে) বলতেন, তোমাদের কেউ কোন স্বপ্ন দেখলে সে তা আমার নিকট প্রকাশ করুক, তাহলে আমি তাকে তার ব্যাখ্যা বলে দিব। জনৈক লোক এসে বলল, হে আল্লাহর রসূল! আমি একটি শামিয়ানা দেখলাম .....। পরবর্তী বর্ণনা (পূর্বোল্লিখিত) বর্ণনাকারীগণের বর্ণিত হাদীসের অবিকল। (ইসলামিক ফাউন্ডেশন ৫৭৩২, ইসলামিক সেন্টার)","e":"Ibn `Abbas reported that Allah's Messenger (ﷺ) used to say to his Companions:He who amongst you sees a vision should narrate it and I would interpret it for him, and a person came and said: Allah's Messenger, I saw a canopy. The rest of the hadith is the same"},{"n":"5932","k":"2270","a":"حَدَّثَنَا عَبْدُ اللَّهِ بْنُ مَسْلَمَةَ بْنِ قَعْنَبٍ، حَدَّثَنَا حَمَّادُ بْنُ سَلَمَةَ، عَنْ ثَابِتٍ الْبُنَانِيِّ، عَنْ أَنَسِ بْنِ مَالِكٍ، قَالَ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ رَأَيْتُ ذَاتَ لَيْلَةٍ فِيمَا يَرَى النَّائِمُ كَأَنَّا فِي دَارِ عُقْبَةَ بْنِ رَافِعٍ فَأُتِينَا بِرُطَبٍ مِنْ رُطَبِ ابْنِ طَابٍ فَأَوَّلْتُ الرِّفْعَةَ لَنَا فِي الدُّنْيَا وَالْعَاقِبَةَ فِي الآخِرَةِ وَأَنَّ دِينَنَا قَدْ طَابَ ‏\"‏ ‏.‏","b":"আবদুল্লাহ ইবনু মাসলামাহ্ ইবনু কা'নাব (রহঃ) ..... আনাস ইবনু মালিক (রাযিঃ) হতে বর্ণিত। তিনি বলেন, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ এক রাতে আমি দেখলাম যেভাবে ঘুমন্ত লোক দেখে (অর্থাৎ স্বপ্ন), যেন আমরা উক্‌বাহ ইবনু রাফি’ এর গৃহে রয়েছি। তখন আমাদের নিকট ইবনু তাব* (নামক) খেজুর হতে কিছু তাজা খেজুর নিয়ে আসা হলো। তখন আমি এর বিশ্লেষণ করলাম- পৃথিবীর বুকে আমাদের জন্য উন্নতি এবং আখিরাতে উত্তম পরিণতি। আর আমাদের দীন অবশ্যই উত্তম। (ইসলামিক ফাউন্ডেশন ৫৭৩৩, ইসলামিক সেন্টার)","e":"Anas b. Malik reported Allah's Messenger (ﷺ) as saying:I saw during the night that which a person sees during the sleep as if we are in the house of `Uqba b. Rafi` that there was brought to us the fresh dates of Ibn Tab. I interpreted it as the sublimity for us in the world and good ending in the Hereafter and that our religion is good"},{"n":"5933","k":"2271","a":"وَحَدَّثَنَا نَصْرُ بْنُ عَلِيٍّ الْجَهْضَمِيُّ، أَخْبَرَنِي أَبِي، حَدَّثَنَا صَخْرُ بْنُ جُوَيْرِيَةَ، عَنْ نَافِعٍ، أَنَّ عَبْدَ اللَّهِ بْنَ عُمَرَ، حَدَّثَهُ أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ ‏ \"‏ أَرَانِي فِي الْمَنَامِ أَتَسَوَّكُ بِسِوَاكٍ فَجَذَبَنِي رَجُلاَنِ أَحَدُهُمَا أَكْبَرُ مِنَ الآخَرِ فَنَاوَلْتُ السِّوَاكَ الأَصْغَرَ مِنْهُمَا فَقِيلَ لِي كَبِّرْ ‏.‏ فَدَفَعْتُهُ إِلَى الأَكْبَرِ ‏\"‏ ‏.‏","b":"নাসর ইবনু আলী জাহ্যামী (রহঃ) ..... নাফি' (রহঃ) হতে বর্ণিত। ‘আবদুল্লাহ ইবনু উমর (রাযিঃ) এ মর্মে বর্ণনা করেছেন যে, রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেনঃ আমি ঘুমের মধ্যে আমাকে একটি দাতন দিয়ে মিসওয়াক করতে দেখলাম। তখন দু’লোক আমাকে আকৃষ্ট করল, যাদের একজন অন্যজনের চেয়ে বয়সে বড়। তখন আমি মিসওয়াকটি কম বয়সীকে দিতে গেলে আমাকে বলা হলো- 'বড়কে দিন', তাই তা আমি বয়স্ককে দিয়ে দিলাম। (ইসলামিক ফাউন্ডেশন ৫৭৩৪, ইসলামিক সেন্টার)","e":"Abdullah b. `Umar reported Allah's Messenger (ﷺ) as saying:I saw in a dream that I was using miswak and two persons contended to get it from me, one being older than the other one. I gave the miswak to the younger one. It was said to me to give that to the older one and I gave it to the older one"},{"n":"5934","k":"2272","a":"حَدَّثَنَا أَبُو عَامِرٍ عَبْدُ اللَّهِ بْنُ بَرَّادٍ الأَشْعَرِيُّ، وَأَبُو كُرَيْبٍ مُحَمَّدُ بْنُ الْعَلاَءِ - وَتَقَارَبَا فِي اللَّفْظِ - قَالاَ حَدَّثَنَا أَبُو أُسَامَةَ، عَنْ بُرَيْدٍ، عَنْ أَبِي بُرْدَةَ، جَدِّهِ عَنْ أَبِي مُوسَى، عَنِ النَّبِيِّ صلى الله عليه وسلم قَالَ ‏ \"‏ رَأَيْتُ فِي الْمَنَامِ أَنِّي أُهَاجِرُ مِنْ مَكَّةَ إِلَى أَرْضٍ بِهَا نَخْلٌ فَذَهَبَ وَهَلِي إِلَى أَنَّهَا الْيَمَامَةُ أَوْ هَجَرُ فَإِذَا هِيَ الْمَدِينَةُ يَثْرِبُ وَرَأَيْتُ فِي رُؤْيَاىَ هَذِهِ أَنِّي هَزَزْتُ سَيْفًا فَانْقَطَعَ صَدْرُهُ فَإِذَا هُوَ مَا أُصِيبَ مِنَ الْمُؤْمِنِينَ يَوْمَ أُحُدٍ ثُمَّ هَزَزْتُهُ أُخْرَى فَعَادَ أَحْسَنَ مَا كَانَ فَإِذَا هُوَ مَا جَاءَ اللَّهُ بِهِ مِنَ الْفَتْحِ وَاجْتِمَاعِ الْمُؤْمِنِينَ وَرَأَيْتُ فِيهَا أَيْضًا بَقَرًا وَاللَّهُ خَيْرٌ فَإِذَا هُمُ النَّفَرُ مِنَ الْمُؤْمِنِينَ يَوْمَ أُحُدٍ وَإِذَا الْخَيْرُ مَا جَاءَ اللَّهُ بِهِ مِنَ الْخَيْرِ بَعْدُ وَثَوَابُ الصِّدْقِ الَّذِي آتَانَا اللَّهُ بَعْدُ يَوْمَ بَدْرٍ ‏\"‏ ‏.‏","b":"আবূ ‘আমির আবদুল্লাহ ইবনু বাররাদ আশ'আরী ও আবূ কুরায়ব মুহাম্মাদ ইবনু আলা (রহঃ) ..... আবূ মূসা (রাযিঃ) এর সানাদে নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কে বলতে শুনেছি। তিনি বলেন, আমি স্বপ্নে দেখলাম যে, আমি মাক্কাহ থেকে এমন এক দেশে হিজরত করে যাচ্ছি, যেখানে খেজুর বৃক্ষ আছে, তাতে আমার কল্পনা এদিকে গেল যে, তা ইয়ামামাহ্ অথবা হাজর (এলাকা) হবে। পরে (বাস্তবে) দেখি যে, তা হলো মাদীনাহ্- (যার পূর্ব নাম) ইয়াসরিব। আমি আমার এ স্বপ্নে আরও দেখলাম যে, আমি একটি তলোয়ার নাড়াচাড়া করলাম, ফলে তার মধ্যখান ভেঙ্গে গেল। তা ছিল উহুদের দিনে যা মুমিনগণের উপর আপতিত হয়েছিল। তারপরে আমি আর একবার সে তলোয়ার নাড়া দিলে তা পূর্বের চাইতে ভাল হয়ে গেল। তারপরে মূলত তা হলো সে বিজয় ও ঈমানদারদের সম্মেলন- যা আল্লাহ সংঘটিত করলেন (মাক্কাহ বিজয়)। আমি তাতে একটি গরুও দেখলাম। আর আল্লাহ তা'আলাই কল্যাণের অধিকারী। মূলত তা হলো- উহুদের যুদ্ধে (শাহাদাতপ্রাপ্ত) মুমিনদের দলটি। আর মঙ্গল হলো, সে কল্যাণ যা পরবর্তীতে আল্লাহ তা'আলা দান করেছেন এবং সততা ও নিষ্ঠার সে সাওয়াব ও প্রতিদান— যা আল্লাহ তা'আলা আমাদের বাদর যুদ্ধের পরে দিয়েছেন। (ইসলামিক ফাউন্ডেশন ৫৭৩৫, ইসলামিক সেন্টার)","e":"Abu Musa reported Allah's Messenger (ﷺ) as saying:I dreamt (while asleep) that I was about to migrate from Mecca to a land abounding in palm trees and I guessed that it would be Yamama or Hajar, but it was the city of Yathrib (the old name of Medina), and I saw in this dream of mine that I was brandishing a sword and its upper end was broken and this is what fell (in the form of misfortune to the believers on the Day of Uhud). I brandished (the sword) for the second time and it became all right and this is what came to be true when Allah granted us victory and solidarity of the believers. And I saw therein cows also and Allah is the Doer of good. These meant the group from amongst the believers on the Day of Uhud and the goodness which Allah brought after that and the reward of attestation of his Truth which Allah brought to us after the Day of Badr"},{"n":"5936","k":"2274.02","a":"وَحَدَّثَنَا مُحَمَّدُ بْنُ رَافِعٍ، حَدَّثَنَا عَبْدُ الرَّزَّاقِ، أَخْبَرَنَا مَعْمَرٌ، عَنْ هَمَّامِ بْنِ مُنَبِّهٍ، قَالَ هَذَا مَا حَدَّثَنَا أَبُو هُرَيْرَةَ، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم ‏.‏ فَذَكَرَ أَحَادِيثَ مِنْهَا وَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم ‏ \"‏ بَيْنَا أَنَا نَائِمٌ أُتِيتُ خَزَائِنَ الأَرْضِ فَوَضَعَ فِي يَدَىَّ أُسْوَارَيْنِ مِنْ ذَهَبٍ فَكَبُرَا عَلَىَّ وَأَهَمَّانِي فَأُوحِيَ إِلَىَّ أَنِ انْفُخْهُمَا فَنَفَخْتُهُمَا فَذَهَبَا فَأَوَّلْتُهُمَا الْكَذَّابَيْنِ اللَّذَيْنِ أَنَا بَيْنَهُمَا صَاحِبَ صَنْعَاءَ وَصَاحِبَ الْيَمَامَةِ ‏\"‏ ‏.‏","b":"মুহাম্মাদ ইবনু রাফি (রহঃ) ..... হাম্মাম ইবনু মুনব্বিহ (রহঃ) হতে বর্ণিত। তিনি বলেন, এ হলো সেসব হাদীস যা আবূ হুরাইরাহ্ (রাযিঃ) রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম থেকে আমাদের নিকট বর্ণনা করেছেন। এ কথা বলে তিনি কয়েকটি হাদীস বর্ণনা করেন। এটি হলো (সেগুলোর একটি)। রসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম আরও বলেন, আমি নিদ্রিত ছিলাম এমতাবস্থায় আমার নিকট দুনিয়ার ভাণ্ডারসমূহ নিয়ে আসা হলো। সে সময় আমার হাতে দুটি স্বর্ণের কাকন রেখে দেয়া হলে সে দুটি আমার জন্য অনেক ওজন মনে হলো এবং তারা আমাকে দুর্ভাবনায় ফেলল। তখন আমার নিকট ওয়াহীর মাধ্যমে জানানো হলো যে, আমি যেন সে দু'টির উপরে ফুঁ দেই। তখন আমি ফুঁ দিলে সে দু'টি উড়ে গেল। আমি সে দুটির ব্যাখ্যা করলাম- সে দু' মিথ্যাবাদী (ভণ্ড নবী) যে দু'জনের মাঝে আমি রয়েছি- (অর্থাৎ-) সান’আ অধিবাসী আসওয়াদ আল-আনসী এবং ইয়ামামাহ অধিবাসী মুসাইলামাতুল কাযযাব। (ইসলামিক ফাউন্ডেশন ৫৭৩৭, ইসলামিক সেন্টার)","e":"Abu Huraira reported Allah's Messenger (ﷺ) as saying:While I was sleeping, the treasures of the earth were presented to me and I was made to wear in my hands two gold bangles. I felt a sort of burden upon me and I was disturbed and it was suggested to me that I should blow over them, so I blew and both of them disappeared. I interpreted them as two great liars who would appear at any time, one is the inhabitant of San`a' and the other is that of Yamama"},{"n":"5937","k":"2275","a":"حَدَّثَنَا مُحَمَّدُ بْنُ بَشَّارٍ، حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ، حَدَّثَنَا أَبِي، عَنْ أَبِي رَجَاءٍ الْعُطَارِدِيِّ، عَنْ سَمُرَةَ بْنِ جُنْدَبٍ، قَالَ كَانَ النَّبِيُّ صلى الله عليه وسلم إِذَا صَلَّى الصُّبْحَ أَقْبَلَ عَلَيْهِمْ بِوَجْهِهِ فَقَالَ ‏ \"‏ هَلْ رَأَى أَحَدٌ مِنْكُمُ الْبَارِحَةَ رُؤْيَا ‏\"‏ ‏.‏","b":"মুহাম্মদ ইবনু বাশশার (রহঃ) .... সামুরাহ ইবনু জুনদাব (রাযিঃ) হতে বর্ণিত। তিনি বলেন, নবী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ফজরের সালাত (সালাত/নামাজ/নামায) আদায়ন্তে লোকদের দিকে মুখ ফিরিয়ে বসতেন এবং বলতেন, তোমাদের কেউ কি গত রাতে কোন স্বপ্ন দেখেছে? (ইসলামিক ফাউন্ডেশন ৫৭৩৮, ইসলামিক সেন্টার)","e":"Samura b. Jundab reported that when Allah's Messenger (ﷺ) had performed his dawn prayer he turned his face towards them (that is towards his Companions) and said:Did any one of you see any vision last night?"}]}],"adab":[{"t":"স্বপ্নের তিন ধরন","items":[{"x":"স্বপ্ন তিন রকম: আল্লাহর পক্ষ থেকে সুসংবাদ, শয়তানের পক্ষ থেকে কষ্টদায়ক স্বপ্ন এবং নিজের মনের ভাবনা।","r":["m:5905"]},{"x":"ভালো স্বপ্ন আল্লাহর পক্ষ থেকে, আর খারাপ স্বপ্ন শয়তানের পক্ষ থেকে।","r":["b:6984","b:6986","m:5900"]}]},{"t":"ভালো স্বপ্ন দেখলে","items":[{"x":"পছন্দের স্বপ্ন দেখলে আল্লাহর শুকরিয়া আদায় করা এবং খুশি হওয়া।","r":["b:6985","b:7045","m:5902"]},{"x":"সেই স্বপ্ন শুধু যাকে ভালোবাসেন তাকেই বলা।","r":["b:7044","m:5902","m:5903"]}]},{"t":"খারাপ বা অপছন্দের স্বপ্ন দেখলে","items":[{"x":"স্বপ্নের অনিষ্ট ও শয়তানের অনিষ্ট থেকে আল্লাহর কাছে আশ্রয় চাওয়া।","r":["b:6985","b:7044","m:5903"]},{"x":"বাম দিকে তিনবার থুথু ফেলা (আলিমদের ব্যাখ্যায় এটি হালকা ফুঁ, যাতে সামান্য থুথুর কণা থাকতে পারে)।","r":["b:6986","b:7005","b:7044","m:5900"]},{"x":"যে পাশে শুয়ে ছিলেন, সেই পাশ বদলে শোয়া।","r":["m:5904"]},{"x":"উঠে নামাজ আদায় করা।","r":["m:5905"]},{"x":"কাউকে সেই স্বপ্ন না বলা। হাদীসে এসেছে, এতে তার কোনো ক্ষতি হবে না।","r":["b:6985","b:7044","m:5903"]}]},{"t":"সতর্কতা","items":[{"x":"যে স্বপ্ন দেখেনি, তা দেখেছে বলে দাবি করা অত্যন্ত গর্হিত কাজ; হাদীসে একে সবচেয়ে বড় মিথ্যাগুলোর একটি বলা হয়েছে।","r":["b:7042","b:7043"]}]}]}</script>
<script>
(function(){
var DATA = JSON.parse(document.getElementById('hdata').textContent);
var BOOKS = {};
var BN = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function bn(s){ return String(s).replace(/[0-9]/g, function(d){ return BN[+d]; }); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normAr(s){
  return String(s).replace(/[ً-ٰٟۖ-ۭـ]/g,'').replace(/[آأإٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
}
function normAll(s){
  return normAr(s).toLowerCase().replace(/থুতু/g, 'থুথু');
}
DATA.books.forEach(function(bk){
  BOOKS[bk.id] = bk;
  bk.items.forEach(function(it, i){
    it._i = i;
    it._s = normAll(it.a + ' ' + it.b + ' ' + it.e + ' ' + it.n + ' ' + (it.k || ''));
    it._t = it._s.replace(/\s+/g, '');
  });
});

var st = { tab:'b', q:'', det:null, scroll:{}, fs:1, en:false, bm:[] };

function load(){
  try{ var v = localStorage.getItem('swapno_bm'); if(v){ st.bm = JSON.parse(v) || []; } }catch(e){}
  try{ var f = parseFloat(localStorage.getItem('swapno_fs')); if(f >= 0.8 && f <= 1.8){ st.fs = f; } }catch(e){}
  try{ st.en = localStorage.getItem('swapno_en') === '1'; }catch(e){}
}
function saveBm(){ try{ localStorage.setItem('swapno_bm', JSON.stringify(st.bm)); }catch(e){} }
function saveFs(){ try{ localStorage.setItem('swapno_fs', String(st.fs)); localStorage.setItem('swapno_en', st.en ? '1' : '0'); }catch(e){} }
function key(b, n){ return b + ':' + n; }
function isBm(b, n){ return st.bm.indexOf(key(b, n)) >= 0; }
function toggleBm(b, n){
  var k = key(b, n), i = st.bm.indexOf(k);
  if(i >= 0){ st.bm.splice(i, 1); toast('বুকমার্ক থেকে সরানো হয়েছে'); }
  else { st.bm.push(k); toast('বুকমার্ক করা হয়েছে'); }
  saveBm();
}

var main = document.getElementById('main');
var mask = document.getElementById('mask');
var box = document.getElementById('box');
var toastEl = document.getElementById('toast');
var toastTimer = null;

function toast(msg){
  toastEl.textContent = msg; toastEl.className = 'toast on';
  if(toastTimer){ clearTimeout(toastTimer); }
  toastTimer = setTimeout(function(){ toastEl.className = 'toast'; }, 1800);
}
function showModal(html){ box.innerHTML = html; mask.className = 'mask on'; }
function hideModal(){ mask.className = 'mask'; }
function modalOpen(){ return mask.className.indexOf('on') >= 0; }

function refLabel(bk, it){
  var s = bk.short + ' ' + bn(it.n);
  return s;
}

function renderNav(){
  var bs = document.querySelectorAll('#nav button');
  for(var i = 0; i < bs.length; i++){
    bs[i].className = (bs[i].getAttribute('data-t') === st.tab && !st.det) ? 'on' : '';
  }
}

function listItems(bk, q){
  var qq = normAll(q).trim();
  if(!qq){ return bk.items; }
  var parts = qq.split(/\s+/);
  return bk.items.filter(function(it){
    for(var i = 0; i < parts.length; i++){
      if(it._s.indexOf(parts[i]) < 0 && it._t.indexOf(parts[i]) < 0){ return false; }
    }
    return true;
  });
}

function cardHtml(bkid, it){
  var bk = BOOKS[bkid];
  var pv = it.b.length > 260 ? it.b.substring(0, 260) + '…' : it.b;
  return '<div class="card tap" data-b="' + bkid + '" data-i="' + it._i + '">' +
    '<div class="row"><span class="num">' + esc(refLabel(bk, it)) + '</span>' +
    (isBm(bkid, it.n) ? '<span class="star">★</span>' : '') + '</div>' +
    '<div class="pv">' + esc(pv) + '</div></div>';
}

function renderList(){
  main.innerHTML = '<input class="sb" id="q" type="search" placeholder="খুঁজুন: বাংলা, আরবি, English বা নম্বর" value="' + esc(st.q) + '"><div id="res"></div>';
  fillRes();
  var q = document.getElementById('q');
  q.addEventListener('input', function(){
    st.q = q.value;
    fillRes();
  });
}
function fillRes(){
  // re-render only the results so the keyboard stays open
  var bk = BOOKS[st.tab];
  var items = listItems(bk, st.q);
  var h = '<div class="cnt">' + esc(bk.name) + ' · ' + esc(bk.sub) + ' — ' + bn(items.length) + 'টি হাদীস</div>';
  if(!items.length){ h += '<div class="empty">কোনো ফল পাওয়া যায়নি</div>'; }
  for(var i = 0; i < items.length; i++){ h += cardHtml(st.tab, items[i]); }
  document.getElementById('res').innerHTML = h;
}

function renderBm(){
  var h = '<div class="cnt">বুকমার্ক করা হাদীস — ' + bn(st.bm.length) + 'টি</div>';
  var n = 0;
  for(var i = 0; i < st.bm.length; i++){
    var p = st.bm[i].split(':'), bk = BOOKS[p[0]];
    if(!bk){ continue; }
    var it = null;
    for(var j = 0; j < bk.items.length; j++){ if(bk.items[j].n === p[1]){ it = bk.items[j]; break; } }
    if(it){ h += cardHtml(p[0], it); n++; }
  }
  if(!n){ h += '<div class="empty">এখনো কোনো বুকমার্ক নেই।<br>হাদীস খুলে ☆ বোতাম চাপুন।</div>'; }
  main.innerHTML = h;
}

function renderDetail(){
  var bk = BOOKS[st.det.b], it = bk.items[st.det.i];
  var fs = st.fs;
  var h = '<div class="top"><button class="bk" id="back">← ফিরুন</button>' +
    '<span class="num">' + esc(refLabel(bk, it)) + '</span></div>';
  var kk = (it.k && String(it.k) !== String(it.n)) ? ' · গ্রন্থ-ক্রম ' + bn(it.k) : '';
  h += '<div class="cnt">' + esc(bk.name) + ' · ' + esc(bk.sub) + kk + '</div>';
  h += '<div class="card"><div class="sec">আরবি</div><div class="ar" style="font-size:' + (22 * fs) + 'px">' + esc(it.a) + '</div>' +
    '<div class="sec">বাংলা</div><div class="bn" style="font-size:' + (16 * fs) + 'px">' + esc(it.b) + '</div>';
  if(st.en){ h += '<div class="sec">English</div><div class="en" style="font-size:' + (15 * fs) + 'px">' + esc(it.e) + '</div>'; }
  h += '</div>';
  h += '<div class="bar">' +
    '<button class="btn fill" id="bBm">' + (isBm(st.det.b, it.n) ? '★ বুকমার্কড' : '☆ বুকমার্ক') + '</button>' +
    '<button class="btn" id="bCp">কপি</button>' +
    '<button class="btn" id="bEn">' + (st.en ? 'English লুকান' : 'English দেখুন') + '</button></div>';
  h += '<div class="bar"><button class="btn" id="bMin">অ−</button><button class="btn" id="bPlus">অ+</button>' +
    '<button class="btn" id="bPrev"' + (st.det.i <= 0 ? ' disabled' : '') + '>← আগের</button>' +
    '<button class="btn" id="bNext"' + (st.det.i >= bk.items.length - 1 ? ' disabled' : '') + '>পরের →</button></div>';
  main.innerHTML = h;
  main.scrollTop = 0;
}

function renderAdab(){
  var h = '<div class="note">এই পাতার সারকথাগুলো সহীহ বুখারী ও মুসলিমের এই অধ্যায়ের হাদীস থেকে সংকলিত। প্রতিটি পয়েন্টের নিচের বোতামে চাপ দিলে মূল হাদীস খুলবে। এটি ফতোয়া নয়; বিস্তারিত জানতে নির্ভরযোগ্য আলিমের শরণাপন্ন হোন।</div>';
  DATA.adab.forEach(function(sec){
    h += '<h3>' + esc(sec.t) + '</h3>';
    sec.items.forEach(function(x){
      h += '<div class="li">' + esc(x.x) + '<div>';
      x.r.forEach(function(r){
        var p = r.split(':'), bk = BOOKS[p[0]];
        h += '<button class="chip" data-ref="' + esc(r) + '">' + esc(bk.short + ' ' + bn(p[1])) + '</button>';
      });
      h += '</div></div>';
    });
  });
  main.innerHTML = h;
}

function render(){
  renderNav();
  if(st.det){ renderDetail(); return; }
  if(st.tab === 'b' || st.tab === 'm'){ renderList(); }
  else if(st.tab === 'bm'){ renderBm(); }
  else { renderAdab(); }
  var sc = st.scroll[st.tab] || 0;
  main.scrollTop = sc;
}

function setTab(t){
  if(!st.det){ st.scroll[st.tab] = main.scrollTop; }
  st.tab = t; st.det = null; st.q = ''; render();
  main.scrollTop = 0;
}
function openDetail(b, i){
  st.scroll[st.tab] = main.scrollTop;
  st.det = { b:b, i:i }; render();
}
function closeDetail(){
  st.det = null; render();
}
function openRef(r){
  var p = r.split(':'), bk = BOOKS[p[0]];
  for(var j = 0; j < bk.items.length; j++){
    if(bk.items[j].n === p[1]){
      st.scroll[st.tab] = main.scrollTop;
      st.det = { b:p[0], i:j, from:'adab' }; render(); return;
    }
  }
}

function copyText(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; ta.setAttribute('readonly', '');
  ta.style.position = 'absolute'; ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0, txt.length);
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  toast(ok ? 'কপি হয়েছে' : 'কপি করা যায়নি');
}

main.addEventListener('click', function(ev){
  var t = ev.target;
  var chip = t.closest ? t.closest('[data-ref]') : null;
  if(chip){ openRef(chip.getAttribute('data-ref')); return; }
  var card = t.closest ? t.closest('.card.tap') : null;
  if(card){ openDetail(card.getAttribute('data-b'), parseInt(card.getAttribute('data-i'), 10)); return; }
  var id = t.id;
  if(!st.det){ return; }
  var bk = BOOKS[st.det.b], it = bk.items[st.det.i];
  if(id === 'back'){ closeDetail(); }
  else if(id === 'bBm'){ toggleBm(st.det.b, it.n); var y = main.scrollTop; renderDetail(); main.scrollTop = y; }
  else if(id === 'bCp'){
    copyText(it.a + '\n\n' + it.b + '\n\n— ' + bk.name + ', হাদীস ' + bn(it.n));
  }
  else if(id === 'bEn'){ st.en = !st.en; saveFs(); var y2 = main.scrollTop; renderDetail(); main.scrollTop = y2; }
  else if(id === 'bPlus'){ if(st.fs < 1.8){ st.fs = Math.round((st.fs + 0.1) * 10) / 10; saveFs(); var y3 = main.scrollTop; renderDetail(); main.scrollTop = y3; } }
  else if(id === 'bMin'){ if(st.fs > 0.8){ st.fs = Math.round((st.fs - 0.1) * 10) / 10; saveFs(); var y4 = main.scrollTop; renderDetail(); main.scrollTop = y4; } }
  else if(id === 'bPrev'){ if(st.det.i > 0){ st.det.i--; renderDetail(); } }
  else if(id === 'bNext'){ if(st.det.i < bk.items.length - 1){ st.det.i++; renderDetail(); } }
});

document.getElementById('nav').addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('button') : null;
  if(b){ setTab(b.getAttribute('data-t')); }
});

document.getElementById('btnAbout').addEventListener('click', function(){
  showModal('<h4>তথ্যসূত্র ও সতর্কতা</h4>' +
    '<p><b>হাদীসের পাঠ:</b> সহীহ বুখারী, কিতাব ৯১ (কিতাবুত তা‘বীর) এবং সহীহ মুসলিম, কিতাব ৪২ (কিতাবুর রুইয়া)।</p>' +
    '<p><b>ডেটা উৎস:</b> উন্মুক্ত Hadith API ডেটাসেট (github.com/fawazahmed0/hadith-api)। আরবি, বাংলা ও ইংরেজি পাঠ সেখান থেকে নেওয়া। ইংরেজি অনুবাদক: বুখারী — মুহসিন খান; মুসলিম — আব্দুল হামীদ সিদ্দিকী। বাংলা অনুবাদকের নাম ডেটাসেটে উল্লেখ নেই।</p>' +
    '<p><b>সতর্কতা:</b> অনুবাদ ও ক্রমিক নম্বর ছাপা সংস্করণের সাথে সামান্য ভিন্ন হতে পারে। গুরুত্বপূর্ণ প্রয়োজনে ছাপা সহীহ গ্রন্থ বা আলিমের সাথে মিলিয়ে নিন। অ্যাপের ‘আদব’ পাতার সারকথা হাদীসের ভাবার্থ, ফতোয়া নয়।</p>' +
    '<p style="text-align:right"><button class="btn fill" id="mClose">বন্ধ করুন</button></p>');
});
mask.addEventListener('click', function(ev){
  if(ev.target === mask || ev.target.id === 'mClose'){ hideModal(); }
});

window.__back = function(){
  if(modalOpen()){ hideModal(); return true; }
  if(st.det){ closeDetail(); return true; }
  if(st.tab !== 'b'){ setTab('b'); return true; }
  return false;
};

load();
render();
})();
</script>
</body>
